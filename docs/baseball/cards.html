    return noneOpt + Object.entries(PV_DIMS).filter(([k]) => k !== "year").map(([k, d]) => `<option value="${k}">${escapeHtml(d.label)}</option>`).join("");
  };
  const HAND_OPTIONS = [["vsR", "対右投手"], ["vsL", "対左投手"]];
  const midOptions = pitchVals.mids.map(v => [v, v]);
  const detailOptions = pitchVals.details.map(v => [v, v]);
  const bandOptions = PV_BAND_VALUES.map(v => [v, v]);
  return `
    <div class="fctrl-block">
      <div class="fctrl-group-title">軸</div>
      <div class="fctrl-group fctrl-group-filter">
        <div class="fctrl-row">
          <span class="fctrl-label">軸1</span>
          <select class="fctrl-select pv-axis1-select">${dimOptions(false)}</select>
        </div>
        <div class="fctrl-row">

        </div>

          <span class="fctrl-label">軸3</span>
          <select class="fctrl-select pv-axis3-select">${dimOptions(true)}</select>
        </div>
      </div>
      <div class="fctrl-group-title">フィルタ</div>
      <div class="fctrl-group fctrl-group-filter">
        <div class="fctrl-row" data-pv-filter-wrap="hand">
          <span class="fctrl-label">対左右</span>
          ${renderMultiSelect("pv-filter-hand", HAND_OPTIONS, HAND_OPTIONS.map(o => o[0]))}
        </div>
        <div class="fctrl-row" data-pv-filter-wrap="mid">
          <span class="fctrl-label">球種カテゴリ</span>
          ${renderMultiSelect("pv-filter-mid", midOptions, midOptions.map(o => o[0]))}
        </div>
        <div class="fctrl-row" data-pv-filter-wrap="detail">
          <span class="fctrl-label">球種詳細</span>
          ${renderMultiSelect("pv-filter-detail", detailOptions, detailOptions.map(o => o[0]))}
        </div>
        <div class="fctrl-row" data-pv-filter-wrap="band">
          <span class="fctrl-label">球速帯</span>
          ${renderMultiSelect("pv-filter-band", bandOptions, bandOptions.map(o => o[0]))}
        </div>
      </div>
    </div>
    <div data-pv-table></div>
  `;
}

function wirePivotSection(scope, seasonsMap, years, rankPool){
  const table = scope.querySelector("[data-pv-table]");
  const axis1Sel = scope.querySelector(".pv-axis1-select");
  const axis2Sel = scope.querySelector(".pv-axis2-select");
  const axis3Sel = scope.querySelector(".pv-axis3-select");
  const filterHand = scope.querySelector(".pv-filter-hand");
  const filterMid = scope.querySelector(".pv-filter-mid");
  const filterDetail = scope.querySelector(".pv-filter-detail");
  const filterBand = scope.querySelector(".pv-filter-band");
  if(!table || !axis1Sel || !axis2Sel || !axis3Sel) return;
  axis1Sel.value = "hand";  // 年度は軸から外した（年度タブで複数選ぶと指標ごとに年度が横並びになる）
  axis2Sel.value = "none";
  axis3Sel.value = "none";

  function updateFilterVisibility(usedDims){
    scope.querySelectorAll("[data-pv-filter-wrap]").forEach(wrap => {
      wrap.style.display = usedDims.has(wrap.dataset.pvFilterWrap) ? "none" : "";
    });
  }
  function redraw(){
    // 軸2・軸3・軸4は、それより前の軸ですでに選ばれている次元と重複していたら「なし」に落とす
    const axis1 = axis1Sel.value;
    let axis2 = (axis2Sel.value !== "none" && axis2Sel.value !== axis1) ? axis2Sel.value : "none";
    let axis3 = (axis3Sel.value !== "none" && axis3Sel.value !== axis1 && axis3Sel.value !== axis2) ? axis3Sel.value : "none";
    if(axis2Sel.value !== axis2) axis2Sel.value = axis2;
    if(axis3Sel.value !== axis3) axis3Sel.value = axis3;
    const activeAxes = [axis1, axis2, axis3].filter(a => a !== "none");
    updateFilterVisibility(new Set(activeAxes));
    const filters = {
      year: currentSeasonYear,   // 年度は選手ヘッダー横のタブで選ぶ（軸に「年度」を選べば年度ごとに比較できる）
      hand: multiSelectValuesForFilter(filterHand), mid: multiSelectValuesForFilter(filterMid),
      detail: multiSelectValuesForFilter(filterDetail), band: multiSelectValuesForFilter(filterBand),
    };
    // 球種カテゴリ・球速帯の複数選択／組み合わせ軸で順位が必要になり得る場合だけ、
    // pivot_population_{year}.json を遅延取得する（毎回のシーズン成績表示で無条件に
    // 取得すると通信量が無駄になるため）。未取得の間は順位無しでいったん描画し、取得完了後に1回だけ再描画する。
    // 取得済み（成功・失敗問わずloaded=true）なら、たとえdataがnullでも再購読しない
    // （解決済みpromiseに.then()し続けて再描画が無限に連鎖しフリーズする不具合を防ぐため）。
    const needPop = pvComboMayNeedPopulation(activeAxes, filters) && activeCardData;
    const populationFor = (year) => {
      if(!needPop) return null;
      const basePath = activeCardData._isFarm ? LEAGUE_PATHS[currentLeague].farmNumeric : LEAGUE_PATHS[currentLeague].numeric;
      const popEntry = ensurePivotPopulation(basePath, year);
      if(!popEntry.loaded) popEntry.promise.then(() => { if(scope.isConnected) redraw(); });
      return popEntry.data;
    };
    const cy = compareYearList(seasonsMap);
    if(cy.length > 1){
      // 年度比較：各年度ぶんの行を作り、指標ごとに年度を横に並べる
      // 軸の組み合わせごとに選択中の年度を続けて並べ、年度は軸の右に固定表示する。順位・色は各年度のもの
      const rowsByYear = cy.map(y => ({ year: y, rows: buildPivotRows3(seasonsMap, years, activeAxes, { ...filters, year: y }, rankPool, populationFor(y)) }));
      const merged = [];
      rowsByYear[0].rows.forEach((_, idx) => rowsByYear.forEach(ry => {
        if(!ry.rows[idx]) return;
        merged.push({ ...ry.rows[idx], [`_label${activeAxes.length + 1}`]: `${ry.year}年` });
      }));
      table.innerHTML = renderPivotTable(merged, [...activeAxes, "year"], sortState);
      return;
    }
    table.innerHTML = renderPivotTable(buildPivotRows3(seasonsMap, years, activeAxes, filters, rankPool, populationFor(filters.year)), activeAxes, sortState);
  }
  let sortState = null;
  // 軸・フィルターを変更すると列構成や母集団が変わるため、ソート状態はリセットする
  const redrawResetSort = () => { sortState = null; redraw(); };
  [axis1Sel, axis2Sel, axis3Sel].forEach(elm => elm.addEventListener("change", redrawResetSort));
  wireMultiSelects(scope, redrawResetSort);
  wireSortHeaders(table, (key) => { sortState = cycleSortState(sortState, key); redraw(); });
  redraw();
}

// gameLog: 試合ログの配列。sortState={key,dir}|null。
// 「この試合の内容」(abs)は打席結果の配列なので、ソート時はカンマ区切り文字列として比較する。
function renderGameLogTable(gameLog, sortState){
  const rows0 = (gameLog || []).slice().reverse(); // 直近の試合を上に（デフォルト順）
  const sortGetVal = (key) => {
    if(key === "pos") return (g) => stripParens(g.pos) || "";
    if(key === "abs") return (g) => (g.abs || []).join(",");
    return (g) => g[key];
  };
  const rows = sortState ? applySortState(rows0, sortState, sortGetVal(sortState.key)) : rows0;
  return `<div class="gamelog-scroll"><table class="gamelog-table">
    <thead><tr>
      ${sortTh("日付", "date", sortState)}${sortTh("対戦", "opponent", sortState)}${sortTh("打順", "order", sortState)}${sortTh("守備", "pos", sortState)}${sortTh("打席", "pa", sortState)}${sortTh("打数", "ab", sortState)}${sortTh("安打", "h", sortState)}
      ${sortTh("本塁打", "hr", sortState)}${sortTh("四死球", "bb", sortState)}${sortTh("三振", "k", sortState)}${sortTh("打点", "rbi", sortState)}${sortTh("盗塁", "sb", sortState)}${sortTh("この試合の内容", "abs", sortState)}
    </tr></thead>
    <tbody>
      ${rows.map(g => `<tr>
        <td>${escapeHtml(g.date || "")}</td>
        <td>${escapeHtml(g.opponent || "")}${g.opp_hand ? `<span class="gl-hand-badge ${g.opp_hand}">${g.opp_hand === "L" ? "左" : "右"}</span>` : ""}</td>
        <td>${g.order ?? "-"}</td><td>${escapeHtml(stripParens(g.pos) || "-")}</td>
        <td>${g.pa ?? "-"}</td><td>${g.ab ?? "-"}</td><td>${g.h ?? "-"}</td><td>${g.hr ?? "-"}</td>
        <td>${g.bb ?? "-"}</td><td>${g.k ?? "-"}</td><td>${g.rbi ?? "-"}</td><td>${g.sb ?? "-"}</td>
        <td class="gl-abs">${(g.abs || []).map(escapeHtml).join(", ")}</td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}

// シーズン守備・走塁成績：「守備」（年度×ポジションごとの行）と「走塁」（年度ごとの行）の2つの表。
// 同じ年度に複数ポジションを守った場合は、年度セルを結合して行を並べる。順位・色は各年度のもの。
// 選手単位（ポジションに紐づかない）の指標は、その年度の全行にまたがる結合セルで1回だけ表示する。データが無い列は出さない。
function renderDefenseSection(seasonsMap, ys){
  const num = (v, d = 1, sign = false) => v == null ? null : `${sign && v > 0 ? "+" : ""}${Number(v).toFixed(d)}`;
  const mr = (df, k) => (df.metric_ranks || {})[k] || null;
  const rk = (r) => (r && r.total ? r : null);
  const IF = new Set(["1B", "2B", "3B", "SS"]), OFP = new Set(["LF", "CF", "RF"]);
  // 列定義：kind "row"＝行ごとの値、"year"＝年度ごとの結合セル。get(行, 年度データ)→{t:表示文字列, r:順位}
  const cols = [
    { label: "OAA", kind: "row", get: (r) => r.o ? { t: num(r.o.outs_above_average, 0, true), r: r.o.rank } : null },
    { label: "送球速度", kind: "row", get: (r, Y) => {
        const df = Y.df, a = df.arm || {};
        if(r.catcher) return df.catcher_poptime && df.catcher_poptime.arm_strength != null ? { t: num(df.catcher_poptime.arm_strength, 1) + " mph", r: df.arm_rank } : null;
        if(r.o && OFP.has(r.o.pos)) return a.arm_of != null ? { t: num(a.arm_of, 1) + " mph", r: mr(df, "arm_of") } : null;
        if(r.o && IF.has(r.o.pos)) return a.arm_inf != null ? { t: num(a.arm_inf, 1) + " mph", r: mr(df, "arm_inf") } : null;
        return a.arm_overall != null ? { t: num(a.arm_overall, 1) + " mph", r: mr(df, "arm_overall") } : null;
      } },
    { label: "最大送球速度", kind: "year", get: (Y) => Y.df.arm && Y.df.arm.max_arm != null ? { t: num(Y.df.arm.max_arm, 1) + " mph", r: mr(Y.df, "max_arm") } : null },
    { label: "外野ジャンプOAA", kind: "year", get: (Y) => Y.df.of_jump && Y.df.of_jump.jump != null ? { t: num(Y.df.of_jump.jump, 0, true), r: mr(Y.df, "of_jump") } : null },
    { label: "反応(ft)", kind: "year", get: (Y) => Y.df.of_jump && Y.df.of_jump.reaction != null ? { t: num(Y.df.of_jump.reaction, 1, true), r: mr(Y.df, "of_reaction") } : null },
    { label: "初動(ft)", kind: "year", get: (Y) => Y.df.of_jump && Y.df.of_jump.burst != null ? { t: num(Y.df.of_jump.burst, 1, true), r: mr(Y.df, "of_burst") } : null },
    { label: "ルート(ft)", kind: "year", get: (Y) => Y.df.of_jump && Y.df.of_jump.route != null ? { t: num(Y.df.of_jump.route, 1, true), r: mr(Y.df, "of_route") } : null },
    { label: "フレーミング(得点)", kind: "row", get: (r, Y) => r.catcher && Y.df.catcher_framing && Y.df.catcher_framing.framing_runs != null ? { t: num(Y.df.catcher_framing.framing_runs, 1, true), r: Y.df.framing_rank } : null },
    { label: "二塁Pop Time(秒)", kind: "row", get: (r, Y) => r.catcher && Y.df.catcher_poptime && Y.df.catcher_poptime.pop_2b != null ? { t: num(Y.df.catcher_poptime.pop_2b, 2), r: Y.df.pop_rank } : null },
    { label: "ブロッキング(得点)", kind: "row", get: (r, Y) => r.catcher && Y.df.catcher_blocking && Y.df.catcher_blocking.runs != null ? { t: num(Y.df.catcher_blocking.runs, 1, true), r: mr(Y.df, "blocking") } : null },
  ];
  const yearData = ys.map(y => { const se = seasonsMap[y] || {}; return { y, se, df: se.defense || {}, ov: se.overall || {} }; });
  // 年度ごとの行（守備位置ごと＋捕手）。守備の指標が何も無い年度でも、送球などがあれば「-」ポジションの行を1つ作る
  const yearRows = yearData.map(Y => {
    const rows = (Y.df.oaa || []).map(o => ({ o }));
    if(Y.df.catcher_framing || Y.df.catcher_poptime || Y.df.catcher_blocking) rows.push({ catcher: true });
    if(!rows.length && (Y.df.arm || Y.df.of_jump)) rows.push({});
    return { Y, rows };
  }).filter(x => x.rows.length);
  const usedCols = cols.filter(c => yearRows.some(({ Y, rows }) => c.kind === "year" ? c.get(Y) : rows.some(r => c.get(r, Y))));
  const cell = (v) => v ? rankedTd(v.t, rk(v.r)) : `<td>-</td>`;
  const yTd = (y, span) => `<td rowspan="${span}" class="kst-year-cell def-year"${yrAttr(y)} style="background:var(--panel)">${yrDot(y)}${escapeHtml(y)}年</td>`;
  const fieldHtml = yearRows.length ? `
    <div class="fctrl-group-title" style="margin-top:0">守備</div>
    <div class="table-scroll"><table class="split-table kst-table"><thead><tr><th class="kst-year-cell def-year">年度</th><th class="def-year">ポジション</th>${usedCols.map(c => `<th>${c.label}</th>`).join("")}</tr></thead><tbody>
      ${yearRows.map(({ Y, rows }) => rows.map((r, i) => `<tr>${i === 0 ? yTd(Y.y, rows.length) : ""}<td class="def-year" style="text-align:center">${r.catcher ? "捕" : r.o ? escapeHtml(r.o.pos) : "-"}</td>${usedCols.map(c =>
        c.kind === "year" ? (i === 0 ? (() => { const v = c.get(Y); return v ? rankedTd(v.t, rk(v.r)).replace("<td", `<td rowspan="${rows.length}"`) : `<td rowspan="${rows.length}">-</td>`; })() : "") : cell(c.get(r, Y))
      ).join("")}</tr>`).join("")).join("")}
    </tbody></table></div>`
    : `<div class="fctrl-group-title" style="margin-top:0">守備</div><div class="defense-note">守備のデータはありません（規定の守備機会に届いていない、または指名打者などのため）。</div>`;

  const runCols = [
    { label: "盗塁", get: (Y) => Y.ov.sb != null ? { t: String(Y.ov.sb), r: (Y.se.splitRankings && Y.se.splitRankings.all30 && Y.se.splitRankings.all30.all || {}).sb } : null },
    { label: "スプリントスピード", get: (Y) => Y.df.sprint_speed != null ? { t: num(Y.df.sprint_speed, 1) + " ft/s", r: Y.df.sprint_rank } : null },
    { label: "走塁得点(BsR相当)", get: (Y) => Y.df.baserunning && Y.df.baserunning.rbaser != null ? { t: num(Y.df.baserunning.rbaser, 1, true), r: mr(Y.df, "rbaser") } : null },
    { label: "追加進塁(XBT)得点", get: (Y) => Y.df.baserunning && Y.df.baserunning.xb_runs != null ? { t: num(Y.df.baserunning.xb_runs, 1, true), r: mr(Y.df, "xb_runs") } : null },
    { label: "一塁到達(秒)", get: (Y) => Y.df.baserunning && Y.df.baserunning.home_to_first != null ? { t: num(Y.df.baserunning.home_to_first, 2), r: mr(Y.df, "home_to_first") } : null },
  ].filter(c => yearData.some(Y => c.get(Y)));
  const runHtml = runCols.length ? `
    <div class="fctrl-group-title" style="margin-top:14px">走塁</div>
    <div class="table-scroll"><table class="split-table kst-table"><thead><tr><th class="kst-year-cell def-year">年度</th>${runCols.map(c => `<th>${c.label}</th>`).join("")}</tr></thead><tbody>
      ${yearData.map(Y => `<tr><td class="kst-year-cell def-year"${yrAttr(Y.y)} style="background:var(--panel)">${yrDot(Y.y)}${escapeHtml(Y.y)}年</td>${runCols.map(c => cell(c.get(Y))).join("")}</tr>`).join("")}
    </tbody></table></div>` : "";
  return fieldHtml + runHtml;
}

function renderPlayerCard(card, llm){
  card._currentLlm = llm;  // シーズンタブ切り替え時の再描画で使う

  const seasonsMap = getSeasonsMap(card);
  const years = Object.keys(seasonsMap).sort((a, b) => b.localeCompare(a));
  if(!currentSeasonYear || !seasonsMap[currentSeasonYear]) currentSeasonYear = years[0];
  // 年度タブの選択状態を整える（選手が変わって存在しない年度は外し、空なら表示中の年度だけにする）。
  // 表示の基準年度（KPI・順位など）は選択中の年度のうち最新のもの。
  selectedYears = selectedYears.filter(y => seasonsMap[y]);
  if(!selectedYears.length) selectedYears = [currentSeasonYear];
  currentSeasonYear = [...selectedYears].sort((a, b) => b.localeCompare(a))[0];
  const seasonObj = seasonsMap[currentSeasonYear] || {};
  const overall = seasonObj.overall || {};
  const defense = seasonObj.defense || {};
  // 規定打席未到達の選手はqualified側に順位が無いため、その場合は常にall30を使う
  // （要望どおり、未到達選手は「全選手」パターンのみでOK）。
  const rankPoolUsable = card.qualifiedPA ? currentRankPool : "all30";
  const rk = (seasonObj.rankings && seasonObj.rankings[rankPoolUsable]) || {};

  // KPIグリッドはOPS/出塁率/長打率/K%/BB%/守備指標の6つに統一。
  // 試合数・打席数・打率・本塁打・打点・盗塁は下の「チーム / ポジション / 成績」行にまとめる。
  // KPI（OPS/出塁率/長打率/K%/BB%/守備指標）を年度ごとに作る。年度比較中は選択中の全年度ぶんを、
  // それぞれの年度の順位（母集団・順位基準もその年度のもの）で並べて表示する。
  const kpisOf = (y) => {
    const se = seasonsMap[y] || {};
    const ov = se.overall || {}, df = se.defense || {};
    const pool = (card.qualifiedPA && se.rankings && se.rankings[currentRankPool]) ? currentRankPool : "all30";
    const r = (se.rankings && se.rankings[pool]) || {};
    const oaa = df.oaa || [];
    const best = oaa.length ? oaa.slice().sort((a, b) => (b.outs_above_average ?? -999) - (a.outs_above_average ?? -999))[0] : null;
    const dv = (best && best.outs_above_average != null) ? `${best.outs_above_average > 0 ? "+" : ""}${best.outs_above_average}` : "-";
    const dr = (best && best.rank && best.rank.total) ? best.rank : null;
    return [
      ...(currentLeague === "npb" ? [] : [["WAR", ov.war != null ? Number(ov.war).toFixed(1) : "-", (se.splitRankings && se.splitRankings[pool] && se.splitRankings[pool].all && se.splitRankings[pool].all.war) || null]]),
      ["OPS", fmt(ov.ops, 3), r.ops], ["出塁率", fmtAvg(ov.obp), r.obp],
      ...(currentLeague === "npb" ? [["長打率", fmtAvg(ov.slg), r.slg]] : []),
      ["K%", fmt(ov.k_pct, 1, "%"), r.k_pct], ["BB%", fmt(ov.bb_pct, 1, "%"), r.bb_pct], ["守備指標", dv, dr],
    ];
  };
  // 年度比較中も、KPIは選択中の年度のうち最新のものを表示する
  const kpis = kpisOf(currentSeasonYear);
  const kpiBoxesHtml = kpis.map(([l, v, r]) => statBox(l, v, r)).join("");

  // チーム / ポジションと、打撃カウント成績（試合数・打席数・打率・本塁打・打点・盗塁・OPS）は
  // 要望により別々の行にする（同じ行だと横スクロールしないと成績が見えず気づきにくいため）。
  const teamClean = seasonObj.team || card.team || "-";
  const posClean = stripParens(seasonObj.pos || card.pos || "-");
  const countLineParts = [
    `${overall.games ?? "-"}試合`, `${overall.pa ?? "-"}打席`, fmtAvg(overall.avg),
    `${overall.hr ?? "-"}本`, `${overall.rbi ?? "-"}打点`, `${overall.sb ?? "-"}盗塁`,
    `OPS ${fmt(overall.ops, 3)}`,
  ];
  const countLineHtml = `<div class="p-team-pos">${escapeHtml(teamClean)} / ${escapeHtml(posClean)}</div>
  <div class="p-count-line">
    ${countLineParts.map(t => `<span class="cl-item">${escapeHtml(t)}</span>`).join("")}
  </div>`;

  const initials = (card.name || "").slice(0, 1);

  let llmHtml = "";
  if(llm){
    llmHtml = `
      <div class="section section-strength">
        <div class="section-title"><span class="bar"></span><span class="label">AI解釈：強み</span></div>
        <div class="bullets tone-positive">${(llm.strengths || []).map(b => `<div><span class="dot">▸</span><div>${escapeHtml(b)}</div></div>`).join("")}</div>
      </div>
      <div class="section section-weakness">
        <div class="section-title"><span class="bar" style="background:var(--red)"></span><span class="label">AI解釈：課題</span></div>
        <div class="bullets tone-negative">${(llm.weaknesses || []).map(b => `<div><span class="dot">▸</span><div>${escapeHtml(b)}</div></div>`).join("")}</div>
      </div>`;
  }else{
    llmHtml = "";
  }

  mainContentEl.classList.remove("placeholder");
  mainContentEl.innerHTML = `
    <div class="card">
      <div class="p-sticky-header">
        <div class="p-header">
          <div class="p-avatar">${escapeHtml(initials)}</div>
          <div>
            <div class="p-name-row">
              <div class="p-name">${escapeHtml(card.name)}</div>
              ${renderSeasonTabs(years, currentSeasonYear)}
            </div>
            <div class="p-meta-row">
              ${countLineHtml}
              ${card._farmData ? `
              <div class="farm-toggle">
                <button type="button" class="farm-toggle-btn ${!card._isFarm ? "active" : ""}" data-farm="0">1軍</button>
                <button type="button" class="farm-toggle-btn ${card._isFarm ? "active" : ""}" data-farm="1">2軍</button>
              </div>` : ""}
            </div>
          </div>
        </div>
        ${card.qualifiedPA ? `
        <div class="rank-pool-toggle">
          <span class="rank-pool-toggle-label">順位基準</span>
          <button type="button" class="pill-btn${rankPoolUsable === "all30" ? " active" : ""}" data-rank-pool="all30">30打席以上の全選手</button>
          <button type="button" class="pill-btn${rankPoolUsable === "qualified" ? " active" : ""}" data-rank-pool="qualified">規定打席到達選手</button>
        </div>` : ""}
        <div class="stat-grid">${kpiBoxesHtml}</div>
      </div>

      ${llmHtml}

      <div class="section" data-season-summary-section>
        <div class="section-title"><span class="bar"></span><span class="label">シーズン打撃成績</span><span class="sub">年度ごとの成績と順位</span></div>
        <div data-season-summary></div>
      </div>

      <div class="section section-note">
        <div class="section-title"><span class="bar" style="background:var(--amber)"></span><span class="label">シーズン守備・走塁成績</span></div>
        ${renderDefenseSection(seasonsMap, Object.keys(seasonsMap).filter(y => seasonsMap[y]).sort((a, b) => b.localeCompare(a)))}
      </div>

      <div class="section" data-pv-section>
        <div class="section-title"><span class="bar"></span><span class="label">シーズン内訳</span><span class="sub">軸を選んで内訳を切り替えられます</span></div>
        ${renderPivotSection(seasonsMap, years)}
      </div>

      <div class="section" data-cz-section>
        <div class="section-title"><span class="bar"></span><span class="label">コース別成績</span></div>
        ${renderCourseZoneSection(seasonsMap, years, currentSeasonYear)}
      </div>

      <div class="section" data-ct-section>
        <div class="section-title"><span class="bar"></span><span class="label">カウント別成績</span></div>
        ${renderCountSection(years, currentSeasonYear)}
      </div>

      <div class="section" data-st-section>
        <div class="section-title"><span class="bar"></span><span class="label">ランナー状況別成績</span></div>
        ${renderSituationSection(seasonsMap, years, currentSeasonYear)}
      </div>

      <div class="section" data-vp-section>
        <div class="section-title"><span class="bar"></span><span class="label">対戦投手別成績</span></div>
        ${renderVsPitcherSection(years, currentSeasonYear)}
      </div>

      <div class="section" data-gamelog-section>
        <div class="section-title"><span class="bar"></span><span class="label">試合ログ</span><span class="sub">年度ごとの試合別成績</span></div>
        ${renderGameLogSection(seasonsMap, years, seasonObj)}
      </div>
    </div>`;

  // シーズンタブ：選手はそのままでcurrentSeasonYearだけ変えて丸ごと再描画する
  wireYearMsel(mainContentEl, years, (sel) => {
    selectedYears = sel;
    currentSeasonYear = selectedYears[0];
    renderPlayerCard(card, card._currentLlm);
  });

  // 順位基準トグル：KPIグリッド・シーズン成績表（球種等で絞り込んでいない行）の
  // 順位母集団を切り替えて丸ごと再描画する
  mainContentEl.querySelectorAll(".rank-pool-toggle [data-rank-pool]").forEach(btn => {
    btn.addEventListener("click", () => {
      if(btn.dataset.rankPool === currentRankPool) return;
      currentRankPool = btn.dataset.rankPool;
      renderPlayerCard(card, card._currentLlm);
    });
  });

  // シーズン成績（年度別の一覧）：ヘッダークリックで並べ替え
  const ssWrap = mainContentEl.querySelector("[data-season-summary]");
  if(ssWrap){
    let ssSort = null;
    const ssRedraw = () => { ssWrap.innerHTML = renderSeasonSummaryTable(seasonsMap, years, ssSort, rankPoolUsable); };
    wireSortHeaders(ssWrap, (key) => { ssSort = cycleSortState(ssSort, key); ssRedraw(); });
    ssRedraw();
  }

  // シーズン内訳：軸1/軸2（年度・対左右・球種カテゴリ/球種詳細）＋カラム別フィルタでドリルダウン
  const pvSection = mainContentEl.querySelector("[data-pv-section]");
  if(pvSection) wirePivotSection(pvSection, seasonsMap, years, rankPoolUsable);

  // コース別成績：対戦・指標のボタンでグリッドを再描画（左打者は投手視点で見て逆サイドに立つ
  // ため、seasonObj.batsが"L"ならシルエット・行を反転する。bats情報がまだ無い古いデータでは
  // 右打者扱い＝従来どおりの表示になる）。
  // 実際のJSON構造では"bats"はカードのトップレベルではなく、season単位のオブジェクト
  // （seasonsMap[currentSeasonYear]、すなわちseasonObj）の中に入っている
  // （export_llm_input_batter.py側でnumeric_cards[name]＝1シーズンぶんのオブジェクトに
  // "bats"を含めてseasons[year]として格納しているため）。card.batsを見ると常にundefined
  // になり、常に右打者扱いのまま反転しない不具合があったため、seasonObj.batsを見る
  // （念のためcard.batsもフォールバックとして見ておく）。
  const czSection = mainContentEl.querySelector("[data-cz-section]");
  if(czSection) wireCourseZoneSection(czSection, seasonsMap, (seasonObj.bats ?? card.bats) === "L");

  // カウント別成績：全体/対右/対左トグル
  const ctSection = mainContentEl.querySelector("[data-ct-section]");
  if(ctSection) wireCountSection(ctSection, seasonsMap);

  // ランナー状況別成績：全体/対右/対左トグル＋年度フィルタ
  const stSection = mainContentEl.querySelector("[data-st-section]");
  if(stSection) wireSituationSection(stSection, seasonsMap);

  // 対戦投手別成績：通算/年度別トグル
  const vpSection = mainContentEl.querySelector("[data-vp-section]");
  if(vpSection) wireVsPitcherSection(vpSection, seasonsMap, years, currentSeasonYear);

  // 試合ログ：シーズン成績/試合別タブ
  const gamelogSection = mainContentEl.querySelector("[data-gamelog-section]");
  if(gamelogSection) wireGameLogSection(gamelogSection, seasonsMap, years, rankPoolUsable);

  // 1軍/2軍 切り替え：同じ選手のもう一方のデータでカードを丸ごと再描画する
  const farmToggleEl = mainContentEl.querySelector(".farm-toggle");
  if(farmToggleEl){
    farmToggleEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".farm-toggle-btn");
      if(!btn) return;
      const wantFarm = btn.dataset.farm === "1";
      if(wantFarm === !!card._isFarm) return;
      const target = card._farmData;
      if(!target) return;
      currentSeasonYear = null;  // 切り替え先の最新シーズンをデフォルト表示にリセット
      selectedYears = [];
      activeCardData = target;
      findLlmDataForPlayer(target.name).then(targetLlm => renderPlayerCard(target, targetLlm));
    });
  }
}

const initialLoad = loadPlayerIndex(currentLeague);

cardsShell.register("batter", {
  ready: initialLoad,
  getState: () => ({ league: currentLeague, id: activePlayerId,
    name: activeCardData ? activeCardData.name : null, farm: currentFarmLevel === "ni" }),
  async setLeague(league){
    if(!league || league === currentLeague || !LEAGUE_PATHS[league]) return;
    leagueStateCache[currentLeague] = snapshotLeagueState();
    document.querySelectorAll(".league-toggle button").forEach(b => b.classList.toggle("active", b.dataset.league === league));
    currentLeague = league;
    await loadPlayerIndex(league);
  },
  async openPlayer({ league, id, name, farm }){
    if(league && league !== currentLeague && LEAGUE_PATHS[league]){
      leagueStateCache[currentLeague] = snapshotLeagueState();
      if(leagueStateCache[league]) leagueStateCache[league].activePlayerId = null;
      document.querySelectorAll(".league-toggle button").forEach(b => b.classList.toggle("active", b.dataset.league === league));
      currentLeague = league;
      await loadPlayerIndex(league);
    }
    const wantLevel = farm ? "ni" : "ichi";
    if(LEAGUE_PATHS[currentLeague].farmNumeric && currentFarmLevel !== wantLevel){
      currentFarmLevel = wantLevel;
      updateFarmLevelToggleUI();
      playerListEl.innerHTML = '<div class="empty-list">読み込み中…</div>';
      await loadPlayerListForCurrentFarmLevel();
      renderPlayerList();
    }
    await selectPlayer(id, name || id);
  },
});

}

// 結合セル（rowspan）を持つ表：どの行にカーソルを当てても、その行にかかる結合セル（球種名・軸の値など）まで光らせる
(function(){
  let lit = [];
  const clear = () => { lit.forEach(c => c.classList.remove("rs-hl")); lit = []; };
  document.addEventListener("mouseover", (e) => {
    const tr = e.target && e.target.closest ? e.target.closest("tbody tr") : null;
    clear();
    if(!tr) return;
    const tbl = tr.closest("table");
    if(!tbl || !/split-table|pmix-table|gamelog-table|vsb-table/.test(tbl.className)) return;
    const idx = tr.rowIndex, rows = tbl.rows;
    for(let i = idx - 1; i >= Math.max(0, idx - 60); i--){
      Array.from(rows[i].cells).forEach(c => {
        if(c.rowSpan > 1 && i + c.rowSpan > idx){ c.classList.add("rs-hl"); lit.push(c); }
      });
    }
  });
  document.addEventListener("mouseout", (e) => {
    const to = e.relatedTarget;
    if(!to || !to.closest || !to.closest("table")) clear();
  });
})();

// ── モード切替ローダー ──
// 投手・打者それぞれのアプリは初回表示時に1回だけ mount され、以後は DOM から
// 外して/戻すだけで切り替える（検索条件・並び順・選択中の選手がモードごとに残る）。
// 同時にDOMへ載るのは片方だけなので、両者に共通のid（#searchInput 等）は衝突しない。
const MODES = {
  pitcher: { title: "投手 AI解釈カード", label: "投手", rootId: "root-pitcher", styleId: "css-pitcher", mount: mountPitcher, mounted: false, hasSel: false },
  batter:  { title: "打者 AI解釈カード", label: "打者", rootId: "root-batter",  styleId: "css-batter",  mount: mountBatter,  mounted: false, hasSel: false },
};
const host = document.getElementById("host");
const roots = {};
for(const k of Object.keys(MODES)){
  roots[k] = document.getElementById(MODES[k].rootId);
  roots[k].remove();  // 使うときだけ host に載せる
}
let currentMode = null;

// ── 選手ページ間の移動（投手の対戦打者 → 打者ページ 等）と「戻る」 ──
// 各モードが register() で {ready, getState(), openPlayer()} を渡す。URLのハッシュは
// #{mode}/{league}/{id}[/farm]（例：#batter/npb/細川_成也）。リンクで別モードへ移るときは、
// 移動前のページを backOrigin に控えて、移動先のヘッダーに「戻る」ボタンを出す。
// ブラウザの戻る操作もハッシュの変化として同じ処理（applyHash）に流す。
const controllers = {};
const scrollPos = {};
let backOrigin = null;   // { mode, hash, name }
const cardsShell = {
  register(mode, ctrl){ controllers[mode] = ctrl; },
  goto(mode, target){ return gotoPlayer(mode, target); },
};

function makeHash(mode, st){
  if(!st || !st.id) return "#" + mode;
  return "#" + [mode, st.league, encodeURIComponent(st.id), st.farm ? "farm" : ""].filter(Boolean).join("/");
}
function parseHash(){
  const parts = (location.hash || "").replace(/^#\/?/, "").split("/");
  if(!MODES[parts[0]]) return null;
  let id = null;
  try{ id = parts[2] ? decodeURIComponent(parts[2]) : null; }catch(e){}
  return { mode: parts[0], league: parts[1] || null, id, farm: parts[3] === "farm" };
}
function readInitialMode(){
  const h = parseHash();
  if(h) return h.mode;
  try{ const s = localStorage.getItem("cardsMode"); if(MODES[s]) return s; }catch(e){}
  return "pitcher";
}

const mainScrollEl = () => document.querySelector("main");
function saveScroll(mode){
  const m = mainScrollEl();
  scrollPos[mode] = { main: m ? m.scrollTop : 0, win: window.scrollY };
}
function restoreScroll(mode){
  const sp = scrollPos[mode];
  if(!sp) return;
  requestAnimationFrame(() => {
    const m = mainScrollEl();
    if(m) m.scrollTop = sp.main;
    window.scrollTo(0, sp.win);
  });
}

function updateBackButtons(){
  for(const k of Object.keys(roots)){
    const btn = roots[k].querySelector(".nav-back-btn");
    if(!btn) continue;
    if(backOrigin && k !== backOrigin.mode){
      btn.hidden = false;
      btn.textContent = `← ${MODES[backOrigin.mode].label}ページに戻る${backOrigin.name ? "（" + backOrigin.name + "）" : ""}`;
    }else{
      btn.hidden = true;
    }
  }
  window.dispatchEvent(new Event("resize"));   // ヘッダーの高さが変わるので測り直させる
}

function switchMode(name){
  if(!MODES[name] || name === currentMode) return;
  if(currentMode){
    const prev = MODES[currentMode];
    saveScroll(currentMode);
    prev.hasSel = document.body.classList.contains("has-selection");
    roots[currentMode].remove();
    document.getElementById(prev.styleId).media = "not all";
  }
  const m = MODES[name];
  document.getElementById(m.styleId).media = "all";
  host.appendChild(roots[name]);
  document.body.classList.toggle("has-selection", m.hasSel);
  currentMode = name;
  if(!m.mounted){ m.mounted = true; m.mount(); observeHeader(roots[name]); }
  document.title = m.title + (YEAR === AVAILABLE_YEARS[0] ? "" : `（${YEAR}年）`);
  try{ localStorage.setItem("cardsMode", name); }catch(e){}
  restoreScroll(name);
  // 各モードのヘッダー高さ変数(--header-h)を測り直させる
  window.dispatchEvent(new Event("resize"));
}

// 指定の選手が、すでにそのモードで表示中ならtrue（再読み込みを避ける）
function isShowing(mode, t){
  const c = controllers[mode];
  const cur = c && c.getState();
  return !!cur && cur.id === t.id && cur.league === t.league && !!cur.farm === !!t.farm;
}
async function openInMode(mode, t){
  const c = controllers[mode];
  if(!c) return;
  await c.ready;                 // 初回のindex読み込みが終わってから
  if(isShowing(mode, t)) return;
  await c.openPlayer(t);
}

async function gotoPlayer(mode, target){
  const from = currentMode, st = controllers[from] && controllers[from].getState();
  if(st && st.id){
    const originHash = makeHash(from, st);
    history.replaceState(null, "", originHash);         // 今のページを履歴に確定させてから
    backOrigin = { mode: from, hash: originHash, name: st.name || "" };
  }
  history.pushState(null, "", makeHash(mode, target));  // 移動先を新しい履歴として積む
  delete scrollPos[mode];                                // 移動先は新しい選手なので先頭から表示
  switchMode(mode);
  updateBackButtons();
  await openInMode(mode, target);
  const m = mainScrollEl(); if(m) m.scrollTop = 0;
}

async function applyHash(){
  const h = parseHash();
  if(!h) return;
  switchMode(h.mode);
  if(backOrigin && h.mode === backOrigin.mode) backOrigin = null;   // 元のページに戻ってきた
  updateBackButtons();
  if(h.id && h.league) await openInMode(h.mode, h);
}

async function syncLeagueToMode(mode, league){
  const c = controllers[mode];
  if(!c) return;
  await c.ready;                                   // 初回のindex読み込みが終わってから揃える
  if(c.getState().league === league) return;
  await c.setLeague(league);
  if(currentMode === mode) history.replaceState(null, "", makeHash(mode, c.getState()));
}

document.addEventListener("click", (e) => {
  const mb = e.target.closest && e.target.closest(".mode-switch button");
  if(mb){
    backOrigin = null;                       // 手動でモードを切り替えたら「戻る」は出さない
    // 投手↔打者を切り替えても、プロ野球/MLBのタブは切替元のまま変えない
    // （各モードは別々にリーグ状態を持つため、そのままだと初期値のプロ野球に戻ってしまう）。
    const fromCtrl = currentMode && controllers[currentMode];
    const keepLeague = fromCtrl ? fromCtrl.getState().league : null;
    switchMode(mb.dataset.mode);
    const c = controllers[mb.dataset.mode];
    history.replaceState(null, "", makeHash(mb.dataset.mode, c && c.getState()));
    updateBackButtons();
    if(keepLeague) syncLeagueToMode(mb.dataset.mode, keepLeague);
    return;
  }
  const bb = e.target.closest && e.target.closest(".nav-back-btn");
  if(bb && backOrigin){
    const hash = backOrigin.hash;
    backOrigin = null;
    location.hash = hash;                    // hashchange → applyHash が元のページへ戻す
  }
});
window.addEventListener("hashchange", applyHash);

(function init(){
  const h = parseHash();
  switchMode(readInitialMode());
  if(!h) history.replaceState(null, "", "#" + currentMode);
  else if(h.id && h.league) openInMode(h.mode, h);
})();

</script>
</body>
</html>

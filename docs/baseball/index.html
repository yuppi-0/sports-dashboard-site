  const color=curBatTeam==='home'?g.homeColor:g.awayColor;
  const teamName=curBatTeam==='home'?g.home:g.away;  const METRICS=[{key:'swStr'},{key:'whiff'},{key:'chase'}];
  const teamAvg={};
  METRICS.forEach(m=>{teamAvg[m.key]=(bats.reduce((s,b)=>s+(+b[m.key]||0),0)/Math.max(bats.length,1)).toFixed(1);});
  
  const AB_COLOR={ 'HR':'#7B2828', '2B':'#0D6B6B','3B':'#0D6B6B', 'H':'#1B5E40', 'BB':'#5C5000', 'K':'#1E2A38','GO':'#1E2A38','DP':'#1E2A38','FO':'#1E2A38', 'E':'#3A3A4A' };
  const AB_FG={ 'HR':'#E2E8F0','2B':'#E2E8F0','3B':'#E2E8F0','H':'#E2E8F0', 'BB':'#E2E8F0','K':'#475569','GO':'#475569','FO':'#475569','DP':'#475569','E':'#94A3B8' };
  function buildAbBar(abs){
    const valid=abs.filter(a=>a&&a!=='—');
    if(!valid.length) return '<div style="color:var(--text3);font-size:10px">—</div>';
    const badges=valid.map(a=>{
      const bg=AB_COLOR[a]||'#64748B';
      const fg=AB_FG[a]||'#E2E8F0';
      const border=bg+'88';
      return`<div class="abb" style="background:${bg};color:${fg};border-color:${border}">${a}</div>`;
    }).join('');
    return`<div class="ab-badges">${badges}</div>`;
  }

  (function sortBats(){
    const POS_SUB_MAP={'打左':'(左)','打一':'(一)','打二':'(二)','打三':'(三)','打右':'(右)','打中':'(中)','打遊':'(遊)','打捕':'(捕)','打指':'(指)','打二遊':'(二遊)','打遊二':'(遊二)'};
    const starters=[...bats].filter(b=>b.order&&b.order>0).sort((a,b2)=>a.order-b2.order);
    const subs=[...bats].filter(b=>!b.order||b.order<=0);
    const posToOrder={};
    starters.forEach(st=>{ posToOrder[st.pos]=st.order; });
    const subsByOrder={};
    const subsUnknown=[];
    subs.forEach(sub=>{
      const targetPos=POS_SUB_MAP[sub.pos];
      const targetOrder=targetPos?posToOrder[targetPos]:null;
      if(targetOrder){
        if(!subsByOrder[targetOrder]) subsByOrder[targetOrder]=[];
        subsByOrder[targetOrder].push(sub);
      } else {
        subsUnknown.push(sub);
      }
    });
    const result=[];
    starters.forEach(st=>{
      result.push(st);
      if(subsByOrder[st.order]) result.push(...subsByOrder[st.order]);
    });
    result.push(...subsUnknown);
    bats.length=0;
    result.forEach(b=>bats.push(b));
  })();

  function fmtM(v){ return v!=null?(+v).toFixed(1)+'%':'—'; }
  function opsColor(v){ return v>=0.900?'var(--green)':v>=0.750?'var(--text)':'var(--text3)'; }

  const rows=bats.map(b=>{
    const opsVal=b.ops!=null?(+b.ops).toFixed(3).replace(/^0/,''):'—';
    const td=(v,style='')=>`<td style="font-family:'DM Mono';font-size:12px;text-align:right;padding:5px 7px;${style}">${v}</td>`;
    const isSub = !b.order || b.order <= 0;
    const bNameStyle = isSub ? 'color:var(--text2); font-weight:500; margin-left:8px;' : '';
    const bNamePrefix = '';
    return`<tr>
<td style="padding:5px 7px;text-align:center"><div class="order-n">${b.order&&b.order>0?b.order:''}</div></td>
<td style="padding:5px 7px;white-space:nowrap"><span class="pos-badge pos-${b.pos}">${b.pos}</span></td>
<td style="padding:5px 7px;white-space:nowrap"><span class="b-name" style="${bNameStyle}cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.35);transition:color .12s" onclick="event.stopPropagation();openPlayerPage('${b.name}','${teamName}','batter',{tab:'batting',batTeam:'${curBatTeam}'})" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color=''">${bNamePrefix}${b.name}</span></td>
<td style="min-width:120px;max-width:200px;padding:5px 7px">${buildAbBar(b.abs)}</td>
${td(b.ab||0)}
${td(b.h||0)}
${td(b.rbi!=null?b.rbi:0)}
${td(b.hr||0,'color:var(--red)')}
${td(b.sb!=null?b.sb:0,'color:var(--green)')}
${td(opsVal,'font-weight:700;color:'+opsColor(b.ops||0))}
${td(fmtM(b.swStr))}
${td(fmtM(b.whiff))}
${td(fmtM(b.chase))}
</tr>`;
  }).join('');
  
  const sumAb=bats.reduce((s,b)=>s+(b.ab||0),0);
  const sumH=bats.reduce((s,b)=>s+(b.h||0),0);
  const sumRbi=bats.reduce((s,b)=>s+(b.rbi||0),0);
  const sumHr=bats.reduce((s,b)=>s+(b.hr||0),0);
  const sumSb=bats.reduce((s,b)=>s+(b.sb||0),0);
  const opsAvg=(bats.reduce((s,b)=>s+(b.ops||0),0)/bats.length).toFixed(3).replace(/^0/,'');
  const tdF=(v,style='')=>`<td style="font-family:'DM Mono';font-size:11px;text-align:right;padding:4px 7px;${style}">${v}</td>`;
  const footRow=`<tr class="tot-row">
<td colspan="4" style="font-family:'DM Mono';padding:4px 7px">チーム計</td>
${tdF(sumAb)}${tdF(sumH)}${tdF(sumRbi)}${tdF(sumHr,'color:var(--red)')}${tdF(sumSb,'color:var(--green)')}
${tdF(opsAvg,'font-weight:700;color:var(--gold)')}
${tdF(fmtM(teamAvg['swStr']))}${tdF(fmtM(teamAvg['whiff']))}${tdF(fmtM(teamAvg['chase']))}
</tr>`;
  const th=(t,a='right')=>`<th style="font-size:10px;font-family:'DM Mono';color:#94a3b8;font-weight:600;text-align:${a};padding:5px 7px;border-bottom:1px solid var(--border2);white-space:nowrap;background:var(--bg2);">${t}</th>`;

  const subFixed = document.getElementById('subFixedArea');
  if(subFixed) subFixed.innerHTML = buildBatSubHeader(g);

  const tc = document.getElementById('tabContent');
  if(tc){ tc.style.overflowX=''; tc.style.padding='0 16px 80px'; }

  document.getElementById('batTeamContent').innerHTML=`
<div class="card" style="padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch;">
  <table class="bat-tbl" id="bat-tbl-main" style="min-width:700px;width:100%">
    <thead id="bat-tbl-head"><tr>
      ${th('打順','center')}${th('位置','center')}${th('選手名','left')}${th('打席結果','left')}
      ${th('打数')}${th('安打')}${th('打点')}${th('本塁打')}${th('盗塁')}${th('OPS')}
      ${th('空振り率')}${th('スイング空振り率')}${th('ボール球スイング率')}
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot>${footRow}</tfoot>
  </table>
</div>`;

  requestAnimationFrame(()=>{
    const head = document.getElementById('bat-tbl-head');
    if(!head) return;
    head.querySelectorAll('th').forEach((el,i)=>{
      el.style.position   = 'sticky';
      el.style.top        = '0px';
      el.style.zIndex     = '10';
      if(i===0){ el.style.left='0';     el.style.zIndex='12'; }
      else if(i===1){ el.style.left='28px';  el.style.zIndex='12'; }
      else if(i===2){ el.style.left='108px'; el.style.zIndex='12'; }
    });
  });
}

// ── PLAYER PROFILE PAGE ──
function openPlayerPage(playerName, playerTeam, playerType, returnContext) {
  // 比較状態をリセット
  if(typeof _pitchCmpSelected !== 'undefined') {
    _pitchCmpSelected = [];
    document.querySelectorAll('[data-pidx]').forEach(c => c.checked = false);
    const scb2 = document.getElementById('pitch-cmp-season-cb');
    if(scb2) scb2.checked = false;
  }
  window._cmpMapsPerEntry = null;
  window._cmpLocsPerEntry = null;
  window._isCmpMode = false;
  window._activeRowIdx = null;
  const rb = document.getElementById('pitch-cmp-reset-btn');
  if(rb) rb.style.display = 'none';
  // MLB時: 個人JSONをfetchしてキャッシュしてから描画
  if (currentSport === 'mlb') {
    const year = new Date().getFullYear();
    const subdir = playerType === 'pitcher' ? '投手' : '野手';
    const encoded = encodeURIComponent(playerName);
    const jsonPath = `./data/MLB/${year}年/公式戦/players/json/${subdir}/${encoded}.json`;
    if (!window._mlbPlayerCache) window._mlbPlayerCache = {};
    if (!window._mlbPlayerCache[playerName]) {
      fetch(jsonPath, {method:'HEAD', cache:'no-store'})
        .then(r => r.ok ? fetch(jsonPath + '?t=' + Date.now(), {cache:'no-store'}).then(r2 => r2.ok ? r2.json() : {}) : {})
        .catch(() => ({}))
        .then(data => {
          window._mlbPlayerCache[playerName] = data;
          _doOpenPlayerPage(playerName, playerTeam, playerType, returnContext);
        });
      return;
    }
  }
  _doOpenPlayerPage(playerName, playerTeam, playerType, returnContext);
}
function _doOpenPlayerPage(playerName, playerTeam, playerType, returnContext) {
  if (!playerPageReturnState) {
    playerPageReturnState = {
      mode: viewMode,
      date: curDate,
      gameIdx: curGameIdx,
      returnTab: returnContext && returnContext.tab != null ? returnContext.tab : curTab,
      returnPitchTeam: returnContext && returnContext.pitchTeam != null ? returnContext.pitchTeam : curPitchTeam,
      returnPitcherIdx: returnContext && returnContext.pitcherIdx != null ? returnContext.pitcherIdx : curPitcherIdx,
      returnBatTeam: returnContext && returnContext.batTeam != null ? returnContext.batTeam : curBatTeam,
      returnSectionId: returnContext && returnContext.sectionId != null ? returnContext.sectionId : null,
    };
  }

  const panel = document.getElementById('detailPanel');
  destroyCharts();
  panel.scrollTop = 0;
  _pitchCmpSelected = [];
  _pitchCmpSeasonMix = null;
  window._activeRowIdx = null;
  window._pitchDetailMixes = null;
  window._activeRole = null;
  window._currentSplitMode = 'all'; // 選手切り替え時は必ず全体にリセット
  window._currentPitcherHand = 'R';

  const allDates = Object.keys(DATA).filter(d => d !== 'highlights' && !d.startsWith('_')).sort();
  const appearances = [];

  const _pnLower = playerName.toLowerCase();
  allDates.forEach(date => {
    const games = DATA[date] || [];
    games.forEach(g => {
      ['home', 'away'].forEach(side => {
        if (playerType === 'pitcher') {
          const pitchers = g.pitchers[side] || [];
          pitchers.forEach(p => {
            if ((p.name||'').toLowerCase() === _pnLower) {
              appearances.push({ date, game: g, side, player: p, type: 'pitcher' });
            }
          });
        } else {
          const batters = g.batters[side] || [];
          batters.forEach(b => {
            if ((b.name||'').toLowerCase() === _pnLower) {
              appearances.push({ date, game: g, side, player: b, type: 'batter' });
            }
          });
        }
      });
    });
  });

  appearances.sort((a, b) => b.date.localeCompare(a.date));

  // MLB時: 個人JSON（_mlbPlayerCache）からappearancesを補完・上書き
  if (currentSport === 'mlb') {
    const cache = (window._mlbPlayerCache || {})[playerName] || {};
    const gameSheet = playerType === 'pitcher' ? '試合別投手成績' : '試合別打者成績';
    const mixSheet  = '試合別投球配球';
    const mixLrSheet= '試合別投球配球_左右別';
    const gameMixRows = cache[mixSheet]  || [];
    const gameMixLrRows= cache[mixLrSheet] || [];

    // ゲームシートの行を appearances に注入
    (cache[gameSheet] || []).forEach(row => {
      const date = (row['試合日'] || '').slice(0,10);
      const ap = appearances.find(a => a.date === date);
      if (ap) {
        // MLB固有指標を player オブジェクトに追加
        if (playerType === 'pitcher') {
          Object.assign(ap.player, {
            kpct:  row['K%'],   bbpct: row['BB%'],
            kbbpct:row['K-BB%'],gbpct: row['GB%'],
            swstr: row['空振り率'], oSwing:row['ゾーン外スイング率'],
            zone:  row['ゾーン率'], strike:row['ストライク率'],
            // MLB独自
            avgEV: row['平均打球速度EV(km/h)'], hardHitPct: row['Hard-Hit%'],
            barrelPct: row['Barrel%'], xwoba: row['xwOBA被打'],
            avgSpin: row['平均回転数(rpm)'], extension: row['Extension(m)'],
          });
          // 球種mixin（試合別投球配球）
          const mixRows = gameMixRows.filter(r => (r['試合日']||'').slice(0,10) === date);
          if (mixRows.length) {
            const _origMix = ap.player.mix || []; // 元のJSON mixからlocsを保持
            ap.player.mix = mixRows.map(r => {
              const orig = _origMix.find(m => m.key === r['球種コード']) || {};
              return {
                name: r['球種名'], key: r['球種コード'],
                count: r['投球数'], pct: r['投球割合%'],
                vel: r['平均球速'], maxVel: r['最高球速'],
                swstr: r['空振り率'], oSwing: r['ゾーン外スイング率'],
                zone: r['ゾーン率'], strike: r['ストライク率'],
                gbpct: r['GB%'], hits: r['H'], hr: r['HR'],
                avgSpin: r['平均回転数(rpm)'], spinAxis: r['回転軸(°)'],
                activeSpin: r['回転効率%(近似)'], vaa: r['VAA(°)'],
                ivb: r['IVB(cm)'], hb: r['HB arm(cm)'], ext: r['Extension(m)'],
                locs: orig.locs || [], // JSONのlocsを保持
                xwoba: orig.xwoba ?? null,
              };
            });
          }
          // 対右・対左
          ['右','左'].forEach(lr => {
            const lrRows = gameMixLrRows.filter(r => (r['試合日']||'').slice(0,10) === date && r['対打者'] === lr);
            if (lrRows.length) {
              const key = lr === '右' ? 'mixVsR' : 'mixVsL';
              const _origLr = ap.player[key] || [];
              ap.player[key] = lrRows.map(r => {
                const orig = _origLr.find(m => m.key === r['球種コード']) || {};
                return {
                  name: r['球種名'], key: r['球種コード'],
                  count: r['投球数'], pct: r['投球割合%'],
                  vel: r['平均球速'], swstr: r['空振り率'],
                  oSwing: r['ゾーン外スイング率'], zone: r['ゾーン率'],
                  strike: r['ストライク率'], gbpct: r['GB%'],
                  hits: r['H'], hr: r['HR'],
                  avgSpin: r['平均回転数(rpm)'], spinAxis: r['回転軸(°)'],
                  activeSpin: r['回転効率%(近似)'], vaa: r['VAA(°)'],
                  ivb: r['IVB(cm)'], hb: r['HB arm(cm)'], ext: r['Extension(m)'],
                  locs: orig.locs || [], // JSONのlocsを保持
                  xwoba: orig.xwoba ?? null,
                };
              });
            }
          });
        } else {
          Object.assign(ap.player, {
            ops: row['OPS'], ba: row['打率'], obp: row['出塁率'], slg: row['長打率'],
            hr: row['本塁打'], rbi: row['打点'], h: row['安打'], ab: row['打数'],
            k: row['三振'], bb: row['四球'],
            // MLB独自
            avgEV: row['平均打球速度EV(km/h)'], hardHitPct: row['Hard-Hit%'],
            barrelPct: row['Barrel%'],
            barrelN: row['Barrel数'],
            xba: row['xBA'], xwoba: row['xwOBA'],
            batSpd: row['平均バットスピード(km/h)'], attackAngle: row['平均アタックアングル(°)'],
          });
        }
      }
    });
  }

  if (playerType === 'pitcher') {
    function _aggregateSeasonMix(apList, mixKey) {
      const km = {};
      apList.forEach(ap => {
        const src = mixKey === 'mixVsR' ? (ap.player.mixVsR || ap.player.mix || [])
                  : mixKey === 'mixVsL' ? (ap.player.mixVsL || ap.player.mix || [])
                  : (ap.player.mix || []);
        src.forEach(m => {
          if (!km[m.key]) km[m.key]={name:m.name,key:m.key,count:0,swstrSum:0,zoneSum:0,oSwingSum:0,oSwingCount:0,velSum:0,velCount:0,maxVel:0,hits:0,hr:0,strikeSum:0,strikeCount:0,gbpctSum:0,gbpctCount:0,cbsMerged:{},avgSpinSum:0,avgSpinCount:0,spinAxisSum:0,spinAxisCount:0,activeSpinSum:0,activeSpinCount:0,vaaSum:0,vaaCount:0,ivbSum:0,ivbCount:0,hbSum:0,hbCount:0,extSum:0,extCount:0,xwobaSum:0,xwobaCount:0};
          const k=km[m.key];
          k.count+=m.count;
          k.swstrSum+=(+(m.swstr)||0)*m.count;
          k.zoneSum+=(+(m.zone)||0)*m.count;
          if(m.oSwing!=null){k.oSwingSum+=(+(m.oSwing)||0)*m.count; k.oSwingCount+=m.count;}
          if(m.vel&&m.vel>0){k.velSum+=m.vel*m.count;k.velCount+=m.count;}
          if(m.maxVel&&m.maxVel>0&&m.maxVel>k.maxVel) k.maxVel=m.maxVel;
          k.hits+=(m.hits||0); k.hr+=(m.hr||0);
          if(m.strike!=null){k.strikeSum+=(+(m.strike)||0)*m.count;k.strikeCount+=m.count;}
          if(m.gbpct!=null){k.gbpctSum+=(+(m.gbpct)||0);k.gbpctCount++;}
          // cbs（カウント別）をマージ
          if(m.cbs) Object.entries(m.cbs).forEach(([ck,cv])=>{
            if(!k.cbsMerged[ck]) k.cbsMerged[ck]={c:0,sw:0,fo:0,lo:0,ba:0,ou:0,hi:0};
            const kc=k.cbsMerged[ck];
            ['c','sw','fo','lo','ba','ou','hi'].forEach(f=>{kc[f]+=(cv[f]||0);});
          });
          // MLB独自: 投球数加重平均
          if(m.avgSpin!=null&&m.avgSpin>0){k.avgSpinSum+=m.avgSpin*m.count;k.avgSpinCount+=m.count;}
          if(m.spinAxis!=null){k.spinAxisSum+=m.spinAxis*m.count;k.spinAxisCount+=m.count;}
          if(m.activeSpin!=null){k.activeSpinSum+=m.activeSpin*m.count;k.activeSpinCount+=m.count;}
          if(m.vaa!=null){k.vaaSum+=m.vaa*m.count;k.vaaCount+=m.count;}
          if(m.ivb!=null){k.ivbSum+=m.ivb*m.count;k.ivbCount+=m.count;}
          if(m.hb!=null){k.hbSum+=m.hb*m.count;k.hbCount+=m.count;}
          if(m.ext!=null&&m.ext>0){k.extSum+=m.ext*m.count;k.extCount+=m.count;}
          if(m.xwoba!=null){k.xwobaSum+=m.xwoba*m.count;k.xwobaCount+=m.count;}
        });
      });
      const merged=Object.values(km).sort((a,b)=>b.count-a.count);
      const tot=merged.reduce((s,m)=>s+m.count,0);
      return merged.map(m=>({
        name:m.name,key:m.key,count:m.count,
        pct:tot>0?(m.count/tot*100).toFixed(1):'0',
        vel:m.velCount>0?(m.velSum/m.velCount).toFixed(1):null,
        maxVel:m.maxVel>0?m.maxVel:null,
        swstr:m.count>0?(m.swstrSum/m.count).toFixed(1):'0',
        zone:m.count>0?(m.zoneSum/m.count).toFixed(1):'0',
        oSwing:m.oSwingCount>0?(m.oSwingSum/m.oSwingCount).toFixed(1):null,
        strike:m.strikeCount>0?(m.strikeSum/m.strikeCount).toFixed(1):null,
        gbpct:m.gbpctCount>0?(m.gbpctSum/m.gbpctCount).toFixed(1):null,
        hits:m.hits,hr:m.hr,
        cbs:Object.keys(m.cbsMerged||{}).length>0?m.cbsMerged:undefined,
        avgSpin:m.avgSpinCount>0?Math.round(m.avgSpinSum/m.avgSpinCount):null,
        spinAxis:m.spinAxisCount>0?Math.round(m.spinAxisSum/m.spinAxisCount):null,
        activeSpin:m.activeSpinCount>0?+(m.activeSpinSum/m.activeSpinCount).toFixed(1):null,
        vaa:m.vaaCount>0?+(m.vaaSum/m.vaaCount).toFixed(2):null,
        ivb:m.ivbCount>0?+(m.ivbSum/m.ivbCount).toFixed(1):null,
        hb:m.hbCount>0?+(m.hbSum/m.hbCount).toFixed(1):null,
        ext:m.extCount>0?+(m.extSum/m.extCount).toFixed(2):null,
        xwoba:m.xwobaCount>0?+(m.xwobaSum/m.xwobaCount).toFixed(3):null,
      }));
    }
    window._seasonMixAll  = _aggregateSeasonMix(appearances, 'mix');
    window._seasonMixVsR  = _aggregateSeasonMix(appearances, 'mixVsR');
    window._seasonMixVsL  = _aggregateSeasonMix(appearances, 'mixVsL');
    _pitchCmpSeasonMix = window._seasonMixAll;

    // シーズン全登板のlocsを球種×左右別に集約
    (function() {
      const _pc={FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6'};
      const map = {};
      appearances.forEach(ap => {
        // mixVsR/mixVsLのlocsのみ使用（mixAllは使わない→2重カウント防止）
        ['mixVsR','mixVsL'].forEach(mixKey => {
          (ap.player[mixKey]||[]).forEach(m => {
            if(!m.key||!m.locs||!m.locs.length) return;
            if(!map[m.key]) map[m.key] = { name: m.name, color: _pc[m.key]||'#94A3B8', locsR:[], locsL:[] };
            if(mixKey==='mixVsR') map[m.key].locsR = map[m.key].locsR.concat(m.locs);
            else if(mixKey==='mixVsL') map[m.key].locsL = map[m.key].locsL.concat(m.locs);
          });
        });
        // mixVsR/VsLにlocsがない場合はmix（全体）のlocsを均等に振り分け
        (ap.player['mix']||[]).forEach(m => {
          if(!m.key||!m.locs||!m.locs.length) return;
          if(!map[m.key]) map[m.key] = { name: m.name, color: _pc[m.key]||'#94A3B8', locsR:[], locsL:[] };
          // VsR/VsLともにlocsがない場合のみmix.locsをそのままlocsRに入れる
          if(!map[m.key].locsR.length && !map[m.key].locsL.length) {
            map[m.key].locsR = m.locs; // 左右不明のためRに一時格納
          }
        });
      });
      window._seasonLocsMap = map;
    })();
  }

  const teamColor = TC[playerTeam] || 'var(--blue)';
  const totalGames = appearances.length;

  function getGameIdx(date, game) {
    const games = DATA[date] || [];
    return games.findIndex(g => g.home === game.home && g.away === game.away);
  }

  function toggleYearAccordion(year) {
    const body  = document.getElementById('year-'+year+'-body');
    const arrow = document.getElementById('year-'+year+'-arrow');
    const hdr   = document.getElementById('year-'+year+'-hdr');
    if(!body) return;
    const isOpen = body.style.display !== 'none';
    if(isOpen) {
      _closePitchDetail();
      body.style.display = 'none';
      if(arrow) arrow.style.transform = 'rotate(0deg)';
      if(hdr)   hdr.style.borderRadius = '12px';
    } else {
      body.style.display = 'block';
      if(arrow) arrow.style.transform = 'rotate(180deg)';
      if(hdr)   hdr.style.borderRadius = '12px 12px 0 0';
    }
  }
  window.toggleYearAccordion = toggleYearAccordion;

  function buildPitcherRows(seasonData) {
    const COL_N = 11; 
    function calcSeasonStats(mode) {
      function weightedAvg(arr, valKey, weightKey) {
        const tot = arr.reduce((s,x)=>s+(x[weightKey]||0),0);
        if(!tot) return null;
        return parseFloat((arr.reduce((s,x)=>s+((x[valKey]||0))*(x[weightKey]||0),0)/tot).toFixed(1));
      }

      if(mode === 'vs_r' || mode === 'vs_l') {
        const statKey = mode === 'vs_r' ? 'pitStatVsR' : 'pitStatVsL';
        const stats = appearances.map(ap=>ap.player[statKey]).filter(Boolean);
        if(!stats.length) return null;
        const totPitches = stats.reduce((s,x)=>s+(x.pitches||0),0);
        const totK  = stats.reduce((s,x)=>s+(x.k||0),0);
        const totBB = stats.reduce((s,x)=>s+(x.bb||0),0);
        const totH  = stats.reduce((s,x)=>s+(x.h||0),0);
        const kbbpct = null; 
        const totTBF = stats.reduce((s,x)=>s+(x.tbf||0),0);
        const kpct   = totTBF>0 ? (totK/totTBF*100).toFixed(1) : null;
        const bbpct  = totTBF>0 ? (totBB/totTBF*100).toFixed(1) : null;
        const kbbpctV= totTBF>0 ? ((totK-totBB)/totTBF*100).toFixed(1) : null;
        const gbSum  = stats.reduce((s,x)=>s+(x.gbpct||0),0);
        const gbCnt  = stats.filter(x=>x.gbpct!=null).length;
        return {
          games: appearances.length,
          ip:     null, k: totK, bb: totBB, h: totH, er: null, era: null,
          kpct, bbpct, kbbpct: kbbpctV,
          swstr:  weightedAvg(stats,'swstr','pitches'),
          oSwing: weightedAvg(stats,'oSwing','pitches'),
          strike: weightedAvg(stats,'strike','pitches'),
          zone:   weightedAvg(stats,'zone','pitches'),
          gbpct:  gbCnt>0 ? (gbSum/gbCnt).toFixed(1) : null,
        };
      }

      const totalIP_raw = appearances.reduce((sum, ap) => {
        const v = String(ap.player.ip || '0');
        const [whole, frac] = v.split('.');
        return sum + parseInt(whole||0)*3 + (frac==='1'?1:frac==='2'?2:0);
      }, 0);
      const totalIP = Math.floor(totalIP_raw/3) + '.' + (totalIP_raw%3===0?'0':totalIP_raw%3===1?'1':'2');
      const totalK   = appearances.reduce((s,ap) => s+(ap.player.k||0), 0);
      const totalBB  = appearances.reduce((s,ap) => s+(ap.player.bb||0), 0);
      const totalH   = appearances.reduce((s,ap) => s+(ap.player.h||0), 0);
      const totalER  = appearances.reduce((s,ap) => s+(ap.player.er||0), 0);
      const ipNum    = totalIP_raw / 3;
      const era      = ipNum > 0 ? (totalER/ipNum*9).toFixed(2) : null;
      // K%/BB%/K-BB%: Σ奪三振/Σ対戦打者数 で直接計算（tbfがない場合はk+bb+h近似）
      const _csTotK  = appearances.reduce((s,ap)=>s+(ap.player.k||0), 0);
      const _csTotBB = appearances.reduce((s,ap)=>s+(ap.player.bb||0), 0);
      const _csTotTBF= appearances.reduce((s,ap)=>{
        const p=ap.player; return s+(p.tbf||(p.k||0)+(p.bb||0)+(p.h||0));
      }, 0);
      const kpct   = _csTotTBF>0 ? (_csTotK/_csTotTBF*100).toFixed(1) : null;
      const bbpct  = _csTotTBF>0 ? (_csTotBB/_csTotTBF*100).toFixed(1) : null;
      const kbbpct = _csTotTBF>0 ? ((_csTotK-_csTotBB)/_csTotTBF*100).toFixed(1) : null;
      let totPitches=0, swstrSum=0, oSwingSum=0, strikeSum=0, zoneSum=0, gbSum=0, gbCount=0;
      appearances.forEach(ap => {
        const p = ap.player;
        const n = p.pitches || 0;
        if(n > 0) {
          totPitches += n;
          if(p.swstr  != null) swstrSum  += p.swstr  * n;
          if(p.oSwing != null) oSwingSum += p.oSwing * n;
          if(p.strike != null) strikeSum += p.strike * n;
          if(p.zone   != null) zoneSum   += p.zone   * n;
        }
        if(p.gbpct != null) { gbSum += p.gbpct; gbCount++; }
      });
      return {
        games: appearances.length,
        ip: totalIP, k: totalK, bb: totalBB, h: totalH, er: totalER, era,
        kpct, bbpct, kbbpct,
        swstr:  totPitches > 0 ? (swstrSum/totPitches).toFixed(1) : null,
        oSwing: totPitches > 0 ? (oSwingSum/totPitches).toFixed(1) : null,
        strike: totPitches > 0 ? (strikeSum/totPitches).toFixed(1) : null,
        zone:   totPitches > 0 ? (zoneSum/totPitches).toFixed(1) : null,
        gbpct:  gbCount > 0 ? (gbSum/gbCount).toFixed(1) : null,
      };
    }

    function buildSS(seasonDataRow, mode) {
      // K%/BB%/K-BB% は常に calcSeasonStats（appearances集計）の値を使う
      const raw = calcSeasonStats(mode);
      if(!raw) return null;
      // mode==='all' かつマスタデータがある場合: ip/era/swstr/zone等はマスタ値で補完
      const sd = (seasonDataRow && mode === 'all') ? seasonDataRow : null;
      return {
        games: raw.games,
        ip:     sd && sd['投球回'] != null ? String(sd['投球回']) : raw.ip,
        kbbpct: raw.kbbpct,
        kpct:   raw.kpct,
        bbpct:  raw.bbpct,
        era:    raw.era,
        swstr:  sd && sd['空振り率']       != null ? parseFloat(sd['空振り率']).toFixed(1)       : raw.swstr,
        oSwing: sd && sd['ゾーン外スイング率'] != null ? parseFloat(sd['ゾーン外スイング率']).toFixed(1) : raw.oSwing,
        strike: sd && sd['ストライク率']   != null ? parseFloat(sd['ストライク率']).toFixed(1)   : raw.strike,
        zone:   sd && sd['ゾーン率']       != null ? parseFloat(sd['ゾーン率']).toFixed(1)       : raw.zone,
        gbpct:  sd && sd['GB%']   != null ? parseFloat(sd['GB%']).toFixed(1)   : raw.gbpct,
      };
    }

    const ssAll  = buildSS(seasonData, 'all');
    const ssVsR  = buildSS(null, 'vs_r');
    const ssVsL  = buildSS(null, 'vs_l');
    const ssDataAttr = JSON.stringify({all:ssAll, vs_r:ssVsR, vs_l:ssVsL}).replace(/'/g,"&#39;");

    function renderSeasonTds(ss, role) {
      if(!ss) return '<td colspan="8" style="padding:7px 8px;color:var(--text3);font-size:11px">データなし</td>';
      const _csAll=window._colorScaleStats||{};
      const roleKey=role==='先発'?'starter':'reliever';
      const _cs=_csAll[roleKey]||_csAll.starter||{};
      const td=(v,colKey,extra='')=>{
        const raw=v!=null?parseFloat(v):null;
        const sc=raw!=null?getScaleColor(colKey,raw,_cs):'';
        const bgS=sc?`background-color:${sc};`:'';
        return `<td class="pit-data-td" style="padding:7px 8px;font-family:'DM Mono';font-size:12px;text-align:left;${bgS}${extra}">${v!=null?v:'—'}</td>`;
      };
      const mlbCells = '';
      return [
        td(ss.swstr!=null?ss.swstr+'%':null,  'swstr',  ''),
        td(ss.oSwing!=null?ss.oSwing+'%':null, 'oSwing', ''),
        td(ss.strike!=null?ss.strike+'%':null, 'strike', ''),
        td(ss.zone!=null?ss.zone+'%':null,     'zone',   ''),
        td(ss.kbbpct!=null?ss.kbbpct+'%':null, 'kbbpct', ''),
        td(ss.kpct!=null?ss.kpct+'%':null,     'kpct',   ''),
        td(ss.bbpct!=null?ss.bbpct+'%':null,   'bbpct',  ''),
        td(ss.gbpct!=null?ss.gbpct+'%':null,   'gbpct',  ''),
      ].join('') + mlbCells;
    }

    const ssAll0 = ssAll || {};
    const seasonResultCell = `<td style="padding:5px 8px;font-family:'DM Mono';font-size:10px;color:var(--text2);position:sticky;left:80px;background:inherit;z-index:2;white-space:nowrap;min-width:160px">
      <span style="color:var(--gold);font-weight:700">${ssAll0.games||appearances.length}登板</span>
      <span style="margin-left:4px;color:var(--text)">${ssAll0.ip||'—'}回</span>
      <span style="margin-left:4px;color:var(--cyan)">防${ssAll0.era||'—'}</span>
      <span style="margin-left:4px">${ssAll0.kpct ? Math.round(parseFloat(ssAll0.kpct) * (appearances.reduce((s,ap)=>s+(ap.player.k||0),0)/(parseFloat(ssAll0.kpct)/100||1))) : appearances.reduce((s,ap)=>s+(ap.player.k||0),0)}K</span>
      <span style="margin-left:4px;color:#F87171">${appearances.reduce((s,ap)=>s+(ap.player.bb||0),0)}BB</span>
    </td>`;

    const totalK_s  = appearances.reduce((s,ap)=>s+(ap.player.k||0),0);
    const totalBB_s = appearances.reduce((s,ap)=>s+(ap.player.bb||0),0);
    const seasonRow = `<tr id="pgr-season" data-ss='${ssDataAttr}' class="pit-row-season" style="background:var(--bg3);border-bottom:2px solid var(--blue);cursor:pointer" onclick="pitchSeasonRowClick()">
      <td class="pit-sticky" style="padding:6px 8px;text-align:center;vertical-align:middle;position:sticky;left:0;z-index:2" onclick="event.stopPropagation()">
        <input type="checkbox" id="pitch-cmp-season-cb" onchange="pitchCmpToggle(this,'season')" style="width:14px;height:14px;cursor:pointer;accent-color:var(--blue)">
      </td>
      <td class="pit-sticky" style="padding:7px 10px;font-family:'DM Mono';font-size:12px;font-weight:700;color:var(--gold);position:sticky;left:28px;z-index:2;white-space:nowrap">シーズン</td>
      <td class="pit-sticky" style="padding:7px 8px;font-family:'DM Mono';font-size:11px;color:var(--text3);position:sticky;left:92px;z-index:2">—</td>
      <td class="pit-sticky" style="padding:5px 8px;font-family:'DM Mono';font-size:10px;color:var(--text2);position:sticky;left:182px;z-index:2;white-space:nowrap">
        <span style="color:var(--gold);font-weight:700">${ssAll0.games||appearances.length}登板</span>
        <span style="margin-left:5px;color:var(--text);font-weight:700">${ssAll0.ip||'—'}回</span>
        <span style="margin-left:5px;color:var(--cyan)">防${ssAll0.era||'—'}</span>
        <span style="margin-left:5px">${totalK_s}K</span>
        <span style="margin-left:4px;color:#F87171">${totalBB_s}BB</span>
      </td>
      ${renderSeasonTds(ssAll, appearances.length>0?appearances[0].player.role:'先発')}
    </tr>`;

    if (!appearances.length) return seasonRow + `<tr><td colspan="${COL_N}" style="padding:20px;color:var(--text3);text-align:center">データなし</td></tr>`;

    // currentPlayerRole: 投手個人ページの主ロール（先発/中継ぎ）
    window._currentPlayerRole = appearances.length > 0 ? appearances[0].player.role : '先発';
    // locsデータをwindowキャッシュに別途保存（data-mix属性に含めるとサイズが大きくなりすぎるため）
    window._playerLocsCache = {};
    appearances.forEach((ap, _ci) => {
      const entry = { mix: {}, mixVsR: {}, mixVsL: {} };
      (ap.player.mix||[]).forEach(m => { if(m.key && m.locs?.length) entry.mix[m.key] = m.locs; });
      (ap.player.mixVsR||[]).forEach(m => { if(m.key && m.locs?.length) entry.mixVsR[m.key] = m.locs; });
      (ap.player.mixVsL||[]).forEach(m => { if(m.key && m.locs?.length) entry.mixVsL[m.key] = m.locs; });
      window._playerLocsCache[_ci] = entry;
    });

    const _cmpMixJson = JSON.stringify(appearances.map((ap, _ci) => {
      const [,_cm,_cd] = ap.date.split('-');
      const _opp = ap.side === 'home' ? ap.game.away : ap.game.home;
      return {
        idx: _ci,
        role: ap.player.role || '先発',
        hand: ap.player.hand || 'R',
        mix: ap.player.mix || [],
        mixVsR: ap.player.mixVsR || [],
        mixVsL: ap.player.mixVsL || [],
        label: parseInt(_cm) + '/' + parseInt(_cd) + ' vs ' + _opp
      };
    })).replace(/'/g, '&#39;');

    let html = seasonRow;
    appearances.forEach((ap, i) => {
      const p = ap.player;
      const zs = p.zoneStats || {};
      const pSwstr  = p.swstr  != null ? p.swstr  : zs.swstr;
      const pOSwing = p.oSwing != null ? p.oSwing : (zs.oSwing != null ? zs.oSwing : null);
      const pStrike = p.strike != null ? p.strike : zs.strike;
      const pZone   = p.zone   != null ? p.zone   : zs.zone;
      const mixOSwingAll = (() => {
        if(pOSwing != null) return pOSwing;
        const mix = p.mix || [];
        const tot = mix.reduce((s,m)=>s+m.count,0);
        return tot>0 ? parseFloat((mix.reduce((s,m)=>s+(+(m.oSwing)||0)*m.count,0)/tot).toFixed(1)) : null;
      })();
      const g = ap.game;
      const opp = ap.side === 'home' ? g.away : g.home;
      const oppColor = TC[opp] || 'var(--text3)';
      const [,m,d] = ap.date.split('-');
      const resStyles = { W:'background:#16a34a;color:#fff', L:'background:#dc2626;color:#fff', H:'background:#d97706;color:#fff', S:'background:#7c3aed;color:#fff' };
      const resBadge = p.result
        ? `<span style="font-size:9px;padding:1px 5px;border-radius:3px;font-family:'DM Mono';font-weight:700;${resStyles[p.result]||'background:rgba(148,163,184,0.15);color:#94a3b8;border:1px solid rgba(148,163,184,0.3)'}">${p.result}</span>`
        : '';
      const hasMix = !!(p.mix && p.mix.length);
      const rowId = 'pgr-' + i;
      const ipDisp = p.ip != null ? (String(p.ip).endsWith('.0') ? String(p.ip).replace('.0','') : String(p.ip)) : '—';
      const ipVal = p.ip != null ? parseFloat(String(p.ip).replace('.1','.33').replace('.2','.67')) : 0;
      const rVal = p.r != null ? p.r : 0;
      const erVal = p.er != null ? p.er : rVal;
      const resultCell = `<div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap">
        <span style="font-family:'DM Mono';font-size:10px;color:var(--text2);white-space:nowrap">
          <span style="font-weight:700;color:var(--text2)">${ipDisp}回</span>
          <span style="margin-left:3px">${p.pitches!=null?p.pitches:'—'}球</span>
          <span style="margin-left:3px">${p.k!=null?p.k:'—'}K</span>
          <span style="margin-left:3px">${p.bb!=null?p.bb:'—'}BB</span>
          <span style="margin-left:3px">${rVal}(${erVal})</span>
        </span>
        ${resBadge?`<span style="margin-left:2px">${resBadge}</span>`:''}
      </div>`;

      // kpct/bbpct/kbbpct: JSONにない場合はK/BB/Hから近似計算
      const _tbf = (p.k||0) + (p.bb||0) + (p.h||0);
      const _kpct   = p.kpct   != null ? p.kpct   : (_tbf > 0 ? parseFloat(((p.k||0)/_tbf*100).toFixed(1)) : null);
      const _bbpct  = p.bbpct  != null ? p.bbpct  : (_tbf > 0 ? parseFloat(((p.bb||0)/_tbf*100).toFixed(1)) : null);
      const _kbbpct = p.kbbpct != null ? p.kbbpct : (_tbf > 0 ? parseFloat((((p.k||0)-(p.bb||0))/_tbf*100).toFixed(1)) : null);
      const vsR = p.pitStatVsR || {};
      const vsL = p.pitStatVsL || {};
      const calcSwstr = (mixArr) => {
        if(!mixArr || !mixArr.length) return null;
        const tot = mixArr.reduce((s,m)=>s+m.count,0);
        return tot > 0 ? parseFloat((mixArr.reduce((s,m)=>s+(+(m.swstr)||0)*m.count,0)/tot).toFixed(1)) : null;
      };
      const calcOSwing = (mixArr) => {
        if(!mixArr || !mixArr.length) return null;
        const tot = mixArr.reduce((s,m)=>s+m.count,0);
        return tot > 0 ? parseFloat((mixArr.reduce((s,m)=>s+(+(m.oSwing)||0)*m.count,0)/tot).toFixed(1)) : null;
      };
      const vsRswstr = vsR.swstr != null ? vsR.swstr : calcSwstr(p.mixVsR);
      const vsLswstr = vsL.swstr != null ? vsL.swstr : calcSwstr(p.mixVsL);
      const vsRoSwing = vsR.oSwing != null ? vsR.oSwing : calcOSwing(p.mixVsR);
      const vsLoSwing = vsL.oSwing != null ? vsL.oSwing : calcOSwing(p.mixVsL);
      const dataAttr = (sfx) => {
        const sw = sfx===''?pSwstr : sfx==='vsr'?vsRswstr : vsLswstr;
        const os = sfx===''?mixOSwingAll : sfx==='vsr'?vsRoSwing : vsLoSwing;
        const st = sfx===''?pStrike : sfx==='vsr'?(vsR.strike!=null?vsR.strike:null) : (vsL.strike!=null?vsL.strike:null);
        const zn = sfx===''?pZone   : sfx==='vsr'?(vsR.zone!=null?vsR.zone:null)     : (vsL.zone!=null?vsL.zone:null);
        const src = sfx==='vsr'?vsR : sfx==='vsl'?vsL : p;
        // vs_r/vs_l のkpct等もフォールバック計算（all時は上で計算済みの値を使用）
        const _stbf = sfx===''?_tbf : (src.k||0)+(src.bb||0)+(src.h||0);
        const _skpct   = sfx===''?_kpct   : (src.kpct   != null ? src.kpct   : (_stbf>0 ? parseFloat(((src.k||0)/_stbf*100).toFixed(1)) : null));
        const _sbbpct  = sfx===''?_bbpct  : (src.bbpct  != null ? src.bbpct  : (_stbf>0 ? parseFloat(((src.bb||0)/_stbf*100).toFixed(1)) : null));
        const _skbbpct = sfx===''?_kbbpct : (src.kbbpct != null ? src.kbbpct : (_stbf>0 ? parseFloat((((src.k||0)-(src.bb||0))/_stbf*100).toFixed(1)) : null));
        return `data-swstr${sfx}="${sw!=null?sw:''}" data-oswing${sfx}="${os!=null?os:''}" data-strike${sfx}="${st!=null?st:''}" data-zone${sfx}="${zn!=null?zn:''}" data-kbbpct${sfx}="${_skbbpct!=null?_skbbpct:''}" data-kpct${sfx}="${_skpct!=null?_skpct:''}" data-bbpct${sfx}="${_sbbpct!=null?_sbbpct:''}" data-gbpct${sfx}="${src.gbpct!=null?src.gbpct:''}"`;
      };

      html += `<tr id="${rowId}"
        data-swstr="${pSwstr!=null?pSwstr:''}"
        data-oswing="${mixOSwingAll!=null?mixOSwingAll:''}"
        data-strike="${pStrike!=null?pStrike:''}"
        data-zone="${pZone!=null?pZone:''}"
        data-kbbpct="${_kbbpct!=null?_kbbpct:''}"
        data-kpct="${_kpct!=null?_kpct:''}"
        data-bbpct="${_bbpct!=null?_bbpct:''}"
        data-gbpct="${p.gbpct!=null?p.gbpct:''}"
        ${dataAttr('vsr')} ${dataAttr('vsl')}
        data-date="${ap.date}"
        data-role="${p.role||'先発'}"
        class="pit-row" style="cursor:${hasMix?'pointer':'default'};border-bottom:1px solid rgba(255,255,255,0.05)">
        <td class="pit-sticky" style="padding:6px 8px;text-align:center;vertical-align:middle;position:sticky;left:0;z-index:2" onclick="event.stopPropagation()">
          ${hasMix ? `<input type="checkbox" data-pidx="${i}" onchange="pitchCmpToggle(this,${i})" style="width:14px;height:14px;cursor:pointer;accent-color:var(--blue)">` : ''}
        </td>
        <td class="pit-sticky" style="padding:7px 8px;font-family:'DM Mono';font-size:11px;white-space:nowrap;position:sticky;left:28px;z-index:2;cursor:${hasMix?'pointer':'default'}" onclick="${hasMix?`pitchRowClick(${i})`:''}"> ${parseInt(m)}/${parseInt(d)}</td>
        <td class="pit-sticky" style="padding:7px 8px;font-size:11px;white-space:nowrap;position:sticky;left:92px;z-index:2;cursor:${hasMix?'pointer':'default'}" onclick="${hasMix?`pitchRowClick(${i})`:''}"><span style="color:${oppColor}">vs ${opp}</span></td>
        <td class="pit-sticky" style="padding:6px 8px;white-space:nowrap;position:sticky;left:182px;z-index:2;cursor:${hasMix?'pointer':'default'}" onclick="${hasMix?`pitchRowClick(${i})`:''}">
          ${resultCell}
        </td>
        ${(()=>{
          const _csAll=window._colorScaleStats||{};
          const _roleKey=p.role==='先発'?'starter':'reliever';
          const _cs=_csAll[_roleKey]||_csAll.starter||{};
          const _oc=hasMix?`pitchRowClick(${i})`:''; 
          const _scTd=(val,colKey,color)=>{
            const sc=val!=null?getScaleColor(colKey,val,_cs):'';
            const bgS=sc?`background-color:${sc};`:'';
            const colorS=color?`color:${color};`:'';
            return `<td class="pit-data-td" style="padding:7px 8px;font-family:'DM Mono';font-size:12px;text-align:left;${colorS}${bgS}" onclick="${_oc}">${val!=null?val+'%':'—'}</td>`;
          };
          return [
            _scTd(pSwstr,       'swstr',  ''),
            _scTd(mixOSwingAll, 'oSwing', ''),
            _scTd(pStrike,      'strike', ''),
            _scTd(pZone,        'zone',   ''),
            _scTd(_kbbpct,      'kbbpct', ''),
            _scTd(_kpct,        'kpct',   ''),
            _scTd(_bbpct,       'bbpct',  ''),
            _scTd(p.gbpct,      'gbpct',  ''),
          ].join('');
        })()}
        ${currentSport==='mlb' ? `

        ` : ''}
      </tr>`;
    });

    html += `<tr style="display:none"><td id="pitch-cmp-data" data-mix='${_cmpMixJson}'></td></tr>`;
    return html;
  }

  function buildBatterRows(seasonData) {
    const td = (val, extra='') => `<td style="padding:7px 8px;font-family:'DM Mono';font-size:12px;${extra}">${val}</td>`;
    let seasonRow = '';
    if(seasonData){
      const hrDisp  = seasonData['本塁打'] != null ? String(seasonData['本塁打']) : '—';
      const rbiDisp = seasonData['打点']   != null ? String(seasonData['打点'])   : '—';
      const opsDisp = seasonData['OPS']    != null ? (+seasonData['OPS']).toFixed(3).replace(/^0/,'') : '—';
      const baDisp  = seasonData['打率']   != null ? (+seasonData['打率']).toFixed(3).replace(/^0/,'') : '—';
      const tbDisp  = seasonData['塁打']   != null ? String(seasonData['塁打']) : '—';
      const hitN    = seasonData['安打']   != null ? parseInt(seasonData['安打'])  : 0;
      const bbN     = seasonData['四球']   != null ? parseInt(seasonData['四球'])  : (seasonData['BB'] != null ? parseInt(seasonData['BB']) : 0);
      const obDisp  = (hitN + bbN) > 0 ? String(hitN + bbN) : '—';
      const paDisp  = seasonData['打席']   != null ? String(seasonData['打席'])   : `${appearances.length}試合`;
      seasonRow = `<tr style="background:var(--bg3);border-bottom:2px solid var(--blue)">
        <td style="padding:7px 10px;font-family:'DM Mono';font-size:11px;white-space:nowrap;font-weight:700;color:var(--gold)">シーズン</td>
        <td style="padding:7px 8px;font-size:11px;white-space:nowrap;color:var(--text2)">打率 ${baDisp}<br><span style="font-size:10px;color:var(--text3)">${paDisp}打席</span></td>
        <td style="padding:7px 8px;font-size:11px">—</td>
        ${td(opsDisp,'font-weight:700;color:var(--green)')}
        ${td(tbDisp,'color:var(--cyan)')}
        ${td(obDisp,'color:var(--teal)')}
        ${td('—')}
        ${td(hrDisp,'color:var(--red)')}
        ${td(rbiDisp)}
        ${currentSport==='mlb' ? `
        ${td('—','color:#10B981')} ${td('—','color:#10B981')} ${td('—','color:#10B981')}
        ${td('—','color:#1A3A5C')} ${td('—','color:#1A3A5C')}
        ${td('—','color:#78350A')} ${td('—','color:#78350A')}
        ` : ''}
      </tr>`;
    }

    if (!appearances.length) return seasonRow + '<tr><td colspan="9" style="padding:20px;color:var(--text3);text-align:center">データなし</td></tr>';
    let html = seasonRow;
    appearances.forEach(ap => {
      const b = ap.player;
      const g = ap.game;
      const opp = ap.side === 'home' ? g.away : g.home;
      const oppColor = TC[opp] || 'var(--text3)';
      const [,m,d] = ap.date.split('-');
      const opsVal   = b.ops != null ? (+b.ops).toFixed(3).replace(/^0/,'') : '—';
      const opsColor = b.ops >= 0.900 ? 'var(--green)' : b.ops >= 0.750 ? 'var(--text)' : 'var(--text3)';
      const normAbs  = (b.abs||[]).filter(a=>a&&a!=='—').map(a=>(a!=='HR'&&/本/.test(a))?'HR':a);
      const abBadges = normAbs.map(a => {
        const BG={'HR':'#7B2828','2B':'#0D6B6B','3B':'#0D6B6B','H':'#1B5E40','BB':'#5C5000','K':'#1E2A38','GO':'#1E2A38','DP':'#1E2A38','FO':'#1E2A38'};
        const FG={'HR':'#E2E8F0','2B':'#E2E8F0','3B':'#E2E8F0','H':'#E2E8F0','BB':'#E2E8F0','K':'#475569','GO':'#475569','FO':'#475569','DP':'#475569'};
        return `<span style="display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:3px;font-size:7px;font-weight:700;font-family:'DM Mono';background:${BG[a]||'#1E2A38'};color:${FG[a]||'#475569'};margin-right:1px">${a}</span>`;
      }).join('');
      const gokVal = normAbs.filter(a=>a==='GO'||a==='DP'||a==='K').length;
      const hrVal  = normAbs.filter(a=>a==='HR').length;
      const tbVal  = normAbs.reduce((s,a)=>s+(a==='HR'?4:a==='3B'?3:a==='2B'?2:(a==='H'?1:0)),0);
      const obVal  = normAbs.filter(a=>a==='HR'||a==='3B'||a==='2B'||a==='H'||a==='BB').length;
      html += `<tr onclick="selectGameFromPlayer('${ap.date}',${getGameIdx(ap.date, ap.game)})" data-date-str="${ap.date}" data-tb="${tbVal}" data-hr="${hrVal}" data-rbi="${b.rbi||0}" data-ops="${b.ops||0}" data-gok="${gokVal}" data-ob="${obVal}" style="cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05)" onmouseover="this.style.background='var(--bg4)'" onmouseout="this.style.background=''">
        <td style="padding:7px 10px;font-family:'DM Mono';font-size:11px;white-space:nowrap">${parseInt(m)}/${parseInt(d)}</td>
        <td style="padding:7px 8px;font-size:11px;white-space:nowrap;color:${oppColor}">vs ${opp}</td>
        <td style="padding:7px 8px;font-size:11px">${abBadges}</td>
        ${td(opsVal,'font-weight:700;color:'+opsColor)}
        ${td(tbVal>0?tbVal:'—','color:var(--cyan)')}
        ${td(obVal>0?obVal:'—','color:var(--teal)')}
        ${td(gokVal>0?gokVal:'—')}
        ${td(hrVal>0?hrVal:'—','color:var(--red)')}
        ${td(b.rbi!=null?b.rbi:'—')}
        ${currentSport==='mlb' ? `
        ${td(b.avgEV!=null?(+b.avgEV).toFixed(1)+'km/h':'—','color:#10B981')}
        ${td(b.hardHitPct!=null?(+b.hardHitPct).toFixed(1)+'%':'—','color:#10B981')}
        ${td(b.barrelPct!=null?(+b.barrelPct).toFixed(1)+'%':'—','color:#10B981')}
        ${td(b.xba!=null?(+b.xba).toFixed(3):'—','color:#1A3A5C')}
        ${td(b.xwoba!=null?(+b.xwoba).toFixed(3):'—','color:#1A3A5C')}
        ${td(b.batSpd!=null?(+b.batSpd).toFixed(1)+'km/h':'—','color:#78350A')}

        ` : ''}
      </tr>`;
    });
    return html;
  }

  function buildSeasonAgg(seasonData) {
    if (playerType === 'pitcher') {
      if(seasonData) {
        const games = seasonData && seasonData['登板'] != null ? String(seasonData['登板']) : String(appearances.length);
        const ip    = seasonData['投球回'] != null ? String(seasonData['投球回']) : '—';
        const era   = seasonData['防御率'] != null ? parseFloat(seasonData['防御率']).toFixed(2) : '—';
        // K%/BB%/K-BB%: Σ奪三振/Σ対戦打者数 で直接計算
        const _aggTotK  = appearances.reduce((s,ap)=>s+(ap.player.k||0), 0);
        const _aggTotBB = appearances.reduce((s,ap)=>s+(ap.player.bb||0), 0);
        const _aggTotTBF= appearances.reduce((s,ap)=>{
          const p=ap.player; return s+(p.tbf||(p.k||0)+(p.bb||0)+(p.h||0));
        }, 0);
        const kpct  = _aggTotTBF>0 ? (_aggTotK/_aggTotTBF*100).toFixed(1)+'%' : '—';
        const bbpct = _aggTotTBF>0 ? (_aggTotBB/_aggTotTBF*100).toFixed(1)+'%' : '—';
        const kbb   = _aggTotTBF>0 ? ((_aggTotK-_aggTotBB)/_aggTotTBF*100).toFixed(1)+'%' : '—';
        const w  = seasonData && seasonData['勝']     != null ? seasonData['勝']     : null;
        const l  = seasonData && seasonData['敗']     != null ? seasonData['敗']     : null;
        const sv = seasonData && seasonData['セーブ'] != null ? seasonData['セーブ'] : null;
        const hd = seasonData && seasonData['ホールド'] != null ? seasonData['ホールド'] : null;
        let recordStr = '—';
        if(w != null && l != null) recordStr = `${w}勝${l}敗`;
        if(sv != null && sv > 0) recordStr += `${sv}S`;
        if(hd != null && hd > 0) recordStr += `${hd}H`;
        const mlbPitRows = currentSport === 'mlb' ? [
          ['xwOBA被打', seasonData['xwOBA被打'] != null ? (+seasonData['xwOBA被打']).toFixed(3) : '—'],
          ['Hard-Hit%', seasonData['Hard-Hit%']  != null ? (+seasonData['Hard-Hit%']).toFixed(1)+'%' : '—'],
          ['平均回転数', seasonData['平均回転数(rpm)'] != null ? Math.round(seasonData['平均回転数(rpm)'])+'rpm' : '—'],
          ['Extension', seasonData['Extension(m)'] != null ? (+seasonData['Extension(m)']).toFixed(2)+'m' : '—'],
        ] : [];
        return [
          ['登板', games], ['投球回', ip], ['勝敗', recordStr],
          ['防御率', era], ['K-BB%', kbb], ['K%', kpct], ['BB%', bbpct],
          ...mlbPitRows,
        ];
      } else {
        const totalIP_raw = appearances.reduce((sum, ap) => {
          const v = String(ap.player.ip || '0');
          const [whole, frac] = v.split('.');
          return sum + parseInt(whole||0)*3 + (frac==='1'?1:frac==='2'?2:0);
        }, 0);
        const totalIP = Math.floor(totalIP_raw/3) + '.' + (totalIP_raw%3===0?'0':totalIP_raw%3===1?'1':'2');
        const totalK  = appearances.reduce((s,ap) => s+(ap.player.k||0), 0);
        const totalBB = appearances.reduce((s,ap) => s+(ap.player.bb||0), 0);
        const totalER = appearances.reduce((s,ap) => s+(ap.player.er||0), 0);
        const ipNum = totalIP_raw / 3;
        const era  = ipNum > 0 ? (totalER/ipNum*9).toFixed(2) : '—';
        // K%/BB%/K-BB%: Σ奪三振/Σ対戦打者数 で直接計算
        const totalTBF = appearances.reduce((s,ap) => {
          const p=ap.player; return s+(p.tbf||(p.k||0)+(p.bb||0)+(p.h||0));
        }, 0);
        const kpct = totalTBF > 0 ? (totalK/totalTBF*100).toFixed(1)+'%' : '—';
        const bbpct= totalTBF > 0 ? (totalBB/totalTBF*100).toFixed(1)+'%' : '—';
        const kbb  = totalTBF > 0 ? ((totalK-totalBB)/totalTBF*100).toFixed(1)+'%' : '—';
        return [
          ['登板', appearances.length], ['投球回', totalIP], ['勝敗', '—'],
          ['防御率', era], ['K-BB%', kbb], ['K%', kpct], ['BB%', bbpct],
        ];
      }
    } else {
      if(seasonData){
        const g    = seasonData['試合'] != null ? String(seasonData['試合']) : totalGames;
        const ab   = seasonData['打数'] != null ? String(seasonData['打数']) : '—';
        const h    = seasonData['安打'] != null ? String(seasonData['安打']) : '—';
        const ba   = seasonData['打率'] != null ? (+seasonData['打率']).toFixed(3).replace(/^0/,'') : '—';
        const hr   = seasonData['本塁打'] != null ? String(seasonData['本塁打']) : '—';
        const rbi  = seasonData['打点'] != null ? String(seasonData['打点']) : '—';
        const sb   = seasonData['盗塁'] != null ? String(seasonData['盗塁']) : '—';
        const ops  = seasonData['OPS'] != null ? (+seasonData['OPS']).toFixed(3).replace(/^0/,'') : '—';
        const mlbBatRows = currentSport === 'mlb' ? [
          ['xwOBA', seasonData['xwOBA'] != null ? (+seasonData['xwOBA']).toFixed(3) : '—'],
          ['xBA',   seasonData['xBA']   != null ? (+seasonData['xBA']).toFixed(3)   : '—'],
          ['EV avg', seasonData['平均打球速度EV(km/h)'] != null ? (+seasonData['平均打球速度EV(km/h)']).toFixed(1)+'km/h' : '—'],
          ['Hard-Hit%', seasonData['Hard-Hit%'] != null ? (+seasonData['Hard-Hit%']).toFixed(1)+'%' : '—'],
          ['Barrel%', seasonData['Barrel%'] != null ? (+seasonData['Barrel%']).toFixed(1)+'%' : '—'],
          ['Bat Spd', seasonData['平均バットスピード(km/h)'] != null ? (+seasonData['平均バットスピード(km/h)']).toFixed(1)+'km/h' : '—'],
        ] : [];
        return [
          ['試合', g+'試合'], ['打数', ab], ['安打', h], ['打率', ba],
          ['本塁打', hr], ['打点', rbi], ['盗塁', sb], ['OPS', ops],
          ...mlbBatRows,
        ];
      } else {
        const totalAB  = appearances.reduce((s,ap)=>s+(ap.player.ab||0),0);
        const totalH   = appearances.reduce((s,ap)=>s+(ap.player.h||0),0);
        const totalHR  = appearances.reduce((s,ap)=>s+(ap.player.hr||0),0);
        const totalRBI = appearances.reduce((s,ap)=>s+(ap.player.rbi||0),0);
        const totalSB  = appearances.reduce((s,ap)=>s+(ap.player.sb||0),0);
        const avgOps   = appearances.length>0?(appearances.reduce((s,ap)=>s+(ap.player.ops||0),0)/appearances.length):0;
        const ba = totalAB>0?(totalH/totalAB).toFixed(3).replace(/^0/,''):'—';
        return [
          ['試合', totalGames+'試合'], ['打数', totalAB], ['安打', totalH], ['打率', ba],
          ['本塁打', totalHR], ['打点', totalRBI], ['盗塁', totalSB],
          ['OPS平均', avgOps>0?avgOps.toFixed(3).replace(/^0/,''):'—'],
        ];
      }
    }
  }

// ── 投手ページ内関数 ──
function switchYearSplit(mode) {
  window._currentSplitMode = mode;
  ['all','vs_r','vs_l'].forEach(m => {
    const btn = document.getElementById('year-split-'+m);
    if(!btn) return;
    const active = m === mode;
    btn.style.background  = active ? 'var(--bg)'  : 'transparent';
    btn.style.color       = active ? 'var(--text)' : 'var(--text3)';
    btn.style.boxShadow   = active ? '0 1px 4px rgba(0,0,0,0.4)' : '';
  });

  _updateGameRowValues(mode);
  ['all','vs_r','vs_l'].forEach(m => {
    const btn = document.getElementById(`pitch-detail-tab-${m}`);
    if(!btn) return;
    btn.style.background = m === mode ? 'var(--bg)' : 'transparent';
    btn.style.color = m === mode ? 'var(--text)' : 'var(--text3)';
    btn.style.boxShadow = m === mode ? '0 1px 4px rgba(0,0,0,0.4)' : '';
  });

  const area = document.getElementById('pitch-detail-area');
  if(area && area.style.display !== 'none') {
    if(window._activeRowIdx === 'season' && window._pitchDetailMixes) {
      _renderPitchDetailContent(mode);
    } else if(window._pitchCmpSelected && window._pitchCmpSelected.length >= 1) {
      _renderCmpContent(mode);
    } else if(window._activeRowIdx != null) {
      _renderPitchDetailContent(mode);
    }
  }
}

function _updateGameRowValues(mode) {
  const COLS = ['swstr','oswing','strike','zone','kbbpct','kpct','bbpct','gbpct'];
  const sfx = mode === 'all' ? '' : mode === 'vs_r' ? 'vsr' : 'vsl';
  const _csAll = window._colorScaleStats || {};
  // シーズン行のroleはwindow._currentPlayerRole、試合別行はtr.dataset.roleから取得
  const _cs = null; // 行ごとに決定するため後で参照
  // 試合別行: テキストとカラースケール背景色を更新
  document.querySelectorAll('tr[data-date]').forEach(row => {
    const tds = row.querySelectorAll('td.pit-data-td');
    const rowRoleKey = (row.dataset.role==='先発') ? 'starter' : 'reliever';
    const rowCs = _csAll[rowRoleKey] || _csAll.starter || {};
    COLS.forEach((col, ci) => {
      if(!tds[ci]) return;
      const key = col + sfx;
      const val = row.dataset[key];
      const disp = (val != null && val !== '') ? parseFloat(val).toFixed(1) + '%' : '—';
      tds[ci].textContent = disp;
      const bg = (val != null && val !== '') ? getScaleColor(col, parseFloat(val), rowCs) : '';
      tds[ci].style.backgroundColor = bg || '';
    });
  });
  // シーズン行: innerHTML再構築でカラースケール込みで更新
  const seasonTr = document.getElementById('pgr-season');
  if(seasonTr) {
    try {
      const ssData = JSON.parse(seasonTr.dataset.ss.replace(/&#39;/g,"'"));
      const ss = ssData[mode];
      if(ss) {
        const seasonRoleKey = window._currentPlayerRole==='先発' ? 'starter' : 'reliever';
        const seasonCs = _csAll[seasonRoleKey] || _csAll.starter || {};
        const fmtTd = (v, colKey, extra='') => {
          const raw = v != null ? parseFloat(v) : null;
          const bg = raw != null ? getScaleColor(colKey, raw, seasonCs) : '';
          const bgS = bg ? `background-color:${bg};` : '';
          return `<td class="pit-data-td" style="padding:7px 8px;font-family:'DM Mono';font-size:12px;text-align:left;${bgS}${extra}">${v!=null?v:'—'}</td>`;
        };
        const newTds = [
          fmtTd(ss.swstr!=null?ss.swstr+'%':null,  'swstr',  ''),
          fmtTd(ss.oSwing!=null?ss.oSwing+'%':null, 'oSwing', ''),
          fmtTd(ss.strike!=null?ss.strike+'%':null, 'strike', ''),
          fmtTd(ss.zone!=null?ss.zone+'%':null,     'zone',   ''),
          fmtTd(ss.kbbpct!=null?ss.kbbpct+'%':null, 'kbbpct', ''),
          fmtTd(ss.kpct!=null?ss.kpct+'%':null,     'kpct',   ''),
          fmtTd(ss.bbpct!=null?ss.bbpct+'%':null,   'bbpct',  ''),
          fmtTd(ss.gbpct!=null?ss.gbpct+'%':null,   'gbpct',  ''),
        ].join('');
        const allTds = seasonTr.querySelectorAll('td');
        const parser = new DOMParser();
        const tmpDoc = parser.parseFromString(`<table><tr>${newTds}</tr></table>`,'text/html');
        const newTdEls = tmpDoc.querySelectorAll('td');
        const startIdx = 4;
        newTdEls.forEach((td, i) => { if(allTds[startIdx+i]) allTds[startIdx+i].replaceWith(td); });
      }
    } catch(e) {}
  }
}

window._pitTblSortKey = null;
window._pitTblSortAsc = false;
function pitTblSort(key) {
  const tbl = document.getElementById('bat-season-table');
  if(!tbl) return;
  const tbody = tbl.querySelector('tbody');
  if(!tbody) return;

  const seasonRow = document.getElementById('pgr-season');

  if(window._pitTblSortKey === key) {
    window._pitTblSortAsc = !window._pitTblSortAsc;
  } else {
    window._pitTblSortKey = key;
    window._pitTblSortAsc = false; 
  }
  const asc = window._pitTblSortAsc;

  ['date','swstr','oSwing','strike','zone','kbbpct','kpct','bbpct','gbpct'].forEach(k => {
    const el = document.getElementById('pth-sort-'+k);
    if(el) el.textContent = k===key ? (asc?'↑':'↓') : '↕';
  });

  const rows = Array.from(tbody.querySelectorAll('tr[data-date]'));
  rows.sort((a, b) => {
    if(key === 'date') {
      const da = a.dataset.date || '';
      const db = b.dataset.date || '';
      return asc ? da.localeCompare(db) : db.localeCompare(da);
    }
    const va = parseFloat(a.dataset[key]) || 0;
    const vb = parseFloat(b.dataset[key]) || 0;
    return asc ? va - vb : vb - va;
  });

  tbody.innerHTML = '';
  if(seasonRow) tbody.appendChild(seasonRow);
  rows.forEach(r => tbody.appendChild(r));
}

window._batTblSortAsc = false;
function batTblSort(key) {
  if(window._batTblSortKey === key) {
    window._batTblSortAsc = !window._batTblSortAsc;
  } else {
    window._batTblSortKey = key;
    window._batTblSortAsc = false;
  }
  ['ops','tb','ob','gok','hr','rbi'].forEach(k => {
    const el = document.getElementById('bat-sort-'+k);
    if(el) el.textContent = k === key ? (window._batTblSortAsc ? '↑' : '↓') : '↕';
  });
  const tbody = document.querySelector('#bat-season-table tbody');
  if(!tbody) return;
  const rows = [...tbody.querySelectorAll('tr')];
  const dataRows = rows.filter(r => r.dataset.dateStr);
  const seasonRow = rows.find(r => !r.dataset.dateStr);
  dataRows.sort((a, b) => {
    const va = parseFloat(a.dataset[key] || a.dataset.dateStr || '0');
    const vb = parseFloat(b.dataset[key] || b.dataset.dateStr || '0');
    if(key === 'date') {
      return window._batTblSortAsc
        ? a.dataset.dateStr.localeCompare(b.dataset.dateStr)
        : b.dataset.dateStr.localeCompare(a.dataset.dateStr);
    }
    return window._batTblSortAsc ? va - vb : vb - va;
  });
  tbody.innerHTML = '';
  if(seasonRow) tbody.appendChild(seasonRow);
  dataRows.forEach(r => tbody.appendChild(r));
}

  { key: 'pct',        label: '投球割合',      fmt: v => v != null ? v + '%'              : '—', color: 'var(--text2)' },
  { key: 'swstr',      label: '空振り率',       fmt: v => v != null ? v + '%'              : '—', color: 'var(--blue)',   loIsBest: false },

  { key: 'strike',     label: 'ストライク率',   fmt: v => v != null ? v + '%'              : '—', color: 'var(--text2)', loIsBest: false },
  { key: 'zone',       label: 'ゾーン率',       fmt: v => v != null ? v + '%'              : '—', color: 'var(--green)', loIsBest: false },
  { key: 'gbpct',      label: 'ゴロ率',         fmt: v => v != null ? v + '%'              : '—', color: 'var(--teal)',  loIsBest: false },
  { key: 'xwoba',      label: 'xwOBA',          fmt: v => v != null ? (+v).toFixed(3)      : '—', color: '#93C5FD',      loIsBest: true,  mlbOnly: true },

  { key: 'maxVel',     label: '最高球速',        fmt: v => v != null && v > 0 ? v + 'km/h' : '—', color: 'var(--orange)',loIsBest: false },

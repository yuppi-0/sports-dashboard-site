// リーグ内の全バッチファイルを読み、「AI解釈テキストがある選手名」の集合を作る（1回だけキャッシュ）。
// token・leagueは呼び出し時点のplayerIndexLoadToken・currentLeagueを渡す：全ファイルの取得中に
// 別のloadPlayerIndex呼び出し（リーグ切り替え等）が割り込んでいたら（＝取得完了時点で
// playerIndexLoadTokenが変わっていたら）、古いリーグのデータでplayersWithLlmData/llmDataByNameを
// 上書きしないよう、結果を反映せずに捨てる（レース対策。ローカル変数に集めてから最後にまとめて
// 反映するのはこのため）。
async function loadAllLlmPlayerNames(token, league){
  const nextWithLlmData = new Set();
  const nextByName = new Map();
  try{
    const idxRes = await fetchJsonZ(`${LEAGUE_PATHS[league].batches}/index.json`);
    if(idxRes.ok){
      const idx = await idxRes.json();
      const files = idx.batches || [];
      await Promise.all(files.map(async file => {
        try{
          const res = await fetchJsonZ(`${LEAGUE_PATHS[league].batches}/${file}`);
          if(!res.ok) return;
          const batch = await res.json();
          normalizeBatchEntries(batch).forEach(e => {
            if(e.name){
              nextWithLlmData.add(e.name);
              if(!nextByName.has(e.name)) nextByName.set(e.name, e.data); // 直接fetchのほうを優先したいので、既にあれば上書きしない
            }
          });
        }catch(e){ /* このバッチはスキップ */ }
      }));
    }
  }catch(e){ /* バッチ一覧が無ければ空のまま */ }
  if(token !== playerIndexLoadToken) return; // 割り込まれていたら破棄する
  playersWithLlmData = nextWithLlmData;
  llmDataByName = nextByName;
  llmDataLoaded = true;
}

// KPIカードの「XX位/XX人中」を、サイドバーの投球回フィルタの値に応じてその場で計算し直す。
// サーバー側（export_llm_input.py の compute_rankings）と同じロジック（役割で母集団を分ける、
// 5指標）をクライアント側でも再現し、index.jsonに載っている全選手の一覧（allPlayers）から算出する。
// 投球回フィルタの値を変えるたびに使うので、都度サーバーには問い合わせない。
const LIVE_RANK_SPECS = [
  ["era", false], ["k_bb_pct", true], ["k_pct", true], ["bb_pct", false], ["gb_pct", true],
  ["swstr_pct", true], ["chase_pct", true], ["strike_pct", true], ["zone_pct", true],
  ["hit_pct", false], ["xbh_pct", false],
];
// 対右/対左の合計行用。index.jsonの「{指標}_vsR」「{指標}_vsL」を使う（防御率などは対右/対左が無いので対象外）
const LIVE_RANK_HAND_KEYS = ["swstr_pct", "chase_pct", "strike_pct", "zone_pct", "gb_pct", "hit_pct", "xbh_pct"];
// suffix: "" なら全体、"_vsR"/"_vsL" なら対右/対左の値で順位を出す（返すキーは常にsuffix無しの指標名）
// 母集団は常に1軍の一覧（firstPlayers）。サイドバーで2軍表示に切り替えていても、
// 1軍カードの順位が2軍選手と混ざらないよう、表示中の一覧（allPlayers）ではなくこちらを使う。
// 選手の特定は名前で行う（2軍一覧から開いた選手はidが "farm:..." になっているため）。
function computeLiveRankings(playerName, minIp, suffix = ""){
  const target = firstPlayers.find(p => p.name === playerName);
  if(!target) return {};
  const playerId = target.id;
  const threshold = isNaN(minIp) ? 0 : minIp;
  const pool = firstPlayers.filter(p =>
    p.role === target.role && p.innings_num != null && p.innings_num >= threshold
  );
  const result = {};
  LIVE_RANK_SPECS.forEach(([baseKey, higherIsBetter]) => {
    if(suffix && !LIVE_RANK_HAND_KEYS.includes(baseKey)) return;
    const key = baseKey + suffix;
    // 一覧(index.json)側にそもそもそのフィールドが無い場合は、ここで静かにスキップする
    // （新しいランク項目を足しても、古い形式のindex.jsonではエラーにならず単に非表示になるだけ）
    if(target[key] == null) return;
    const valid = pool
      .filter(p => p[key] != null)
      .map(p => [p.id, p[key]])
      .sort((a, b) => higherIsBetter ? b[1] - a[1] : a[1] - b[1]);
    const idx = valid.findIndex(([id]) => id === playerId);
    if(idx >= 0) result[baseKey] = { rank: idx + 1, total: valid.length };
  });
  return result;
}

// ── 年度比較 ──
// 選手ヘッダー横の年度ボタンの並びに「年度比較」を置き、選ぶと球種別成績・コース分布・カウント別配球が
// 全年度の比較表示になる（各セクション内に切り替えは置かない）。複数年度を持つ1軍カードだけで有効。
function canCompareYears(d){
  return !d._isFarm && Array.isArray(d._availableYears) && d._availableYears.length > 1 && !!d._seasonEntriesByYear;
}
// 選択中の年度（新しい順）。表示中カードの年度(_activeYear)は常にその最新。
function selectedYearsOf(d){
  let sel = (compareYearsSel || []).filter(y => (d._availableYears || []).includes(y)).sort((a, b) => b.localeCompare(a));
  if(!sel.length || sel[0] !== d._activeYear) sel = [d._activeYear];
  return sel;
}
function isCompareYears(d){ return canCompareYears(d) && selectedYearsOf(d).length > 1; }
// 年度yのカードデータ（選択中の年度はd自身＝AIタグ・ライブ順位付き、他の年度は数値データのみ）
function cardOfYear(d, y){ return y === d._activeYear ? d : (d._seasonEntriesByYear && d._seasonEntriesByYear[y]); }
function yearBlocksHtml(d, renderFn){
  return d._availableYears.map(y => {
    const e = cardOfYear(d, y);
    const inner = e ? renderFn(e, y === d._activeYear, y) : "";
    return inner ? `<div class="pmix-year-block" data-year="${escapeHtml(y)}"><div class="pmix-year-label">${escapeHtml(y)}年</div>${inner}</div>` : "";
  }).join("");
}

function renderCard(d){
  const initial = (d.name || "?").trim().charAt(0);
  const minIp = parseFloat(minIpFilterEl.value);
  // 2軍表示中は1軍選手一覧(allPlayers)を母集団にしたライブ順位を出すと数値と噛み合わなくなるため、
  // その場合はJSONに焼き込み済みのd.rankings（あれば）を使う
  // 順位はその年度のカードに焼き込み済みのrankings（その年度の母集団）を使う。
  // 以前は一覧(index.json＝選手ごとに最新年度の値、母集団は全年度の和集合)からライブ計算しており、年度を切り替えても順位が変わらなかった
  const rk = d.rankings || {};
  // 球種別成績の「合計」行の順位：全体はKPIと同じrk、対右/対左はそれぞれの値で出した順位を使う
  // （以前は対右/対左タブでも全体の順位をそのまま表示していた）
  const HAND_SUFFIX = { vsR: "_vsR", vsL: "_vsL" };
  const totalsRanksFor = (hand) => {
    if(!hand || hand === "all") return rk;
    return (d.rankings_by_hand && d.rankings_by_hand[hand]) || {};
  };
  // 試合ログの「シーズン」行をクリックしたときの下のパネルでも、合計行に同じ順位を出すために持たせておく
  d._totalsRanksFor = totalsRanksFor;
  d._liveRk = rk;   // シーズン成績表（最上部）の順位表示用
  const rankText = (key) => {
    const r = rk[key];
    if(!r) return "";
    if(r.rank == null) return `<div class="rank">-</div>`;
    return `<div class="rank"><b>${r.rank}</b>位<span class="rank-of"> / ${r.total}人中</span></div>`;
  };
  // 決め球：専用フィールドが無い場合は、球種の特徴タグ（全体/対右/対左のいずれか）に
  // 「決め球」と付いている球種から補う。
  // タグが複数球種に付いていれば、2つまでは並べて表示して構わない。それも無ければ「なし」と明記する。
  const signaturePitchEntries = (d.pitch_evaluations || []).filter(p =>
    [p.tagAll, p.tagVsRight, p.tagVsLeft].some(t => t && t.includes("決め球"))
  );
  // 決め球が複数ある場合、value側で単一文字列として結合すると狭いスタッツボックス内で
  // 詰まって見えるため、球種名のリストとして保持し、表示側で球種ごとに改行する。
  const signaturePitchList = d.signature_pitch
    ? [d.signature_pitch]
    : signaturePitchEntries.map(p => p.name);
  // KPIは、シーズン球種別成績の表と同じ7段階（tierFromRank）で「順位の文字色」だけを変える
  // （カード背景や値の数字には色を付けない。値は白のまま）。順位が無い場合は色なし。
  const kpiTier = (key) => tierFromRank(rk[key]) || "mid";
  const stats = [
    { label: "防御率", value: d.era ?? "-", rankKey: "era" },
    { label: "K-BB%", value: d.k_bb_pct != null ? d.k_bb_pct + "%" : "-", rankKey: "k_bb_pct" },
    { label: "K%", value: d.k_pct_season != null ? d.k_pct_season + "%" : "-", rankKey: "k_pct" },
    { label: "BB%", value: d.bb_pct_season != null ? d.bb_pct_season + "%" : "-", rankKey: "bb_pct" },
    { label: "ゴロ率", value: d.gb_pct != null ? d.gb_pct + "%" : "-", rankKey: "gb_pct" },
    { label: "空振り率", value: d.swstr_pct_season != null ? d.swstr_pct_season + "%" : "-", rankKey: "swstr_pct" },
  ].map(s => ({ ...s, color: "var(--text-bright)", tier: kpiTier(s.rankKey) }));

  const gameLogParts = buildGameLogTable(d);   // {season: 上部の「シーズン成績」, game: 下部の「試合ログ」（試合別のみ）}

  // 球種評価セクション（旧・全体/対右/対左タブ＋説明文）は廃止し、球種ごとの特徴タグだけを
  // 「シーズン球種別成績」表の最終列に載せる。表側のタブ（all/vsR/vsL）と、
  // 特徴タグ側のキー（tagAll/tagVsRight/tagVsLeft）の対応はここでまとめて持つ。
  const PMIX_HAND_TO_TAGKEY = { all: "tagAll", vsR: "tagVsRight", vsL: "tagVsLeft" };
  function buildPmixTagsByName(hand){
    const tagKey = PMIX_HAND_TO_TAGKEY[hand] || "tagAll";
    const map = {};
    (d.pitch_evaluations || []).forEach(p => { map[p.name] = p[tagKey]; });
    return map;
  }

  // スクリーンショットの球種別成績表（本家ダッシュボードと同じ列構成）を、
  // シーズン成績セクション（試合ログ）とは別に、選手プロフィールより上に単独表示する。
  // MLBはxwOBA・回転数などの追加指標が本来の列構成に含まれており列数が多いが、
  // 枠の横幅はNPBと同じに保ち、はみ出す分は表自体の横スクロール（.pmix-scroll）で
  // 見られるようにする（枠自体は広げない）。
  const seasonPitchDetailHtml = (d.season_pitch_detail && d.season_pitch_detail.all && d.season_pitch_detail.all.length) ? `
    <div class="section section-pitchdetail">
      ${sectionHeader({ bar:"var(--blue)", label:"シーズン球種別成績", labelColor:"var(--text-bright)" })}
      <div class="section-body">
        <div class="hand-toggle season-pmix-hand-toggle">
          <button class="hand-btn active" data-hand="all">全体</button>
          <button class="hand-btn" data-hand="vsR">対右</button>
          <button class="hand-btn" data-hand="vsL">対左</button>
        </div>
        <div class="pmix-wrap" data-season-pmix>${pitchDetailTableHtml(d.season_pitch_detail.all, d.season_totals && d.season_totals.all, undefined, buildPmixTagsByName("all"), rk)}</div>
      </div>
    </div>
  ` : "";

  // カウント別配球：シーズン球種別成績の下・コース分布セクションのさらに下に独立セクションとして配置。
  // 球種別の詳細行を追加したことで縦に長くなったため、全体/対右/対左は再びタブ切り替えに戻した
  // （同時表示だとスクロールが長くなりすぎるため）。
  const countPitchSectionHtml = (d.season_pitch_detail && d.season_pitch_detail.all && d.season_pitch_detail.all.length) ? `
    <div class="section section-countpattern">
      ${sectionHeader({ bar:"var(--amber)", label:"シーズンカウント別配球", labelColor:"var(--text-bright)" })}
      <div class="section-body">
        <div class="hand-toggle count-pattern-hand-toggle">
          <button class="hand-btn active" data-hand="all">全体</button>
          <button class="hand-btn" data-hand="vsR">対右</button>
          <button class="hand-btn" data-hand="vsL">対左</button>
        </div>
        <div data-count-pattern>${countPatternTableHtml(d.season_pitch_detail.all)}</div>
      </div>
    </div>
  ` : "";

  // 対戦打者成績（カウント別配球の下）
  const vsBattersHtml = vsBattersSectionHtml(d);

  // 選手特徴・強み・弱み を1つの枠にまとめる（区切り線つき）
  const profileHtml = `
    <div class="section section-profile">
      ${sectionHeader({ bar:"var(--blue)", label:"選手プロフィール", labelColor:"var(--text-bright)" })}
      <div class="section-body">
        ${d.player_type ? `
        <div class="profile-sub">
          <div class="tag" style="background:rgba(148,163,184,0.15);border:1px solid rgba(148,163,184,0.35);color:var(--text)">${escapeHtml(d.player_type.tag || "")}</div>
          ${d.player_type.groups.map((g, gi) => `
            ${g.label ? `<div class="profile-sub-title" style="margin-top:${gi > 0 ? '12px' : '10px'}"><span class="bar" style="background:var(--text-dim)"></span><span class="label" style="color:#CBD5E1">${escapeHtml(g.label)}</span></div>` : ""}
            ${bulletsHtml(g.bullets, "var(--text-dim)")}
          `).join("")}
        </div>` : ""}

        ${d.strengths?.length ? `
        <div class="profile-sub">
          <div class="profile-sub-title"><span class="bar" style="background:var(--green)"></span><span class="label" style="color:var(--green-text)">強み</span></div>
          ${bulletsHtml(d.strengths, "var(--green)", "positive")}
        </div>` : ""}

        ${d.weaknesses?.length ? `
        <div class="profile-sub">
          <div class="profile-sub-title"><span class="bar" style="background:var(--red)"></span><span class="label" style="color:var(--red-text)">弱み</span></div>
          ${bulletsHtml(d.weaknesses, "var(--red)", "negative")}
        </div>` : ""}
      </div>
    </div>
  `;

  // #mainContent自体が初期HTMLでclass="placeholder"のままになっており、
  // 「選手を選んでください」用のpadding-top:60pxなどが実カード表示時にも
  // 残ってしまい、才木浩人のような選手名の上に余計な余白ができていたため、
  // 実カードを描画する際はここで明示的に外している。
  mainContentEl.classList.remove("placeholder");
  mainContentEl.innerHTML = `
    <div class="card">
      <div class="p-sticky-header">
        <div class="p-header">
          <div class="p-avatar">${escapeHtml(initial)}</div>
          <div>
            <div class="p-name-row">
              <div class="p-name">${escapeHtml(d.name)}</div>
              ${d._availableYears && d._availableYears.length > 1 ? yearMselHtml(d._availableYears, selectedYearsOf(d)) : ""}
            </div>
            <div class="p-meta-row">
              <span class="p-meta">${escapeHtml(d.team || "")}・${escapeHtml(d.throws_bats || "")}・${escapeHtml(d.role || "")}・${escapeHtml(formatSeasonResult(d))}</span>
              ${d._farmData ? `
              <div class="farm-toggle">
                <button type="button" class="farm-toggle-btn ${!d._isFarm ? "active" : ""}" data-farm="0">1軍</button>
                <button type="button" class="farm-toggle-btn ${d._isFarm ? "active" : ""}" data-farm="1">2軍</button>
              </div>` : ""}
            </div>
          </div>
        </div>

        <div class="stat-grid">
          ${stats.map(s => {
            const valueHtml = s.valueList
              ? `<div class="value multi-line" style="${s.small ? 'font-size:13px' : ''}">${s.valueList.map(v => `<span>${escapeHtml(v)}</span>`).join("")}</div>`
              : `<div class="value" style="${s.small ? 'font-size:13px' : ''}">${escapeHtml(String(s.value))}</div>`;
            return `
            <div class="stat-box t-${s.tier || "mid"}">
              <div class="label">${s.label}</div>
              ${valueHtml}
              ${s.rankKey ? rankText(s.rankKey) : ""}
            </div>
          `;}).join("")}
        </div>
      </div>

      ${d._2gunOnly ? `<div class="no-llm-note">※ この選手は1軍での登板記録が無いため、2軍のデータを表示しています</div>` : ""}

      ${gameLogParts.season}

      ${seasonPitchDetailHtml}

      <div class="section section-coursedist">
        ${sectionHeader({ bar:"var(--blue)", label:"シーズンコース分布", labelColor:"var(--text-bright)" })}
        <div class="section-body">
          <div id="seasonCourseSection"></div>
        </div>
      </div>

      ${countPitchSectionHtml}

      ${vsBattersHtml}

      ${profileHtml}

      ${gameLogParts.game}
    </div>
  `;

  // 球種別成績（プロフィール上の単独セクション）: 全体/対右/対左タブ。年度比較中は球種比較表（年度を横に並べる）
  const seasonPmixToggle = mainContentEl.querySelector(".season-pmix-hand-toggle");
  function redrawSeasonPmix(){
    const wrap = mainContentEl.querySelector("[data-season-pmix]");
    if(!wrap || !d.season_pitch_detail) return;
    const activeBtn = seasonPmixToggle && seasonPmixToggle.querySelector(".hand-btn.active");
    const hand = activeBtn ? activeBtn.dataset.hand : "all";
    if(isCompareYears(d)){
      // 球種ごとに選択中の年度を続けて並べる（年度は球種名の右に固定表示。順位・色は各年度のもの）
      const ys = selectedYearsOf(d);
      const perYear = ys.map(y => { const e = cardOfYear(d, y); return (e && e.season_pitch_detail && e.season_pitch_detail[hand]) || []; });
      const names = [];
      perYear.forEach(list => list.forEach(pt => { if(pt.name && !names.includes(pt.name)) names.push(pt.name); }));
      const flat = [];
      names.forEach((nm, ci) => ys.forEach((y, yi) => {
        const pt = perYear[yi].find(x => x.name === nm);
        if(pt) flat.push({ ...pt, _year: `${y}年`, _ci: ci });
      }));
      wrap.innerHTML = pitchDetailTableHtml(flat, null, undefined, undefined, null);
    }else{
      wrap.innerHTML = pitchDetailTableHtml(d.season_pitch_detail[hand], d.season_totals && d.season_totals[hand], undefined, buildPmixTagsByName(hand), totalsRanksFor(hand));
    }
  }
  if(seasonPmixToggle){
    seasonPmixToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      seasonPmixToggle.querySelectorAll(".hand-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      redrawSeasonPmix();
    });
  }
  if(isCompareYears(d)) redrawSeasonPmix();

  // シーズン成績：シーズン別/試合別タブ切り替え
  const gamelogTabToggle = mainContentEl.querySelector(".gamelog-tab-toggle");
  if(gamelogTabToggle){
    gamelogTabToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      const tab = btn.dataset.tab;
      gamelogTabToggle.querySelectorAll(".hand-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      mainContentEl.querySelectorAll("[data-gamelog-tab]").forEach(panel => {
        panel.style.display = panel.dataset.gamelogTab === tab ? "" : "none";
      });
    });
  }

  // カウント別配球: 全体/対右/対左タブ切り替え。年度比較中は各カウントの列に年度を横に並べる
  const countPatternToggle = mainContentEl.querySelector(".count-pattern-hand-toggle");
  const countPatternWrap = mainContentEl.querySelector("[data-count-pattern]");
  function redrawCountPattern(){
    const wrap = mainContentEl.querySelector("[data-count-pattern]");
    if(!wrap || !d.season_pitch_detail) return;
    const activeBtn = countPatternToggle && countPatternToggle.querySelector(".hand-btn.active");
    const hand = activeBtn ? activeBtn.dataset.hand : "all";
    if(isCompareYears(d)){
      wrap.innerHTML = countPatternCompareHtml(selectedYearsOf(d).map(y => {
        const e = cardOfYear(d, y);
        return { label: `${y}年`, rows: (e && e.season_pitch_detail && e.season_pitch_detail[hand]) || [] };
      }), wrap._cntPick);
      wrap.querySelectorAll("tr[data-pick]").forEach(tr => {
        tr.addEventListener("click", () => { wrap._cntPick = tr.dataset.pick; redrawCountPattern(); });
      });
    }else{
      wrap.innerHTML = countPatternTableHtml(d.season_pitch_detail[hand]);
      wireCountPatternBlock(wrap, d.season_pitch_detail[hand]);
    }
  }
  if(countPatternWrap && d.season_pitch_detail){
    if(isCompareYears(d)) redrawCountPattern();
    else wireCountPatternBlock(countPatternWrap, d.season_pitch_detail.all); // 初期表示（全体タブ）ぶんの行クリックを有効化
  }
  if(countPatternToggle){
    countPatternToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      countPatternToggle.querySelectorAll(".hand-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      redrawCountPattern();
    });
  }

  wireVsBatters(d);

  // 1軍/2軍 切り替え：同じ選手のもう一方のデータでカードを丸ごと再描画する
  // （renderCard自体は毎回mainContentEl全体を作り直す設計なので、両データに互いへの
  // 参照（_farmData）を持たせておき、切り替え先を選ぶだけでよいようにしている）
  const farmToggle = mainContentEl.querySelector(".farm-toggle");
  if(farmToggle){
    farmToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".farm-toggle-btn");
      if(!btn) return;
      const wantFarm = btn.dataset.farm === "1";
      if(wantFarm === !!d._isFarm) return; // すでにその表示なら何もしない
      const target = d._farmData;
      if(!target) return;
      activeCardData = target;
      renderCard(target);
    });
  }

  if(canCompareYears(d)){
    wireYearMsel(mainContentEl, d._availableYears, (sel) => {
      compareYearsSel = sel;
      const newActive = sel[0];
      if(newActive === d._activeYear) renderCard(d);
      else switchCardYear(newActive);
    });
  }

  // 各セクション枠（選手プロフィール／球種評価／提案／試合成績）の開閉
  mainContentEl.querySelectorAll(".section-title[data-toggle]").forEach(title => {
    title.addEventListener("click", () => {
      const body = title.nextElementSibling;
      const chev = title.querySelector(".chev");
      const isCollapsed = body.classList.toggle("collapsed");
      chev.style.transform = isCollapsed ? "rotate(-90deg)" : "rotate(0deg)";
    });
  });

  // 試合ログ: 行クリック＝この行だけ選んで比較パネルへスクロール／チェックボックス＝複数比較に追加・削除
  compareSelectedKeys = new Set(); // 選手が変わったら比較選択はリセット
  previewGidx = null; // 試合ログの比較パネルは行クリックがあるまで非表示（シーズンコース分布は別セクションで常時表示）
  window._hmResultFilter = "all";
  window._hmSplitMode = "25";
  window._hmSelectedPitchKeys = null;
  // シーズンコース分布セクションはフィルター状態を選手ごとにリセットして常に表示する
  seasonHmState._hmResultFilter = "all";
  seasonHmState._hmSplitMode = "25";
  seasonHmState._hmSelectedPitchKeys = null;
  renderSeasonCourseSection(d);

  function toggleCompareRow(gidx, cb){
    previewGidx = null; // チェックボックス操作が優先。行クリックのプレビューは破棄する
    if(cb.checked) compareSelectedKeys.add(gidx);
    else compareSelectedKeys.delete(gidx);
    renderComparePanel(d);
  }

  mainContentEl.querySelectorAll(".cmp-checkbox").forEach(cb => {
    cb.addEventListener("click", (e) => e.stopPropagation()); // 行クリックとの二重発火を防ぐ
    cb.addEventListener("change", () => toggleCompareRow(cb.dataset.gidx, cb));
  });

  // 年フォルダ行クリック：その年の試合行だけを開閉する
  mainContentEl.querySelectorAll(".gamelog-table tr.row-folder").forEach(row => {
    row.addEventListener("click", () => {
      const year = row.dataset.year;
      const body = mainContentEl.querySelector(`.gamelog-table tbody.folder-body[data-year-body="${year}"]`);
      if(!body) return;
      const isOpen = body.style.display !== "none";
      body.style.display = isOpen ? "none" : "table-row-group";
      const chev = row.querySelector(".folder-chevron");
      if(chev) chev.style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
    });
  });

  // 行クリック：チェックボックスは一切変更せず、その行の内容だけを下のパネルにプレビュー表示する
  mainContentEl.querySelectorAll(".gamelog-table tbody tr.row-game").forEach(row => {
    row.addEventListener("click", (e) => {
      if(e.target.closest(".cmp-checkbox")) return; // チェックボックス自体のクリックはここでは扱わない
      const gidx = row.dataset.gidx;
      previewGidx = (previewGidx === gidx) ? null : gidx; // 同じ行を再クリックしたら閉じる
      renderComparePanel(d);
      if(previewGidx){
        const panel = document.getElementById("comparePanel");
        if(panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  });
}

// ── 試合ログテーブル（シーズン行 + 直近試合の行、行クリックで詳細展開）──
function cellClass(value, goodDir, threshold){
  // goodDir: "high"なら値が高いほど良い、"low"なら低いほど良い
  if(value == null) return "";
  if(goodDir === "high") return value >= threshold ? "cell-good" : (value <= threshold * 0.6 ? "cell-bad" : "");
  return value <= threshold ? "cell-good" : (value >= threshold * 1.6 ? "cell-bad" : "");
}

// 試合1件ぶんの「回・球数・K・BB・安打(自責)」表記（例: 6.0回 104球 5K 3BB 7(2)）
function formatGameResult(g){
  if(g.ip == null && g.pitches == null) return escapeHtml(g.result || "");
  return `${g.ip ?? "-"}回 ${g.pitches ?? "-"}球 ${g.k ?? "-"}K ${g.bb ?? "-"}BB ${g.h ?? "-"}(${g.er ?? "-"})`;
}

// シーズン行の「登板・回・防御率・K・BB」表記（例: 7登板 53.1回 防1.01 53K 7BB）
function formatSeasonResult(d, br){
  const t = `${d.games ?? "-"}登板 ${d.innings ?? "-"}回 防${d.era ?? "-"}${br ? "<br>" : " "}${d.k ?? "-"}K ${d.bb ?? "-"}BB`;
  return br ? t : t.replace("<br>", " ");
}

// "2026-08-30" → "8/30"（年をまたぐ表示が必要な箇所では別途年フォルダを使う）
function formatDateShort(dateStr){
  if(!dateStr) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
  if(!m) return dateStr;
  return `${parseInt(m[2],10)}/${parseInt(m[3],10)}`;
}
// "2026-08-30" → "2026"
function dateYear(dateStr){
  const m = /^(\d{4})-/.exec(dateStr || "");
  return m ? m[1] : null;
}

// ── 球種詳細テーブル（本家ダッシュボードと同じ列構成・パーセンタイル色付け）──
// currentLeagueに応じて表示する指標を切り替える（MLB独自指標はNPBデータには存在しないため）
const PMIX_METRICS_BASE = [
  { key:"swstr_pct",  tierKey:"空振り率_ランク",         label:"空振り率",      unit:"%",   decimals:1, width:104 },
  { key:"chase_pct",  tierKey:"ゾーン外スイング率_ランク", label:"ボール球SW%",   unit:"%",   decimals:1, width:104 },
  { key:"strike_pct", tierKey:"ストライク率_ランク",       label:"ストライク率",  unit:"%",   decimals:1, width:104 },
  { key:"zone_pct",   tierKey:"ゾーン率_ランク",          label:"ゾーン率",      unit:"%",   decimals:1, width:104 },
  { key:"gb_pct",     tierKey:"GB%_ランク",              label:"ゴロ率",        unit:"%",   decimals:1, width:104 },
];
const PMIX_METRICS_VEL = [
  { key:"avg_vel", tierKey:"平均球速_ランク", label:"平均球速", unit:"km/h", decimals:1, width:108 },
  { key:"max_vel", tierKey:"最高球速_ランク", label:"最高球速", unit:"km/h", decimals:1, width:108 },
];
// 被打率：最高球速のすぐ右に置く。打率のような「.038」表記にしたいので
// format:"avg" を付け、fmtMetricVal側でその場合だけ特別扱いする。順位は他の指標と同じ仕組みで
// 出るが、値が低いほど良い指標なので、ランキング側（export_llm_input.py）は方向を逆にしてある。
// カラースケールは、他の指標のような球種別パーセンタイル（_ランク）がバックエンド側に無いので、
// 代わりにuseRankTier:trueを付けて、既に持っている順位（p.ranks）から色を決める
// （tierFromRank。合計行で使っているのと同じ仕組みを球種別の行にも流用）。
// 被打率＝被安打÷打数（打率の投手版）。値は%（例:23.4）で来るので「.234」表記にする。
const PMIX_METRICS_HIT = [
  { key:"hit_pct", label:"被打率", unit:"%", decimals:1, width:90, format:"avg", useRankTier:true },
  // 被長打割合＝長打（2塁打以上）÷打数。被打率と同じ分母なので並べて読める
  { key:"xbh_pct", label:"被長打割合", unit:"%", decimals:1, width:100, format:"avg", useRankTier:true },
];
// MLB独自指標。回転軸（向きであって大小に優劣が無い／角度の単純平均は0°・360°付近で破綻する）と
// 回転効率(近似)（回転軸から機械的に出した値で、実際の回転効率ではない）は意味が薄いため外した。
// 順位はexport_llm_input.pyの_PITCH_RANK_METRICS_MLBで算出（回転数・VAA・縦変化量は球種によって
// 良い方向が逆になる。見出しのtitle属性＝ホバー時の説明に方向を書いてある）。
// noTotal: 「合計」行で球種をまたいで平均しても意味が無い（球種ごとの物理特性）ので「—」にする。
// useRankTier: 順位が無い表示（試合単位の球種内訳）では色を付けない
//   （値ベースtierは球種ごとの良い方向を考慮していないため、順位の色と食い違ってしまう）。
const PMIX_METRICS_MLB_EXTRA = [
  { key:"xwoba",    tierKey:"xwOBA_ランク",      label:"xwOBA",    unit:"",    decimals:3, width:78,
    hint:"打球の速度・角度から見た被打撃の質。低いほど良い" },
  { key:"avg_spin", label:"回転数",   unit:"rpm", decimals:0, width:86, noTotal:true, useRankTier:true,
    hint:"スプリット・フォーク・チェンジアップ等は低いほど、それ以外は高いほど上位" },
  { key:"vaa",      label:"VAA",      unit:"°",   decimals:1, width:66, noTotal:true, useRankTier:true,
    hint:"ホーム到達時の縦の入射角。フォーシームは浅い（0に近い）ほど、それ以外は急なほど上位" },
  { key:"ivb",      label:"縦変化量", unit:"cm",  decimals:1, width:84, noTotal:true, useRankTier:true,
    hint:"重力を除いた縦の変化量（＋はホップ方向）。フォーシーム・カットは大きいほど、それ以外は小さい（落ちる）ほど上位" },
  { key:"hb",       label:"横変化量", unit:"cm",  decimals:1, width:84, noTotal:true, useRankTier:true,
    hint:"横の変化量（＋は投手の腕側、−はグラブ側）。向きを問わず大きく動くほど上位" },
  { key:"ext",      tierKey:"Extension_ランク",  label:"Extension", unit:"m",  decimals:2, width:84,
    hint:"リリースの打者寄りの位置。長いほど体感速度が上がるため上位" },

function currentPmixMetrics(){
  return currentLeague === "mlb"
    ? [...PMIX_METRICS_BASE, ...PMIX_METRICS_VEL, ...PMIX_METRICS_HIT, ...PMIX_METRICS_MLB_EXTRA]
    : [...PMIX_METRICS_BASE, ...PMIX_METRICS_VEL, ...PMIX_METRICS_HIT];
}
function fmtMetricVal(m, v){
  if(v == null || Number.isNaN(v)) return "—";
  if(m.format === "avg"){
    // 打率のような「.038」表記（先頭の"0"を落とす）。値は%表記（例:3.8）で来るので100で割る
    const s = (+v / 100).toFixed(3);
    return s.startsWith("0.") ? s.slice(1) : s;
  }
  return (+v).toFixed(m.decimals) + (m.unit || "");
}
const TIER_COLOR = {
  top15: "rgba(18,165,178,0.40)", top30: "rgba(18,165,178,0.25)", top40: "rgba(18,165,178,0.12)",
  mid: "", bot60: "rgba(238,122,151,0.10)", bot70: "rgba(238,122,151,0.18)", bot85: "rgba(238,122,151,0.38)"
};
// KPIカード用：同じ7段階を文字色で表す（背景は塗らない）。濃い段階ほど彩度の高い色にしている。
// 順位の文字色（表の「n位/m人中」とKPIの順位で共通）。濃い段階ほど彩度を上げている。
// 文字は同じ段階の背景色（TIER_COLOR）の上に乗るため、どの段階でも背景とのコントラスト比
// 4.5以上（WCAGのAA相当）になるよう明度を調整している。上位15%・下位15%の最上位段階は太字にもする（CSS側）。
const TIER_TEXT_COLOR = {
  top15: "#5EEAD4", top30: "#7FD8CD", top40: "#A9DAD5",
  mid: "", bot60: "#E9B8C4", bot70: "#F59AB1", bot85: "#FFA6BD"
};

// 順位バッジ（サッカー版player-cards.htmlの .rk / rankChip と同じ見た目・判定ロジックに合わせている）。
// rank===null（母数はあるが投球数などのしきい値未満で対象外）は「-」、rankデータ自体が無ければ何も出さない。
// 文字色（緑/赤/グレー）もセルの背景色と同じ判定（tierFromRank）に揃え、
// 「背景は青緑なのに文字は赤」のような食い違いが出ないようにしている。
function rankBadgeHtml(rk){
  if(!rk) return "";
  if(rk.rank == null) return `<div class="rk none">-</div>`;
  const tier = tierFromRank(rk) || "mid";
  return `<div class="rk t-${tier}">${rk.rank}位/${rk.total}人中</div>`;
}

// 「合計」行（シーズン全体の値）にも、球種別セルと同じ緑〜赤のカラースケールを付けるための変換。
// 球種別セルは母集団の値そのものをp15/p30/p40/p60/p70/p85のパーセンタイルしきい値と比較して
// tierを決めている（get_scale_tier、export_llm_input.py参照）が、「合計」行はJSON側に
// そのパーセンタイル値が無く、順位（rank/total）だけを持っている。順位は値の単調な関数なので、
// 順位のパーセンタイル位置を同じ6段階のtierにマッピングすることで近似している。
// 順位（rank/total）→ 7段階のtier。表のセル背景・順位バッジ・KPIの文字色すべてこれで決める。
//   top15: 上位15%以内 / top30: 上位15〜30% / top40: 上位30〜40% / mid: 上位40〜60%
//   bot60: 上位60〜70%（下位30〜40%） / bot70: 上位70〜85%（下位15〜30%） / bot85: 下位15%以内
// 例：66位/86人中 → 66/86=76.7% → bot70（中間の赤）
// 球種別セルのtier。順位データ（p.ranks[key]）があれば常に順位から決める
// （以前はバックエンドの値ベースのパーセンタイル tier（_ランク）を使っていたため、
//  順位は下位なのに青緑になる、といった食い違いが出ていた）。
// 順位の母数はあるが対象外（rank:null＝「-」表示）の場合は色なし。
// 順位データ自体が無い表示（試合ログの球種内訳など）だけ、従来の値ベースtierにフォールバックする。
function cellTier(p, m){
  const rk = p.ranks && p.ranks[m.key];
  if(rk) return tierFromRank(rk);
  if(m.useRankTier) return null;
  return m.tierKey ? p[m.tierKey] : null;
}

function pitchDetailTableHtml(pitches, trueTotal, metricsOverride, tagsByName, totalsRanks){
  if(!pitches || !pitches.length){
    return `<div style="padding:16px;text-align:center;color:var(--text-dim);font-size:12px">データなし</div>`;
  }
  const metrics = metricsOverride || currentPmixMetrics();
  const showTagCol = !!tagsByName;
  const tc = pitches.reduce((s,m)=>s+(m.count||0), 0);
  // ゴロ率(gb_pct)の本来の分母は「打球数」、ボール球SW%(chase_pct)の本来の分母は
  // 「ゾーン外投球数」で、どちらも投球数(count)そのものではない。それぞれ専用の
  // 実数フィールド（gb_n/oz_n）があればそちらで加重し、無い（古い形式の）データの
  // 場合のみ投球数で代用する。
  // ただし本来は、球種別内訳から再度加重平均するより、シーズン全体を直接集計した
  // 実数（trueTotal。season_totalsから渡される）をそのまま使う方が正確
  // （一部の打席で球種が特定できず球種別内訳から漏れるケースがあっても影響を受けない）。
  // trueTotalが無い場合（試合単位のログ表示など）のみ、フォールバックとして
  // 球種別内訳からの加重平均を使う。
  const TRUE_TOTAL_KEY = { swstr_pct: "空振り率", chase_pct: "ゾーン外スイング率", strike_pct: "ストライク率", zone_pct: "ゾーン率", gb_pct: "ゴロ率", hit_pct: "被打率", xbh_pct: "被長打割合" };
  const WEIGHT_FIELD = { gb_pct: "gb_n", chase_pct: "oz_n", hit_pct: "ab_n", xbh_pct: "ab_n" };
  // 被打率は打数(ab_n)で加重しないと意味が変わってしまう（＝合計被安打÷合計打数にならない）ので、
  // ab_nが無い古いデータの場合は投球数で代用せず「—」にする。
  const STRICT_WEIGHT = new Set(["hit_pct", "xbh_pct"]);
  const wavg = (key) => {
    if(trueTotal){
      const tKey = TRUE_TOTAL_KEY[key];
      if(tKey && trueTotal[tKey] != null) return trueTotal[tKey];
    }
    const wField = WEIGHT_FIELD[key];
    const withVal = pitches.filter(m => m[key] != null);
    const weightOf = (m) => {
      if(wField && m[wField] != null) return m[wField];
      if(STRICT_WEIGHT.has(key)) return 0;
      return m.count || 0;
    };
    const wsum = withVal.reduce((s,m)=>s+weightOf(m), 0);
    return wsum > 0 ? withVal.reduce((s,m)=>s+(m[key]*weightOf(m)), 0) / wsum : null;
  };
  const maxVel = pitches.reduce((mx,m) => (m.max_vel != null && m.max_vel > mx) ? m.max_vel : mx, 0);
  // スマホ（縦・横どちらも）は画面が限られるので、この表の列幅・行間・文字を一回り詰め、
  // さらに「投球割合」列を独立させず「投球数」列の下にカッコ書きで統合して列数自体を減らす
  // （横スクロール量そのものを減らす）。PC表示は従来通り2列に分けたまま。
  // 球種名・投球数の2列は、縮小率(WSCALE)の対象にせず縦向きスマホの実測サイズに合わせて
  // 直接小さめの固定値にする。ただし球種名は「ストレート」「スライダー」「ツーシーム」など
  // 5文字までの代表的な球種名は絶対に見切れないよう、5文字＋色丸アイコンが収まる幅を確保する
  // （6文字以上の長い球種名は見切れても許容する）。
  const compact = isMobileLayout();
  const WSCALE = compact ? 0.7 : 1;
  const sw = (px) => Math.round(px * WSCALE);
  const C1 = compact ? 82 : 104;
  const C2 = compact ? 54 : 52; // compact時は投球数セルに割合も同居させるので若干広げる
  const C3 = sw(80); // 「投球割合」列は「空振り率」列と同じ幅に揃える（PMIX_METRICS_BASEのswstr_pct.width=80と一致させる）
  // 「特徴」タグ列は、折り返しも省略もせず1行のまま全文を見せたいので、固定幅にせず、
  // 実際にこの表に出てくるタグ文字列のうち最長のものが1行に収まる幅を都度計算する
  // （タグは選手・球種によって長さがまちまちなので、決め打ちの固定幅だと長いタグで
  // 見切れたり、逆に短いタグしか無いのに無駄に広くなったりする）。収まりきらない分は
  // 表全体の横スクロールで見られればよく、この列自体では折り返し・省略はしない。
  // 文字幅の見積もりは安全側に少し余裕を持たせ（実測より広めに）、それでも万一ズレて
  // 幅が足りなかった場合に備えてCSS側でもoverflow:hidden/text-overflow:ellipsisを使わず
  // overflow:visibleにしているため、"…"のような省略記号が出ることはない。
  const TAG_FONT_PX = compact ? ((typeof isLandscapeNarrow === "function" && isLandscapeNarrow()) ? 8.5 : 9) : 10;
  const TAG_CHAR_PX = TAG_FONT_PX * 1.15; // 和文フォントは字体により全角1em強のことがあるため、少し余裕を持たせる
  const TAG_PAD_PX = (compact ? 22 : 26) + 10; // タグ（バッジ）自体の左右padding＋セルpadding＋安全マージン
  const maxTagLen = showTagCol
    ? Math.max(0, ...pitches.map(p => (tagsByName[p.name] || "").length))
    : 0;
  const TAG_COL_WIDTH = showTagCol ? Math.max(compact ? 74 : 90, Math.ceil(maxTagLen * TAG_CHAR_PX) + TAG_PAD_PX) : 0;
  const countCellHtml = (count, pct) => compact
    ? `<span class="pmix-count-main">${count ?? "—"}</span>${pct != null ? `<span class="pmix-count-sub">(${pct}%)</span>` : ""}`
    : `${count ?? "—"}`;
  // table-layout:fixedは、テーブル自身の幅がautoのままだと内容の長さに引っ張られて列幅がズレてしまう
  // （固定列の位置計算の前提が崩れ、スクロール時に他の値が透けて見える原因になる）ため、
  // 列幅の合計と完全に一致する幅をここで計算してテーブルに明示的に指定する。
  // 年度比較時（各行が_yearを持つ）は、球種名の右に「年度」列を固定表示で足す。
  // 固定列（球種名・年度・投球数）はnth-childではなく各セルのインラインstickyで指定する
  // （球種名セルをrowspanで結合すると、行によってnth-childの対応がずれるため）。
  const hasYear = pitches.some(p => p._year != null);
  const CY = hasYear ? 86 : 0;
  const stk = (left, z = 1) => hasYear ? `position:sticky;left:${left}px;z-index:${z};background:var(--panel);` : "";
  const stkH = (left) => hasYear ? `position:sticky;left:${left}px;z-index:4;background:var(--panel-alt);` : "";
  const totalWidth = C1 + CY + C2 + (compact ? 0 : C3) + metrics.reduce((s,m) => s + sw(m.width), 0) + (showTagCol ? TAG_COL_WIDTH : 0);
  const rows = pitches.map((p,i) => {
    // 年度比較では、同じ球種が続く行の球種名セルを1つに結合する
    let nameCell = "";
    if(!(hasYear && i > 0 && pitches[i - 1].name === p.name)){
      let span = 1;
      if(hasYear) while(i + span < pitches.length && pitches[i + span].name === p.name) span++;
      nameCell = `<td style="width:${C1}px;${stk(0)}"${span > 1 ? ` rowspan="${span}"` : ""}><span class="pmix-pname"><span class="pmix-dot" style="background:${pitchColor(p._ci ?? i)}"></span>${escapeHtml(p.name)}</span></td>`;
    }
    return `
    <tr>
      ${nameCell}
      ${hasYear ? `<td${yrAttr(p._year)} style="width:${CY}px;text-align:center;font-weight:700;${stk(C1)}">${yrDot(p._year)}${escapeHtml(p._year ?? "-")}</td>` : ""}
      <td style="width:${C2}px;${hasYear ? stk(C1 + CY) : `left:${C1}px`}">${countCellHtml(p.count, p.pct)}</td>
      ${compact ? "" : `<td style="width:${C3}px"><span class="pmix-val">${p.pct != null ? p.pct + "%" : "—"}</span></td>`}
      ${metrics.map(m => {
        const v = p[m.key];
        const tier = cellTier(p, m);
        const bg = tier ? (TIER_COLOR[tier] || "") : "";
        return `<td style="width:${sw(m.width)}px;background:${bg}"><span class="pmix-val">${fmtMetricVal(m, v)}</span>${rankBadgeHtml(p.ranks && p.ranks[m.key])}</td>`;
      }).join("")}
      ${showTagCol ? `<td class="pmix-tag-cell" style="width:${TAG_COL_WIDTH}px">${tagsByName[p.name] ? `<span class="pmix-tag">${escapeHtml(tagsByName[p.name])}</span>` : "—"}</td>` : ""}
    </tr>
  `;}).join("");
  return `
    <div class="pmix-scroll${compact ? ' pmix-scroll-compact' : ''}">
      <table class="pmix-table${hasYear ? " pmix-cmp" : ""}" style="width:${totalWidth}px">
        <thead><tr><th style="width:${C1}px;${stkH(0)}">球種</th>${hasYear ? `<th style="width:${CY}px;${stkH(C1)}">年度</th>` : ""}<th style="width:${C2}px;${hasYear ? stkH(C1 + CY) : `left:${C1}px`}">投球数</th>${compact ? "" : `<th style="width:${C3}px">投球割合</th>`}${metrics.map(m => `<th style="width:${sw(m.width)}px"${m.hint ? ` title="${escapeHtml(m.hint)}"` : ""}>${m.label}</th>`).join("")}${showTagCol ? `<th style="width:${TAG_COL_WIDTH}px">特徴</th>` : ""}</tr></thead>
        <tbody>${rows}</tbody>
        ${hasYear ? "" : `<tfoot><tr><td style="width:${C1}px">合計</td><td style="width:${C2}px;left:${C1}px">${countCellHtml(tc, compact ? 100 : null)}</td>${compact ? "" : `<td style="width:${C3}px"><span class="pmix-val">100%</span></td>`}${metrics.map(m => {
          const rk = totalsRanks && totalsRanks[m.key];
          if(m.key === "max_vel") return `<td style="width:${sw(m.width)}px"><span class="pmix-val">${maxVel > 0 ? maxVel + "km/h" : "—"}</span></td>`;
          if(m.noTotal) return `<td style="width:${sw(m.width)}px"><span class="pmix-val">—</span></td>`;
          const tier = tierFromRank(rk);
          const bg = tier ? (TIER_COLOR[tier] || "") : "";
          return `<td style="width:${sw(m.width)}px;background:${bg}"><span class="pmix-val">${fmtMetricVal(m, wavg(m.key))}</span>${rankBadgeHtml(rk)}</td>`;
        }).join("")}${showTagCol ? `<td style="width:${TAG_COL_WIDTH}px"></td>` : ""}</tr></tfoot>`}
      </table>
    </div>
  `;
}

const PITCH_COLORS = ["#34D399","#FB923C","#F87171","#EC4899","#A78BFA","#60A5FA","#FBBF24","#22D3EE"];
function pitchColor(i){ return PITCH_COLORS[i % PITCH_COLORS.length]; }

// ── カウント別配球（球種選択割合＋クリックで切り替えるストライク率/空振り率/見逃し率）──
// export_llm_input.py 側でseason_pitch_detailの各球種行に "cbs"（カウント別集計。
// {count: {c,sw,fo,lo,ba,ou,hi}}）が入っている前提。まだ無い（run.py未再実行の）
// 古いJSONの場合は、その旨を表示するだけにして他の表示は壊さない。
// 列の並びはストライク数ごとにまとめる（0ストライク → 1ストライク → 2ストライク、各グループ内はボール数順）。
// 4列ずつのグループ見出し・区切り線（countTheadHtml / CSSの .count-grp-*）はこの並びが前提。
const COUNT_KEYS = ["0-0","1-0","2-0","3-0","0-1","1-1","2-1","3-1","0-2","1-2","2-2","3-2"];
const COUNT_STRIKE_GROUPS = [
  { label: "0ストライク", cls: "count-grp-0" },
  { label: "1ストライク", cls: "count-grp-1" },
  { label: "2ストライク", cls: "count-grp-2" },
];
// 2つの表（球種別カウント割合／球種別ストライク・空振り・見逃し率）で列幅を完全に揃えるための共通定数
// ラベル列の幅はシーズン球種別成績の表（pitchDetailTableHtml）の1列目と揃え（104px）、
// 横スクロール開始位置の見た目・固定表示の挙動を統一する。
// ラベル列の幅：以前はシーズン球種別成績の表の1列目（104px）に揃えていたが、
// 「ゾーン内スイング率」「ボール球空振り率」のような長い指標名が見切れてしまうため、
// この2つの表専用にもう少し広げた（球種別カウント割合の「球種」列もこれで同じ幅になる）。
const COUNT_TABLE_LABEL_W = 148, COUNT_TABLE_COL_W = 52;
function countTableColgroupHtml(){
  return `<colgroup><col style="width:${COUNT_TABLE_LABEL_W}px">${COUNT_KEYS.map(() => `<col style="width:${COUNT_TABLE_COL_W}px">`).join("")}</colgroup>`;
}
const COUNT_TABLE_WIDTH = COUNT_TABLE_LABEL_W + COUNT_TABLE_COL_W * COUNT_KEYS.length;
// カウント表の見出し：1段目にストライク数のグループ見出し、2段目に各カウント。
// 1段目の先頭は空セルにして、2段目と列位置（nth-child）を揃える（1列目の固定表示CSSをそのまま使うため）。
function countTheadHtml(firstLabel){
  const perGroup = COUNT_KEYS.length / COUNT_STRIKE_GROUPS.length;
  return `<thead>
    <tr class="count-grp-row"><th></th>${COUNT_STRIKE_GROUPS.map(g => `<th colspan="${perGroup}" class="${g.cls}">${g.label}</th>`).join("")}</tr>
    <tr class="count-key-row"><th>${firstLabel}</th>${COUNT_KEYS.map((ck, i) => `<th class="${COUNT_STRIKE_GROUPS[Math.floor(i / perGroup)].cls}">${ck}</th>`).join("")}</tr>
  </thead>`;
}
// カラースケール：割合が高いほど濃く塗る。他選手比較ではなく、この表の中だけの単純な値ベースの濃淡。
function countScaleBg(pct, rgb){
  return pct == null ? "" : `rgba(${rgb},${(0.04 + Math.min(100,Math.max(0,pct))/100*0.32).toFixed(2)})`;
}
function countCellHtmlHelper(pct, rgb, format){
  if(pct == null) return `<td style="background:${countScaleBg(pct, rgb)}"><span class="count-cell-empty">-</span></td>`;
  const text = format === "avg" ? fmtMetricVal({format:"avg"}, pct) : pct + "%";
  return `<td style="background:${countScaleBg(pct, rgb)}">${text}</td>`;
}

const COUNT_RATE_SPECS = [
  // 表示順：ゾーン率 → ゾーン見逃し率 → ストライク率 → 空振り率 → ボール球SW率 → ボール球空振り率 → 被打率 → 被長打割合
  { label: "ゾーン率",           calc: (agg, t) => t > 0 ? Math.round(agg.iz / t * 100) : null },
  // ゾーン見逃し率：ゾーン内に来た球のうち何%を見逃したか（分母は投球数全体ではなくゾーン内投球数）
  { label: "ゾーン見逃し率",     calc: (agg, t) => agg.iz > 0 ? Math.round(agg.izlo / agg.iz * 100) : null },
  // ストライク率：ボール判定以外（見逃し・空振り・ファウル・インプレー）になった球の割合
  { label: "ストライク率",       calc: (agg, t) => t > 0 ? Math.round((t - agg.ba) / t * 100) : null },
  { label: "空振り率",           calc: (agg, t) => t > 0 ? Math.round(agg.sw / t * 100) : null },
  // ボール球SW率／ボール球空振り率：ゾーン外の球のうち何%に手を出したか／その何%が空振りだったか
  // （分母はいずれもゾーン外投球数）
  { label: "ボール球SW率",       calc: (agg, t) => agg.oz > 0 ? Math.round(agg.ozsw / agg.oz * 100) : null },
  { label: "ボール球空振り率",   calc: (agg, t) => agg.oz > 0 ? Math.round(agg.ozwh / agg.oz * 100) : null },
  // 被打率：そのカウントの球で打席が終わった「打数」のうち、何本安打にされたか（被安打÷打数）。
  // 三振も打数に含む（打席の最終球ベース。四死球・犠打・犠飛は含まない）。
  // 打率のような「.310」表記にしたいので format:"avg" を付ける（小数1桁の%で持つと.xxxの3桁が正確に出る）。
  // カウント単位だとサンプルが小さくなりがちなので、打数0のカウントは「-」になる。
  { label: "被打率",             format: "avg", calc: (agg, t) => agg.ab > 0 ? Math.round(agg.hi / agg.ab * 1000) / 10 : null },
  // 被長打割合：同じ打数を分母にした長打（2塁打・3塁打・本塁打）の割合。被打率と分母が同じなので
  // 「被打率.300のうち長打が.100」のように並べて読める（どのカウントで長打を打たれやすいか）。
  { label: "被長打割合",         format: "avg", calc: (agg, t) => agg.ab > 0 ? Math.round(agg.xh / agg.ab * 1000) / 10 : null },
];
function countAggOf(cbsRows){
  const out = {};
  COUNT_KEYS.forEach(ck => {
    out[ck] = cbsRows.reduce((acc, p) => {
      const c = p.cbs[ck];
      if(!c) return acc;
      acc.sw += c.sw || 0; acc.lo += c.lo || 0; acc.fo += c.fo || 0;
      acc.ba += c.ba || 0; acc.ou += c.ou || 0; acc.hi += c.hi || 0;
      // ゾーン関連の4項目は、run.py側でcbsにiz/oz/izlo/ozsw/ozwhが追加される前の古いJSONだと
      // 存在しない（undefined）ため || 0 で吸収する。その場合はcalc側の分母が0になり、
      // 該当する行だけ自動的に「-」表示になる（他の指標や表全体は壊れない）。
      acc.iz += c.iz || 0; acc.oz += c.oz || 0;
      acc.izlo += c.izlo || 0; acc.ozsw += c.ozsw || 0; acc.ozwh += c.ozwh || 0;
      acc.xh += c.xh || 0; // 被長打（2塁打・3塁打・本塁打）。古いJSONには無いので同様に || 0 で吸収
      acc.ab += c.ab || 0; // 打数（打席の最終球ベース）。古いJSONには無い→分母0で「-」表示
      return acc;
    }, {sw:0, lo:0, fo:0, ba:0, ou:0, hi:0, iz:0, oz:0, izlo:0, ozsw:0, ozwh:0, xh:0, ab:0});
  });
  return out;
}

// groupIdx: -1 なら「全体」（全球種合算）、0以上ならrows[groupIdx]のその球種だけの内訳。
// 「投球数」行（合計行）をクリックした場合も-1（全体）として扱う。
function countRateBlockHtml(rows, countTotals, groupIdx){
  let agg, totals, titleHtml;
  if(groupIdx == null || groupIdx < 0){
    agg = countAggOf(rows);
    totals = countTotals;
    titleHtml = `全体`;
  }else{
    const p = rows[groupIdx];
    agg = countAggOf([p]);
    totals = {};
    COUNT_KEYS.forEach(ck => { totals[ck] = (p.cbs[ck] && p.cbs[ck].c) || 0; });
    titleHtml = `<span class="pmix-dot" style="background:${pitchColor(groupIdx)}"></span>${escapeHtml(p.name)}`;
  }
  const rowsHtml = COUNT_RATE_SPECS.map(spec => `
    <tr>
      <td class="count-rate-label">${spec.label}</td>
      ${COUNT_KEYS.map(ck => countCellHtmlHelper(spec.calc(agg[ck], totals[ck]), "18,165,178", spec.format)).join("")}
    </tr>
  `).join("");
  return `
    <div class="count-rate-header">
      <span class="count-subtitle">球種別指標</span>
      <span class="count-rate-current">${titleHtml}</span>
    </div>
    <div class="pmix-scroll">
      <table class="pmix-table count-rate-table" style="width:${COUNT_TABLE_WIDTH}px">
        ${countTableColgroupHtml()}
        ${countTheadHtml("指標")}
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function countPatternTableHtml(pitchRows, label){
  const rows = (pitchRows || []).filter(p => p.cbs && Object.keys(p.cbs).length);
  if(!rows.length){
    return `<div style="font-size:11px;color:var(--text-dim);padding:4px 0 8px">

  COUNT_KEYS.forEach(ck => {
    countTotals[ck] = rows.reduce((s,p) => s + ((p.cbs[ck] && p.cbs[ck].c) || 0), 0);
  });

  // 球種選択割合：そのカウントで実際に投げられた球のうち、その球種が占めた割合。
  // 行をクリックすると、下の「球種別ストライク率・空振り率・見逃し率」がその球種の内訳に切り替わる
  // （投球数＝合計行をクリックすると「全体」に戻る）。クリック可能なことが分かるよう cursor:pointer にしている。
  const pitchTableHtml = `
    <div class="count-subtitle">カウント別球種割合<span class="count-subtitle-hint">（行をクリックで下の内訳を切り替え）</span></div>
    <div class="pmix-scroll">
      <table class="pmix-table count-pmix-table" style="width:${COUNT_TABLE_WIDTH}px">
        ${countTableColgroupHtml()}
        ${countTheadHtml("球種")}
        <tbody>
          ${rows.map((p,i) => `
            <tr class="count-pmix-row" data-group-idx="${i}">
              <td><span class="pmix-pname"><span class="pmix-dot" style="background:${pitchColor(i)}"></span>${escapeHtml(p.name)}</span></td>
              ${COUNT_KEYS.map(ck => {
                const c = p.cbs[ck];
                const cnt = c ? (c.c || 0) : 0;
                const total = countTotals[ck];
                const pct = total > 0 ? Math.round(cnt / total * 100) : null;
                return countCellHtmlHelper(pct, "59,130,246");
              }).join("")}
            </tr>
          `).join("")}
          <tr class="count-total-row count-pmix-row active" data-group-idx="-1">
            <td>投球数</td>
            ${COUNT_KEYS.map(ck => `<td>${countTotals[ck] || "-"}</td>`).join("")}

  const rateSectionHtml = `

  `;

  return `${label ? `<div class="compare-block-title">${escapeHtml(label)}</div>` : ""}${pitchTableHtml}${rateSectionHtml}`;
}

// 年度比較用：カウント別球種割合・球種別指標を、球種（指標）ごとに選択中の年度を続けて並べて表示する。
// 年度は球種名の右に固定表示。entries: [{label, rows}]（rowsはseason_pitch_detail[hand]）
function countPatternCompareHtml(entries, pick){
  const es = entries.map(e => ({ label: e.label, rows: (e.rows || []).filter(p => p.cbs && Object.keys(p.cbs).length) }));
  if(!es.some(e => e.rows.length)){
    return `<div style="font-size:11px;color:var(--text-dim);padding:4px 0 8px">カウント別データがまだありません</div>`;
  }
  const perGroup = COUNT_KEYS.length / COUNT_STRIKE_GROUPS.length;
  // 球種名・年度列の幅は「シーズン球種別成績」の表（球種104px／年度52px、スマホは82px／46px）に揃える
  const compact = isMobileLayout();
  const LW = compact ? 82 : 104, YW = 86;
  const ALL = "__all__";
  const sel = pick || ALL;
  const totalsOf = (rows) => { const t = {}; COUNT_KEYS.forEach(ck => { t[ck] = rows.reduce((sum, p) => sum + ((p.cbs[ck] && p.cbs[ck].c) || 0), 0); }); return t; };
  const totalsAll = es.map(e => totalsOf(e.rows));
  const names = [];
  es.forEach(e => e.rows.forEach(p => { if(!names.includes(p.name)) names.push(p.name); }));
  const W = LW + YW + COUNT_KEYS.length * COUNT_TABLE_COL_W;
  const colgroup = `<colgroup><col style="width:${LW}px"><col style="width:${YW}px">${COUNT_KEYS.map(() => `<col style="width:${COUNT_TABLE_COL_W}px">`).join("")}</colgroup>`;
  const stk = (left) => `position:sticky;left:${left}px;z-index:1;background:var(--panel);`;
  const stkH = (left) => `position:sticky;left:${left}px;z-index:4;background:var(--panel-alt);`;
  const yTd = (label) => `<td${yrAttr(label)} style="${stk(LW)}text-align:center;font-weight:700">${yrDot(label)}${escapeHtml(label)}</td>`;
  const thead = (first) => `<thead>
    <tr class="count-grp-row"><th style="${stkH(0)}"></th><th style="${stkH(LW)}"></th>${COUNT_STRIKE_GROUPS.map(g => `<th colspan="${perGroup}" class="${g.cls}">${g.label}</th>`).join("")}</tr>
    <tr class="count-key-row"><th style="${stkH(0)}">${first}</th><th style="${stkH(LW)}">年度</th>${COUNT_KEYS.map((ck, i) => `<th class="${COUNT_STRIKE_GROUPS[Math.floor(i / perGroup)].cls}">${ck}</th>`).join("")}</tr>
  </thead>`;
  const nameTd = (inner, span, extra = "") => `<td class="cnt-name" style="${stk(0)}"${span > 1 ? ` rowspan="${span}"` : ""}${extra}>${inner}</td>`;
  // 球種別カウント割合：球種（または「投球数」行）をクリックすると、下の球種別指標がその球種のものに切り替わる。
  // 選択中の行（初期は「投球数」＝全体）は、左端に縦線で示す。
  const shareRows = names.map((name, ni) => {
    const have = es.map((e, i) => ({ e, i, p: e.rows.find(r => r.name === name) })).filter(x => x.p);
    return have.map(({ e, i, p }, k) => `<tr class="cnt-pick${sel === name ? " cnt-sel" : ""}" data-pick="${escapeHtml(name)}">
      ${k === 0 ? nameTd(`<span class="pmix-pname"><span class="pmix-dot" style="background:${pitchColor(ni)}"></span>${escapeHtml(name)}</span>`, have.length) : ""}${yTd(e.label)}
      ${COUNT_KEYS.map(ck => {
        const cnt = p.cbs[ck] ? (p.cbs[ck].c || 0) : 0;
        return countCellHtmlHelper(totalsAll[i][ck] > 0 ? Math.round(cnt / totalsAll[i][ck] * 100) : null, "59,130,246");
      }).join("")}
    </tr>`).join("");
  }).join("");
  const totalRows = es.map((e, i) => `<tr class="count-total-row cnt-pick${sel === ALL ? " cnt-sel" : ""}" data-pick="${ALL}">${i === 0 ? nameTd("投球数", es.length) : ""}${yTd(e.label)}${COUNT_KEYS.map(ck => `<td>${totalsAll[i][ck] || "-"}</td>`).join("")}</tr>`).join("");
  // 球種別指標：選択中の球種（全体なら全球種合算）の、年度ごとの値
  const pickRows = es.map(e => sel === ALL ? e.rows : e.rows.filter(p => p.name === sel));
  const aggs = pickRows.map(r => countAggOf(r)), totals = pickRows.map(r => totalsOf(r));
  const rateRows = COUNT_RATE_SPECS.map(spec => es.map((e, i) => `
    <tr>${i === 0 ? nameTd(`<span class="count-rate-label">${spec.label}</span>`, es.length) : ""}${yTd(e.label)}
      ${COUNT_KEYS.map(ck => countCellHtmlHelper(spec.calc(aggs[i][ck], totals[i][ck]), "18,165,178", spec.format)).join("")}
    </tr>`).join("")).join("");
  const pickLabel = sel === ALL ? "全体（投球数）" : sel;
  return `
    <div class="count-subtitle">カウント別球種割合（年度比較）<span class="count-subtitle-hint">（行をクリックで下の内訳を切り替え）</span></div>
    <div class="pmix-scroll"><table class="pmix-table pmix-cmp" style="width:${W}px">${colgroup}${thead("球種")}<tbody>${shareRows}${totalRows}</tbody></table></div>
    <div class="count-subtitle" style="margin-top:16px">球種別指標：${escapeHtml(pickLabel)}</div>
    <div class="pmix-scroll"><table class="pmix-table pmix-cmp" style="width:${W}px">${colgroup}${thead("指標")}<tbody>${rateRows}</tbody></table></div>
  `;
}

// countPatternTableHtml()で作った1ブロック（全体/対右/対左いずれか1つぶん）内の、
// 球種選択割合の行クリック→下のストライク率等の内訳切り替えを有効にする。
// 選手選択時・1軍2軍切り替え時・カウント別配球のタブ切り替え時、いずれもHTMLを差し替えた直後に呼ぶ必要がある。
function wireCountPatternBlock(blockEl, pitchRows){
  if(!blockEl) return;
  const rows = (pitchRows || []).filter(p => p.cbs && Object.keys(p.cbs).length);
  if(!rows.length) return;
  const countTotals = {};
  COUNT_KEYS.forEach(ck => {
    countTotals[ck] = rows.reduce((s,p) => s + ((p.cbs[ck] && p.cbs[ck].c) || 0), 0);
  });
  // スマホでは各表が横スクロールになるため、上の「カウント別球種割合」と下の「球種別指標」が
  // 別々に動くと、同じカウント列を見比べられなくなる。2つの表の横スクロール位置を連動させる。
  // 行クリックで下の表のHTMLが差し替わると新しいスクロール要素になるので、その都度つなぎ直し、
  // 直前のスクロール位置も引き継ぐ。
  const pitchScroll = blockEl.querySelector(".count-pmix-table")?.closest(".pmix-scroll");
  const rateScrollEl = () => blockEl.querySelector("[data-count-rate-block] .pmix-scroll");
  let syncing = false;
  const mirror = (from, to) => {
    if(!from || !to || syncing || Math.abs(to.scrollLeft - from.scrollLeft) < 1) return;
    syncing = true;
    to.scrollLeft = from.scrollLeft;
    requestAnimationFrame(() => { syncing = false; });
  };
  const bindRateScroll = () => {
    const rs = rateScrollEl();
    if(!rs || !pitchScroll) return;
    rs.scrollLeft = pitchScroll.scrollLeft;
    rs.addEventListener("scroll", () => mirror(rs, pitchScroll), { passive: true });
  };
  if(pitchScroll) pitchScroll.addEventListener("scroll", () => mirror(pitchScroll, rateScrollEl()), { passive: true });
  bindRateScroll();

  blockEl.querySelectorAll(".count-pmix-row").forEach(tr => {
    tr.addEventListener("click", () => {
      const idx = parseInt(tr.dataset.groupIdx, 10);
      const rateWrap = blockEl.querySelector("[data-count-rate-block]");
      if(rateWrap) rateWrap.innerHTML = countRateBlockHtml(rows, countTotals, idx);
      bindRateScroll();
      blockEl.querySelectorAll(".count-pmix-row").forEach(r => r.classList.remove("active"));
      tr.classList.add("active");
    });
  });
}


// ── 対戦打者成績 ──
// d.vs_batters: export_llm_input.py の build_vs_batter_breakdown() が作る、打者ごとのシーズン通算成績
// （投手から見た被打率など）。打者名は打者カード（batter_cards_numeric/{batterId}.json）へのリンク。
// 表は最小打席数で絞り込み、見出しクリックで並べ替え。上位VSB_INITIAL_ROWS件だけ出し「もっと見る」で全件。
const VSB_COLS = [
  { key:"pa",  label:"打席",   fmt:"int", w:52 }, { key:"ab", label:"打数", fmt:"int", w:52 },
  { key:"h",   label:"被安打", fmt:"int", good:"low", w:60 }, { key:"hr", label:"被本塁打", fmt:"int", good:"low", w:72 },
  { key:"avg", label:"被打率", fmt:"avg", good:"low", w:68 }, { key:"ops", label:"被OPS", fmt:"ops", good:"low", w:68 },
  { key:"obp", label:"被出塁率", fmt:"avg", good:"low", w:78 }, { key:"slg", label:"被長打率", fmt:"avg", good:"low", w:78 },
  { key:"kbb_pct", label:"K-BB%", fmt:"pct", good:"high", w:66 },
  { key:"k_pct", label:"K%", fmt:"pct", good:"high", w:58 }, { key:"bb_pct", label:"BB%", fmt:"pct", good:"low", w:58 },
  { key:"whiff_pct", label:"空振り率", fmt:"pct", good:"high", w:76 },
];
const VSB_MIN_PA_OPTIONS = [[1, "全員"], [3, "3打席以上"], [5, "5打席以上"], [10, "10打席以上"]];
const VSB_INITIAL_ROWS = 10;
function vsbFmt(v, kind){
  if(v === null || v === undefined || Number.isNaN(v)) return "-";
  if(kind === "int") return String(v);
  if(kind === "avg") return v.toFixed(3).replace(/^0(?=\.)/, "");
  if(kind === "ops") return v.toFixed(3);
  if(kind === "pct") return v.toFixed(1) + "%";
  return String(v);
}

// 打者カードが存在するかを、打者のindex.jsonで一度だけ調べて使い回す（無い打者は名前をリンクにしない）。
const batterIdSetCache = {};
function getBatterIdSet(league, farm){
  const paths = SHARED_PATHS.batter[league];
  const base = paths && (farm ? paths.farmNumeric : paths.numeric);
  if(!base) return Promise.resolve(null);
  const key = `${league}|${farm ? 1 : 0}`;
  if(!batterIdSetCache[key]){
    batterIdSetCache[key] = fetchJsonZ(`${base}/index.json`)
      .then(r => r.ok ? r.json() : null)
      .then(j => j && Array.isArray(j.players) ? new Set(j.players.map(p => p.id)) : null)
      .catch(() => null);
  }
  return batterIdSetCache[key];
}

// 打者ごとの年度別成績（vs_batters）を、打者IDで束ねて通算に合算する。
// 打数・安打・塁打などの実数は足し合わせて率を出し直す。空振り率だけは元データに分子・分母が無いため
// 投球数(count)での加重平均（近似）にする。
function mergeVsBattersAcrossYears(rowsByYear){
  const acc = new Map();
  rowsByYear.forEach(({ rows }) => (rows || []).forEach(r => {
    const k = r.batterId || r.batter;
    let a = acc.get(k);
    if(!a){ a = { batter: r.batter, batterId: r.batterId, pa:0, ab:0, h:0, d2:0, d3:0, hr:0, bb:0, hbp:0, k:0, tb:0, count:0, _wh:0, _whn:0 }; acc.set(k, a); }
    ["pa","ab","h","d2","d3","hr","bb","hbp","k","tb","count"].forEach(f => { a[f] += r[f] || 0; });
    if(r.whiff_pct != null && (r.count || 0) > 0){ a._wh += r.whiff_pct * r.count; a._whn += r.count; }
  }));
  const r3 = (v) => Math.round(v * 1000) / 1000, r1 = (v) => Math.round(v * 10) / 10;
  return [...acc.values()].map(a => {
    const obpDen = a.ab + a.bb + a.hbp;
    const slg = a.ab > 0 ? a.tb / a.ab : null;
    const obp = obpDen > 0 ? (a.h + a.bb + a.hbp) / obpDen : null;
    return { ...a,
      avg: a.ab > 0 ? r3(a.h / a.ab) : null, obp: obp != null ? r3(obp) : null, slg: slg != null ? r3(slg) : null,
      ops: (slg != null && obp != null) ? r3(slg + obp) : null,
      k_pct: a.pa > 0 ? r1(a.k / a.pa * 100) : null, bb_pct: a.pa > 0 ? r1(a.bb / a.pa * 100) : null,
      whiff_pct: a._whn > 0 ? r1(a._wh / a._whn) : null };
  });
}

function wireVsBatters(d){
  const sec = mainContentEl.querySelector(".section-vsbatter");
  const list0 = d.vs_batters;
  if(!sec || !Array.isArray(list0) || !list0.length) return;
  const tableWrap = sec.querySelector("[data-vsb-table]");
  const minPaSel = sec.querySelector(".vsb-minpa-select");
  const summaryEl = sec.querySelector(".vsb-summary");
  const moreBtn = sec.querySelector(".vsb-more");
  const scopeToggle = sec.querySelector(".vsb-scope-toggle");
  const league = currentLeague, farm = !!d._isFarm;
  // 通算/年度別の元データ：各年度のvs_batters（無ければ表示中のカード自身の1年度ぶんだけ）
  const yearRows = canCompareYears(d)
    ? d._availableYears.map(y => ({ year: y, rows: (cardOfYear(d, y) || {}).vs_batters || [] }))
    : [{ year: d._activeYear || "", rows: list0 }];
  const withKbb = (r) => ({ ...r, kbb_pct: (r.k_pct != null && r.bb_pct != null) ? Math.round((r.k_pct - r.bb_pct) * 10) / 10 : null });
  const careerList = (canCompareYears(d) ? mergeVsBattersAcrossYears(yearRows) : list0).map(withKbb);
  const seasonList = yearRows.flatMap(({ year, rows }) => rows.map(r => ({ ...withKbb(r), _year: year })));
  const currentScope = () => {
    const b = scopeToggle && scopeToggle.querySelector(".hand-btn.active");
    return b ? b.dataset.scope : "career";
  };
  const getList = () => currentScope() === "season" ? seasonList : careerList;
  // 既定は3打席以上。3打席以上の打者が1人もいないシーズン序盤等は全員表示にする。
  const st = { minPa: 3, key: "ops", dir: "desc", expanded: false };   // 既定は被OPSの降順
  const pickDefaultMinPa = () => (Math.max(...getList().map(r => r.pa || 0), 0) >= 3 ? 3 : 1);
  st.minPa = pickDefaultMinPa();
  minPaSel.value = String(st.minPa);
  let batterIds = null;  // Set | null（null＝未取得/取得失敗→全員リンクにする）

  // 被安打以降は、対戦投手別成績（打者）と同じ青のカラースケール：列内の最小〜最大で正規化し、
  // 投手にとって良い方向（被打率は低い、三振・空振りは高い、など）ほど濃くする
  const shade = (rows, col, v) => {
    if(!col.good || v == null) return "";
    const vals = rows.map(r => r[col.key]).filter(x => x != null);
    if(vals.length < 2) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals);
    if(hi === lo) return "";
    let t = (v - lo) / (hi - lo);
    if(col.good === "low") t = 1 - t;
    return ` style="background:rgba(59,130,246,${(0.06 + t * 0.34).toFixed(2)})"`;
  };

  const render = () => {
    const list = getList();
    const isSeason = currentScope() === "season";
    const filtered = list.filter(r => (r.pa || 0) >= st.minPa);
    const sorted = filtered.slice().sort((a, b) => {
      const av = a[st.key], bv = b[st.key];
      if(av == null && bv == null) return 0;
      if(av == null) return 1;
      if(bv == null) return -1;                        // 値なしは並び順に関わらず末尾
      if(typeof av === "string" || typeof bv === "string"){   // 年度列（文字列）
        return (st.dir === "desc" ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv))) || (b.pa || 0) - (a.pa || 0);
      }
      return (st.dir === "desc" ? bv - av : av - bv) || (b.pa || 0) - (a.pa || 0);
    });
    const shown = st.expanded ? sorted : sorted.slice(0, VSB_INITIAL_ROWS);
    summaryEl.textContent = isSeason ? `${filtered.length}行／全${list.length}行中` : `${filtered.length}人／対戦${list.length}人中`;
    if(!filtered.length){
      tableWrap.innerHTML = `<div class="vsb-empty">${st.minPa}打席以上対戦した打者はいません</div>`;
      moreBtn.hidden = true;
      return;
    }
    const arrow = (k) => st.key === k ? (st.dir === "desc" ? " ▼" : " ▲") : "";
    const yearTh = isSeason ? `<th data-sort="_year" class="${st.key === "_year" ? "sorted" : ""}" style="text-align:center">年度${arrow("_year")}</th>` : "";
    const head = `<tr><th data-sort="batter" style="cursor:default">打者</th>${yearTh}${VSB_COLS.map(c =>
      `<th data-sort="${c.key}" class="${st.key === c.key ? "sorted" : ""}">${c.label}${arrow(c.key)}</th>`).join("")}</tr>`;
    const body = shown.map(r => {
      const linked = !batterIds || batterIds.has(r.batterId);
      const nameHtml = linked
        ? `<a class="vsb-batter" href="#batter/${league}/${encodeURIComponent(r.batterId)}${farm ? "/farm" : ""}" data-batter-id="${escapeHtml(r.batterId)}" data-batter-name="${escapeHtml(r.batter)}">${escapeHtml(r.batter)}</a>`
        : `<span class="vsb-batter nolink" title="打者カードがありません">${escapeHtml(r.batter)}</span>`;
      const yearTd = isSeason ? `<td${yrAttr(r._year)} style="text-align:center;font-weight:700">${yrDot(r._year)}${escapeHtml(r._year ?? "-")}年</td>` : "";
      return `<tr><td>${nameHtml}</td>${yearTd}${VSB_COLS.map(c => `<td${shade(filtered, c, r[c.key])}>${vsbFmt(r[c.key], c.fmt)}</td>`).join("")}</tr>`;
    }).join("");
    const colW = [190, ...(isSeason ? [62] : []), ...VSB_COLS.map(c => c.w)];
    const tW = colW.reduce((a, w) => a + w, 0);
    tableWrap.innerHTML = `<table class="vsb-table" style="table-layout:fixed;width:${tW}px;min-width:0"><colgroup>${colW.map(w => `<col style="width:${w}px">`).join("")}</colgroup><thead>${head}</thead><tbody>${body}</tbody></table>`;
    const hidden = sorted.length - VSB_INITIAL_ROWS;
    moreBtn.hidden = hidden <= 0;
    moreBtn.textContent = st.expanded ? "上位のみ表示に戻す" : `残り${hidden}人を表示`;
  };

  if(scopeToggle){
    scopeToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      scopeToggle.querySelectorAll(".hand-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      st.key = "ops"; st.dir = "desc"; st.expanded = false;
      st.minPa = pickDefaultMinPa();
      minPaSel.value = String(st.minPa);
      render();
    });
  }
  minPaSel.addEventListener("change", () => { st.minPa = Number(minPaSel.value); st.expanded = false; render(); });
  moreBtn.addEventListener("click", () => { st.expanded = !st.expanded; render(); });
  tableWrap.addEventListener("click", (e) => {
    const th = e.target.closest("th[data-sort]");
    if(th && th.dataset.sort !== "batter"){
      const k = th.dataset.sort;
      if(st.key === k) st.dir = st.dir === "desc" ? "asc" : "desc"; else { st.key = k; st.dir = "desc"; }
      render();
      return;
    }
    const a = e.target.closest("a.vsb-batter[data-batter-id]");
    if(a){
      e.preventDefault();
      cardsShell.goto("batter", { league, id: a.dataset.batterId, name: a.dataset.batterName, farm });
    }
  });
  render();
  // 打者カードが無い打者はリンクにしない（打者のindex.jsonが取れたときだけ絞る）
  getBatterIdSet(league, farm).then(set => { if(set && sec.isConnected){ batterIds = set; render(); } });
}

// 日本語（全角）と英数字（半角）が混ざった短い文言のセル幅を見積もる。
// 「8/30 vs ソフトバンク」のような長いチーム名でも列が見切れないようにするため、
// 表示する文言の長さに応じて列幅を動的に決める（固定幅だと長いチーム名で切れてしまうため）。
function estimateLabelWidth(s){
  let w = 20; // 左右パディング分
  for(const ch of String(s || "")){
    w += /[\x00-\x7F]/.test(ch) ? 7 : 12;
  }
  return w;
}

// ── 複数選択時：指標ごとに、選択項目の数だけ横並びで比較するテーブル ──
// entries: [{label, pitches}]（pitchesは pitchDetailTableHtml に渡すのと同じ球種配列）
function buildPitchCompareTable(entries){
  if(!entries.length) return "";
  const metrics = [
    { key:"count", label:"投球数", isCount:true },
    { key:"pct",   label:"投球割合", isPct:true },
    ...currentPmixMetrics(),
  ];
  // 球種の並び順：先に選んだ項目の投球数が多い順 → 以後の項目にしか無い球種は末尾に追加
  const order = [];
  const seen = new Set();
  entries.forEach(e => (e.pitches || []).forEach(p => {
    if(p.name && !seen.has(p.name)){ seen.add(p.name); order.push(p.name); }
  }));
  const colorFor = (name) => pitchColor(order.indexOf(name));

  const cellsFor = (metric, perEntry) => perEntry.map((p,i) => {
    const sep = i === 0 ? "grp-sep" : "";
    if(!p) return `<td class="${sep}">—</td>`;
    if(metric.isCount) return `<td class="${sep}">${p.count ?? "—"}</td>`;
    if(metric.isPct)   return `<td class="${sep}">${p.pct != null ? p.pct + "%" : "—"}</td>`;
    const v = p[metric.key];
    const tier = cellTier(p, metric);
    const bg = tier ? (TIER_COLOR[tier] || "") : "";
    return `<td class="${sep}" style="background:${bg}">${fmtMetricVal(metric, v)}</td>`;
  }).join("");

  const rows = order.map(name => {
    const perEntry = entries.map(e => (e.pitches || []).find(p => p.name === name) || null);
    return `
      <tr>
        <td class="pcompare-namecol"><span class="pmix-pname"><span class="pmix-dot" style="background:${colorFor(name)}"></span>${escapeHtml(name)}</span></td>
        ${metrics.map(m => cellsFor(m, perEntry)).join("")}
      </tr>
    `;
  }).join("");

  const totalRow = `
    <tr>
      <td class="pcompare-namecol">合計</td>
      ${metrics.map(m => entries.map((e,i) => {
        const sep = i === 0 ? "grp-sep" : "";
        if(m.isCount) return `<td class="${sep}">${(e.pitches||[]).reduce((s,p)=>s+(p.count||0),0)}</td>`;
        if(m.isPct)   return `<td class="${sep}">${(e.pitches||[]).length ? "100%" : "—"}</td>`;
        return `<td class="${sep}">—</td>`;
      }).join("")).join("")}
    </tr>
  `;

  const n = entries.length;
  // table-layout:fixedで列幅を確実に固定するため、colgroupで各列の幅を明示する。
  // ここを明示しないと、横スクロール中に列幅がブラウザ側で再計算されてsticky列の位置とズレ、
  // 隣の指標セルの色（カラースケール）が固定列の隙間から透けて見える不具合になる。
  // 列幅は「8/30 vs ソフトバンク」のような長いチーム名でも見切れないよう、
  // 実際に表示するラベルの長さから動的に決める。
  const COL_W = Math.max(64, Math.min(150, ...entries.map(e => estimateLabelWidth(e.label))));
  const totalWidth = 110 + metrics.length * n * COL_W;
  const colgroupHtml = `<colgroup><col style="width:110px">${metrics.map(() => entries.map(() => `<col style="width:${COL_W}px">`).join("")).join("")}</colgroup>`;
  return `
    <div class="pcompare-scroll">
      <table class="pcompare-table" style="width:${totalWidth}px">
        ${colgroupHtml}
        <thead>
          <tr>
            <th rowspan="2" class="pcompare-namecol">球種</th>
            ${metrics.map(m => `<th colspan="${n}" class="grp-sep">${m.label}</th>`).join("")}
          </tr>
          <tr>
            ${metrics.map(() => entries.map((e,i) => `<th class="${i===0?'grp-sep':''}">${escapeHtml(e.label)}</th>`).join("")).join("")}
          </tr>
        </thead>
        <tbody>${rows}${totalRow}</tbody>
      </table>
    </div>
  `;
}

// ============================================================
// コース分布（本家ダッシュボードの _hmFilterLocs / グリッド計算 / _drawZoneHeatmapMulti を移植）
// ============================================================

const HM_RESULT_OPTIONS = [
  { key:"all",           label:"全て" },
  { key:"swing",         label:"スイング" },
  { key:"swstr",         label:"空振り（/全て）" },
  { key:"swstr_vs_swing",label:"空振り（/スイング）" },
  { key:"take",          label:"見逃し" },
  { key:"ground",        label:"ゴロアウト" },
  { key:"fly",           label:"フライアウト" },
  { key:"hit",           label:"被打" },
  { key:"xbh",           label:"長打" },
  { key:"hr",            label:"HR" },
];

// グローバルなフィルター状態（比較パネル内の全ブロックで共有）
window._hmResultFilter = window._hmResultFilter || "all";
window._hmSplitMode = window._hmSplitMode || "25";
window._hmSelectedPitchKeys = window._hmSelectedPitchKeys || null; // null=全球種

// 各resultFilterの「率の分母」に使うフィルター。指定が無いものは"all"（全投球に対する率）。
// swstr_vs_swingだけ、分母を「スイングした球」に絞る（=空振り/スイング数）。
const HM_RATE_DENOM_FILTER = { swstr_vs_swing: "swing" };

// ── シーズンコース分布セクション（常にシーズン全体を表示。試合ログの比較パネルとは独立） ──
// 試合ログ側（renderComparePanel）はwindow._hmResultFilter等の共有状態を使うが、
// こちらは同じ変数を共有すると「片方でフィルターを変えたのにもう片方の表示が古いまま」に
// なってしまうため、専用の状態オブジェクトを持たせている。
const seasonHmState = { _hmResultFilter: "all", _hmSplitMode: "25", _hmSelectedPitchKeys: null };

function renderSeasonCourseSection(d){
  const container = document.getElementById("seasonCourseSection");
  if(!container) return;
  // 年度比較中は全年度ぶんを年ごとの見出し付きで縦に並べる（1年度だけのときは従来どおり見出し無し）
  const compare = isCompareYears(d);
  const entries = compare
    ? selectedYearsOf(d).map(y => ({ y, card: cardOfYear(d, y) })).filter(e => e.card)
    : [{ y: null, card: d }];
  const controlsLocs = {};   // 球種フィルターボタン用：全対象年度に登場する球種の和集合
  const pitchCounts = {};
  entries.forEach(({ card }) => Object.entries(card.season_course_locs || {}).forEach(([pkey, info]) => {
    controlsLocs[pkey] = controlsLocs[pkey] || info;
    pitchCounts[pkey] = (pitchCounts[pkey] || 0) + (info.locsR ? info.locsR.length : 0) + (info.locsL ? info.locsL.length : 0);
  }));
  if(!Object.keys(controlsLocs).length){
    container.innerHTML = `<div style="font-size:12px;color:var(--text-dim)">コース分布データがありません</div>`;
    return;
  }
  const sortedPitchKeysMap = {};
  Object.keys(controlsLocs)
    .sort((a, b) => (pitchCounts[b] || 0) - (pitchCounts[a] || 0))
    .forEach(k => { sortedPitchKeysMap[k] = controlsLocs[k]; });

  const flipR = hmDisplayFlip(currentLeague, d.throws, true);
  const flipL = hmDisplayFlip(currentLeague, d.throws, false);
  const isAllFilter = seasonHmState._hmResultFilter === "all";
  const denomFilter = HM_RATE_DENOM_FILTER[seasonHmState._hmResultFilter] || "all";
  const idOf = (y) => y ? `season-hmcanvas-${y}` : "season-hmcanvas";

  const pairHtml = (card, y, isR, label) => {
    const courseLocs = card.season_course_locs || {};
    const locs = hmCombinedLocs(courseLocs, isR, undefined, seasonHmState);
    const allLocs = isAllFilter ? null : hmCombinedLocs(courseLocs, isR, denomFilter, seasonHmState);
    return `<div class="course-pair">
      ${hmBuildGridHtml(label, locs, isR ? flipR : flipL, allLocs, seasonHmState._hmSplitMode, true)}
      <div class="hm-canvas-block">
        <div class="hm-canvas-title">${yrDot(label)}${escapeHtml(label)} 配球</div>
        <canvas id="${idOf(y)}-${isR ? "R" : "L"}" width="200" height="210"></canvas>
      </div>
    </div>`;
  };
  // 年度比較：対右→対左の順に各年度を横に並べる（2026年-対右, 2025年-対右, 2026年-対左, 2025年-対左）。
  // 各図は配球図をグリッドの下に置いて幅を詰め、4つ並べやすくする（足りなければ折り返す）
  const multiHtml = compare ? `<div class="course-row-multi">
    <div class="hand-group">${entries.map(({ y, card }) => pairHtml(card, y, true, `${y}年 対右打者`)).join("")}</div>
    <div class="hand-group">${entries.map(({ y, card }) => pairHtml(card, y, false, `${y}年 対左打者`)).join("")}</div>
  </div>` : "";
  const singleY = entries[0] ? entries[0].y : null;
  const singleLabel = (hand) => `${d._activeYear}年 対${hand}打者`;
  const entriesHtml = compare ? multiHtml : `<div class="course-row">
    ${pairHtml(d, singleY, true, singleLabel("右"))}
    ${pairHtml(d, singleY, false, singleLabel("左"))}
  </div>`;
  container.innerHTML = `${hmControlsHtml(sortedPitchKeysMap, seasonHmState)}${entriesHtml}`;

  container.querySelectorAll(".hm-filter-btn--result").forEach(btn => {
    btn.addEventListener("click", () => { seasonHmState._hmResultFilter = btn.dataset.result; renderSeasonCourseSection(d); });
  });
  container.querySelectorAll(".hm-filter-btn--split").forEach(btn => {
    btn.addEventListener("click", () => { seasonHmState._hmSplitMode = btn.dataset.split; renderSeasonCourseSection(d); });
  });
  container.querySelectorAll(".hm-pitch-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const pkey = btn.dataset.pkey;
      seasonHmState._hmSelectedPitchKeys = hmTogglePitchKey(seasonHmState._hmSelectedPitchKeys, pkey);
      renderSeasonCourseSection(d);
    });
  });

  // canvas描画（DOM挿入後に実行する必要がある）
  entries.forEach(({ y, card }) => {
    const courseLocs = card.season_course_locs || {};
    const buildColored = (isR) => {
      const out = [];
      Object.entries(courseLocs).forEach(([pkey, info]) => {
        if(seasonHmState._hmSelectedPitchKeys && !seasonHmState._hmSelectedPitchKeys.has(pkey)) return;
        let raw = hmFilterLocs((isR ? info.locsR : info.locsL) || [], seasonHmState._hmResultFilter);
        if(seasonHmState._hmSplitMode === "9") raw = raw.filter(l => l[3] === 1);
        raw.forEach(loc => { const l = loc.slice(); l._color = info.color; out.push(l); });
      });
      return out;
    };
    hmDrawHeatmap(`${idOf(y)}-R`, buildColored(true), true, flipR);
    hmDrawHeatmap(`${idOf(y)}-L`, buildColored(false), false, flipL);
  });
  // 数値表（グリッド）と配球図の高さ・上端をそろえる：配球図の高さをグリッドの高さに合わせて縮尺する
  container.querySelectorAll(".course-pair").forEach(pair => {
    const grid = pair.querySelector(".hm-grid-table");
    const cv = pair.querySelector(".hm-canvas-block canvas");
    const blk = pair.querySelector(".hm-canvas-block");
    if(!grid || !cv || !blk) return;
    const h = grid.getBoundingClientRect().height;
    if(h > 20){ cv.style.height = `${h}px`; cv.style.width = `${h * 200 / 210}px`; blk.style.width = "auto"; }
  });
}

function hmFilterLocs(locs, resultFilter){
  return (locs || []).filter(loc => {
    const [x, y, flag, inZone, rtype] = loc;
    if(resultFilter === "all") return true;
    if(resultFilter === "swstr")          return flag === 1;
    if(resultFilter === "swstr_vs_swing") return flag === 1;
    if(resultFilter === "swing")  return flag >= 0;
    if(resultFilter === "take")   return flag === -1;
    if(resultFilter === "ground") return rtype === 1;
    if(resultFilter === "fly")    return rtype === 2;
    if(resultFilter === "hit")    return rtype === 3 || rtype === 4 || rtype === 5;
    if(resultFilter === "xbh")    return rtype === 4 || rtype === 5;
    if(resultFilter === "hr")     return rtype === 5;
    return true;
  });
}

function hmGetCell(v, edges){
  for(let i=0;i<edges.length-1;i++){ if(v >= edges[i] && v < edges[i+1]) return i; }
  return v < edges[0] ? 0 : edges.length-2;
}

// pitchLocsMap: {球種コード: {name,color,locsR,locsL}} → 指定した打者方向の、フィルター適用済み結合locs配列
// stateOverride を渡すと、共有のwindow._hm*状態ではなくそちらを使う（シーズンコース分布セクションなど、
// 試合ログの比較パネルとは独立してフィルター状態を持たせたい箇所向け）
function hmCombinedLocs(pitchLocsMap, isBatterRight, filterOverride, stateOverride){
  const state = stateOverride || window;
  const selectedKeys = state._hmSelectedPitchKeys;
  const locsKey = isBatterRight ? "locsR" : "locsL";
  const keys = Object.keys(pitchLocsMap).filter(k => !selectedKeys || selectedKeys.has(k));
  const filter = filterOverride !== undefined ? filterOverride : state._hmResultFilter;
  return keys.flatMap(k => hmFilterLocs(pitchLocsMap[k][locsKey] || [], filter));
}

// 本家 index.html の表示用フリップ（_fR/_fL）の移植。
// データ生成側で既にflip_x正規化はしてあるが、それとは別に「投手の利き腕」に応じて
// 対右／対左どちらか一方の見た目だけをもう一段階左右反転する表示ロジックが本家にあり、
// これが無いと球種比較で見え方が本家と食い違う（＝反転して見える）ため移植する。
function hmDisplayFlip(league, pitcherHand, isBatterRight){
  if(!pitcherHand) return false;
  if(isBatterRight){
    return league === "mlb" ? (pitcherHand === "R") : (pitcherHand === "L");
  }
  return league === "mlb" ? (pitcherHand === "L") : (pitcherHand === "R");
}

function hmBuildGridHtml(label, locs, flipX, allLocs, splitModeOverride, resultTitle){
  const ZONE = 1.0, OUTER = 1.67;
  const edges9  = [-ZONE, -ZONE/3, ZONE/3, ZONE];
  const edges25 = [-OUTER, -ZONE, -ZONE/3, ZONE/3, ZONE, OUTER];
  const mode = splitModeOverride || window._hmSplitMode;
  const edges = mode === "9" ? edges9 : edges25;
  const N = edges.length - 1;

  const zoneLocs = mode === "9" ? locs.filter(l => l[3] === 1) : locs;
  const denom = zoneLocs.length;
  const counts = Array.from({length:N}, () => new Array(N).fill(0));
  zoneLocs.forEach(([x,y]) => { const dispX = flipX ? -x : x; counts[hmGetCell(-y, edges)][hmGetCell(dispX, edges)]++; });
  const maxCnt = Math.max(...counts.flat(), 1);

  // 「スイング」以降のタブでは、各セルを「そのゾーンに投げた全投球数」に対する割合（分数付き）で表示する。
  // 「全て」タブのときは従来通り「全ゾーン合計に対する割合」を表示する。
  const showRateOfAll = !!allLocs;
  let allCounts = null, allMaxCnt = 1;
  if(showRateOfAll){
    const allZoneLocs = mode === "9" ? allLocs.filter(l => l[3] === 1) : allLocs;
    allCounts = Array.from({length:N}, () => new Array(N).fill(0));
    allZoneLocs.forEach(([x,y]) => { const dispX = flipX ? -x : x; allCounts[hmGetCell(-y, edges)][hmGetCell(dispX, edges)]++; });
    allMaxCnt = Math.max(...allCounts.flat(), 1);
  }

  // スマホ幅では「グリッド＋配球キャンバス」を横並びのまま収めたいので、セルを一回り小さくする
  const isNarrow = isMobileLayout();
  const CW = mode === "9" ? (isNarrow ? 44 : 54) : (isNarrow ? 26 : 34);
  const CH = mode === "9" ? (isNarrow ? 36 : 44) : (isNarrow ? 22 : 28);
  const fs = mode === "9" ? (isNarrow ? "10.5px" : "12px") : "10px", fsSub = mode === "9" ? "8.5px" : "8px";

  // showRateOfAll（「スイング」以降のタブ）では、色の濃淡は「そのゾーンに来た球のうち該当した割合」
  // （＝セルに表示されている%そのもの）が高いほど濃くなるようにする。総投球数で決めると、
  // 割合は高いのに投球数が少ないだけのセルが薄く表示されて紛らわしいため、先に全セルの%を
  // 計算してその中の最大値を基準に正規化する。
  let ratePctGrid = null, maxRatePct = 1;
  if(showRateOfAll){
    ratePctGrid = Array.from({length:N}, () => new Array(N).fill(0));
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const total = allCounts[r][c];
      ratePctGrid[r][c] = total>0 ? (counts[r][c]/total*100) : 0;
    }
    maxRatePct = Math.max(...ratePctGrid.flat(), 1);
  }

  let html = `<div class="course-block">
    <div class="ctitle">${resultTitle ? `${yrDot(label)}${escapeHtml(label)} 結果（${mode==='9' ? denom+'球 ゾーン内' : locs.length+'球'}）` : `${escapeHtml(label)}（${mode==='9' ? denom+'球 ゾーン内' : locs.length+'球'}）— 投手視点`}</div>
    <table class="hm-grid-table"><tbody>`;
  for(let r=0;r<N;r++){
    html += "<tr>";
    for(let c=0;c<N;c++){
      const cnt = counts[r][c];
      let pct, subLabel, hasVal, intensity;
      if(showRateOfAll){
        const total = allCounts[r][c];
        hasVal = total > 0;
        pct = hasVal ? Math.round(cnt/total*100) : 0;
        subLabel = `${cnt}/${total}`;
        intensity = hasVal ? ratePctGrid[r][c] / maxRatePct : 0; // 濃淡は割合（%）の高さを基準にする
      } else {
        hasVal = cnt > 0;
        pct = denom>0 ? (cnt/denom*100).toFixed(1) : "0.0";
        subLabel = String(cnt);
        intensity = cnt / maxCnt;
      }
      const inZone = mode==="9" ? true : (c>=1&&c<=3&&r>=1&&r<=3);
      const bgAlpha = (0.05 + intensity*0.7).toFixed(2);
      const bg = hasVal ? (inZone?`rgba(59,130,246,${bgAlpha})`:`rgba(100,116,139,${bgAlpha})`) : (inZone?"rgba(59,130,246,0.03)":"rgba(255,255,255,0.01)");
      const textCol = intensity>0.25 ? "#fff" : (hasVal?"var(--text)":"var(--text-dim)");
      const subCol = intensity>0.25 ? "rgba(255,255,255,0.75)" : "var(--text-dim)";
      const bT = (mode==="25"&&r===1)?"2px solid rgba(255,255,255,0.5)":"1px solid rgba(255,255,255,0.08)";
      const bL = (mode==="25"&&c===1)?"2px solid rgba(255,255,255,0.5)":"1px solid rgba(255,255,255,0.08)";
      const bB = (mode==="25"&&r===3)?"2px solid rgba(255,255,255,0.5)":"1px solid rgba(255,255,255,0.08)";
      const bR = (mode==="25"&&c===3)?"2px solid rgba(255,255,255,0.5)":"1px solid rgba(255,255,255,0.08)";
      html += `<td style="width:${CW}px;height:${CH}px;text-align:center;border-top:${bT};border-left:${bL};border-bottom:${bB};border-right:${bR};background:${bg};vertical-align:middle;padding:0">
        <div style="font-size:${fs};font-weight:700;line-height:1.3;color:${textCol}">${hasVal?pct+'%':'·'}</div>
        ${hasVal?`<div style="font-size:${fsSub};line-height:1.1;color:${subCol}">${subLabel}</div>`:""}
      </td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

// 本家 _drawZoneHeatmapMulti の移植（バッターシルエット込み）
function hmDrawHeatmap(canvasId, locs, isBatterRight, flipX){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  const RANGE = 1.75, BAT_W = 42, PAD_TOP=6, PAD_BTM=28;
  const PAD_L = isBatterRight ? 10 : BAT_W+6;
  const PAD_R = isBatterRight ? BAT_W+6 : 10;
  const drawW = W-PAD_L-PAD_R, drawH = H-PAD_TOP-PAD_BTM;
  const toX = x => PAD_L + (x+RANGE)/(RANGE*2)*drawW;
  const toY = y => PAD_TOP + (1-(y+RANGE)/(RANGE*2))*drawH;

  ctx.fillStyle = "#070E1A"; ctx.fillRect(0,0,W,H);

  const sigma = (drawW/(RANGE*2))*0.075*2;
  const BASE_LOCS = 150;
  const _scale = locs.length > BASE_LOCS ? Math.sqrt(BASE_LOCS/locs.length) : 1.0;
  const dotScale = Math.max(0.7,_scale), alphaScale = Math.max(0.5,_scale);

  ctx.save(); ctx.beginPath(); ctx.rect(PAD_L,PAD_TOP,drawW,drawH); ctx.clip();
  const dotR = Math.max(2.5, sigma*0.55*dotScale);
  const a0 = +(0.85*alphaScale).toFixed(2), a1 = +(0.55*alphaScale).toFixed(2);
  locs.forEach(loc => {
    const [x,y] = loc;
    const pc = hexToRgb(loc._color || "#3B82F6");
    const px = flipX ? -x : x;
    // ボール球（ゾーン外）はもとの座標をそのまま使うとキャンバス端に寄りすぎて見づらいため
    // 少し圧縮しているが、値が小さすぎるとストライクゾーンのすぐ外側に張り付いて見えてしまう。
    // ボールゾーン側にもう少し広がって見えるよう圧縮率を弱めている。
    const BALL_COMPRESS = 0.55, SZ = 1.0;
    const compress = v => { if(Math.abs(v)<=SZ) return v; const sign=v>0?1:-1; return sign*(SZ+(Math.abs(v)-SZ)*BALL_COMPRESS); };
    const cx2 = toX(compress(px)), cy2 = toY(compress(y));
    const grd = ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,dotR*2.2);
    grd.addColorStop(0,`rgba(${pc.r},${pc.g},${pc.b},${a0})`);
    grd.addColorStop(0.4,`rgba(${pc.r},${pc.g},${pc.b},${a1})`);
    grd.addColorStop(1,`rgba(${pc.r},${pc.g},${pc.b},0)`);
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx2,cy2,dotR*2.2,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();

  const zx1=toX(-1),zx2=toX(1),zy1=toY(1),zy2=toY(-1);
  ctx.strokeStyle="rgba(255,255,255,0.55)"; ctx.lineWidth=1.5; ctx.strokeRect(zx1,zy1,zx2-zx1,zy2-zy1);
  ctx.strokeStyle="rgba(255,255,255,0.18)"; ctx.lineWidth=0.8;
  [toX(-1/3),toX(1/3)].forEach(x=>{ctx.beginPath();ctx.moveTo(x,zy1);ctx.lineTo(x,zy2);ctx.stroke();});
  [toY(1/3),toY(-1/3)].forEach(y=>{ctx.beginPath();ctx.moveTo(zx1,y);ctx.lineTo(zx2,y);ctx.stroke();});

  const plateY=toY(-1.0)+2, plW=zx2-zx1;
  ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(zx1,plateY); ctx.lineTo(zx2,plateY);
  ctx.moveTo(zx1,plateY); ctx.lineTo(zx1+plW*0.15,plateY+8);
  ctx.lineTo(zx1+plW*0.5,plateY+11); ctx.lineTo(zx2-plW*0.15,plateY+8); ctx.lineTo(zx2,plateY);
  ctx.stroke();

  const batCX = isBatterRight ? toX(1)+BAT_W*0.5 : toX(-1)-BAT_W*0.5;
  const batBotY = toY(-1.0)+4, s = 0.88;
  ctx.save(); ctx.translate(batCX,batBotY);
  if(!isBatterRight) ctx.scale(-1,1);
  ctx.fillStyle = "rgba(148,163,184,0.55)"; ctx.strokeStyle = "rgba(148,163,184,0.55)";
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-12*s,0); ctx.lineTo(-14*s,-25*s); ctx.lineTo(-7*s,-25*s); ctx.lineTo(-5*s,-14*s);
  ctx.lineTo(-1*s,-25*s); ctx.lineTo(5*s,-25*s); ctx.lineTo(2*s,0); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-13*s,-23*s); ctx.lineTo(-14*s,-48*s); ctx.lineTo(-4*s,-48*s); ctx.lineTo(-2*s,-23*s);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-9*s,-56*s,7*s,8*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-4*s,-54*s,4*s,5*s,0.3,0,Math.PI); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13*s,-44*s); ctx.lineTo(-24*s,-35*s); ctx.lineWidth=7*s; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14*s,-44*s); ctx.lineTo(-7*s,-33*s); ctx.lineWidth=5*s; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7*s,-33*s); ctx.lineTo(10*s,-14*s); ctx.lineWidth=3.5*s;
  ctx.strokeStyle="rgba(148,163,184,0.35)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(10*s,-14*s,2.5*s,0,Math.PI*2); ctx.fillStyle="rgba(148,163,184,0.4)"; ctx.fill();
  ctx.restore();
}

function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16) } : { r:59,g:130,b:246 };
}

// 球種フィルターボタンのクリック挙動（複数選択・要望）：
// ・「全球種」をクリック → 絞り込み無し（null）に戻す。
// ・絞り込み無し（currentSet=null）の状態から特定の球種（例：スライダー）をクリック
//   → その球種だけを選択する（全球種→単一選択に絞り込む操作）。
// ・すでに1つ以上選択されている状態から、まだ選ばれていない球種（例：カーブ）を
//   クリック → 選択に追加する（複数選択）。
// ・すでに選択されている球種を再度クリック → その球種だけ選択解除する。
//   解除した結果0件になったら、絞り込み無し（全球種＝null）に自動的に戻す。
function hmTogglePitchKey(currentSet, pkey){
  if(pkey === "__all__") return null;
  if(!currentSet) return new Set([pkey]);
  const next = new Set(currentSet);
  if(next.has(pkey)) next.delete(pkey); else next.add(pkey);
  return next.size === 0 ? null : next;
}

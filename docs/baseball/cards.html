      <span class="hm-pdot" style="background:${info.color}"></span>${escapeHtml(info.name)}

  return `
    <div class="hm-controls">

          ${HM_RESULT_OPTIONS.map(o => `<button class="hm-filter-btn hm-filter-btn--result ${state._hmResultFilter===o.key?'active':''}" data-result="${o.key}">${o.label}</button>`).join("")}
        </div>

          <button class="hm-pitch-btn ${!state._hmSelectedPitchKeys ? 'active' : ''}" data-pkey="__all__">全球種</button>
          ${pitchBtns}
        </div>
      </div>
      <div class="hm-controls-row">
        <span class="hm-controls-label">分割</span>
        <div class="hm-btn-group">
          <button class="hm-filter-btn hm-filter-btn--split ${state._hmSplitMode==='25'?'active':''}" data-split="25">25分割</button>
          <button class="hm-filter-btn hm-filter-btn--split ${state._hmSplitMode==='9'?'active':''}" data-split="9">9分割</button>
        </div>
      </div>
    </div>
  `;
}

function buildGameLogTable(d){
  if(!d.game_log || !d.game_log.length) return { season: "", game: "" };
  const cols = [
    { key: "swstr_pct", label: "空振り率", good: "high", th: 12 },
    { key: "chase_pct", label: "ボール球SW%", good: "high", th: 30 },
    { key: "strike_pct", label: "ストライク率", good: "high", th: 55 },
    { key: "zone_pct", label: "ゾーン率", good: "high", th: 45 },
    { key: "kbb_pct", label: "K-BB%", good: "high", th: 15 },
    { key: "k_pct", label: "K%", good: "high", th: 22 },
    { key: "bb_pct", label: "BB%", good: "low", th: 8 },
    { key: "gb_pct", label: "ゴロ率", good: "high", th: 42 }
  ];

  const chk = (gidx) => `<input type="checkbox" class="cmp-checkbox" data-gidx="${gidx}" ${compareSelectedKeys.has(gidx)?"checked":""}>`;

  // 対戦・結果は1セルにまとめ、結果を1行目・対戦相手をひとまわり小さく2行目に表示する
  // （3行目は作らない＝どちらも折り返さず1行で収まる幅にしてある）
  const matchupCell = (resultHtml, opponentText) => `
    <td class="gl-matchup-cell">
      <div class="gl-result">${resultHtml}</div>
      <div class="gl-opponent">${opponentText}</div>
    </td>
  `;

  const colCount = 3 + cols.length; // 比較・日付（または年度）・対戦結果 + 指標列

  const headerRowHtml = (labelCol) => `
    <tr class="row-col-header">
      <th>比較</th><th>${labelCol}</th><th>結果</th>
      ${cols.map(c => `<th>${c.label}</th>`).join("")}
    </tr>
  `;

  // ── シーズン別：この選手が持つ年度ぶん（d._availableYears）を1行ずつ並べる。
  // 複数年対応前のデータ（2軍カード等）ではd._availableYearsが無いので、従来どおり1行だけになる。
  const seasonEntries = (d._availableYears && d._seasonEntriesByYear)
    ? d._availableYears.map(y => ({ year: y, data: d._seasonEntriesByYear[y], gidx: `season:${y}` }))
    : (() => {
        const latestYear = d.game_log.reduce((y, g) => {
          const gy = dateYear(g.date);
          return gy && (!y || gy > y) ? gy : y;
        }, null);
        return [{ year: latestYear || (d.season_label || "シーズン"), data: d, gidx: "season" }];
      })();
  // シーズン別の表：結果（登板・防御率など）→ K-BB% → K% → BB% → ゴロ率 → 空振り率 → ボール球SW% → ストライク率 → ゾーン率 の順。
  // 各指標にその年度の順位と色を付ける。比較用チェックや行クリックでの移動は無し（年度比較は選手名横の年度選択で行う）。
  const SS_ORDER = ["kbb_pct", "k_pct", "bb_pct", "gb_pct", "swstr_pct", "chase_pct", "strike_pct", "zone_pct"];
  const ssCols = SS_ORDER.map(k => cols.find(c => c.key === k)).filter(Boolean);
  const RK_KEY = { swstr_pct: "swstr_pct", chase_pct: "chase_pct", strike_pct: "strike_pct", zone_pct: "zone_pct", kbb_pct: "k_bb_pct", k_pct: "k_pct", bb_pct: "bb_pct", gb_pct: "gb_pct" };
  const seasonRowHtml = (entry) => {
    const rkAll = (entry.data && entry.data.rankings) || {};
    return `
    <tr>
      <td class="ss-year"${yrAttr(entry.year)}>${yrDot(entry.year)}${escapeHtml(String(entry.year))}${/^\d{4}$/.test(String(entry.year)) ? "年" : ""}</td>
      <td class="ss-name-cell">${formatSeasonResult(entry.data, true).split("<br>").map(escapeHtml).join("<br>")}</td>
      ${ssCols.map(c => {
        const v = entry.data[c.key + "_season"];

      }).join("")}

  const seasonTabHtml = `

      <tbody>${seasonEntries.map(seasonRowHtml).join("")}</tbody>
    </table></div>
  `;

  // ── 試合別：年ごとにグループ化し、フォルダ行の下にその年の試合行だけを表示する。

    if(!grp){ grp = { year: y, indices: [] }; yearGroups.push(grp); }
    grp.indices.push(i);
  });
  // 年フォルダは最新年（先頭）だけ開いておく（試合別タブに切り替えて最初に見えるのが
  // 空のフォルダ一覧だけ、という状態を避けるため）
  const gameFolderRowsHtml = yearGroups.map((grp, gi) => {
    const isOpen = false;   // 年フォルダは初期状態では全て閉じておく
    const rows = grp.indices.map(i => gameRowHtml(d.game_log[i], i)).join("");
    return `
      <tbody class="folder-head-body">
        <tr class="row-folder" data-year="${escapeHtml(grp.year)}">
          <td colspan="${colCount}" class="folder-cell">
            <div class="folder-row-inner">
              <span class="folder-bar"></span>

      <tbody class="folder-body" data-year-body="${escapeHtml(grp.year)}" style="display:${isOpen ? "table-row-group" : "none"}">
        ${headerRowHtml("日付")}${rows}
      </tbody>
    `;
  }).join("");
  const gameTabHtml = `
    <table class="gamelog-table">
      ${colgroupHtml(cols)}
      ${gameFolderRowsHtml}
    </table>
  `;

  // 上部の「シーズン成績」（年度別の一覧。行のチェック/クリックで下の比較パネルに反映）と、
  // 下部の「試合ログ」（試合別のみ）に分けて返す。
  return {
    season: `
    <div class="section section-gamelog">
      ${sectionHeader({ bar:"var(--amber)", label:"シーズン成績", labelColor:"var(--text-bright)", sub:"年度ごとの成績" })}
      <div class="section-body">
        ${seasonTabHtml}
      </div>
    </div>`,
    game: `
    <div class="section section-gamelog">
      ${sectionHeader({ bar:"var(--amber)", label:"試合ログ", labelColor:"var(--text-bright)", sub:"試合別" })}
      <div class="section-body">
        <div class="gamelog-scroll" data-gamelog-tab="game">
          ${gameTabHtml}
        </div>
        <div id="comparePanel"></div>

}

// table-layout:fixed の列幅は本来thead側の指定で決まるが、年フォルダを閉じている間は
// 列見出し行自体が無くなる（display:none）ため、colgroupで列幅を明示して
// フォルダの開閉状態に関わらず常に同じ列幅になるようにしている。
function colgroupHtml(cols){
  return `
    <colgroup>
      <col style="width:36px"><col style="width:64px"><col style="width:180px">
      ${cols.map(() => `<col style="width:88px">`).join("")}
    </colgroup>
  `;
}

// 選択中のキーに対応する {pitch_detail, course_locs, label, summary} を取得
function getRowDataFor(d, gidx){
  if(gidx === "season"){
    return { label: "シーズン", pitchDetail: d.season_pitch_detail, courseLocs: d.season_course_locs, summary: formatSeasonResult(d), seasonTotals: d.season_totals || null, totalsRanksFor: d._totalsRanksFor || null };
  }
  if(typeof gidx === "string" && gidx.startsWith("season:")){
    const y = gidx.slice("season:".length);
    const sd = d._seasonEntriesByYear && d._seasonEntriesByYear[y];
    if(!sd) return null;
    // アクティブな年度は順位計算済み（d._totalsRanksFor）をそのまま使う。他年度は順位無し表示。
    const totalsRanksFor = (y === d._activeYear) ? (d._totalsRanksFor || null) : null;
    return { label: `${y}年`, pitchDetail: sd.season_pitch_detail, courseLocs: sd.season_course_locs, summary: formatSeasonResult(sd), seasonTotals: sd.season_totals || null, totalsRanksFor };
  }
  const g = d.game_log[parseInt(gidx,10)];
  if(!g) return null;
  return { label: `${formatDateShort(g.date)} ${g.opponent || ""}`.trim(), pitchDetail: g.pitch_detail, courseLocs: g.course_locs, summary: formatGameResult(g), seasonTotals: null, totalsRanksFor: null };
}

function renderComparePanel(d){
  const panel = document.getElementById("comparePanel");
  if(!panel) return;
  // チェックボックスでの選択がある場合はそちらを優先。無ければ行クリックのプレビューを表示する
  const keys = compareSelectedKeys.size ? [...compareSelectedKeys] : (previewGidx != null ? [previewGidx] : []);
  if(!keys.length){ panel.innerHTML = ""; return; }

  // 比較パネルが表示される（下に大きく伸びる）ときは、開いている年フォルダを閉じて
  // シーズン成績テーブル自体の縦の長さを抑える
  mainContentEl.querySelectorAll(".gamelog-table tbody.folder-body").forEach(body => {
    if(body.style.display !== "none"){
      body.style.display = "none";
      const year = body.dataset.yearBody;
      const row = mainContentEl.querySelector(`.gamelog-table tr.row-folder[data-year="${year}"]`);
      const chev = row && row.querySelector(".folder-chevron");
      if(chev) chev.style.transform = "rotate(-90deg)";
    }
  });

  // 全選択ぶんに登場する球種の集合（球種フィルターボタン用）。
  // タブは投球割合（投球数）が多い球種順に並べる。
  const allPitchKeysMap = {};
  const pitchCounts = {};
  keys.forEach(k => {
    const rd = getRowDataFor(d, k);
    if(rd && rd.courseLocs) Object.entries(rd.courseLocs).forEach(([pkey, info]) => {
      allPitchKeysMap[pkey] = info;
      const cnt = (info.locsR ? info.locsR.length : 0) + (info.locsL ? info.locsL.length : 0);
      pitchCounts[pkey] = (pitchCounts[pkey] || 0) + cnt;
    });
  });
  const sortedPitchKeysMap = {};
  Object.keys(allPitchKeysMap)
    .sort((a, b) => (pitchCounts[b] || 0) - (pitchCounts[a] || 0))
    .forEach(k => { sortedPitchKeysMap[k] = allPitchKeysMap[k]; });
  const controlsHtml = hmControlsHtml(sortedPitchKeysMap);
  const isMulti = keys.length >= 2;
  // 投手の利き腕に応じた表示用フリップ（対右/対左それぞれ独立）。本家index.htmlの_fR/_fLと同じ計算。
  const flipR = hmDisplayFlip(currentLeague, d.throws, true);
  const flipL = hmDisplayFlip(currentLeague, d.throws, false);

  // 表部分：球種の投球数・割合など（複数選択なら球種比較テーブル、単一選択ならそのゲームの球種内訳表）
  const statsInnerHtml = isMulti ? (() => {
    const entries = keys.map(gidx => {
      const rd = getRowDataFor(d, gidx);
      const pitches = rd && rd.pitchDetail ? rd.pitchDetail[compareHand] : null;
      return { label: rd ? rd.label : gidx, pitches: pitches || [] };
    });
    const handButtons = `
      <div class="chand-toggle">
        <button class="hand-btn ${compareHand==='all'?'active':''}" data-hand="all">全体</button>
        <button class="hand-btn ${compareHand==='vsR'?'active':''}" data-hand="vsR">対右</button>
        <button class="hand-btn ${compareHand==='vsL'?'active':''}" data-hand="vsL">対左</button>
      </div>
    `;
    return `
      <div class="compare-block-title">球種比較</div>
      ${handButtons}
      ${buildPitchCompareTable(entries)}
    `;
  })() : (() => {
    const gidx = keys[0];
    const rd = getRowDataFor(d, gidx);
    if(!rd || !rd.pitchDetail || !rd.pitchDetail.all) return "";
    return `
      <div class="compare-block-title">${escapeHtml(rd.label)}</div>
      ${rd.summary ? `<div class="compare-block-summary">${escapeHtml(rd.summary)}</div>` : ""}
      <div class="hand-toggle" data-gidx="${gidx}">
        <button class="hand-btn active" data-hand="all">全体</button>
        <button class="hand-btn" data-hand="vsR">対右</button>
        <button class="hand-btn" data-hand="vsL">対左</button>
      </div>
      <div class="pmix-wrap" data-gidx="${gidx}">${pitchDetailTableHtml(rd.pitchDetail.all, rd.seasonTotals && rd.seasonTotals.all, undefined, undefined, rd.totalsRanksFor ? rd.totalsRanksFor("all") : undefined)}</div>
    `;
  })();

  // 配球部分：結果/分割/球種のタブと、選択ぶんの配球グリッド＋配球図
  const courseEntriesHtml = keys.map(gidx => {
    const rd = getRowDataFor(d, gidx);
    if(!rd) return "";
    const courseLocs = rd.courseLocs || {};
    const locsR = hmCombinedLocs(courseLocs, true);
    const locsL = hmCombinedLocs(courseLocs, false);
    const isAllFilter = window._hmResultFilter === "all";
    const denomFilter = HM_RATE_DENOM_FILTER[window._hmResultFilter] || "all";
    const allLocsR = isAllFilter ? null : hmCombinedLocs(courseLocs, true, denomFilter);
    const allLocsL = isAllFilter ? null : hmCombinedLocs(courseLocs, false, denomFilter);
    const canvasIdR = `hmcanvas-${gidx}-R`, canvasIdL = `hmcanvas-${gidx}-L`;
    return `
      <div class="course-entry" data-cmp-gidx="${gidx}">
        ${isMulti ? `
          <div class="compare-block-title">${escapeHtml(rd.label)}</div>
          ${rd.summary ? `<div class="compare-block-summary">${escapeHtml(rd.summary)}</div>` : ""}
        ` : ""}
        <div class="course-row">
          <div class="course-pair">
            ${hmBuildGridHtml("対右打者", locsR, flipR, allLocsR)}
            <div class="hm-canvas-block">
              <div class="hm-canvas-title">対右打者 配球</div>
              <canvas id="${canvasIdR}" width="200" height="210"></canvas>
            </div>
          </div>
          <div class="course-pair">
            ${hmBuildGridHtml("対左打者", locsL, flipL, allLocsL)}
            <div class="hm-canvas-block">
              <div class="hm-canvas-title">対左打者 配球</div>
              <canvas id="${canvasIdL}" width="200" height="210"></canvas>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");

  // カウント別配球：選択した試合（またはシーズン）ぶんの球種ごとのcbsから、シーズンの
  // 「カウント別配球」セクションと同じ表を作る。複数選択時は選択ぶんを縦に並べ、全体/対右/対左は共通のタブで切り替える。
  // 試合単位のcbsはexport_llm_input.pyの_single_game_mix_rowsで追加したもの（再出力前の古いJSONでは
  // countPatternTableHtml側が「データがまだありません」と表示するだけで、他の表示は壊れない）。
  const countHandBtn = (h, label) => `<button class="hand-btn ${compareCountHand===h?'active':''}" data-hand="${h}">${label}</button>`;
  const countEntriesHtml = keys.map(gidx => {
    const rd = getRowDataFor(d, gidx);
    if(!rd || !rd.pitchDetail) return "";
    return `<div class="cmp-count-entry" data-count-gidx="${gidx}"${isMulti ? ' style="margin-bottom:18px"' : ""}>${countPatternTableHtml(rd.pitchDetail[compareCountHand], isMulti ? rd.label : null)}</div>`;
  }).join("");
  const countSectionHtml = `
    <div class="compare-divider"></div>
    <div class="compare-block-title" style="margin-bottom:8px">カウント別配球</div>
    <div class="chand-toggle ccount-toggle">
      ${countHandBtn("all","全体")}${countHandBtn("vsR","対右")}${countHandBtn("vsL","対左")}
    </div>
    ${countEntriesHtml}
  `;

  // 表部分と配球部分は、2つの枠に分けず1つの囲み枠の中を区切り線で分ける
  const combinedBoxHtml = `
    <div class="compare-block">
      ${statsInnerHtml}
      <div class="compare-divider"></div>
      ${controlsHtml}
      ${courseEntriesHtml}
      ${countSectionHtml}
    </div>
  `;

  panel.innerHTML = `<div class="compare-blocks">${combinedBoxHtml}</div>`;


  // canvas描画（DOM挿入後に実行する必要がある）
  keys.forEach(gidx => {
    const rd = getRowDataFor(d, gidx);
    if(!rd || !rd.courseLocs) return;
    const buildColored = (isR) => {
      const out = [];
      Object.entries(rd.courseLocs).forEach(([pkey, info]) => {
        if(window._hmSelectedPitchKeys && !window._hmSelectedPitchKeys.has(pkey)) return;
        let raw = hmFilterLocs((isR ? info.locsR : info.locsL) || [], window._hmResultFilter);
        // 9分割の表はゾーン内投球だけを集計している（ボール球は含めない）ため、
        // 配球図（キャンバス）側もボール球のプロットを出すと表の数値と対応しなくなる。
        // 9分割のときはキャンバスもゾーン内投球だけに絞り、表と配球図を一致させる。
        if(window._hmSplitMode === "9") raw = raw.filter(l => l[3] === 1);
        raw.forEach(loc => { const l = loc.slice(); l._color = info.color; out.push(l); });
      });
      return out;
    };
    hmDrawHeatmap(`hmcanvas-${gidx}-R`, buildColored(true), true, flipR);
    hmDrawHeatmap(`hmcanvas-${gidx}-L`, buildColored(false), false, flipL);
  });

  wireComparePanelEvents(d);
}

function wireComparePanelEvents(d){
  const panel = document.getElementById("comparePanel");
  if(!panel) return;

  panel.querySelectorAll(".chand-toggle:not(.ccount-toggle) .hand-btn").forEach(btn => {
    btn.addEventListener("click", () => { compareHand = btn.dataset.hand; renderComparePanel(d); });
  });
  // カウント別配球のタブ：その部分だけ差し替える（パネル全体を再描画すると配球図の選択状態などまで作り直しになるため）
  const ccountToggle = panel.querySelector(".ccount-toggle");
  const wireCountEntries = () => {
    panel.querySelectorAll(".cmp-count-entry").forEach(entry => {
      const rd = getRowDataFor(d, entry.dataset.countGidx);
      if(rd && rd.pitchDetail) wireCountPatternBlock(entry, rd.pitchDetail[compareCountHand]);
    });
  };
  if(ccountToggle){
    ccountToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      compareCountHand = btn.dataset.hand;
      ccountToggle.querySelectorAll(".hand-btn").forEach(b => b.classList.toggle("active", b === btn));
      const isMulti = panel.querySelectorAll(".cmp-count-entry").length >= 2;
      panel.querySelectorAll(".cmp-count-entry").forEach(entry => {
        const rd = getRowDataFor(d, entry.dataset.countGidx);
        if(!rd || !rd.pitchDetail) return;
        entry.innerHTML = countPatternTableHtml(rd.pitchDetail[compareCountHand], isMulti ? rd.label : null);
      });
      wireCountEntries();
    });
  }
  wireCountEntries();
  panel.querySelectorAll(".hm-filter-btn[data-result]").forEach(btn => {
    btn.addEventListener("click", () => { window._hmResultFilter = btn.dataset.result; renderComparePanel(d); });
  });
  panel.querySelectorAll(".hm-filter-btn[data-split]").forEach(btn => {
    btn.addEventListener("click", () => { window._hmSplitMode = btn.dataset.split; renderComparePanel(d); });
  });
  panel.querySelectorAll(".hm-pitch-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const pkey = btn.dataset.pkey;
      // 複数選択：全球種→1つクリックで単一選択、以降は未選択の球種をクリックするたびに
      // 追加、選択済みの球種を再クリックすると解除する（hmTogglePitchKey参照）。
      window._hmSelectedPitchKeys = hmTogglePitchKey(window._hmSelectedPitchKeys, pkey);
      renderComparePanel(d);
    });
  });
  panel.querySelectorAll(".hand-toggle").forEach(toggle => {
    toggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      const idx = toggle.dataset.gidx;
      const hand = btn.dataset.hand;
      const rd = getRowDataFor(d, idx);
      if(!rd || !rd.pitchDetail) return;
      toggle.querySelectorAll(".hand-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const wrap = panel.querySelector(`.pmix-wrap[data-gidx="${idx}"]`);
      if(wrap) wrap.innerHTML = pitchDetailTableHtml(rd.pitchDetail[hand], rd.seasonTotals && rd.seasonTotals[hand], undefined, undefined, rd.totalsRanksFor ? rd.totalsRanksFor(hand) : undefined);
    });
  });
}

// 共通ローダー(cardsShell)から、外部リンク・戻るボタン経由でこのモードの選手ページを開くための窓口
cardsShell.register("pitcher", {
  ready: initialLoad,
  getState: () => ({ league: currentLeague, id: activePlayerId,
    name: activeCardData ? activeCardData.name : null, farm: !!(activeCardData && activeCardData._isFarm) }),
  // 投手↔打者のモード切替時に、切替元のプロ野球/MLBタブに合わせるための窓口
  async setLeague(league){
    if(!league || league === currentLeague || !LEAGUE_PATHS[league]) return;
    leagueStateCache[currentLeague] = snapshotLeagueState();
    document.querySelectorAll(".league-toggle button").forEach(b => b.classList.toggle("active", b.dataset.league === league));
    currentLeague = league;
    await loadPlayerIndex(league);
  },
  async openPlayer({ league, id, name }){
    if(league && league !== currentLeague && LEAGUE_PATHS[league]){
      leagueStateCache[currentLeague] = snapshotLeagueState();
      // リーグ切替時に「前回選んでいた選手」の自動選択が走ると、これから開く選手を上書きしうるので消しておく
      if(leagueStateCache[league]) leagueStateCache[league].activePlayerId = null;
      document.querySelectorAll(".league-toggle button").forEach(b => b.classList.toggle("active", b.dataset.league === league));
      currentLeague = league;
      await loadPlayerIndex(league);
    }
    await selectPlayer(id, name || id);
  },
});

}

// 守備位置の表記ゆれ対策：古いキャッシュ済みJSON等に "(三)" のようなカッコ付き表記が
// 残っていても、表示時にここで剥がす（新しいexport_llm_input_batter.pyはカッコ無しで出力する）。
function stripParens(s){
  return s ? String(s).replace(/[（）()]/g, "").trim() : s;
}


function fmt(v, digits, suffix){
  if(v === null || v === undefined || Number.isNaN(v)) return "-";
  const n = typeof v === "number" ? v : Number(v);
  if(Number.isNaN(n)) return "-";
  const s = digits === 0 ? String(Math.round(n)) : n.toFixed(digits);
  return suffix ? `${s}${suffix}` : s;
}
function fmtAvg(v){
  if(v === null || v === undefined) return "-";
  return v.toFixed(3).replace(/^0\./, ".");
}
function rankText(rk){
  if(!rk || !rk.total) return "";
  if(rk.rank == null) return "-";
  return `${rk.rank}位 / ${rk.total}人中`;
}

// 順位（rank/total）→ 7段階のtier。KPIボックスの文字色をこれで決める。
// pitcher-cards.htmlのtierFromRankと同じロジック（本スクリプトのrank計算は、
// 指標の向き（高いほど良い/低いほど良い）を計算時点で吸収して「1位=最良」に
// 揃えているので、ここでの扱いは全指標で同じでよい）。
//   top15: 上位15%以内 / top30: 上位15〜30% / top40: 上位30〜40% / mid: 上位40〜60%
//   bot60: 上位60〜70% / bot70: 上位70〜85% / bot85: 下位15%以内

// テーブルセルの背景カラースケール（pitcher-cards.htmlのTIER_COLORと完全に同じ配色を使う）。
const TIER_COLOR = {
  top15: "rgba(18,165,178,0.40)", top30: "rgba(18,165,178,0.25)", top40: "rgba(18,165,178,0.12)",
  mid: "", bot60: "rgba(238,122,151,0.10)", bot70: "rgba(238,122,151,0.18)", bot85: "rgba(238,122,151,0.38)",
};
function tierBg(tier){ return (tier && TIER_COLOR[tier]) || ""; }

// 順位データが無い（＝ランキング未算出の指標・テーブル）場合に、その表の中だけで
// 相対的な良し悪しの色を付けるための簡易版。allValuesはその列に現在表示されている
// 全行の値。higherIsBetterで方向を指定する（K%・空振り率・chase%はfalse）。
function relativeTier(value, allValues, higherIsBetter){
  if(value == null) return null;
  const vals = allValues.filter(v => v != null);
  if(vals.length < 3) return null;
  const rank = vals.filter(v => higherIsBetter ? v > value : v < value).length + 1;
  return tierFromRank({ rank, total: vals.length });
}

async function loadAllLlmPlayerNames(){
  try{
    const idxRes = await fetchJsonZ(`${LEAGUE_PATHS[currentLeague].batches}/index.json`);
    if(!idxRes.ok){ llmDataLoaded = true; return; }
    const idx = await idxRes.json();
    const files = idx.files || [];
    for(const file of files){
      try{
        const res = await fetchJsonZ(`${LEAGUE_PATHS[currentLeague].batches}/${file}`);
        if(!res.ok) continue;
        const batch = await res.json();
        (batch.players || []).forEach(p => {
          if(p && p.name){
            playersWithLlmData.add(p.name);
            llmDataByName.set(p.name, p);
          }
        });
      }catch(e){ /* このバッチファイルだけスキップ */ }
    }
  }catch(e){ /* バッチ一覧が無い＝打者版のAI解釈はまだ未生成 */ }
  llmDataLoaded = true;
}

async function findLlmDataForPlayer(playerName){
  if(llmDataByName.has(playerName)) return llmDataByName.get(playerName);
  if(!llmDataLoaded) await loadAllLlmPlayerNames();
  return llmDataByName.get(playerName) || null;
}

async function getFarmIndex(league){
  const farmNumeric = LEAGUE_PATHS[league].farmNumeric;
  if(!farmNumeric) return null;
  try{
    const idxRes = await fetchJsonZ(`${farmNumeric}/index.json`);
    if(!idxRes.ok) return null;
    return await idxRes.json();
  }catch(e){ return null; }
}

async function fetchFarmData(league, playerName){
  const farmIdx = await getFarmIndex(league);
  if(!farmIdx || !farmIdx.players) return null;
  const hit = farmIdx.players.find(p => p.name === playerName);
  if(!hit) return null;
  try{
    const res = await fetchJsonZ(`${LEAGUE_PATHS[league].farmNumeric}/${hit.id}.json`);
    if(!res.ok) return null;
    return stripNonPitchTypes(await res.json());
  }catch(e){ return null; }
}

// ポジションの正規の並び順（フィルタのプルダウンをこの順で表示する）。
// 守備位置8つ（捕/一/二/三/遊/左/中/右）に加え、指名打者（指）も選手が実際に着く
// 「ポジション」の一種としてフィルタの選択肢に含める。「打」「打指」「走」「走一」等の
// 代打/代走を示す表記は守備位置でもポジションでもないため、これらは引き続き除外する。
const POSITION_ORDER = ["捕", "一", "二", "三", "遊", "左", "中", "右", "指"];

function populatePosSelect(players){
  // 値そのものにカッコが残っていても（古いキャッシュ済みJSON対策）表示・比較はカッコ無しで統一する。
  // 「中右」「左右」のような複数ポジション表記からも、含まれる守備位置の文字を1つずつ拾う
  // （「左」で絞り込んだ時に「左右」の選手も出てくるようにするため。フィルタ適用側は
  // 部分一致で判定する＝下のフィルタ処理を参照）。
  const found = new Set();
  players.forEach(p => {
    const raw = stripParens(p.pos) || "";
    for(const ch of raw){
      if(POSITION_ORDER.includes(ch)) found.add(ch);
    }
  });
  const poss = POSITION_ORDER.filter(p => found.has(p));
  posSelectEl.innerHTML = renderMultiSelectInner(poss.map(p => [p, p]), poss);
  wireOneMultiSelect(posSelectEl, renderPlayerList);
}
// 保存済みの選択（チーム/ポジションのフィルタ）を、populate直後（デフォルトは全選択）の
// チェック状態に反映し直す。savedValuesが空（＝保存時点で全選択だった）なら何もしない
// （populate直後の状態＝全選択のままでよいため）。
function restoreMselSelection(wrap, savedValues){
  if(!wrap || !savedValues || !savedValues.length) return;
  wrap.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.checked = savedValues.includes(cb.value);
  });
  const optionLabels = [...wrap.querySelectorAll(".msel-opt")].map(lab => [
    lab.querySelector("input").value, lab.querySelector(".msel-opt-label").textContent,
  ]);
  multiSelectSummaryUpdate(wrap, optionLabels);
}

// MLBのindex.jsonには、同一選手が大文字小文字違いの表記（例："Pete Crow-Armstrong"と
// "pete crow-armstrong"）で複数エントリとして混入していることがある（データソース側の
// 表記ゆれ）。表示上重複しないよう、名前を正規化（trim+小文字化）したキーで1人にまとめる。
// 重複がある場合は、打席数(pa)が多い方＝より完全なデータを優先し、同数なら小文字のみ
// （表記が崩れている側）より通常の大文字始まりの表記を優先する。
function dedupePlayersByName(players){
  const byKey = new Map();
  for(const p of players){
    const key = String(p.name || "").trim().toLowerCase();
    if(!key) continue;
    const existing = byKey.get(key);
    if(!existing){
      byKey.set(key, p);
      continue;
    }
    const pPa = p.pa || 0, ePa = existing.pa || 0;
    const pLooksProper = /[A-Z]/.test(p.name || "");
    const eLooksProper = /[A-Z]/.test(existing.name || "");
    if(pPa > ePa || (pPa === ePa && pLooksProper && !eLooksProper)){
      byKey.set(key, p);
    }
  }
  return [...byKey.values()];
}

// currentLeague・currentFarmLevelに応じたindex.jsonを取得してallPlayersに入れる

async function loadPlayerListForCurrentFarmLevel(){
  const isFarm = currentFarmLevel === "ni";
  if(isFarm && !LEAGUE_PATHS[currentLeague].farmNumeric){
    allPlayers = [];
    populateTeamSelect(allPlayers);
    populatePosSelect(allPlayers);
    playerListEl.innerHTML = '<div class="empty-list">このリーグは2軍データに対応していません。</div>';
    return;
  }
  try{
    // 1軍は全年度の和集合、2軍は現状(最新年度)のみ
    const players = isFarm
      ? (await (async () => {
          const res = await fetchJsonZ(`${LEAGUE_PATHS[currentLeague].farmNumeric}/index.json`);
          if(!res.ok) throw new Error(`index.json の取得に失敗しました (${res.status})`);
          const data = await res.json();
          return data.players || [];
        })())
      : await fetchUnionedPlayerIndex("batter", currentLeague);
    allPlayers = dedupePlayersByName(players);
    populateTeamSelect(allPlayers);
    populatePosSelect(allPlayers);
  }catch(e){
    allPlayers = [];
    playerListEl.innerHTML = `<div class="empty-list">選手一覧の読み込みに失敗しました。<br>${escapeHtml(e.message)}</div>`;
  }
}

function filteredSortedPlayers(){
  let list = allPlayers.slice();
  const q = searchInputEl.value.trim().toLowerCase();
  if(q) list = list.filter(p => (p.name || "").toLowerCase().includes(q));
  const teamSel = multiSelectValuesForFilter(teamSelectEl);
  if(teamSel.length) list = list.filter(p => teamSel.includes(p.team));
  // 「左」で絞り込んだ時に「左右」のような複数ポジション表記の選手も対象に含める（部分一致）。
  // MLBはDH専念選手等、守備位置が判定できずpos===nullの選手がいる（populatePosSelect側では
  // 既に`stripParens(p.pos) || ""`でガード済みだったが、ここは抜けていた）。ガード無しだと
  // stripParens(null)がnullをそのまま返し、null.includes(...)で例外が飛んで
  // filteredSortedPlayers()全体が失敗し、フィルターが一切効かなくなっていた（絞り込み前の
  // リストのまま表示され続ける）。
  const posSel = multiSelectValuesForFilter(posSelectEl);
  if(posSel.length) list = list.filter(p => posSel.some(v => (stripParens(p.pos) || "").includes(v)));
  const minPa = Number(minPaFilterEl.value || 0);
  if(minPa > 0) list = list.filter(p => (p.pa || 0) >= minPa);
  if(aiOnlyFilterEl.checked) list = list.filter(p => playersWithLlmData.has(p.name));

  list.sort((a, b) => {
    if(sortField === "name"){
      return sortDir === "asc" ? String(a.name).localeCompare(b.name, "ja") : String(b.name).localeCompare(a.name, "ja");
    }
    const av = a[sortField], bv = b[sortField];
    const an = (av === null || av === undefined) ? -Infinity : av;
    const bn = (bv === null || bv === undefined) ? -Infinity : bv;
    return sortDir === "asc" ? an - bn : bn - an;
  });
  return list;
}

async function selectPlayer(id, name){
  activePlayerId = id;
  updateSidebarSummary(name, "読み込み中…");
  bodyLayoutEl.classList.add("has-selection");
  collapseSidebarOnMobile();
  renderPlayerList();
  mainContentEl.innerHTML = '<div class="placeholder">読み込み中…</div>';
  try{
    // 一覧は currentFarmLevel（1軍/2軍）ごとに完全に差し替わっているので、
    // idは常にその時点のレベルのindex.jsonから来たもの。そのレベルの数値JSONを読む。
    const isFarmList = currentFarmLevel === "ni";
    let card;
    if(isFarmList){
      // 2軍は現状年度のみ（複数年対応は1軍のみ）
      const basePath = LEAGUE_PATHS[currentLeague].farmNumeric;
      const res = await fetchJsonZ(`${basePath}/${id}.json`);
      if(!res.ok) throw new Error(`選手データの取得に失敗しました (${res.status})`);
      card = stripNonPitchTypes(await res.json());
    }else{
      // 選手一覧（全年度和集合）からこの選手が登場する年度を調べ、各年度のフォルダから
      // 個別に取得して card.seasons へ合成する（年度ごとにファイルが分かれているため）。
      const listEntry = allPlayers.find(p => p.id === id);
      const years = (listEntry && listEntry._years && listEntry._years.length) ? listEntry._years : [YEAR];
      const fetchedByYear = {};
      await Promise.all(years.map(async y => {
        const paths = PATHS_BY_YEAR[y] && PATHS_BY_YEAR[y].batter && PATHS_BY_YEAR[y].batter[currentLeague];
        if(!paths) return;
        try{
          const r = await fetchJsonZ(`${paths.numeric}/${id}.json`);
          if(r.ok) fetchedByYear[y] = stripNonPitchTypes(await r.json());
        }catch(e){ /* この年度はスキップ */ }
      }));
      const base = fetchedByYear[years[0]]; // 最新年度をプロフィール等のベースにする
      if(!base) throw new Error(`選手データの取得に失敗しました`);
      const combinedSeasons = {};
      years.forEach(y => {
        if(fetchedByYear[y]) Object.assign(combinedSeasons, getSeasonsMap(fetchedByYear[y]));
      });
      card = { ...base, seasons: combinedSeasons };
    }
    card._isFarm = isFarmList;

    // 選手詳細内の「1軍/2軍」切り替えボタン用に、もう一方のレベルのデータも裏で探しておく
    // （見つかった場合だけボタンを出す。見つからなければその選手はそのレベルにしか居ない）
    const otherBasePath = isFarmList ? LEAGUE_PATHS[currentLeague].numeric : LEAGUE_PATHS[currentLeague].farmNumeric;
    if(otherBasePath){
      const otherCard = isFarmList
        ? await (async () => { // 2軍表示中 → 1軍側にも居るか名前で探す
            const idxRes = await fetchJsonZ(`${otherBasePath}/index.json`).catch(() => null);
            if(!idxRes || !idxRes.ok) return null;
            const idx = await idxRes.json();
            const hit = (idx.players || []).find(p => p.name === card.name);
            if(!hit) return null;
            const r = await fetchJsonZ(`${otherBasePath}/${hit.id}.json`).catch(() => null);
            return (r && r.ok) ? stripNonPitchTypes(await r.json()) : null;
          })()
        : await fetchFarmData(currentLeague, card.name);
      if(otherCard){
        card._farmData = otherCard;
        otherCard._farmData = card;
        otherCard._isFarm = !isFarmList;
      }
    }

    const llm = await findLlmDataForPlayer(card.name);
    activeCardData = card;
    currentSeasonYear = null;  // 選手が変わったら最新シーズンをデフォルト表示にリセット
    selectedYears = [];
    currentRankPool = "all30";  // 選手が変わったら順位基準も既定値にリセット
    updateSidebarSummary(card.name, card.team || "");
    renderPlayerCard(card, llm);
  }catch(e){
    mainContentEl.classList.remove("placeholder");
    mainContentEl.innerHTML = `<div class="error">選手データの読み込みに失敗しました。<br>${escapeHtml(e.message)}</div>`;
  }
}

function statBox(label, value, rk){
  const tier = tierFromRank(rk);
  const tierClass = tier ? ` t-${tier}` : "";
  const rankHtml = rankText(rk);
  return `<div class="stat-box${tierClass}"><div class="label">${escapeHtml(label)}</div><div class="value">${value}</div>
    ${rankHtml ? `<div class="rank">${escapeHtml(rankHtml)}</div>` : ""}</div>`;
}

// v1（旧・単一シーズン）形式のnumeric jsonしか無い場合に、seasonsが無くても
// 同じ形（{team,pos,overall,splits,rankings,byPitchType,game_log,defense}）で
// 1シーズンぶん組み立てる後方互換ヘルパー。
function _v1StatToObj(s){
  if(!s) return {};
  return {
    games: s.試合数, pa: s.打席, ab: s.打数, h: s.安打, hr: s.本塁打,
    bb: s.四死球, k: s.三振, rbi: s.打点, sb: s.盗塁,
    avg: s.打率, obp: s.出塁率, slg: s.長打率, ops: s.OPS,
    k_pct: s["K%"], bb_pct: s["BB%"],
    chase_pct: s["O-Swing%"], contact_pct: s["Z-Swing%"], whiff_pct: s["whiff%"],
  };
}
function getSeasonsMap(card){
  if(card.seasons && typeof card.seasons === "object" && Object.keys(card.seasons).length){
    return card.seasons;
  }
  const y = card.latestYear || "-";
  return { [y]: {
    team: card.team, pos: card.pos,
    overall: {
      games: card.games, pa: card.pa, ab: card.ab, h: card.h, hr: card.hr, bb: card.bb,
      k: card.k, rbi: card.rbi, sb: card.sb, avg: card.avg, obp: card.obp, slg: card.slg, ops: card.ops,
      k_pct: card.k_pct_season, bb_pct: card.bb_pct_season, chase_pct: card.chase_pct_season,
      contact_pct: card.contact_pct_season, whiff_pct: card.whiff_pct_season,
    },
    splits: {
      vsR: _v1StatToObj(card.splits?.vsR), vsL: _v1StatToObj(card.splits?.vsL),
    },
    rankings: card.rankings || {},
    byPitchType: card.byPitchType || { all: [], vsR: [], vsL: [] },
    game_log: card.game_log || [],
    defense: card.defense || {},
  }};
}

function renderSplitTable(seasonObj){
  const rowsDef = [
    ["全体", seasonObj.overall || {}],
    ["対右投手", seasonObj.splits?.vsR || {}],
    ["対左投手", seasonObj.splits?.vsL || {}],
  ];
  return `<div class="table-scroll"><table class="split-table">
    <thead><tr><th>対戦</th><th>打席</th><th>打率</th><th>出塁率</th><th>長打率</th><th>OPS</th><th>本塁打</th><th>K%</th><th>BB%</th></tr></thead>
    <tbody>
      ${rowsDef.map(([label, s]) => `<tr>
        <td>${escapeHtml(label)}</td><td>${s.pa ?? "-"}</td><td>${fmtAvg(s.avg)}</td><td>${fmtAvg(s.obp)}</td>
        <td>${fmtAvg(s.slg)}</td><td>${fmt(s.ops, 3)}</td><td>${s.hr ?? "-"}</td>
        <td>${fmt(s.k_pct, 1, "%")}</td><td>${fmt(s.bb_pct, 1, "%")}</td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}

// 球種別テーブル：行クリックでその球種の球速帯別内訳を展開する
// ランキング付きの値を <span class="rk t-XX"> で包んで返す（テーブルセル用）
function rankedCell(text, rk){
  const tier = tierFromRank(rk);
  const tierClass = tier ? ` t-${tier}` : "";
  const title = rankText(rk);
  return `<span class="rk${tierClass}"${title ? ` title="${escapeHtml(title)}"` : ""}>${text}</span>`;
}

// rankedCellの<td>版：背景色（TIER_COLOR）も一緒に敷く。順位（n位/m人中）はホバー時だけ
// でなく、pitcher-cards.htmlの球種別テーブルと同じように値の下に常時表示する。
// tierOverrideを渡すと（rank情報が無い簡易カラースケール用）背景だけ付けられる。
function rankedTd(text, rk, tierOverride){
  const tier = tierOverride !== undefined ? tierOverride : tierFromRank(rk);
  const bg = tierBg(tier);
  const tierClass = tier ? ` t-${tier}` : "";
  const rt = rk ? rankText(rk) : "";
  let inner;
  if(rt){
    inner = `<div class="rk-val${tierClass}">${text}</div><div class="rk-sub${tierClass}">${escapeHtml(rt)}</div>`;
  }else if(tierOverride !== undefined){
    inner = `<span class="rk${tierClass}">${text}</span>`;
  }else{
    inner = text;
  }
  return `<td${bg ? ` style="background:${bg}"` : ""}>${inner}</td>`;
}

// ── コース別成績グリッド ──
// 投手側のヒートマップ（頻度の可視化）とは違い、こちらはセルごとの打撃成績
// （打率・空振り率等、指標をボタンで切り替え）を色の濃淡で表示する。
// 指標一覧：打率/本塁打/OPS/出塁率/長打率/スイング率/コンタクト率/空振り率（/すべて）/
// 空振り率（/スイング）/GB%。スイング率・コンタクト率・空振り率（/すべて）・GB%は、
// courseSplitsにゾーン内空振り数・打球種別（GB/LD/FB）が追加されたことで算出できる
// ようになった指標（_agg_pitch_group側で計算済み）。
const CZ_METRICS = [
  ["ops", "OPS"], ["slg", "長打率"], ["avg", "打率"],
  ["swing_pct", "スイング率"], ["swing_contact_pct", "コンタクト率"],
  ["whiff_pct_all", "空振り率（/すべて）"], ["whiff_pct", "空振り率（/スイング）"],
  ["gb_pct", "GB%"], ["hr_pct", "HR%"],
  // MLB独自（NPBでは値を算出できないため、currentLeague==="npb"の時はczMetricsFor()で除外する）
  ["hard_hit_pct", "Hard-Hit%"], ["xwoba", "xwOBA"], ["pull_pct", "Pull%"],
];
// MLB独自の打球質指標（NPBには元データが無く常に値が出せないため、NPB表示時は
// これらの指標そのものをボタン・列から取り除く。単に値が「-」になるだけだと選手を
// 切り替えるたびに無意味な列が残り続けて見づらいため）。
const MLB_ONLY_METRIC_KEYS = new Set(["hard_hit_pct", "avg_ev", "sweet_spot_pct", "xwoba", "pull_pct", "war", "oaa", "frp", "sb_pct", "sprint_speed"]);
function czMetricsFor(){
  return currentLeague === "npb" ? CZ_METRICS.filter(([k]) => !MLB_ONLY_METRIC_KEYS.has(k)) : CZ_METRICS;
}
const CZ_METRIC_FMT = { avg: "avg", hr: "int", obp: "avg", slg: "avg", ops: "ops",
  swing_pct: "pct", swing_contact_pct: "pct", whiff_pct_all: "pct", whiff_pct: "pct", gb_pct: "pct",
  hr_pct: "pct", hard_hit_pct: "pct", xwoba: "avg", pull_pct: "pct" };
// 値が低いほど（打者にとって）良い＝色を濃くしたい指標（今までは高いほど濃かった指標を反転）。
const CZ_LOWER_IS_BETTER = new Set(["whiff_pct_all", "whiff_pct", "gb_pct"]);

// OPSを除く各指標の分子/分母（要望：「8球」のような分母だけでなく「4球/8球」のように
// 分子も併記する）。値はcourseZoneCellTextに渡されるcell（サーバー側byCourseZone、または
// クライアント側aggCourseCellStats/czBuildFilteredZoneListのいずれか）から直接引く。
// unitは分子・分母どちらにも付ける単位表記。
const CZ_FRACTION_DEF = {
  avg:  { num: (c) => c.h, den: (c) => c.ab, unit: "打数" },
  slg:  { num: (c) => c.tb, den: (c) => c.ab, unit: "打数" },
  swing_pct: { num: (c) => c.sw, den: (c) => c.n ?? c.count, unit: "球" },
  swing_contact_pct: { num: (c) => (c.sw ?? 0) - (c.ws ?? 0), den: (c) => c.sw, unit: "球" },
  whiff_pct_all: { num: (c) => c.ws, den: (c) => c.n ?? c.count, unit: "球" },
  whiff_pct: { num: (c) => c.ws, den: (c) => c.sw, unit: "球" },
  gb_pct: { num: (c) => c.gb, den: (c) => (c.gb ?? 0) + (c.ld ?? 0) + (c.fb ?? 0), unit: "打球" },
  hr_pct: { num: (c) => c.hr, den: (c) => c.pa, unit: "打席" },
};
// 長打率は分子（塁打数）を併記せず、打率と同じ分母（打数）だけを表示する
// （要望：塁打数は打率の「安打」ほど直感的でなく、打率側と表記を揃えたほうが分かりやすいため）。
const CZ_DENOM_ONLY_METRICS = new Set(["slg"]);

function courseZoneCellText(cell, metric){
  const fracDef = CZ_FRACTION_DEF[metric];
  // OPSだけは単純な分子/分母を持たない（出塁率+長打率の合計）ため、従来どおり
  // 打席数のみをサブテキストに表示する。
  // 分子/分母を併記する指標は「10打数/22打数」のように単位を2回書くと折り返されて
  // 見づらいため、単位は分母側だけに付ける（「10/22打数」）。
  let denomLabel;
  if(fracDef){
    const den = cell ? (fracDef.den(cell) ?? 0) : 0;
    denomLabel = CZ_DENOM_ONLY_METRICS.has(metric)
      ? `${den}${fracDef.unit}`
      : `${cell ? (fracDef.num(cell) ?? 0) : 0}/${den}${fracDef.unit}`;
  }else{
    denomLabel = `${cell ? (cell.pa ?? 0) : 0}打席`;
  }
  if(!cell || cell[metric] == null) return { text: "-", sub: denomLabel };
  const kind = CZ_METRIC_FMT[metric] || "pct";
  const text = kind === "avg" ? fmtAvg(cell[metric]) : kind === "ops" ? fmt(cell[metric], 3)
    : kind === "int" ? String(cell[metric]) : fmt(cell[metric], 1, "%");
  return { text, sub: denomLabel };
}

// inZone=true（ストライクゾーン内）は青系、false（ボールゾーン）はpitcher-cards.htmlの
// ヒートマップと同じスレートグレー系（rgba(100,116,139,…)）で塗り分ける。
function courseZoneColor(cell, metric, allCells, inZone){
  const emptyBg = inZone ? "rgba(59,130,246,0.03)" : "rgba(255,255,255,0.01)";
  if(!cell || cell[metric] == null) return emptyBg;
  const vals = allCells.filter(c => c && c[metric] != null).map(c => c[metric]);
  if(vals.length === 0) return emptyBg;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  let t = hi > lo ? (cell[metric] - lo) / (hi - lo) : 0.5;
  // 空振り率（/すべて・/スイング）・GB%は値が低いほど打者にとって良いので、濃淡を反転する
  // （低いほど濃い色になる）。
  if(CZ_LOWER_IS_BETTER.has(metric)) t = 1 - t;
  const alpha = (0.08 + t * 0.7).toFixed(2);
  const hue = inZone ? "59,130,246" : "100,116,139";
  return `rgba(${hue},${alpha})`;
}

// zoneRowは値が大きいほど「高め」（run.py/run_mlb.pyのcy正規化: +1=高め）。
// 表の上段に高め、下段に低めを描画するため、visRowは4→0の降順で走査する。
// zoneColは値が大きいほど「+側=外角」（courseSplits構築時に打者自身の利き手でXOR反転済み。
// run.py/run_mlb.pyのflip_xロジック）。表の右列が外角・左列が内角になるよう、
// colRangeは常に昇順（左→右）で描画する。「内角/外角」の文字表記の代わりに、グリッドの
// 左（内角側）に打者シルエットを添えて、どちら向きかを視覚的に示す。
// splitMode "9" = ストライクゾーンのみ(3×3・行列1〜3)、"25" = ボールゾーン込みの全体(5×5)。
const CZ_BATTER_SVG = `<svg class="cz-batter-svg" viewBox="0 0 30 60" width="24" height="48" aria-hidden="true">
  <circle cx="14" cy="8" r="6" fill="rgba(148,163,184,0.55)"/>
  <path d="M8 16 L20 16 L18 38 L14 38 L13 26 L12 38 L8 38 Z" fill="rgba(148,163,184,0.55)"/>
  <line x1="14" y1="38" x2="10" y2="58" stroke="rgba(148,163,184,0.55)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14" y1="38" x2="19" y2="58" stroke="rgba(148,163,184,0.55)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="18" y1="18" x2="29" y2="6" stroke="rgba(148,163,184,0.45)" stroke-width="2.5" stroke-linecap="round"/>
</svg>`;

// isLeft: この選手が左打者かどうか（seasonObj.bats === "L"、フォールバックでcard.bats）。投手視点で見て打者が立つ側を
// 反転させる（CSS側のcz-flipクラスでイラストの表示位置・シルエット自体を鏡像にする）。
// あわせて列の描画順も反転させる：イラストはCSSのrow-reverseでテーブルの右側に回り込む
// だけで、テーブル内部のセル順はDOM順のまま変わらないため、列順もJS側で反転しないと
// 「内角側（col=0）がイラストの近くに来る」という対応関係が崩れてしまう。
function renderCourseGrid(list, metric, splitMode, isLeft){
  const byKey = {};
  (list || []).forEach(c => { byKey[`${c.zoneRow}_${c.zoneCol}`] = c; });
  const rowRange = splitMode === "9" ? [3, 2, 1] : [4, 3, 2, 1, 0];
  let colRange = splitMode === "9" ? [1, 2, 3] : [0, 1, 2, 3, 4];
  if(isLeft) colRange = [...colRange].reverse();
  const allCells = rowRange.flatMap(r => colRange.map(c => byKey[`${r}_${c}`])).filter(Boolean);
  let html = `<div class="cz-figure-row${isLeft ? " cz-flip" : ""}">${CZ_BATTER_SVG}<table class="cz-grid-table"><tbody>`;
  for(const visRow of rowRange){
    html += "<tr>";
    for(const col of colRange){
      const cell = byKey[`${visRow}_${col}`];
      const inZoneCell = (col >= 1 && col <= 3 && visRow >= 1 && visRow <= 3);
      const { text, sub } = courseZoneCellText(cell, metric);
      const bg = courseZoneColor(cell, metric, allCells, inZoneCell);
      html += `<td class="cz-cell${inZoneCell ? " cz-in-zone" : ""}" style="background:${bg}">
        <div class="cz-val">${text}</div><div class="cz-sub">${sub}</div>
      </td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

// ── 対戦投手別成績 ──
// 対象データを見て10打席では該当投手が少なすぎたため8打席に緩和（要望）。
const VS_PITCHER_MIN_PA = 8;  // これ未満はサンプル過小として集計対象から除外する

// 打席・打率・本塁打・打点・OPS・出塁率・長打率・K%・BB%・Z-Swing%・Z-Contact%・Whiff%・
// Chase%・GB%・HR%を1つの表にまとめて表示する（得意/苦手の区分・上位5人への絞り込みは
// 廃止し、対象投手を全員ソート可能な1表で見せる要望）。KEYED_STAT_METRICS_FULLは
// avg/hr/rbi/ops/obp/slg/k_pct/bb_pct/z_swing_pct/z_contact_pct/whiff_pct/chase_pct/
// gb_pct/hr_pctの後にMLB独自指標を続けた構成なので、そのMLB独自部分だけ除いてそのまま
// 使う（renderKeyedStatTableの表示・ソートロジックをそのまま流用できる）。
// KEYED_STAT_METRICS_FULLはこのファイルの後方で定義されるため、関数化して呼び出し時に
// 評価する（czMetricsFor()/keyedStatMetricsFor()と同じパターン）。
// 対戦投手別成績用。MLB独自の打球質指標に加え、NPBでは打点（rbi）も除外する
// （NPBのvsPitcher元データには打点情報が無く常に「-」になるため。MLBはStatcast由来の
// bat_score差分から算出できるため表示したままにする）。
// 対戦投手別成績用の指標一覧。
// - MLB独自の打球質指標（Hard-Hit%等）は、NPBでは元データが無く常に「-」になるため除外し、
//   MLBでは表示する（以前はリーグに関わらず常に除外していたが、MLBでも見たいとの要望）。
// - 打点（rbi）は、NPBのvsPitcher元データには無く常に「-」になるためNPBでは除外し、
//   MLBはStatcast由来のbat_score差分から算出できるため表示する。
function vpMetricsFor(){
  const exclude = currentLeague === "npb" ? (k) => MLB_ONLY_METRIC_KEYS.has(k) || k === "rbi" : (k) => false;
  return KEYED_STAT_METRICS_FULL.filter(([k]) => !exclude(k));
}

// 通算表示用：seasonsMapの全年度ぶんのvsPitcher（シーズン単位で_agg_pitch_group()により
// 集計済み＝pa/ab/h/hr/rbiと各種割合指標を持つ）を投手名ごとにさらに合算する。
// aggregatePitchEntries()（打席数で加重平均する既存ヘルパー、コース別成績の球種フィルターと
// 同じ考え方）にそのまま渡せる形になっている。
function vsPitcherMerged(seasonsMap, years){
  const acc = {};
  years.forEach(y => {
    ((seasonsMap[y] || {}).vsPitcher || []).forEach(e => {
      (acc[e.pitcher] || (acc[e.pitcher] = [])).push(e);
    });
  });
  return Object.entries(acc).map(([pitcher, entries]) => ({ pitcher, ...aggregatePitchEntries(entries) }));
}

function renderVsPitcherSection(years, currentYear){
  return `
    <div class="fctrl-block">
      <div class="fctrl-row">
        <span class="fctrl-label">集計</span>
        <div class="pill-group vp-scope-group">
          <button type="button" class="pill-btn active" data-scope="career">通算</button>
          <button type="button" class="pill-btn" data-scope="season">年度別</button>
        </div>
      </div>

    <div class="vp-note">${VS_PITCHER_MIN_PA}打席以上対戦した投手のみが対象です。サンプルが少ない投手は参考値程度に見てください。投手名をタップすると、その投手のページへ移動できます。</div>
    <div data-vp-table></div>
  `;
}

function wireVsPitcherSection(scope, seasonsMap, years, currentYear){
  const scopeGroup = scope.querySelector(".vp-scope-group");
  const table = scope.querySelector("[data-vp-table]");
  if(!scopeGroup || !table) return;
  function currentScope(){ return (scopeGroup.querySelector(".pill-btn.active") || {}).dataset?.scope || "career"; }
  // デフォルトはOPS降順（要望）。集計切り替え・年度切り替え時もこのデフォルトに戻す。
  const DEFAULT_SORT = { key: "ops", dir: "desc" };
  let sortState = { ...DEFAULT_SORT };
  let pitcherLookup = null;   // Map | null（取得できるまで／取得失敗時はリンク無し）
  const VP_INITIAL_ROWS = 10;  // 初期表示は上位10人まで（「残りを表示」で全件）
  let expanded = false;
  function redraw(){
    const isCareer = currentScope() === "career";
    // 年度別＝持っている全年度を「投手×年度」の行で並べて比較する（年度列付き）
    const raw = isCareer ? vsPitcherMerged(seasonsMap, years)
      : years.flatMap(y => ((seasonsMap[y] || {}).vsPitcher || []).map(e => ({ ...e, _year: y })));
    const qualified = raw.filter(e => (e.pa || 0) >= VS_PITCHER_MIN_PA);
    // 投手一覧に実在する投手だけ、名前を投手ページへのリンクにする（一覧を読み込むまでは通常の文字）
    const linkCell = (s) => {
      const hit = pitcherLookup && pitcherLookup.get(nameKey(s.pitcher));
      if(!hit) return escapeHtml(s.pitcher ?? "-");
      return `<a class="xlink" href="#pitcher/${currentLeague}/${encodeURIComponent(hit.id)}${hit.farm ? "/farm" : ""}" data-pitcher-id="${escapeHtml(hit.id)}" data-pitcher-name="${escapeHtml(hit.name)}" data-pitcher-farm="${hit.farm ? 1 : 0}">${escapeHtml(s.pitcher)}</a>`;
    };
    table.innerHTML = renderKeyedStatTable(qualified, "投手", "pitcher", vpMetricsFor(),

// ── コース別成績グリッドの球種フィルター用：生データ(courseZoneByPitchRaw)から
// リアルタイムで(row,col)ごとに合算して%を算出する。_agg_pitch_group()/
// _agg_batted_quality_extra()（export_llm_input_batter.py）と同じ計算式のJS版。
// フィルター無し（球種カテゴリ・球種詳細・球速帯すべて選択＝絞り込み無し）の時は
// こちらを使わず、従来どおりサーバー側で事前集計済みのbyCourseZoneを使う（軽量・高速）。
function aggCourseCellStats(entries){
  const sum = (k) => entries.reduce((a, e) => a + (e[k] || 0), 0);
  const n = sum("n"), pa = sum("pa"), ab = sum("ab"), h = sum("h_");
  const d2 = sum("2b"), d3 = sum("3b"), hr = sum("hr"), bb = sum("bb"), hbp = sum("hbp");
  const sw = sum("sw"), ws = sum("ws");
  const gb = sum("gb"), ld = sum("ld"), fb = sum("fb");
  const evn = sum("evn"), hh = sum("hh");
  const xwn = sum("xwn"), xwsum = sum("xwsum");
  const pu = sum("pu"), spn = sum("spn");
  const singles = Math.max(h - d2 - d3 - hr, 0);
  const tb = singles + d2 * 2 + d3 * 3 + hr * 4;
  const obpDen = ab + bb + hbp;
  const bipKnown = gb + ld + fb;
  const avg = ab > 0 ? h / ab : null;
  const slg = ab > 0 ? tb / ab : null;
  const obp = obpDen > 0 ? (h + bb + hbp) / obpDen : null;
  const r1 = (v) => v == null ? null : Math.round(v * 10) / 10;
  const r3 = (v) => v == null ? null : Math.round(v * 1000) / 1000;
  return {
    pa, n, hr, ab, h, tb,
    sw, ws, gb, ld, fb,
    avg: r3(avg), slg: r3(slg), obp: r3(obp),
    ops: (avg != null && slg != null && obp != null) ? r3(slg + obp) : null,
    swing_pct: n > 0 ? r1(sw / n * 100) : null,
    whiff_pct_all: n > 0 ? r1(ws / n * 100) : null,
    swing_contact_pct: sw > 0 ? r1((sw - ws) / sw * 100) : null,
    whiff_pct: sw > 0 ? r1(ws / sw * 100) : null,
    gb_pct: bipKnown > 0 ? r1(gb / bipKnown * 100) : null,
    hr_pct: pa > 0 ? r1(hr / pa * 100) : null,
    hard_hit_pct: evn > 0 ? r1(hh / evn * 100) : null,
    xwoba: xwn > 0 ? r3(xwsum / xwn) : null,
    pull_pct: spn > 0 ? r1(pu / spn * 100) : null,
  };
}
// raw: season.courseZoneByPitchRaw（全ゾーン×全球種×全球速帯×両サイドの生カウント一覧）。
// hand: "vsR"|"vsL"。midSel/detailSel/bandSel: multiSelectValuesForFilter()と同じ規約
// （空配列=絞り込み無し）。戻り値はbyCourseZoneの各セルと同じ形（zoneRow/zoneCol付き）。
function czBuildFilteredZoneList(raw, hand, midSel, detailSel, bandSel){
  const wantHand = hand === "vsR" ? "R" : "L";
  const filtered = raw.filter(e => e.h === wantHand
    && (midSel.length === 0 || midSel.includes(e.pitchCategoryMid))
    && (detailSel.length === 0 || detailSel.includes(e.pitchType))
    && (bandSel.length === 0 || bandSel.includes(e.band)));
  const byCell = {};
  filtered.forEach(e => {
    const key = `${e.zoneRow}_${e.zoneCol}`;
    (byCell[key] || (byCell[key] = [])).push(e);
  });
  return Object.keys(byCell).map(key => {
    const [row, col] = key.split("_").map(Number);
    return { ...aggCourseCellStats(byCell[key]), zoneRow: row, zoneCol: col };
  });
}

// ── 状況別（ランナー状況別／カウント別）テーブルの共通レンダラー ──
// bySituation・byCountはどちらも「状況キー＋pa/avg/hr/rbi/obp/slg/ops/k_pct/bb_pct/
// whiff_pct/chase_pct/contact_pct」という同じ形なので、ここで共通化する。
// 順位データ（母集団全体との比較）が無いテーブルなので、良し悪しの色（赤/緑）ではなく、
// 指標（列）ごとに青系・緑系を交互に割り当て、表内の相対的な大小を濃淡で表す
// （コース別成績の単色グラデーションと同じ考え方。列が変わるたびに色相が変わるので、
// 隣り合う指標を見分けやすい）。
// [フィールド名, （未使用・過去のgood/bad方向の名残）, 見出しラベル, 表示形式]
// Z-Contact%・GB%は現状のpitchSplits/courseSplits元データ（ゾーン内空振り数の分離や
// 打球種別が無い）では算出できないため、値が無ければ自動的に「-」表示になる
// （バックエンド側にデータが追加され次第、追加コード無しでここに反映される）。
const KEYED_STAT_METRICS_FULL = [
  ["avg", true, "打率", "avg"], ["hr", true, "本塁打", "int"], ["rbi", true, "打点", "int"],
  ["ops", true, "OPS", "ops"], ["obp", true, "出塁率", "avg"], ["slg", true, "長打率", "avg"],
  ["k_pct", false, "K%", "pct"], ["bb_pct", true, "BB%", "pct"],
  ["z_swing_pct", true, "Z-Swing%", "pct"], ["z_contact_pct", true, "Z-Contact%", "pct"],
  ["whiff_pct", false, "Whiff%", "pct"], ["chase_pct", false, "Chase%", "pct"], ["gb_pct", false, "GB%", "pct"],
  ["hr_pct", true, "HR%", "pct"],
  // MLB独自の打球質指標。NPBデータでは値が常にnull（自動的に「-」表示、magnitudeBgも
  // vals.length<2で塗り無しになるので害はない）。
  ["hard_hit_pct", true, "Hard-Hit%", "pct"], ["avg_ev", true, "平均EV(km/h)", "num1"],
  ["sweet_spot_pct", true, "Sweet Spot%", "pct"], ["xwoba", true, "xwOBA", "avg"],
  ["pull_pct", true, "Pull%", "pct"],
];
// カウント別成績・ランナー状況別成績用。NPBのcountSplits/situationSplits元データには
// 打点（rbi）情報が無く常に「-」になってしまうため、NPBでは打点列も除外する
// （MLB側はpitchSplits単位でも打点を算出できるため表示したままにする）。
// excludeKBB=true: K%/BB%を除外する（カウント別成績専用。カウントごとのK%/BB%は
// 「そのカウントに達した打席のうち、最終的にK/BBで終わった割合」であり、例えば
// 0-0（初球）ではカウントの定義上どちらも必ず0%になるはずで意味が薄いため、
// カウント別成績の表からは削除する。ランナー状況別成績・対戦投手別成績では
// 引き続き表示する）。
function keyedStatMetricsFor(excludeKBB){
  let metrics = currentLeague !== "npb" ? KEYED_STAT_METRICS_FULL
    : KEYED_STAT_METRICS_FULL.filter(([k]) => !MLB_ONLY_METRIC_KEYS.has(k) && k !== "rbi");
  // カウント別成績では出塁率(obp)も除外する。カウントは「打席を終えた球を受けたときのカウント」
  // なので、0-0〜2-1のように四球・三振が構造上起きないカウントでは出塁率＝(安打+死球)/(打数+死球)、
  // つまり打率とほぼ同じ値になり、独立した情報にならないため（エラー出塁は出塁率上はアウト扱い）。
  if(excludeKBB) metrics = metrics.filter(([k]) => k !== "k_pct" && k !== "bb_pct" && k !== "obp");
  return metrics;
}
// contact_pct（実体はZ-Swing%として計算済み）等、旧フィールド名で来るデータを新フィールド名に
// 正規化する。z_contact_pct/gb_pctは元データに無ければnullのまま（表示は自動的に「-」）。
function normStat(s){
  if(!s) return s;
  return { ...s,
    z_swing_pct: s.z_swing_pct ?? s.contact_pct ?? null,
    z_contact_pct: s.z_contact_pct ?? null,
    gb_pct: s.gb_pct ?? null,
  };
}
// ── 汎用：クリックで昇順・降順ソートできるテーブルヘッダー ──
// 「すべての表で昇順・降順に並び替えたい」という要望に対応する共通ヘルパー群。
// state: {key, dir("desc"|"asc")} | null。ヘッダーをクリックするたびに
// 降順→昇順→元の順（null・並び替え解除）の順で循環する。
function cycleSortState(state, key){
  if(!state || state.key !== key) return { key, dir: "desc" };
  if(state.dir === "desc") return { key, dir: "asc" };
  return null;
}
// list: 元配列（非破壊）。getVal(item)は比較に使う値（数値 or 文字列 or null）を返す。
// null（打席不足等でデータが無いセル）は常に末尾に回す。同値の場合は元の順序を保つ（安定ソート）。
function applySortState(list, state, getVal){
  if(!state) return list;
  const withIdx = list.map((item, i) => ({ item, i, v: getVal(item) }));
  withIdx.sort((a, b) => {
    if(a.v == null && b.v == null) return a.i - b.i;
    if(a.v == null) return 1;
    if(b.v == null) return -1;
    const c = (typeof a.v === "string" || typeof b.v === "string")
      ? String(a.v).localeCompare(String(b.v), "ja") : (a.v - b.v);
    return c !== 0 ? (state.dir === "asc" ? c : -c) : a.i - b.i;
  });
  return withIdx.map(x => x.item);
}
// ソート可能な<th>を生成する。現在ソート中の列にだけ▲（昇順）/▼（降順）を表示する。
// extraClassはsort-thに追加するクラス（kst-key-cell等）。呼び出し側でclass="..."を
// extraAttrsに直接書くと、HTMLは同じ要素に複数のclass属性が来た場合は最初の1つしか
// 有効にならない（2つ目以降は無視される）ため、固定列用のクラスが黙って効かなくなる
// 不具合の元だった。クラスは必ずこの引数経由で渡し、extraAttrsにはstyle等クラス以外の
// 属性だけを渡すこと。
function sortTh(label, key, state, extraAttrs, extraClass){
  const active = state && state.key === key;
  const arrow = active ? (state.dir === "asc" ? "▲" : "▼") : "";
  const cls = extraClass ? `sort-th ${extraClass}` : "sort-th";
  return `<th class="${escapeHtml(cls)}" data-sort-key="${escapeHtml(key)}"${extraAttrs || ""}>${escapeHtml(label)}${arrow ? ` <span class="sort-arrow">${arrow}</span>` : ""}</th>`;
}
// テーブルを内包するcontainer要素に、ヘッダークリックでのソートを1回だけ仕込む
// （container.innerHTMLを再描画で差し替えてもイベント委譲は効き続ける）。
// onSortKey(key)側でstateを更新し、テーブルを再描画すること。
function wireSortHeaders(container, onSortKey){
  container.addEventListener("click", (e) => {
    const th = e.target.closest("th[data-sort-key]");
    if(!th) return;
    onSortKey(th.dataset.sortKey);
  });
}

const KEYED_HUES = ["59,130,246"];  // 青(--blue)のみ。全指標を同じ色系統の濃淡で統一する
function fmtKeyedVal(v, kind){
  if(kind === "avg") return fmtAvg(v);
  if(kind === "ops") return fmt(v, 3);
  if(kind === "int") return v ?? "-";
  if(kind === "num1") return fmt(v, 1);
  return fmt(v, 1, "%");
}
// コース別成績のcourseZoneColor()と同じ考え方：列内の最小〜最大でmin-max正規化した濃淡。
// higherIsBetter=falseの指標（K%・Whiff%・Chase%・GB%等）は値が低いほど色を濃くする。
function magnitudeBg(value, allValues, hueRgb, higherIsBetter){
  if(value == null) return "";
  const vals = allValues.filter(v => v != null);
  if(vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals);
  let t = hi > lo ? (value - lo) / (hi - lo) : 0.5;
  if(higherIsBetter === false) t = 1 - t;
  const alpha = (0.06 + t * 0.34).toFixed(2);
  return `rgba(${hueRgb},${alpha})`;
}
// showCount=trueの場合、打席カラムの隣に「球数」列を追加する（カウント別成績のみで使用。
// byCountの各エントリは_agg_pitch_group()由来で"count"（=投球数の実数）を持っている）。
// sortState={key,dir}|null: キーは"__key"(keyLabel列)/"__group"(グループ列)/"pa"/"count"/各指標キー。
// ソートを適用すると、グループ列（カウント区分等）のrowspan結合は隣接する行同士でのみ有効になる
// （並び替えで同じグループの行が離れた場合は、各行に単独でラベルが表示される＝壊れずに縮退する）。
function renderKeyedStatTable(list, keyLabel, keyField, metrics, emptyNote, groupSpec, showCount, sortState, keyCellFn, maxRows){
  if(!list || list.length === 0){
    return `<div class="defense-note">${escapeHtml(emptyNote || "この条件に該当するデータがありません。")}</div>`;
  }
  list = list.map(normStat);
  const hasYearCol = list.some(s => s._year != null);   // 年度比較モード（_yearを持つ行）のとき年度列を足す
  const columnsAll = {};
  metrics.forEach(([m]) => { columnsAll[m] = list.map(s => s[m]); });
  const sortGetVal = (key) => {
    if(key === "__key") return (item) => item[keyField];
    if(key === "__group") return (item) => groupSpec.label(item);
    return (item) => item[key];
  };
  const sortedAll = sortState ? applySortState(list, sortState, sortGetVal(sortState.key)) : list;
  const sortedList = maxRows ? sortedAll.slice(0, maxRows) : sortedAll;   // maxRows指定時は並び替え後の上位N行だけ表示
  const groupLabels = groupSpec ? sortedList.map(s => groupSpec.label(s)) : null;
  const rows = sortedList.map((s, idx) => {
    let groupCell = "";
    if(groupSpec){
      const isFirstOfGroup = idx === 0 || groupLabels[idx] !== groupLabels[idx - 1];
      if(isFirstOfGroup){
        let span = 1;
        while(idx + span < sortedList.length && groupLabels[idx + span] === groupLabels[idx]) span++;
        groupCell = `<td class="kst-group-cell" rowspan="${span}">${escapeHtml(groupLabels[idx])}</td>`;
      }
    }
    const cells = metrics.map(([m, higherIsBetter, , kind], i) => {
      const text = fmtKeyedVal(s[m], kind);
      // rankings（母集団全体との比較）が付いている表（カウント別・ランナー状況別成績）は
      // 他の表と同じ順位付きセル（rankedTd）を使う。無い表（対戦投手別成績等）は従来どおり
      // 表内だけの相対的な濃淡（magnitudeBg）にフォールバックする。
      if(s.rankings){
        const rk = s.rankings[m] ?? (m === "z_swing_pct" ? s.rankings.contact_pct : null);
        return rankedTd(text, rk);
      }
      const bg = magnitudeBg(s[m], columnsAll[m], KEYED_HUES[i % KEYED_HUES.length], higherIsBetter);
      return `<td${bg ? ` style="background:${bg}"` : ""}>${text}</td>`;
    }).join("");
    const countCell = showCount ? `<td>${s.count ?? "-"}</td>` : "";
    const yearCell = hasYearCol ? `<td class="kst-year-cell"${yrAttr(s._year)}>${yrDot(s._year)}${s._year != null ? escapeHtml(s._year) + "年" : "-"}</td>` : "";
    // 年度比較（年度列あり）では、同じキーが続く行のキー列を1つに結合して表示する
    let keyCell = "";
    const sameKeyAsPrev = hasYearCol && idx > 0 && sortedList[idx - 1][keyField] === s[keyField];
    if(!sameKeyAsPrev){
      let kspan = 1;
      if(hasYearCol) while(idx + kspan < sortedList.length && sortedList[idx + kspan][keyField] === s[keyField]) kspan++;
      keyCell = `<td class="kst-key-cell"${kspan > 1 ? ` rowspan="${kspan}"` : ""}${groupSpec ? ` style="left:90px"` : ""}>${keyCellFn ? keyCellFn(s) : escapeHtml(s[keyField] ?? "-")}</td>`;
    }
    return `<tr>${groupCell}${keyCell}${yearCell}<td>${s.pa ?? "-"}</td>${countCell}${cells}</tr>`;
  }).join("");
  const groupHeadTh = groupSpec ? sortTh(groupSpec.header, "__group", sortState, undefined, "kst-group-cell") : "";
  const countHeadTh = showCount ? sortTh("球数", "count", sortState) : "";
  const yearHeadTh = hasYearCol ? sortTh("年度", "_year", sortState, undefined, "kst-year-cell") : "";
  return `<div class="table-scroll"><table class="split-table kst-table">
    <thead><tr>${groupHeadTh}${sortTh(keyLabel, "__key", sortState, groupSpec ? ` style="left:90px"` : "", "kst-key-cell")}${yearHeadTh}${sortTh("打席", "pa", sortState)}${countHeadTh}${metrics.map(([m, , l]) => sortTh(l, m, sortState)).join("")}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── 年度比較（カウント別・ランナー状況別・コース別で共通）──
// 選手ヘッダー横の年度タブの並びに「年度比較」を置き、選ぶと全セクションが年度横並び表示になる
// （各セクション内に年度切り替えは置かない）。複数年度を持つ選手のときだけ有効。
function compareYearList(seasonsMap){
  const ys = selectedYears.filter(y => seasonsMap[y]).sort((a, b) => b.localeCompare(a));
  return ys.length ? ys : [currentSeasonYear];
}
function isYearCompare(seasonsMap){ return compareYearList(seasonsMap).length > 1; }
// 年度比較用：キー（カウント・状況）ごとに、選択中の年度の行を続けて並べた配列にする（各行に_yearを付ける）。
// 行ごとの順位・色はその年度の値で付く（renderKeyedStatTableがrow.rankingsを使うため）。
function buildYearCompareList(seasonsMap, years, getList, keyField){
  const order = [], byKey = {};
  years.forEach(y => (getList(seasonsMap[y] || {}) || []).forEach(e => {
    const k = e[keyField];
    if(!(k in byKey)){ byKey[k] = []; order.push(k); }
    byKey[k].push({ ...e, _year: y });
  }));
  return order.flatMap(k => byKey[k]);
}

function countStrikeGroupLabel(s){
  const m = /^(\d+)-(\d+)$/.exec(s.countKey || "");
  return m ? `${m[2]}ストライク` : "その他";
}

// グループ列(rowspan、カウント区分)がある表は、キー列(カウント)のposition:sticky用leftを
// グループ列の幅ぶん右にずらす必要がある。table-layout:auto（既定）では、列が多い表だと
// CSSでwidthを指定していても実際のレンダリング幅が一致するとは限らない（他の列との
// 兼ね合いで縮む）ため、ハードコードした値に頼るとズレて隙間や文字欠けが生じる。
// 描画後に実測してleftを動的に合わせることで、どんなフォント・列数でも必ず隙間なく
// 隣接させる。
function syncKstKeyLeft(container){
  const groupCell = container.querySelector(".kst-group-cell");
  const gw = groupCell ? groupCell.getBoundingClientRect().width : 0;
  if(groupCell) container.querySelectorAll(".kst-key-cell").forEach(el => { el.style.left = `${gw}px`; });
  // 年度列（年度比較時）はキー列のすぐ右に固定する
  const keyCell = container.querySelector(".kst-key-cell");
  const kw = keyCell ? keyCell.getBoundingClientRect().width : 0;
  container.querySelectorAll(".kst-year-cell").forEach(el => { el.style.left = `${gw + kw}px`; });
}

// ── シーズン成績ピボット表（軸1〜3＝年度/対左右/球種カテゴリ/球種詳細/球速帯） ──
// 軸に選んだ次元は値ごとに行が展開され、軸に選ばなかった次元は右側のカラム別フィルタの
// 値1つに固定される（対左右フィルタ＝全体、年度フィルタ＝最新年、など）。
// 順位・カラースケールは、選んだ次元の組み合わせに応じてexport_llm_input_batter.py側で
// あらかじめ計算済みのランキングをそのまま使う（15打席以上を対象、PIVOT_RANK_MIN_PA）:
//   ・球種を一切使わない（年度/対左右のみ） → season.splitRankings[rankPool][hand]（rankPool="all30"|"qualified"）
//   ・球種詳細が1つに絞られている            → その球種のpt.rankings（対左右population別）
//   ・球種カテゴリが1つに絞られている（詳細は絞っていない）→ byPitchCategoryMidのrankings
//   ・球種詳細×球速帯が1つに絞られている      → そのband.rankings
// 上記のどれにも当てはまらない組み合わせ（例：球種カテゴリと球速帯を同時に軸にするなど、
// 複数の球種詳細にまたがる集約になる場合）は、打席数で加重平均した近似値を表示するが
// 順位は付かない（母集団を新たに定義しないと意味が無いため）。
// colWidth: この軸の値の表示に必要な幅（[モバイル, デスクトップ]px）。以前は全軸で
// 一律92px(デスクトップ)/60px(モバイル)だったが、「年度」（常に"2026"のような4桁数字のみ）
// にはそれでは広すぎ、逆に「対左右」（"対右投手"等5文字）や「球種カテゴリ」（"ストレート系"等）
// には狭すぎることがあったため、軸ごとに必要な幅を個別に持たせる（要望）。
const PV_DIMS = {
  year:   { label: "年度", colWidth: [56, 64] },
  hand:   { label: "対左右", colWidth: [64, 80] },
  mid:    { label: "球種カテゴリ", colWidth: [64, 96] },
  detail: { label: "球種詳細", colWidth: [64, 96] },
  band:   { label: "球速帯", colWidth: [56, 64] },
};
// この3つを軸に選んだ場合、打席の右に「球数」列を追加する（球種カテゴリ/球種詳細/球速帯は
// 球種を絞り込む軸なので、投球数の内訳を見たいという要望）。
const PV_PITCH_COUNT_DIMS = new Set(["mid", "detail", "band"]);
const PV_BAND_VALUES = ["速い", "中間", "遅い"];  // 表示順は速い→中間→遅い（要望）
// 打率	本塁打	打点	OPS	出塁率	長打率	K%	BB%	Z-Swing%　Z-Contact%　Whiff%　Chase%　GB%の順で表示。
// Z-Contact%・GB%は現状のpitchSplits元データ（ゾーン内空振り数の分離・打球種別情報が無い）
// では算出できないため、値が無ければ自動的に「-」表示になる（データが追加され次第、
// 追加コード無しでここに反映される）。
const PV_FULL_COLUMNS = [
  ["pa", "打席"], ["avg", "打率"], ["hr", "本塁打"], ["rbi", "打点"], ["ops", "OPS"], ["obp", "出塁率"], ["slg", "長打率"],
  ["k_pct", "K%"], ["bb_pct", "BB%"], ["z_swing_pct", "Z-Swing%"], ["z_contact_pct", "Z-Contact%"],
  ["whiff_pct", "Whiff%"], ["chase_pct", "Chase%"], ["gb_pct", "GB%"], ["hr_pct", "HR%"],
  // MLB独自の打球質指標。NPB側は値が常にnullのため自動的に「-」表示（rankedTdも
  // 順位無しのまま値だけ表示するので害はない）。
  ["hard_hit_pct", "Hard-Hit%"], ["avg_ev", "平均EV(km/h)"], ["sweet_spot_pct", "Sweet Spot%"],
  ["xwoba", "xwOBA"], ["pull_pct", "Pull%"],
];
// activeAxesを渡すと、球種カテゴリ/球種詳細/球速帯のいずれかが軸に含まれる場合、NPBでは
// 「打点」列を除外する（NPBのpitchSplits元データには球単位の打点情報が無く、常に
// 「-」になってしまうため）。MLBはpitchSplits側でも打点を算出できるため常に表示する。
// 年度ごとのシーズン成績表（最上部）だけに足す列：WAR（打席の右）と、Pull%の後ろの守備・走塁指標
const PV_EXT_WAR = ["war", "WAR"];
const PV_EXT_TAIL = [];   // OAA以降（守備・走塁）は「シーズン守備・走塁成績」に移した
function pvFullColumnsFor(activeAxes, ext){
  let cols = currentLeague === "npb" ? PV_FULL_COLUMNS.filter(([k]) => !MLB_ONLY_METRIC_KEYS.has(k)) : PV_FULL_COLUMNS;
  if(ext && currentLeague !== "npb") cols = [cols[0], PV_EXT_WAR, ...cols.slice(1), ...PV_EXT_TAIL];
  if(currentLeague === "npb" && activeAxes && activeAxes.some(a => PV_PITCH_COUNT_DIMS.has(a))){
    cols = cols.filter(([k]) => k !== "rbi");
  }
  return cols;
}

function pvHandLabel(h){ return h === "vsR" ? "対右投手" : h === "vsL" ? "対左投手" : "全体"; }
function pvLabelFor(dim, v){ return dim === "hand" ? pvHandLabel(v) : v; }

// シーズン全体（全年度）からユニークな球種詳細/球種カテゴリの一覧を作る
function pvCollectPitchValues(seasonsMap, years){
  const details = new Set(), mids = new Set();
  years.forEach(y => {
    (seasonsMap[y]?.byPitchType?.all || []).forEach(pt => {
      details.add(pt.pitchType);
      mids.add(pt.pitchCategoryMid || "その他");
    });
  });
  return { details: [...details], mids: [...mids] };
}

function pvAxisValues(dim, years, pitchVals){
  if(dim === "year") return years;
  if(dim === "hand") return ["vsR", "vsL"];  // 軸として使う場合は「全体」は出さない（フィルタとしては引き続き選べる）
  if(dim === "mid") return pitchVals.mids;
  if(dim === "detail") return pitchVals.details;
  if(dim === "band") return PV_BAND_VALUES;
  return [null];
}

// pf.hand/mid/detail/band は、軸として使われている場合は単一の値（文字列）、
// フィルターとしてのみ使われている場合は複数選択ドロップダウンからの配列（0件〜複数件）
// のどちらかで来る。ここで統一的に扱えるよう正規化する。
// mode: "none"（絞り込み無し＝all/未選択） / "one"（単一値に特定） / "many"（複数値でOR絞り込み）
function pvSelKind(v){
  if(Array.isArray(v)){
    if(v.length === 0) return { mode: "none" };
    if(v.length === 1) return { mode: "one", value: v[0] };
    return { mode: "many", value: v };
  }
  if(v == null || v === "all") return { mode: "none" };
  return { mode: "one", value: v };
}

// 複数のエントリ（球種詳細や球速帯など、pa/avg/hr/rbi/obp/slg/ops/...の形を持つオブジェクト）
// を1つに集約する。打率・本塁打は安打/打数/本塁打の積み上げから正確に算出できるが、
// 長打率・出塁率・OPS・K%・BB%・各スイング系指標は打席数で加重平均した近似値になる
// （元の単打/長打/四球内訳はexport_llm_input_batter.py側で消費済みのため）。
function aggregatePitchEntries(rawEntries){
  if(!rawEntries || !rawEntries.length) return null;
  const entries = rawEntries.map(normStat);
  const pa = entries.reduce((a, e) => a + (e.pa || 0), 0);
  const count = entries.reduce((a, e) => a + (e.count || 0), 0);
  const ab = entries.reduce((a, e) => a + (e.ab || 0), 0);
  const h = entries.reduce((a, e) => a + (e.h || 0), 0);
  const hr = entries.reduce((a, e) => a + (e.hr || 0), 0);
  const hasRbi = entries.some(e => e.rbi != null);
  const rbi = hasRbi ? entries.reduce((a, e) => a + (e.rbi || 0), 0) : null;
  const wavg = (key, digits) => {
    const num = entries.reduce((a, e) => a + (e[key] != null ? e[key] * (e.pa || 0) : 0), 0);
    const den = entries.reduce((a, e) => a + (e[key] != null ? (e.pa || 0) : 0), 0);
    const mul = Math.pow(10, digits);
    return den > 0 ? Math.round((num / den) * mul) / mul : null;
  };
  return {
    pa, count, ab, h, hr, rbi,
    avg: ab > 0 ? Math.round((h / ab) * 1000) / 1000 : null,
    slg: wavg("slg", 3), obp: wavg("obp", 3), ops: wavg("ops", 3),
    k_pct: wavg("k_pct", 1), bb_pct: wavg("bb_pct", 1),
    hr_pct: pa > 0 ? Math.round((hr / pa) * 1000) / 10 : null,
    z_swing_pct: wavg("z_swing_pct", 1), z_contact_pct: wavg("z_contact_pct", 1),
    whiff_pct: wavg("whiff_pct", 1), chase_pct: wavg("chase_pct", 1), gb_pct: wavg("gb_pct", 1),
    // MLB独自の打球質指標。他の割合指標と同じく打席数での加重平均（近似）。元データ（pitchSplits等）が
    // 持っていない古いデータ・NPBではnullのまま＝「-」表示。
    hard_hit_pct: wavg("hard_hit_pct", 1), avg_ev: wavg("avg_ev", 1),
    sweet_spot_pct: wavg("sweet_spot_pct", 1), xwoba: wavg("xwoba", 3), pull_pct: wavg("pull_pct", 1),
  };
}

function pvStatFields(s){
  const n = normStat(s) || {};
  return {
    pa: n.pa ?? null, count: n.count ?? null, avg: n.avg ?? null, hr: n.hr ?? null, rbi: n.rbi ?? null,
    obp: n.obp ?? null, slg: n.slg ?? null, ops: n.ops ?? null,
    k_pct: n.k_pct ?? null, bb_pct: n.bb_pct ?? null, hr_pct: n.hr_pct ?? null,
    z_swing_pct: n.z_swing_pct ?? null, z_contact_pct: n.z_contact_pct ?? null,
    whiff_pct: n.whiff_pct ?? null, chase_pct: n.chase_pct ?? null, gb_pct: n.gb_pct ?? null,
    // MLB独自の打球質指標。この一覧に無いキーはbuildPivotCell側の行オブジェクトに一切
    // 存在しなくなり、順位（_rk、サーバー側のrankings由来で別経路）だけ表示されて値が
    // 常に「-」になるバグの原因だったため、新指標を追加した際は必ずここにも追加すること。
    hard_hit_pct: n.hard_hit_pct ?? null, avg_ev: n.avg_ev ?? null,
    sweet_spot_pct: n.sweet_spot_pct ?? null, xwoba: n.xwoba ?? null, pull_pct: n.pull_pct ?? null,
    // 年度ごとのシーズン成績表だけで使う指標（overallにのみ入っている。無ければ「-」）
    war: n.war ?? null, oaa: n.oaa ?? null, frp: n.frp ?? null, sb: n.sb ?? null,
    sb_pct: n.sb_pct ?? null, sprint_speed: n.sprint_speed ?? null,
  };
}
const PV_EMPTY_ROW = { pa: null, count: null, avg: null, hr: null, rbi: null, obp: null, slg: null, ops: null,
  k_pct: null, bb_pct: null, hr_pct: null, z_swing_pct: null, z_contact_pct: null, whiff_pct: null, chase_pct: null,
  gb_pct: null, hard_hit_pct: null, avg_ev: null, sweet_spot_pct: null, xwoba: null, pull_pct: null, _rk: null };

// ── シーズン成績ピボット表：球種カテゴリ・球速帯の複数選択／組み合わせ軸の順位 ──
// 球種カテゴリ・球速帯を複数選択（マルチセレクト）したり、両方を軸にしたりすると、
// その組み合わせに対応するランキング母集団を新たに定義しないと順位が出せない
// （buildPivotCellの元のコメント参照）。1選手ぶんのnumeric jsonだけでは他の全選手の
// 同じ組み合わせの値と比較できないため、export_llm_input_batter.py（build_pitch_category_band_grid）
// が全選手ぶんの「中カテゴリ×球速帯」の生グリッドを書き出したpivot_population_{year}.jsonを
// 遅延取得し、選ばれた部分集合ごとに全選手を集計し直して順位付けする。
// 球種詳細(detail)は種類数が多く全選手ぶんを配るのが非現実的なため対象外
// （detailで絞り込んでいる場合は従来通りbyPitchType/byVelocityBandのrankingsを使う）。
const PV_POP_MIN_PA = 15;  // export_llm_input_batter.pyのPIVOT_RANK_MIN_PAと合わせる
// (フィールド名, 高いほど良いか)。表示列(PV_FULL_COLUMNS)のうち順位付け対象の指標のみ。
const PV_RANK_SPECS = [
  ["avg", true], ["obp", true], ["slg", true], ["ops", true], ["hr", true], ["rbi", true],
  ["k_pct", false], ["bb_pct", true],
  ["whiff_pct", false], ["chase_pct", false], ["z_swing_pct", true], ["z_contact_pct", true],
  ["gb_pct", false], ["hr_pct", true],
  ["avg_ev", true], ["hard_hit_pct", true], ["sweet_spot_pct", true], ["xwoba", true], ["pull_pct", true],
];

const pivotPopulationCache = {};  // key: `${basePath}|${year}` -> { data, promise }
function ensurePivotPopulation(basePath, year){
  const key = `${basePath}|${year}`;
  let entry = pivotPopulationCache[key];
  if(!entry){
    // loadedは「取得を試み終えたか」を表す（dataがnullでもtrueになり得る＝まだ
    // pivot_population_{year}.jsonが生成されていない・404等で取得できなかった場合）。
    // 呼び出し側（wirePivotSectionのredraw）はこのloadedを見て「もう一度だけ再描画する」
    // 判断をするため、data==nullだけを条件にすると取得失敗のたびに同じ（既に解決済みの）
    // promiseへ再度.then()を仕掛け続け、微小タスクが無限に連鎖してタブがフリーズする
    // 不具合があった（population未生成のリーグ/年度で球種カテゴリ・球速帯の組み合わせ
    // フィルターを操作すると発生）。
    entry = { data: null, loaded: false, promise: null };
    entry.promise = fetchJsonZ(`${basePath}/pivot_population_${year}.json`)
      .then(res => res.ok ? res.json() : null)
      .then(json => { entry.data = json; entry.loaded = true; return json; })
      .catch(() => { entry.loaded = true; return null; });
    pivotPopulationCache[key] = entry;
  }
  return entry;
}

// pvSelKind()の結果を、絞り込み無し=null／単一・複数値=Setに正規化する
// （computePivotGroupRankでmid/bandどちらも同じ形で扱えるようにするため）。
function pvSelToSet(sel){
  if(sel.mode === "none") return null;
  return new Set(sel.mode === "one" ? [sel.value] : sel.value);
}

// population（pivot_population_{year}.jsonの中身）から、選ばれた球種カテゴリ・球速帯の
// 部分集合（null=絞り込み無し）ごとに全選手ぶんを集計し直し（aggregatePitchEntriesを
// そのまま流用）、現在表示中の選手(activePlayerId)の順位・母数を返す。
function computePivotGroupRank(population, handKey, midSet, bandSet){
  if(!population || !population.players || !activePlayerId) return null;
  const players = population.players;
  const valuesByMetric = {};
  let selfAgg = null;
  for(const pid in players){
    const grid = players[pid] && players[pid][handKey];
    if(!grid) continue;
    const cells = [];
    for(const mid in grid){
      if(midSet && !midSet.has(mid)) continue;
      const bandsObj = grid[mid];
      for(const band in bandsObj){
        if(bandSet && !bandSet.has(band)) continue;
        cells.push(bandsObj[band]);
      }
    }
    if(!cells.length) continue;
    const agg = aggregatePitchEntries(cells);
    if(!agg) continue;
    if(pid === activePlayerId) selfAgg = agg;
    if((agg.pa || 0) < PV_POP_MIN_PA) continue;
    PV_RANK_SPECS.forEach(([metric]) => {
      const v = agg[metric];
      if(v != null){
        (valuesByMetric[metric] || (valuesByMetric[metric] = [])).push({ id: pid, value: v });
      }
    });
  }
  if(!selfAgg) return null;
  const selfQualified = (selfAgg.pa || 0) >= PV_POP_MIN_PA;
  const rk = {};
  PV_RANK_SPECS.forEach(([metric, higherIsBetter]) => {
    const list = valuesByMetric[metric] || [];
    const total = list.length;
    if(!selfQualified || selfAgg[metric] == null){
      rk[metric] = { rank: null, total };
      return;
    }
    list.sort((a, b) => higherIsBetter ? b.value - a.value : a.value - b.value);
    const idx = list.findIndex(e => e.id === activePlayerId);
    rk[metric] = { rank: idx >= 0 ? idx + 1 : null, total };
  });
  return rk;
}

// この軸・フィルタの組み合わせで、pivot_populationからの順位計算が必要になり得るか
// （＝事前に取得しておく価値があるか）を判定する。球種詳細が一切絞り込まれていない
// （軸としても使われていない）場合に限り、球種カテゴリ・球速帯のどちらかが軸または
// フィルターとして関与していればtrue。
function pvComboMayNeedPopulation(activeAxes, filters){
  if(activeAxes.includes("detail")) return false;
  if(pvSelKind(filters.detail).mode !== "none") return false;
  if(activeAxes.includes("mid") || activeAxes.includes("band")) return true;
  return pvSelKind(filters.mid).mode !== "none" || pvSelKind(filters.band).mode !== "none";
}

// 1つのピボットセル（軸の値の組み合わせ1通り）ぶんのデータを、最も具体的なランキング母集団を
// 優先して取ってくる。単一値に特定できるケース（軸として使われている、またはフィルターで
// 1つだけ選ばれている）ではサーバー側の正確な順位付き集計を使い、複数選択でのOR絞り込みの
// 場合はクライアント側で該当エントリを合算する（この場合は順位母集団が定義できないため
// 順位は付かない）。
function buildPivotCell(seasonsMap, pf, rankPool, population){
  const year = pf.year;
  const season = seasonsMap[year] || {};
  const handSel = pvSelKind(pf.hand);
  const detailSel = pvSelKind(pf.detail);
  const midSel = pvSelKind(pf.mid);
  const bandSel = pvSelKind(pf.band);
  // 対左右を両方選択した場合は「全体」と同じ意味になる（合算すれば全体と一致するため）
  const handKey = handSel.mode === "one" ? handSel.value : "all";
  const poolRk = season.splitRankings ? (season.splitRankings[rankPool] || null) : null;

  if(detailSel.mode === "none" && midSel.mode === "none" && bandSel.mode === "none"){
    const stat = handKey === "all" ? (season.overall || {}) : (season.splits?.[handKey] || {});
    return { ...pvStatFields(stat), _rk: poolRk ? (poolRk[handKey] || null) : null };
  }

  if(detailSel.mode === "one"){
    const pt = (season.byPitchType?.[handKey] || []).find(p => p.pitchType === detailSel.value);
    if(!pt) return { ...PV_EMPTY_ROW };
    if(bandSel.mode === "one"){
      const band = (pt.byVelocityBand || []).find(b => b.band === bandSel.value);
      return band ? { ...pvStatFields(band), _rk: band.rankings || null } : { ...PV_EMPTY_ROW };
    }
    if(bandSel.mode === "many"){
      const bandEntries = (pt.byVelocityBand || []).filter(b => bandSel.value.includes(b.band));
      const agg = aggregatePitchEntries(bandEntries);
      return agg ? { ...pvStatFields(agg), _rk: null } : { ...PV_EMPTY_ROW };
    }
    return { ...pvStatFields(pt), _rk: pt.rankings || null };
  }

  // ここに来るのは：球種詳細が複数選択（OR）、または球種カテゴリ/球速帯のいずれかで
  // 絞り込みが効いている場合。byPitchTypeをmid/detailでOR絞り込みしてから必要に応じて
  // band単位へ展開・合算する。
  let list = season.byPitchType?.[handKey] || [];
  list = list.filter(pt => {
    if(midSel.mode === "one" && (pt.pitchCategoryMid || "その他") !== midSel.value) return false;
    if(midSel.mode === "many" && !midSel.value.includes(pt.pitchCategoryMid || "その他")) return false;
    if(detailSel.mode === "many" && !detailSel.value.includes(pt.pitchType)) return false;
    return true;
  });

  if(bandSel.mode === "none"){
    // 球種カテゴリを1つだけ選んでいる（球種詳細・球速帯の絞り込みは無い）特殊ケースは、
    // サーバー側の正確な順位付き集計（byPitchCategoryMid）をそのまま使う。
    if(midSel.mode === "one" && detailSel.mode === "none"){
      const stat = season.byPitchCategoryMid?.[handKey]?.[midSel.value];
      return stat ? { ...pvStatFields(stat), _rk: stat.rankings || null } : { ...PV_EMPTY_ROW };
    }
    const agg = aggregatePitchEntries(list);
    // 球種カテゴリを複数選択（OR）している場合は、pivot_population（球種カテゴリ×球速帯の
    // 全選手ぶんグリッド）から同じ組み合わせを集計し直して順位を出す（detailの絞り込みが
    // 無い場合のみ。detail種類数が多く population 側では対応していないため対象外）。
    const rk = (agg && detailSel.mode === "none")
      ? computePivotGroupRank(population, handKey, pvSelToSet(midSel), null)
      : null;
    return agg ? { ...pvStatFields(agg), _rk: rk } : { ...PV_EMPTY_ROW };
  }

  // 球種の絞り込みが一切無く、球速帯だけ単一選択している特殊ケースは、サーバー側の
  // byVelocityBandOnly（順位計算済み）をそのまま使う。
  if(midSel.mode === "none" && detailSel.mode === "none" && bandSel.mode === "one"){
    const stat = season.byVelocityBandOnly?.[handKey]?.[bandSel.value];
    return stat ? { ...pvStatFields(stat), _rk: stat.rankings || null } : { ...PV_EMPTY_ROW };
  }
  const bandEntries = list.flatMap(pt => (pt.byVelocityBand || []).filter(b =>
    bandSel.mode === "one" ? b.band === bandSel.value : bandSel.value.includes(b.band)
  ));
  const agg = aggregatePitchEntries(bandEntries);
  // 球種カテゴリ×球速帯を両方軸にした場合（例：カテゴリ=1つ・球速帯=1つ）や、
  // 球速帯を複数選択した場合も、pivot_populationから同じ組み合わせを集計し直して
  // 順位を出す（detailの絞り込みが無い場合のみ）。
  const rk = (agg && detailSel.mode === "none")
    ? computePivotGroupRank(population, handKey, pvSelToSet(midSel), pvSelToSet(bandSel))
    : null;
  return agg ? { ...pvStatFields(agg), _rk: rk } : { ...PV_EMPTY_ROW };
}

// 軸1〜3（activeAxes、最大3つ）の値のデカルト積で全行を組み立てる。
function buildPivotRows3(seasonsMap, years, activeAxes, filters, rankPool, population){
  const pitchVals = pvCollectPitchValues(seasonsMap, years);
  const axisValueLists = activeAxes.map(dim => pvAxisValues(dim, years, pitchVals));

  function cartesian(lists){
    if(lists.length === 0) return [[]];
    const [first, ...rest] = lists;
    const restCombos = cartesian(rest);
    const out = [];
    first.forEach(v => restCombos.forEach(c => out.push([v, ...c])));
    return out;
  }
  const combos = cartesian(axisValueLists);

  return combos.map(combo => {
    const pf = { year: filters.year, hand: filters.hand, mid: filters.mid, detail: filters.detail, band: filters.band };
    activeAxes.forEach((dim, i) => { pf[dim] = combo[i]; });
    const row = buildPivotCell(seasonsMap, pf, rankPool, population);
    activeAxes.forEach((dim, i) => { row[`_label${i + 1}`] = pvLabelFor(dim, combo[i]); });
    return row;
  });
}

function renderPivotTable(rows0, activeAxes, sortState, ext){
  if(rows0.length === 0) return `<div class="defense-note">条件に一致するデータがありません。</div>`;
  // 球種カテゴリ/球種詳細/球速帯を軸に使っている場合だけ、打席の右に「球数」列を追加する。
  const showCount = activeAxes.some(a => PV_PITCH_COUNT_DIMS.has(a));
  const fullCols = pvFullColumnsFor(activeAxes, ext);
  const cols = showCount
    ? [fullCols[0], ["count", "球数"], ...fullCols.slice(1)]
    : fullCols;
  const headCols = activeAxes.map(dim => PV_DIMS[dim]?.label || "-");
  // 固定列（軸ラベル）の幅は軸の種類ごとに異なる（PV_DIMS[dim].colWidth）ため、
  // 各列のwidth/min-widthをインラインで指定しつつ、position:stickyのleftオフセットは
  // それらの累積和で計算する（CSS側の一律min-widthには頼らない）。モバイルでは
  // 指標列を一度に多く見せたいので、各軸ともモバイル用の狭い幅を使う。
  const isMobileW = window.matchMedia("(max-width:720px)").matches;
  const axisColWidths = activeAxes.map(dim => (PV_DIMS[dim]?.colWidth || [60, 92])[isMobileW ? 0 : 1]);
  const axisColLefts = axisColWidths.reduce((acc, w, i) => { acc.push((acc[i - 1] ?? 0) + (i === 0 ? 0 : axisColWidths[i - 1])); return acc; }, []);
  const axisColStyle = (i) => ` class="pv-axis-col${activeAxes[i] === "year" ? " pv-year-col" : ""}" style="left:${axisColLefts[i]}px; width:${axisColWidths[i]}px; min-width:${axisColWidths[i]}px;"`;

  // 軸列（_label1〜3）は文字列比較、指標列は数値比較でソートする。
  const sortGetVal = (key) => (r) => r[key];
  const rows = sortState ? applySortState(rows0, sortState, sortGetVal(sortState.key)) : rows0;

  // 年度比較（最後の軸が「年度」）では、同じ軸の値が続く行の軸セルを結合する（上の軸から順に、値の並びが同じ範囲）
  const isCmp = activeAxes.length > 1 && activeAxes[activeAxes.length - 1] === "year";
  const prefixSame = (a, b, upto) => { for(let k = 0; k <= upto; k++){ if(a[`_label${k + 1}`] !== b[`_label${k + 1}`]) return false; } return true; };
  const trs = rows.map((r, ri) => {
    const labelCells = activeAxes.map((_, i) => {
      if(isCmp && i < activeAxes.length - 1){
        if(ri > 0 && prefixSame(rows[ri - 1], r, i)) return "";
        let span = 1;
        while(ri + span < rows.length && prefixSame(rows[ri + span], r, i)) span++;
        return `<td${axisColStyle(i)}${span > 1 ? ` rowspan="${span}"` : ""}>${escapeHtml(r[`_label${i + 1}`] ?? "-")}</td>`;
      }
      return `<td${axisColStyle(i)}${activeAxes[i] === "year" ? yrAttr(r[`_label${i + 1}`]) : ""}>${activeAxes[i] === "year" ? yrDot(r[`_label${i + 1}`]) : ""}${escapeHtml(r[`_label${i + 1}`] ?? "-")}</td>`;
    });
    const statCells = cols.map(([key]) => {
      if(key === "pa" || key === "count") return `<td>${r[key] ?? "-"}</td>`;  // 打席・球数は順位・カラースケール対象外
      const v = r[key];
      let text;
      if(key === "avg" || key === "obp" || key === "slg" || key === "xwoba") text = fmtAvg(v);
      else if(key === "ops") text = fmt(v, 3);
      else if(key === "avg_ev" || key === "war" || key === "sprint_speed") text = fmt(v, 1);
      else if(key === "oaa" || key === "frp") text = v == null ? "-" : `${v > 0 ? "+" : ""}${v}`;
      else if(key === "sb_pct") text = fmt(v, 1, "%");
      else if(key === "k_pct" || key === "bb_pct" || key === "z_swing_pct" || key === "z_contact_pct"
        || key === "whiff_pct" || key === "chase_pct" || key === "gb_pct" || key === "hr_pct"
        || key === "hard_hit_pct" || key === "sweet_spot_pct" || key === "pull_pct") text = fmt(v, 1, "%");
      else text = v ?? "-";
      // 値自体は常にそのまま表示し、資格打席未満で順位が付いていない場合は
      // rankedTd側が順位部分だけを「-」にする（pitcher-cards.htmlと同じ仕様）。
      // z_swing_pctはサーバー側の順位計算がまだ旧フィールド名(contact_pct)のままのため、
      // どちらのキーでも順位を拾えるようにしておく。
      const rk = r._rk ? (r._rk[key] ?? (key === "z_swing_pct" ? r._rk.contact_pct : null)) : null;
      return rankedTd(text, rk);
    });
    return `<tr>${labelCells.join("")}${statCells.join("")}</tr>`;
  }).join("");

  const headAxisCells = headCols.map((h, i) => sortTh(h, `_label${i + 1}`, sortState,
    ` style="left:${axisColLefts[i]}px; width:${axisColWidths[i]}px; min-width:${axisColWidths[i]}px;"`, "pv-axis-col" + (activeAxes[i] === "year" ? " pv-year-col" : ""))).join("");
  return `<div class="table-scroll"><table class="split-table pv-result-table">
    <thead><tr>${headAxisCells}${cols.map(([k, l]) => sortTh(l, k, sortState)).join("")}</tr></thead>
    <tbody>${trs}</tbody>

  </table></div>`;
}

function pvSelectOptions(options, activeValue){
  return options.map(([v, l]) => `<option value="${escapeHtml(v)}"${activeValue === v ? " selected" : ""}>${escapeHtml(l)}</option>`).join("");
}

function _buildRankPitcher() {
  const isSeason = rankState.mode === 'season';
  const pitchTypes = [
    {key:'all', label:'総合'},
    {key:'FF', label:'ストレート (FF)'},
    {key:'SL', label:'スライダー (SL)'},
    {key:'CU', label:'カーブ (CU)'},
    {key:'CH', label:'チェンジアップ (CH)'},
    {key:'SI', label:'シンカー/ツーシーム (SI)'},
    {key:'CT', label:'カットボール (CT)'},
    {key:'SP', label:'スプリット (SP)'},
    {key:'FK', label:'フォーク (FK)'}
  ];

  const subNavHtml = `
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <div class="rank-toggle-group">
        <button onclick="switchRankPitchRole('starter')" class="rank-toggle-btn ${rankState.pitchRole==='starter'?'active':''}">先発</button>
        <button onclick="switchRankPitchRole('reliever')" class="rank-toggle-btn ${rankState.pitchRole==='reliever'?'active':''}">中継ぎ</button>
        <button onclick="switchRankPitchRole('all')" class="rank-toggle-btn ${rankState.pitchRole==='all'?'active':''}">全体</button>
      </div>
      <div class="rank-toggle-group">
        <button onclick="switchRankPitchSplit('all')" class="rank-toggle-btn ${rankState.pitchSplit==='all'?'active':''}">全体</button>
        <button onclick="switchRankPitchSplit('vs_r')" class="rank-toggle-btn ${rankState.pitchSplit==='vs_r'?'active':''}">対右</button>
        <button onclick="switchRankPitchSplit('vs_l')" class="rank-toggle-btn ${rankState.pitchSplit==='vs_l'?'active':''}">対左</button>
      </div>
      <select onchange="switchRankPitchType(this.value)" style="padding:4px 8px;font-size:11px;font-weight:700;border-radius:5px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'Noto Sans JP'">
        ${pitchTypes.map(t => `<option value="${t.key}" ${rankState.pitchPitchType===t.key?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>
  `;

  const tableHtml = isSeason ? _getSeasonPitcherTableHtml() : _getGamelogPitcherTableHtml();
  return `<div class="card" style="padding:14px;border-radius:12px;background:var(--bg2)">${subNavHtml}${tableHtml}</div>`;
}

function _getGamelogPitcherTableHtml() {
  const pitchers = [];
  const mixKey = rankState.pitchSplit === 'vs_r' ? 'mixVsR' : rankState.pitchSplit === 'vs_l' ? 'mixVsL' : 'mix';
  const getSortArrow = (key) => rankPitSortKey === key ? (rankPitSortAsc ? '↑' : '↓') : '↕';
  const isOverall = rankState.pitchPitchType === 'all';
  const currentSplit = rankState.pitchSplit;

  const cols = isOverall ? [
    {label:'空振り率',key:'swstr',color:'var(--blue)'},{label:'ボール球SW%',key:'oswing',color:'var(--cyan)'},
    {label:'ストライク率',key:'strike',color:'var(--text2)'},{label:'ゾーン率',key:'zone',color:'var(--green)'},
    {label:'K-BB%',key:'kbbpct',color:'#A78BFA'},{label:'K%',key:'kpct',color:'#F59E0B'},
    {label:'BB%',key:'bbpct',color:'#F87171'},{label:'GB%',key:'gbpct',color:'var(--teal)'}
  ] : [
    {label:'空振り率',key:'swstr',color:'var(--blue)'},{label:'ボール球SW%',key:'oswing',color:'var(--cyan)'},
    {label:'ストライク率',key:'strike',color:'var(--text2)'},{label:'ゾーン率',key:'zone',color:'var(--green)'},
    {label:'GB%',key:'gbpct',color:'var(--teal)'},
    ...(currentSport==='mlb'?[{label:'xwOBA',key:'xwoba',color:'#93C5FD'}]:[]),
    {label:'投球割合',key:'pct',color:'var(--text2)'},
    {label:'平均球速',key:'ave',color:'var(--gold)'},{label:'最高球速',key:'maxVel',color:'var(--orange)'},
    ...(currentSport==='mlb'?[
      {label:'回転数',key:'avgSpin',color:'#A78BFA'},
      {label:'回転軸',key:'spinAxis',color:'#C4B5FD'},
      {label:'回転効率(近似)',key:'activeSpin',color:'#DDD6FE'},
      {label:'VAA',key:'vaa',color:'#F9A8D4'},
      {label:'縦変化量',key:'ivb',color:'#67E8F9'},
      {label:'横変化量',key:'hb',color:'#86EFAC'},
      {label:'Extension',key:'ext',color:'#FCD34D'},
    ]:[]),
  ];

  // ── グローバル全試合データ収集（色付けの基準用）──
  // フィルタなし・全試合の値リストを作成してパーセンタイルで色付け
  const _globalColVals = {}; // {key: sorted number[]}
  cols.forEach(c => { _globalColVals[c.key] = []; });
  Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
    (DATA[date]||[]).forEach(g=>{
      ['home','away'].forEach(side=>{
        (g.pitchers[side]||[]).forEach(p=>{
          if(rankState.pitchRole==='starter'&&p.role!=='先発') return;
          if(rankState.pitchRole==='reliever'&&p.role!=='中継ぎ') return;
          const bm = p[mixKey]||p.mix||[];
          let am = isOverall ? bm : [bm.find(x=>x.key===rankState.pitchPitchType)].filter(Boolean);
          const tot = am.reduce((s,m)=>s+m.count,0);
          if(tot===0) return;
          const obj = {};
          if(isOverall) {
            obj.swstr=p.swstr??null; obj.oswing=p.oSwing??null; obj.strike=p.strike??null;
            obj.zone=p.zone??null;
            const k=p.k??0, bb=p.bb??0, tbf=p.tbf??1;
            obj.kpct=tbf>0?+(k/tbf*100).toFixed(1):null;
            obj.bbpct=tbf>0?+(bb/tbf*100).toFixed(1):null;
            obj.kbbpct=(obj.kpct!=null&&obj.bbpct!=null)?+(obj.kpct-obj.bbpct).toFixed(1):null;
            obj.gbpct=p.gbpct??null;
          } else {
            const m0=am[0]||{};
            obj.swstr=m0.swstr??null; obj.oswing=m0.oSwing??null; obj.strike=m0.strike??null;
            obj.zone=m0.zone??null; obj.gbpct=m0.gbpct??null;
            obj.pct=m0.pct??null; obj.ave=m0.vel??null; obj.maxVel=m0.maxVel??null;
            obj.xwoba=m0.xwoba??null;
          }
          cols.forEach(c=>{
            if(obj[c.key]!=null) _globalColVals[c.key].push(+obj[c.key]);
          });
        });
      });
    });
  });
  // ソート（bbpct・xwoba は昇順が良い）
  const _loIsBestKeys = new Set(['bbpct','xwoba']);
  cols.forEach(c=>{
    _globalColVals[c.key].sort((a,b)=>_loIsBestKeys.has(c.key)?a-b:b-a);
  });
  // パーセンタイルから背景色を返す関数（全試合基準）
  function _globalRkBg(val, key) {
    if(val==null||isNaN(+val)) return '';
    const arr = _globalColVals[key]; if(!arr||arr.length<2) return '';
    const lo = _loIsBestKeys.has(key);
    // arr: lo=true→昇順, false→降順
    const v = +val, n = arr.length;
    let cnt = 0;
    if(lo){
      for(let i=n-1;i>=0;i--){ if(arr[i]>v) cnt++; else break; }
    } else {
      for(let i=n-1;i>=0;i--){ if(arr[i]<v) cnt++; else break; }
    }
    const pct = cnt/n;
    if(pct>=0.85) return 'rgba(18,165,178,0.40)';
    if(pct>=0.70) return 'rgba(18,165,178,0.25)';
    if(pct>=0.60) return 'rgba(18,165,178,0.12)';
    if(pct>=0.40) return '';
    if(pct>=0.30) return 'rgba(238,122,151,0.10)';
    if(pct>=0.15) return 'rgba(238,122,151,0.18)';
    return 'rgba(238,122,151,0.38)';
  }

  const dateFrom = window._rankDateFrom||'';
  const dateTo   = window._rankDateTo||'';

  Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
    if(dateFrom && date < dateFrom) return;
    if(dateTo   && date > dateTo)   return;
    (DATA[date]||[]).forEach(g=>{
      ['home','away'].forEach(side=>{
        (g.pitchers[side]||[]).forEach(p=>{
          if(rankState.pitchRole==='starter'&&p.role!=='先発') return;
          if(rankState.pitchRole==='reliever'&&p.role!=='中継ぎ') return;
          const baseMix = p[mixKey]||p.mix||[];
          let activeMix = isOverall ? baseMix : [baseMix.find(x=>x.key===rankState.pitchPitchType)].filter(Boolean);
          const tot = activeMix.reduce((s,m)=>s+m.count,0);
          const minRequired = (isOverall&&rankState.pitchRole==='reliever')?10:(isOverall?1:1);
          if(tot<minRequired) return;
          const vsStat = currentSplit==='vs_r'?p.pitStatVsR:currentSplit==='vs_l'?p.pitStatVsL:p.zoneStats||p;
          const target = isOverall ? vsStat : activeMix[0];
          const baseInfo = `${p.ip}回 ${p.pitches}球 ${p.k}K ${p.bb}BB`;
          let dayStatLabel = '';
          if(isOverall){
            if(currentSplit==='vs_r') dayStatLabel=`${baseInfo} (対右:${tot}球)`;
            else if(currentSplit==='vs_l') dayStatLabel=`${baseInfo} (対左:${tot}球)`;
            else dayStatLabel=`${baseInfo} ${p.er}失点`;
          } else {
            dayStatLabel=`${tot}球 (${activeMix[0]?.name||''})`;
          }
          const pitchPct = !isOverall&&activeMix[0]?+(activeMix[0].pct||0):null;
          // kpct/bbpct/kbbpct: JSONにない場合はK/BB/Hから近似計算
          const _gtbf = (p.k||0)+(p.bb||0)+(p.h||0);
          const _gkpct   = (target?.kpct??p.kpct)   != null ? (target?.kpct??p.kpct)   : (_gtbf>0?parseFloat(((p.k||0)/_gtbf*100).toFixed(1)):null);
          const _gbbpct  = (target?.bbpct??p.bbpct)  != null ? (target?.bbpct??p.bbpct)  : (_gtbf>0?parseFloat(((p.bb||0)/_gtbf*100).toFixed(1)):null);
          const _gkbbpct = (target?.kbbpct??p.kbbpct)!= null ? (target?.kbbpct??p.kbbpct): (_gtbf>0?parseFloat((((p.k||0)-(p.bb||0))/_gtbf*100).toFixed(1)):null);
          // 投球回(IP)を数値で保持（フィルタ用）
          const _gipRaw = (() => { const v=String(p.ip||'0'); const [wh,fr]=v.split('.'); return parseInt(wh||0)*3+(fr==='1'?1:fr==='2'?2:0); })();
          pitchers.push({
            date, name:p.name, team:side==='home'?g.home:g.away, dayStat:dayStatLabel,
            kbbpct:_gkbbpct, kpct:_gkpct, bbpct:_gbbpct,
            swstr:target?.swstr??0, oswing:target?.oSwing??0, strike:target?.strike??0,
            zone:target?.zone??0, gbpct:target?.gbpct??p.gbpct,
            ave:target?.vel||0, maxVel:target?.maxVel||0, pct:pitchPct,
            avgSpin:target?.avgSpin??null, spinAxis:target?.spinAxis??null,
            activeSpin:target?.activeSpin??null, vaa:target?.vaa??null,
            ivb:target?.ivb??null, hb:target?.hb??null, ext:target?.ext??null,
            xwoba:target?.xwoba??null,
            pitchCount:isOverall?null:tot,
            ipRaw:_gipRaw
          });
        });
      });
    });
  });

  const _sq=(rankState.searchQuery||'').trim();
  let filtered = _sq ? pitchers.filter(r=>r.name.includes(_sq)||r.team.includes(_sq)) : pitchers;
  // 総合=投球回フィルター、球種別=球数フィルター（デフォルト100球）
  if(isOverall){
    const _gameMinIPRaw = (window._gamePitMinIP != null ? window._gamePitMinIP : 5) * 3;
    filtered = filtered.filter(r => r.ipRaw >= _gameMinIPRaw);
  } else {
    const _gameMinPitches = window._gamePitMinPitches != null ? window._gamePitMinPitches : 15;
    filtered = filtered.filter(r => (r.pitchCount||0) >= _gameMinPitches);
  }
  const sk = rankPitSortKey||'swstr';
  filtered.sort((a,b)=>rankPitSortAsc?(a[sk]??0)-(b[sk]??0):(b[sk]??0)-(a[sk]??0));

  // 各指標の独立順位計算
  function calcRk(arr,key,loIsBest=false){
    const s=[...arr].sort((a,b)=>loIsBest?((a[key]??999)-(b[key]??999)):((b[key]??-999)-(a[key]??-999)));
    const m=new Map();let rk=1;
    s.forEach((r,i)=>{if(i>0&&r[key]!==s[i-1][key])rk=i+1;m.set(r,rk);});return m;
  }
  const rkMaps={};
  cols.forEach(c=>{rkMaps[c.key]=calcRk(filtered,c.key,c.key==='bbpct');});
  const dispRkMap=calcRk(filtered,sk,sk==='bbpct');

  // 日付フィルターUI
  const _inputStyle="background:var(--bg4);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'DM Mono';font-size:11px;padding:3px 8px;outline:none !important;cursor:pointer;";
  const _gameIPVal = window._gamePitMinIP != null ? window._gamePitMinIP : 5;
  const _gamePitchVal = window._gamePitMinPitches != null ? window._gamePitMinPitches : 15;
  const dateFilterBar=`<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border2);background:var(--bg3);flex-wrap:wrap;">
    <span style="font-size:10px;color:var(--text3);font-family:'DM Mono'">日付</span>
    <input type="date" id="rankDateFrom" value="${dateFrom}" onchange="window._rankDateFrom=this.value;_updateRankContent()" onclick="try{this.showPicker()}catch(e){}" style="${_inputStyle}">
    <span style="font-size:11px;color:var(--text3)">〜</span>
    <input type="date" id="rankDateTo" value="${dateTo}" onchange="window._rankDateTo=this.value;_updateRankContent()" onclick="try{this.showPicker()}catch(e){}" style="${_inputStyle}">
    <button onclick="window._rankDateFrom='';window._rankDateTo='';_updateRankContent()" style="font-size:10px;background:rgba(255,255,255,0.06);border:1px solid var(--border2);border-radius:4px;color:var(--text3);padding:3px 10px;cursor:pointer">クリア</button>
    ${isOverall ? `
    <span style="font-size:10px;color:var(--text3);font-family:'DM Mono';margin-left:6px">投球回フィルター</span>
    <div style="display:flex;align-items:center;gap:4px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;">
      <span style="font-size:10px;color:var(--text3)">≥</span>
      <input type="number" min="0" step="1" value="${_gameIPVal}" placeholder="5" onchange="onGamePitIPFilter(this.value)" onblur="onGamePitIPFilter(this.value)" onfocus="this.select()"
        style="width:48px;background:transparent;border:none;color:var(--text3);font-family:'DM Mono';font-size:12px;font-weight:700;outline:none;text-align:center;" oninput="this.style.color='var(--text)'" onkeydown="if(event.key==='Enter')this.blur()">
      <span style="font-size:10px;color:var(--text3)">回</span>
    </div>` : `
    <span style="font-size:10px;color:var(--text3);font-family:'DM Mono';margin-left:6px">球数フィルター</span>
    <div style="display:flex;align-items:center;gap:4px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;">
      <span style="font-size:10px;color:var(--text3)">≥</span>
      <input type="number" min="0" step="1" value="${_gamePitchVal}" placeholder="15" onchange="window._gamePitMinPitches=+this.value;_updateRankContent()" onblur="window._gamePitMinPitches=+this.value;_updateRankContent()" onfocus="this.select()"
        style="width:56px;background:transparent;border:none;color:var(--text3);font-family:'DM Mono';font-size:12px;font-weight:700;outline:none;text-align:center;" oninput="this.style.color='var(--text)'" onkeydown="if(event.key==='Enter')this.blur()">
      <span style="font-size:10px;color:var(--text3)">球</span>
    </div>`}
    <span style="font-size:10px;color:var(--text3)">${filtered.length}件</span>
  </div>`;

  const thead = `<thead><tr>
    <th style="min-width:180px;padding-left:14px;">投手</th>
    <th style="min-width:58px;color:var(--text3)">日付</th>
    ${cols.map(c=>`<th style="min-width:82px;color:${c.color};cursor:pointer;font-weight:${sk===c.key?'700':'500'}" onclick="pitRankLogSort('${c.key}')">${c.label} ${getSortArrow(c.key)}</th>`).join('')}
  </tr></thead>`;

  const tbody = `<tbody>${filtered.slice(0,100).map(r=>{
    const tc=TC[r.team]||'var(--text3)';
    const dispRank=dispRkMap.get(r)||1;
    const nameHtml = `<div style="font-size:${r.name.length>=8?'12px':'13px'};font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.3)" onclick="openPlayerPageAuto('${r.name}','${r.team}')">${r.name}</span> <span style="font-size:10px;color:${tc}">${r.team}</span></div>${!isOverall?`<div style="font-size:9px;color:var(--text2);margin-top:2px;font-family:'DM Mono'">${r.pitchCount!=null?r.pitchCount+'球':''} ${r.dayStat.replace(/^\d+球 /,'')}</div>`:`<div style="font-size:9px;color:var(--text2);margin-top:2px;font-family:'DM Mono'">${r.dayStat}</div>`}`;
    return`<tr>
      <td style="padding:8px 8px 8px 14px;min-width:180px;vertical-align:top;">
        <div style="display:flex;align-items:flex-start;gap:6px;">
          <span style="font-family:'DM Mono';font-size:14px;font-weight:700;color:var(--gold);width:20px;text-align:right;flex-shrink:0;margin-top:2px">${dispRank}</span>
          <div>${nameHtml}</div>
        </div>
      </td>
      <td style="font-family:'DM Mono';font-size:11px;color:var(--text3);white-space:nowrap;">${r.date.slice(5).replace('-','/')}</td>
      ${cols.map(c=>{
        let v=r[c.key]!=null?_tf(r[c.key]):'—';
        if(v!=='—') {
          if(['ave','maxVel'].includes(c.key)) v+='km/h';
          else if(c.key==='avgSpin') v=Math.round(r[c.key])+'rpm';
          else if(c.key==='spinAxis') v=Math.round(r[c.key])+'°';
          else if(c.key==='activeSpin') v=_tf(r[c.key])+'%';
          else if(c.key==='vaa') v=_tf(r[c.key])+'°';
          else if(c.key==='ivb'||c.key==='hb') v=_tf(r[c.key])+'cm';
          else if(c.key==='ext') v=parseFloat(r[c.key]).toFixed(2)+'m';
          else if(c.key==='xwoba') v=parseFloat(r[c.key]).toFixed(3);
          else if(c.key!=='pct') v+='%';
        }
        const rk=rkMaps[c.key]?.get(r);
        const _rlKey = rankState.pitchRole==='reliever' ? 'reliever' : 'starter';
        const _ovKey = c.key==='oswing'?'oSwing':c.key;
        const bg=_ovBg(r[c.key], _ovKey, _rlKey);
        return`<td style="${bg?'background:'+bg+';':''}"><div style="font-family:'DM Mono';font-size:13px;font-weight:700;color:${c.color}">${v}</div><div style="font-size:10px;color:rgba(160,190,220,0.7)">${rk!=null?rk+'位':''}</div></td>`;
      }).join('')}
    </tr>`;
  }).join('')}</tbody>`;

  return`${dateFilterBar}<div class="rnk-tbl-wrap"><table class="rnk-tbl">${thead}${tbody}</table></div>`;
}

function _getSeasonPitcherTableHtml() {
  const pitchersMap = {};
  const isOverall = rankState.pitchPitchType === 'all';
  const currentSplit = rankState.pitchSplit;
  const getSortArrow = (key) => rankPitSortKey === key ? (rankPitSortAsc ? '↑' : '↓') : '↕';
  const sk = rankPitSortKey||'swstr';

  const cols = isOverall ? [
    {label:'空振り率',key:'swstr',color:'var(--blue)'},{label:'ボール球SW%',key:'oswing',color:'var(--cyan)'},
    {label:'ストライク率',key:'strike',color:'var(--text2)'},{label:'ゾーン率',key:'zone',color:'var(--green)'},
    {label:'K-BB%',key:'kbbpct',color:'#A78BFA'},{label:'K%',key:'kpct',color:'#F59E0B'},
    {label:'BB%',key:'bbpct',color:'#F87171'},{label:'GB%',key:'gbpct',color:'var(--teal)'}
  ] : [
    {label:'空振り率',key:'swstr',color:'var(--blue)'},{label:'ボール球SW%',key:'oswing',color:'var(--cyan)'},
    {label:'ストライク率',key:'strike',color:'var(--text2)'},{label:'ゾーン率',key:'zone',color:'var(--green)'},
    {label:'GB%',key:'gbpct',color:'var(--teal)'},
    ...(currentSport==='mlb'?[{label:'xwOBA',key:'xwoba',color:'#93C5FD'}]:[]),
    {label:'投球割合',key:'pct',color:'var(--text2)'},
    {label:'平均球速',key:'ave',color:'var(--gold)'},{label:'最高球速',key:'maxVel',color:'var(--orange)'},
    ...(currentSport==='mlb'?[
      {label:'回転数',key:'avgSpin',color:'#A78BFA'},
      {label:'回転軸',key:'spinAxis',color:'#C4B5FD'},
      {label:'回転効率(近似)',key:'activeSpin',color:'#DDD6FE'},
      {label:'VAA',key:'vaa',color:'#F9A8D4'},
      {label:'縦変化量',key:'ivb',color:'#67E8F9'},
      {label:'横変化量',key:'hb',color:'#86EFAC'},
      {label:'Extension',key:'ext',color:'#FCD34D'},
    ]:[]),
  ];

  Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
    (DATA[date]||[]).forEach(g=>{
      ['home','away'].forEach(side=>{
        (g.pitchers[side]||[]).forEach(p=>{
          if(rankState.pitchRole==='starter'&&p.role!=='先発') return;
          if(rankState.pitchRole==='reliever'&&p.role!=='中継ぎ') return;
          const key=p.name+'|'+(side==='home'?g.home:g.away);
          if(!pitchersMap[key]){
            pitchersMap[key]={name:p.name,team:(side==='home'?g.home:g.away),
              apps:0,ipRaw:0,pitches:0,k:0,bb:0,h:0,er:0,tbfSum:0,
              swstrSum:0,oswingSum:0,strikeSum:0,zoneSum:0,
              gbSum:0,gbCnt:0,kpctSum:0,kpctCnt:0,bbpctSum:0,bbpctCnt:0,kbbpctSum:0,kbbpctCnt:0,
              velSum:0,velCnt:0,maxVel:0,pitchCount:0,pitchName:'',pitchPctSum:0,pitchPctCnt:0,_n:0,
              avgSpinSum:0,avgSpinCnt:0,spinAxisSum:0,spinAxisCnt:0,activeSpinSum:0,activeSpinCnt:0,
              vaaSum:0,vaaCnt:0,ivbSum:0,ivbCnt:0,hbSum:0,hbCnt:0,extSum:0,extCnt:0,
              xwobaSum:0,xwobaCnt:0};
          }
          const d=pitchersMap[key];
          d.apps++;
          const ipV=String(p.ip||'0');const[w,f]=ipV.split('.');
          d.ipRaw+=parseInt(w||0)*3+(f==='1'?1:f==='2'?2:0);
          d.pitches+=p.pitches||0;d.k+=p.k||0;d.bb+=p.bb||0;d.h+=p.h||0;d.er+=p.er||0;
          // tbf蓄積（K%/BB%の分母）
          d.tbfSum += p.tbf||(p.k||0)+(p.bb||0)+(p.h||0);
          if(isOverall){
            let stat=null;
            if(currentSplit==='vs_r') stat=p.pitStatVsR||null;
            else if(currentSplit==='vs_l') stat=p.pitStatVsL||null;
            const n=(stat?stat.pitches:p.pitches)||1;
            const sw=stat?stat.swstr:p.swstr;
            const os=stat?(stat.oSwing!=null?stat.oSwing:stat.oswing):(p.oSwing!=null?p.oSwing:p.oswing);
            const st=stat?stat.strike:p.strike;
            const zo=stat?stat.zone:p.zone;
            const gb=stat?stat.gbpct:p.gbpct;
            const kp=stat?stat.kpct:p.kpct;
            const bbp=stat?stat.bbpct:p.bbpct;
            const kbbp=stat?stat.kbbpct:p.kbbpct;
            if(sw!=null)  d.swstrSum+=sw*n;
            if(os!=null)  d.oswingSum+=os*n;
            if(st!=null)  d.strikeSum+=st*n;
            if(zo!=null)  d.zoneSum+=zo*n;
            if(gb!=null) {d.gbSum+=gb;d.gbCnt++;}
            if(kp!=null) {d.kpctSum+=kp;d.kpctCnt++;}
            if(bbp!=null){d.bbpctSum+=bbp;d.bbpctCnt++;}
            if(kbbp!=null){d.kbbpctSum+=kbbp;d.kbbpctCnt++;}
            d._n+=n;
          } else {
            const mixSrc=currentSplit==='vs_r'?(p.mixVsR||p.mix||[]):currentSplit==='vs_l'?(p.mixVsL||p.mix||[]):(p.mix||[]);
            const mix=mixSrc.find(x=>x.key===rankState.pitchPitchType);
            if(mix&&mix.count>0){
              const n=mix.count;
              d.pitchName=mix.name;d.pitchCount+=n;
              if(mix.swstr!=null) d.swstrSum+=mix.swstr*n;
              if(mix.oSwing!=null) d.oswingSum+=mix.oSwing*n;
              if(mix.strike!=null) d.strikeSum+=mix.strike*n;
              if(mix.zone!=null) d.zoneSum+=mix.zone*n;
              if(mix.gbpct!=null){d.gbSum+=mix.gbpct;d.gbCnt++;}
              if(mix.vel>0){d.velSum+=mix.vel*n;d.velCnt+=n;}
              if(mix.maxVel>d.maxVel) d.maxVel=mix.maxVel;
              if(mix.pct!=null){d.pitchPctSum+=mix.pct;d.pitchPctCnt++;}
              if(mix.avgSpin!=null&&mix.avgSpin>0){d.avgSpinSum+=mix.avgSpin*n;d.avgSpinCnt+=n;}
              if(mix.spinAxis!=null){d.spinAxisSum+=mix.spinAxis*n;d.spinAxisCnt+=n;}
              if(mix.activeSpin!=null){d.activeSpinSum+=mix.activeSpin*n;d.activeSpinCnt+=n;}
              if(mix.vaa!=null){d.vaaSum+=mix.vaa*n;d.vaaCnt+=n;}
              if(mix.ivb!=null){d.ivbSum+=mix.ivb*n;d.ivbCnt+=n;}
              if(mix.hb!=null){d.hbSum+=mix.hb*n;d.hbCnt+=n;}
              if(mix.ext!=null&&mix.ext>0){d.extSum+=mix.ext*n;d.extCnt+=n;}
              if(mix.xwoba!=null){d.xwobaSum+=mix.xwoba*n;d.xwobaCnt+=n;}
            }
          }
        });
      });
    });
  });

  // 投球回フィルターのデフォルト: 1軍/MLB=50回, 2軍=30回
  const _seaPitIPDefault = (currentLeague==='ni') ? 30 : 50;
  const minIPRaw=(window._seaPitMinIP != null ? window._seaPitMinIP : _seaPitIPDefault)*3;
  const minPitchCount = isOverall ? 0 : (window._seaPitMinPitches != null ? window._seaPitMinPitches : 100);
  const res=Object.values(pitchersMap).filter(d=>d.ipRaw>=minIPRaw&&(isOverall?d.ipRaw>0:d.pitchCount>=minPitchCount)).map(d=>{
    const ip=Math.floor(d.ipRaw/3)+'.'+(d.ipRaw%3===0?'0':d.ipRaw%3===1?'1':'2');
    const era=d.ipRaw>0?+(d.er/(d.ipRaw/3)*9).toFixed(2):null;
    const tot=isOverall?(d._n||d.pitches||1):(d.pitchCount||1);
    const m=getSeasonMasterData(d.name,'pitcher')||{};
    // マスタデータはNPB1軍のみ存在するため、他リーグでは使わない
    const hasMaster=m['空振り率']!=null&&isOverall&&currentSplit==='all'&&currentSport==='npb'&&currentLeague==='ichi';
    const subLabel=isOverall?`${ip}回 防${era??'—'} ${d.k}K ${d.bb}BB / ${d.apps}登板`:`${d.pitchCount}球 (${d.pitchName||'—'})`;
    return{
      name:d.name,team:d.team,ipStr:ip,apps:d.apps,k:d.k,bb:d.bb,era,subLabel,
      pitchCount:isOverall?null:d.pitchCount,
      swstr: hasMaster&&m['空振り率']!=null?parseFloat(m['空振り率']):(tot>0?+(d.swstrSum/tot).toFixed(1):0),
      oswing:hasMaster&&m['ゾーン外スイング率']!=null?parseFloat(m['ゾーン外スイング率']):(tot>0?+(d.oswingSum/tot).toFixed(1):0),
      strike:hasMaster&&m['ストライク率']!=null?parseFloat(m['ストライク率']):(tot>0?+(d.strikeSum/tot).toFixed(1):0),
      zone:  hasMaster&&m['ゾーン率']!=null?parseFloat(m['ゾーン率']):(tot>0?+(d.zoneSum/tot).toFixed(1):0),
      gbpct: d.gbCnt>0?+(d.gbSum/d.gbCnt).toFixed(1):null,
      kpct:  d.tbfSum>0 ? +(d.k/d.tbfSum*100).toFixed(1) : null,
      bbpct: d.tbfSum>0 ? +(d.bb/d.tbfSum*100).toFixed(1) : null,
      kbbpct:d.tbfSum>0 ? +((d.k-d.bb)/d.tbfSum*100).toFixed(1) : null,
      ave:   d.velCnt>0?+(d.velSum/d.velCnt).toFixed(1):null,
      maxVel:d.maxVel||null,
      pct:   d.pitchPctCnt>0?+(d.pitchPctSum/d.pitchPctCnt).toFixed(1):null,
      avgSpin:   d.avgSpinCnt>0?Math.round(d.avgSpinSum/d.avgSpinCnt):null,
      spinAxis:  d.spinAxisCnt>0?Math.round(d.spinAxisSum/d.spinAxisCnt):null,
      activeSpin:d.activeSpinCnt>0?+(d.activeSpinSum/d.activeSpinCnt).toFixed(1):null,
      vaa:   d.vaaCnt>0?+(d.vaaSum/d.vaaCnt).toFixed(1):null,
      ivb:   d.ivbCnt>0?+(d.ivbSum/d.ivbCnt).toFixed(1):null,
      hb:    d.hbCnt>0?+(d.hbSum/d.hbCnt).toFixed(1):null,
      ext:   d.extCnt>0?+(d.extSum/d.extCnt).toFixed(2):null,
      xwoba: d.xwobaCnt>0?+(d.xwobaSum/d.xwobaCnt).toFixed(3):null,
    };
  });

  const _sqS=(rankState.searchQuery||'').trim();
  const res_final=_sqS?res.filter(r=>r.name.includes(_sqS)||r.team.includes(_sqS)):res;
  res_final.sort((a,b)=>rankPitSortAsc?((a[sk]??-999)-(b[sk]??-999)):((b[sk]??-999)-(a[sk]??-999)));

  // フィルターUI（総合=投球回、球種別=球数）
  const ipVal=window._seaPitMinIP != null ? window._seaPitMinIP : _seaPitIPDefault;
  const pitchVal = window._seaPitMinPitches != null ? window._seaPitMinPitches : 100;
  const filterBarHtml=`<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border2);background:var(--bg3);flex-wrap:wrap;">
    ${isOverall ? `
    <span style="font-size:10px;color:var(--text3);font-family:'DM Mono'">投球回フィルター</span>
    <div style="display:flex;align-items:center;gap:4px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;">
      <span style="font-size:10px;color:var(--text3)">≥</span>
      <input type="number" min="0" step="1" value="${ipVal}" placeholder="50" onchange="onSeaPitIPFilter(this.value)" onblur="onSeaPitIPFilter(this.value)" onfocus="this.select()"
        style="width:48px;background:transparent;border:none;color:var(--text3);font-family:'DM Mono';font-size:12px;font-weight:700;outline:none;text-align:center;" oninput="this.style.color='var(--text)'" onkeydown="if(event.key==='Enter')this.blur()">
      <span style="font-size:10px;color:var(--text3)">回</span>
    </div>` : `
    <span style="font-size:10px;color:var(--text3);font-family:'DM Mono'">球数フィルター</span>
    <div style="display:flex;align-items:center;gap:4px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;">
      <span style="font-size:10px;color:var(--text3)">≥</span>
      <input type="number" min="0" step="1" value="${pitchVal}" placeholder="100" onchange="window._seaPitMinPitches=+this.value;_updateRankContent()" onblur="window._seaPitMinPitches=+this.value;_updateRankContent()" onfocus="this.select()"
        style="width:56px;background:transparent;border:none;color:var(--text3);font-family:'DM Mono';font-size:12px;font-weight:700;outline:none;text-align:center;" oninput="this.style.color='var(--text)'" onkeydown="if(event.key==='Enter')this.blur()">
      <span style="font-size:10px;color:var(--text3)">球</span>
    </div>`}
    <span style="font-size:10px;color:var(--text3)">${res_final.length}名</span>
  </div>`;

  if(!res_final.length){
    return filterBarHtml+`<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px">条件一致なし</div>`;
  }

  // 各指標の独立順位計算
  function calcRk(arr,key,loIsBest=false){
    const s=[...arr].sort((a,b)=>loIsBest?((a[key]??999)-(b[key]??999)):((b[key]??-999)-(a[key]??-999)));
    const m=new Map();let rk=1;
    s.forEach((r,i)=>{if(i>0&&r[key]!==s[i-1][key])rk=i+1;m.set(r,rk);});return m;
  }
  const rkMaps={};
  cols.forEach(c=>{rkMaps[c.key]=calcRk(res_final,c.key,c.key==='bbpct');});
  const dispRkMap=calcRk(res_final,sk,sk==='bbpct');

  const thead=`<thead><tr>
    <th style="min-width:180px;padding-left:14px;">投手</th>
    ${cols.map(c=>`<th style="min-width:82px;color:${c.color};cursor:pointer;font-weight:${sk===c.key?'700':'500'}" onclick="pitRankLogSort('${c.key}')">${c.label} ${getSortArrow(c.key)}</th>`).join('')}
  </tr></thead>`;

  const tbody=`<tbody>${res_final.map(r=>{
    const tc=TC[r.team]||'var(--text3)';
    const dispRank=dispRkMap.get(r)||1;
    const nameHtml=`<div style="font-size:${r.name.length>=8?'12px':'13px'};font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.3)" onclick="openPlayerPageAuto('${r.name}','${r.team}')">${r.name}</span> <span style="font-size:10px;color:${tc}">${r.team}</span></div>${!isOverall?`<div style="font-family:'DM Mono';font-size:9px;color:var(--text3);margin-top:2px">${r.pitchCount!=null?r.pitchCount+'球':''} ${r.subLabel.replace(/^\d+球 /,'')}</div>`:`<div style="font-family:'DM Mono';font-size:9px;color:var(--text3);margin-top:2px">${r.subLabel}</div>`}`;
    return`<tr>
      <td style="padding:8px 8px 8px 14px;min-width:180px;vertical-align:top;">
        <div style="display:flex;align-items:flex-start;gap:6px;">
          <span style="font-family:'DM Mono';font-size:14px;font-weight:700;color:var(--gold);width:20px;text-align:right;flex-shrink:0;margin-top:2px">${dispRank}</span>
          <div>${nameHtml}</div>
        </div>
      </td>
      ${cols.map(c=>{
        const raw=r[c.key];
        if(raw==null) return`<td><div style="font-family:'DM Mono';font-size:13px;font-weight:700;color:var(--text3)">—</div></td>`;
        let val=parseFloat(raw).toFixed(1);
        if(['ave','maxVel'].includes(c.key)) val+='km/h';
        else if(c.key==='avgSpin') val=Math.round(raw)+'rpm';
        else if(c.key==='spinAxis') val=Math.round(raw)+'°';
        else if(c.key==='activeSpin') val=parseFloat(raw).toFixed(1)+'%';
        else if(c.key==='vaa') val=parseFloat(raw).toFixed(1)+'°';
        else if(c.key==='ivb'||c.key==='hb') val=parseFloat(raw).toFixed(1)+'cm';
        else if(c.key==='ext') val=parseFloat(raw).toFixed(2)+'m';
        else if(c.key==='xwoba') val=parseFloat(raw).toFixed(3);
        else if(c.key!=='pct') val+='%';
        const rk=rkMaps[c.key]?.get(r);
        const bg=_rkBg(rk,res_final.length,c.key==='bbpct'||c.key==='xwoba');
        return`<td style="${bg?'background:'+bg+';':''}"><div style="font-family:'DM Mono';font-size:13px;font-weight:700;color:${c.color}">${val}</div><div style="font-size:10px;color:rgba(160,190,220,0.7)">${rk!=null?rk+'位':''}</div></td>`;
      }).join('')}
    </tr>`;
  }).join('')}</tbody>`;

  return`${filterBarHtml}<div class="rnk-tbl-wrap"><table class="rnk-tbl">${thead}${tbody}</table></div>`;
}

function _buildRankBatter() {
  const isSeason = rankState.mode === 'season';
  const batters = [];
  Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
    (DATA[date]||[]).forEach(g=>{
      ['home','away'].forEach(side=>{
        (g.batters[side]||[]).forEach(b=>{
          const validAbs=(b.abs||[]).filter(a=>a&&a!=='—');
          const actualPa=Math.max(b.pa||0,validAbs.length);
          if(actualPa<1) return;
          const _naB = a => {
            if(a==='本'||a==='HR') return 'HR'; if(a==='二'||a==='2B') return '2B';
            if(a==='三'||a==='3B') return '3B'; if(a==='単'||a==='H')  return 'H';
            if(a==='四'||a==='申四'||a==='BB') return 'BB';
            if(a==='死'||a==='HBP') return 'HBP';
            if(a==='三振'||a==='K') return 'K';
            if(a==='ゴロ') return 'GO'; if(a==='飛'||a==='内飛') return 'FO';
            if(a==='ライナー') return 'LD'; if(a==='犠飛') return 'SF'; if(a==='犠打') return 'SB';
            return a;
          };
          const normAbs=validAbs.map(_naB);
          const hr=normAbs.filter(a=>a==='HR').length;
          const tb=normAbs.reduce((s,a)=>s+(a==='HR'?4:a==='3B'?3:a==='2B'?2:(a==='H'?1:0)),0);
          const gok=normAbs.filter(a=>a==='GO'||a==='DP'||a==='K').length;
          const ob=normAbs.filter(a=>a==='HR'||a==='3B'||a==='2B'||a==='H'||a==='BB').length;
          batters.push({date,name:b.name,team:side==='home'?g.home:g.away,
            ops:b.ops||0,hr,rbi:b.rbi||0,tb,gok,ob,pa:actualPa,abs:normAbs,
            swStr:b.swStr!=null?b.swStr:(b.whiff||0),
            chase:b.chase||0,contact:b.contact||0,
            avgEV:b.avgEV??null, maxEV:b.maxEV??null,
            xwoba:b.xwoba??null, barrel:b.barrelN??null});
        });
      });
    });
  });
  window._rankBatterData=batters;
  // modeが変わった場合はソートキーをリセット
  const _defBatSortKey = currentSport === 'mlb' ? 'barrel' : 'tb';
  if(window._rankLastMode !== rankState.mode) {
    window._rankBatSortKey=_defBatSortKey;
    window._rankBatSortAsc=false;
    window._rankBatShowAll=false;
    window._rankLastMode=rankState.mode;
  }
  window._rankBatSortKey=window._rankBatSortKey||_defBatSortKey;
  window._rankBatSortAsc=window._rankBatSortAsc||false;

  const batSplit=rankState.batSplit||'all';
  const splitBtns=['all','vs_r','vs_l'].map((v,i)=>{
    const lbl=['全体','対右','対左'][i];
    const active=batSplit===v;
    const bg=active?'var(--bg3)':'transparent';
    const cl=active?'var(--text)':'var(--text3)';
    const bx=active?'box-shadow:0 1px 4px rgba(0,0,0,0.4)':'';
    return '<button onclick="switchBatSplit(\'' + v + '\')" style="padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;background:' + bg + ';color:' + cl + ';border:none;border-radius:5px;transition:all .15s;' + bx + '">' + lbl + '</button>';
  }).join('');
  const batSplitBar='<div style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--border2);background:var(--bg3)"><div style="display:inline-flex;background:var(--bg4);border:1px solid var(--border2);border-radius:7px;padding:2px;gap:1px">'+splitBtns+'</div></div>';

  return '<div class="card" style="padding:0;border-radius:12px;overflow:hidden;background:var(--bg2)">'
       + '<div id="rank-bat-content" style="background:var(--bg3)">'+_getRankBatListHtml()+'</div>'
       + '</div>';
}

function _getRankBatListHtml() {
  const isSeason = rankState.mode === 'season';
  let data = [...(window._rankBatterData||[])];
  const minPA = (window._seaBatMinPA!=null&&window._seaBatMinPA!=='')?window._seaBatMinPA:1;
  const batSplit = rankState.batSplit||'all';

  if(isSeason){
    if(batSplit!=='all' && window.SEASON_DATA && window.SEASON_DATA['シーズン打者マスタ_左右別']) {
      const vsKey = batSplit==='vs_r'?'右':'左';
      data = window.SEASON_DATA['シーズン打者マスタ_左右別'].filter(r=>r['対投手']===vsKey).map(r=>({
        name:r['選手名']||'', team:r['チーム']||'',
        pa:+(r['打席']||0), hr:+(r['本塁打']||0), rbi:+(r['打点']||0),
        tb:+(r['長打']||0)*2+(r['単打']||0)+(r['三塁打']||0)*3+(r['本塁打']||0)*4,
        ob:+(r['安打']||0)+(r['四球']||0)+(r['死球']||0),
        gok:0, ops:+(r['OPS']||0),
        swStr:r['whiff%']!=null?parseFloat(r['whiff%']):null,
        chase:r['O-Swing%']!=null?parseFloat(r['O-Swing%']):null,
        contact:r['Z-Swing%']!=null?parseFloat(r['Z-Swing%']):null,
        abs:[]
      }));
    } else {
      const batMap={};
      data.forEach(b=>{
        const key=b.name+'|'+b.team;
        if(!batMap[key]) batMap[key]={name:b.name,team:b.team,pa:0,hr:0,rbi:0,tb:0,gok:0,ob:0,
          opsSum:0,opsCnt:0,swStrSum:0,swStrCnt:0,chaseSum:0,chaseCnt:0,contactSum:0,contactCnt:0,
          avgEVSum:0,avgEVCnt:0,maxEV:null,xwobaSum:0,xwobaCnt:0,barrel:0,cnt:0};
        const d=batMap[key];
        d.pa+=b.pa;d.hr+=b.hr;d.rbi+=b.rbi;d.tb+=b.tb;d.gok+=b.gok;d.ob+=b.ob;
        if(b.ops>0){d.opsSum+=b.ops;d.opsCnt++;}
        if(b.swStr>0){d.swStrSum+=b.swStr;d.swStrCnt++;}
        if(b.chase>0){d.chaseSum+=b.chase;d.chaseCnt++;}
        if(b.contact>0){d.contactSum+=b.contact;d.contactCnt++;}
        if(b.avgEV!=null){d.avgEVSum+=b.avgEV;d.avgEVCnt++;}
        if(b.maxEV!=null&&(d.maxEV==null||b.maxEV>d.maxEV)) d.maxEV=b.maxEV;
        if(b.xwoba!=null){d.xwobaSum+=b.xwoba;d.xwobaCnt++;}
        if(b.barrel!=null) d.barrel+=b.barrel;
        d.cnt++;
      });
      data=Object.values(batMap).map(d=>{
        // マスタデータはNPB1軍のみ存在するため、他リーグでは使わない
        const m=(currentSport==='npb'&&currentLeague==='ichi')?getSeasonMasterData(d.name,'batter')||{}:{};
        d.ops=m['OPS']!=null&&parseFloat(m['OPS'])>0?parseFloat(m['OPS']):(d.opsCnt>0?+(d.opsSum/d.opsCnt).toFixed(3):0);
        if(m['本塁打']!=null&&parseInt(m['本塁打'])>0) d.hr=parseInt(m['本塁打']);
        if(m['打点']!=null&&parseInt(m['打点'])>0) d.rbi=parseInt(m['打点']);
        if(m['塁打']!=null&&parseInt(m['塁打'])>0) d.tb=parseInt(m['塁打']);
        d.avgEV = m['平均打球速度EV(km/h)']!=null ? parseFloat(m['平均打球速度EV(km/h)']) : (d.avgEVCnt>0 ? +(d.avgEVSum/d.avgEVCnt).toFixed(1) : null);
        d.maxEV = m['最高打球速度EV(km/h)']!=null ? parseFloat(m['最高打球速度EV(km/h)']) : d.maxEV;
        d.xwoba = m['xwOBA']!=null ? parseFloat(m['xwOBA']) : (d.xwobaCnt>0 ? +(d.xwobaSum/d.xwobaCnt).toFixed(3) : null);
        const mSwStr=m['whiff%']!=null?parseFloat(m['whiff%']):null;
        const mChase=m['O-Swing%']!=null?parseFloat(m['O-Swing%']):null;
        const mContact=m['Z-Swing%']!=null?parseFloat(m['Z-Swing%']):null;
        d.swStr=mSwStr!=null?mSwStr:(d.swStrCnt>0?+(d.swStrSum/d.swStrCnt).toFixed(1):null);
        d.chase=mChase!=null?mChase:(d.chaseCnt>0?+(d.chaseSum/d.chaseCnt).toFixed(1):null);
        d.contact=mContact!=null?mContact:(d.contactCnt>0?+(d.contactSum/d.contactCnt).toFixed(1):null);
        return d;
      });
      if(minPA>0) data=data.filter(r=>r.pa>=minPA);
    }
  }

  const sk=window._rankBatSortKey||'ops';
  const asc=window._rankBatSortAsc||false;
  const _sqB=(rankState.searchQuery||'').trim();
  if(_sqB) data=data.filter(r=>r.name.includes(_sqB)||r.team.includes(_sqB));
  data.sort((a,b)=>asc?((a[sk]||0)-(b[sk]||0)):((b[sk]||0)-(a[sk]||0)));
  // 試合別: 各指標のトップ200に絞り込み（パフォーマンス改善）
  if(!isSeason) data = data.slice(0, 200);

  const _evFmt = v => v!=null ? (+v).toFixed(1)+'km/h' : '—';
  const _xwFmt = v => v!=null ? (+v).toFixed(3) : '—';
  // MLB時: バレル追加・EV avg削除・EV max→最高打球速度・xwOBA追加
  // NPB時: EV avg/max 非表示
  const colsDailyDef = currentSport === 'mlb' ? [
    {label:'バレル',      key:'barrel', color:'#10B981'},
    {label:'塁打',        key:'tb',     color:'var(--cyan)'},
    {label:'出塁',        key:'ob',     color:'var(--teal)'},
    {label:'最高打球速度',key:'maxEV',  color:'#059669', fmt:_evFmt},
    {label:'本塁打',      key:'hr',     color:'var(--red)'},
    {label:'打点',        key:'rbi',    color:'var(--gold)'},
    {label:'OPS',         key:'ops',    color:'var(--green)'},
    {label:'xwOBA',       key:'xwoba',  color:'#1A3A5C', fmt:_xwFmt},
  ] : [
    {label:'塁打',   key:'tb',  color:'var(--cyan)'},
    {label:'出塁',   key:'ob',  color:'var(--teal)'},
    {label:'本塁打', key:'hr',  color:'var(--red)'},
    {label:'打点',   key:'rbi', color:'var(--gold)'},
    {label:'OPS',    key:'ops', color:'var(--green)'},
  ];
  const colsSeasonDef = currentSport === 'mlb' ? [
    {label:'バレル',      key:'barrel', color:'#10B981'},
    {label:'塁打',        key:'tb',     color:'var(--cyan)'},
    {label:'出塁',        key:'ob',     color:'var(--teal)'},
    {label:'最高打球速度',key:'maxEV',  color:'#059669', fmt:_evFmt},
    {label:'OPS',         key:'ops',    color:'var(--green)'},
    {label:'本塁打',      key:'hr',     color:'var(--red)'},
    {label:'打点',        key:'rbi',    color:'var(--gold)'},
    {label:'xwOBA',       key:'xwoba',  color:'#1A3A5C', fmt:_xwFmt},
    {label:'空振り率',    key:'swStr',  color:'var(--blue)'},
  ] : [
    {label:'塁打',        key:'tb',     color:'var(--cyan)'},
    {label:'出塁',        key:'ob',     color:'var(--teal)'},
    {label:'OPS',         key:'ops',    color:'var(--green)'},
    {label:'本塁打',      key:'hr',     color:'var(--red)'},
    {label:'打点',        key:'rbi',    color:'var(--gold)'},
    {label:'空振り率',    key:'swStr',  color:'var(--blue)'},
    {label:'ボール球SW%', key:'chase',  color:'var(--cyan)'},
  ];
  const cols=isSeason?colsSeasonDef:colsDailyDef;
  const hasDailyDate=!isSeason;

  function calcR(arr,key){
    const s=[...arr].sort((a,b)=>(b[key]||0)-(a[key]||0));
    const m=new Map();let rk=1;
    s.forEach((r,i)=>{if(i>0&&(r[key]||0)!==(s[i-1][key]||0))rk=i+1;m.set(r,rk);});return m;
  }
  const rkMaps={};cols.forEach(c=>{rkMaps[c.key]=calcR(data,c.key);});
  const dispRkMap=calcR(data,sk);
  const rankMap=new Map();let rk=1;
  data.forEach((r,i)=>{if(i>0&&(r[sk]||0)!==(data[i-1][sk]||0))rk=i+1;rankMap.set(r,rk);});

  const getArr=(k)=>sk===k?(asc?'↑':'↓'):'↕';

  // PAフィルターUI（試合別・シーズン共通）
  const paFilterBar=`<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border2);background:var(--bg3);flex-wrap:wrap;">
    <span style="font-size:10px;color:var(--text3);font-family:'DM Mono'">打席数フィルター</span>
    <div style="display:flex;align-items:center;gap:4px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;">
      <span style="font-size:10px;color:var(--text3)">≥</span>
      <input type="number" min="0" step="1" value="${minPA>1?minPA:''}" placeholder="1" onchange="onSeaBatPAFilter(this.value)" onblur="onSeaBatPAFilter(this.value)"
        style="width:48px;background:transparent;border:none;color:var(--text);font-family:'DM Mono';font-size:12px;font-weight:700;outline:none;text-align:center;">
      <span style="font-size:10px;color:var(--text3)">打席</span>
    </div>
    <span style="font-size:10px;color:var(--text3)">${data.length}名</span>
  </div>`;

  function buildAbBadges(abs){
    if(!abs||!abs.length) return '';
    // MLB JSON打席結果「単/二/三/本/四/三振/ゴロ/飛/ライナー/犠飛/犠打/etc」→バッジ
    const _normA = a => {
      if(a==='本' || a==='HR') return 'HR';
      if(a==='二' || a==='2B') return '2B';
      if(a==='三' || a==='3B') return '3B';
      if(a==='単' || a==='H')  return 'H';
      if(a==='四' || a==='申四'|| a==='BB') return 'BB';
      if(a==='死' || a==='HBP') return 'HBP';
      if(a==='三振' || a==='K') return 'K';
      if(a==='ゴロ' || a==='GO') return 'GO';
      if(a==='飛' || a==='内飛'|| a==='FO') return 'FO';
      if(a==='ライナー' || a==='LD') return 'LD';
      if(a==='犠飛' || a==='SF') return 'SF';
      if(a==='犠打' || a==='SB') return 'SB';
      return a;
    };
    const BG={'HR':'#7B2828','2B':'#0D6B6B','3B':'#0D6B6B','H':'#1B5E40','BB':'#5C5000','HBP':'#5C3800','K':'rgba(255,255,255,0.03)','GO':'rgba(255,255,255,0.02)','FO':'rgba(255,255,255,0.02)','LD':'rgba(255,255,255,0.05)','SF':'rgba(255,255,255,0.02)','SB':'rgba(255,255,255,0.02)','DP':'rgba(255,255,255,0.02)'};
    const FG={'HR':'#FCA5A5','2B':'#67E8F9','3B':'#6EE7B7','H':'#86EFAC','BB':'#FDE047','HBP':'#FB923C','K':'#475569','GO':'#475569','FO':'#475569','LD':'#94A3B8','SF':'#475569','SB':'#475569','DP':'#475569'};
    return abs.filter(a=>a&&a!=='—').map(a=>{const n=_normA(a);return`<span style="display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:3px;font-size:7px;font-weight:700;font-family:'DM Mono';background:${BG[n]||'rgba(255,255,255,0.03)'};color:${FG[n]||'#475569'};border:1px solid rgba(255,255,255,0.06);margin-right:2px;padding:0 2px">${n}</span>`;}).join('');
  }

  const thead=`<thead><tr>
    <th style="min-width:180px;padding-left:14px;">打者 / 打席結果</th>
    ${!isSeason?`<th style="min-width:72px;color:var(--text3);font-weight:500;white-space:nowrap;">日付</th>`:''}
    ${cols.map(c=>`<th style="min-width:70px;color:${sk===c.key?c.color:'var(--text3)'};cursor:pointer;font-weight:${sk===c.key?'700':'500'}" onclick="rankBatSortByKey('${c.key}')">${c.label} ${getArr(c.key)}</th>`).join('')}
  </tr></thead>`;

  const rows=data.slice(0,isSeason?99999:100).map(r=>{
    const tc=TC[r.team]||'var(--text3)';
    const rnk=rankMap.get(r)||1;
    const opsV=(+r.ops).toFixed(3).replace(/^0/,'');
    const subText=isSeason?`${r.pa}打席`:'';
    const dateDisp=!isSeason?(r.date?(r.date.slice(5).replace('-','/')):('—')):'';
    return`<tr>
      <td style="padding:8px 8px 8px 14px;min-width:180px;vertical-align:top;">
        <div style="display:flex;align-items:flex-start;gap:6px;">
          <span style="font-family:'DM Mono';font-size:14px;font-weight:700;color:var(--gold);width:20px;text-align:right;flex-shrink:0;margin-top:2px">${rnk}</span>
          <div>
            <div style="font-size:13px;font-weight:700;"><span style="cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.35)" onclick="openPlayerPageAuto('${r.name}','${r.team}')">${r.name}</span> <span style="font-size:10px;color:${tc}">${r.team}</span></div>
            ${isSeason?`<div style="font-size:9px;color:var(--text3);margin-top:2px">${subText}</div>`:`<div style="margin-top:3px;">${buildAbBadges(r.abs||[])}</div>`}
          </div>
        </div>
      </td>
      ${!isSeason?`<td style="vertical-align:top;padding-top:10px;"><span style="font-family:'DM Mono';font-size:11px;color:var(--text3);white-space:nowrap;">${dateDisp}</span></td>`:''}
      ${cols.map(c=>{
        const rk2=rkMaps[c.key]?.get(r);
        let val;
        if(c.key==='ops') val=opsV;
        else if(c.fmt) val=c.fmt(r[c.key]);
        else if(['swStr','chase','contact'].includes(c.key)) val=r[c.key]!=null?(+r[c.key]).toFixed(1)+'%':'—';
        else val=r[c.key]!=null?String(r[c.key]):'—';
        return`<td><div style="font-family:'DM Mono';font-size:13px;font-weight:700;color:${sk===c.key?c.color:'var(--text2)'}">${val}</div><div style="font-size:10px;color:rgba(160,190,220,0.7)">${rk2!=null?rk2+'位':''}</div></td>`;
      }).join('')}
    </tr>`;
  });

  return`${paFilterBar}<div class="rnk-tbl-wrap"><table class="rnk-tbl">
    ${thead}<tbody>${rows.join('')}</tbody>
  </table></div>`;
}

function _buildRankHero() {
  const isSeason = rankState.mode === 'season';

  if (isSeason) {
    const counts = {};
    Object.values(DATA.highlights || {}).forEach(list => {
      list.forEach(h => {
        const key = h.player + '|' + h.team;
        if (!counts[key]) counts[key] = { name: h.player, team: h.team, count: 0 };
        counts[key].count++;
      });
    });
    const heroes = Object.values(counts).sort((a,b) => b.count - a.count);
    const headerHtml = `<div style="display:grid; grid-template-columns:${heroGrid}; padding:10px 16px; background:var(--bg3); border-bottom:1px solid var(--border2); font-size:10px; color:var(--text3)">
      <div>選手 / チーム</div><div>選出回数</div><div>-</div></div>`;
    
    let rankHero = 1;
    const rowsHtml = heroes.map((r,i) => {
      if(i>0 && r.count !== heroes[i-1].count) rankHero = i+1;
      const tc = TC[r.team] || 'var(--text3)';
      return `<div class="hero-row" style="display:grid; grid-template-columns:${heroGrid}; align-items:center; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.05);">
        <div style="font-size:15px;font-weight:700;color:var(--text)">
          <span class="rank-num-col" style="font-size:14px; margin-right:8px; color:var(--gold)">${rankHero}</span>
          <span style="cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.3)" onclick="openPlayerPageAuto('${r.name}','${r.team}')">${r.name}</span>
          <span style="font-size:11px;color:${tc};margin-left:8px">${r.team}</span>
        </div>
        <div style="font-family:'DM Mono';font-size:18px;font-weight:700;color:var(--gold)">${r.count}<span style="font-size:11px;margin-left:4px;color:var(--text3)">回</span></div>
        <div></div>
      </div>`;
    }).join('');
    return `<div class="card" style="padding:0;border-radius:12px;overflow:hidden;background:var(--bg3)">${headerHtml}${rowsHtml}</div>`;
  } else {
    const logs = [];
    Object.keys(DATA.highlights || {}).sort((a,b)=>b.localeCompare(a)).forEach(date => {
      DATA.highlights[date].forEach(h => logs.push({date, ...h}));
    });

    const headerHtml = `
      <div style="display:grid; grid-template-columns:${heroGrid}; padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--border); font-size:11px; font-weight:700; color:var(--text3)">
        <div>選手 / チーム</div>
        <div>日付</div>
        <div>活躍内容詳細</div>
      </div>`;

    const rowsHtml = logs.map(r => {
      const tc = TC[r.team] || 'var(--text3)';
      return `<div class="hero-row" style="display:grid; grid-template-columns:${heroGrid}; border-bottom:1px solid rgba(255,255,255,0.05); align-items:center;">
        <div style="padding:12px 16px; font-weight:700; color:var(--text);">
          <span style="cursor:pointer; border-bottom:1px solid rgba(59,130,246,0.3)" onclick="openPlayerPageAuto('${r.player}','${r.team}')">${r.player}</span> 
          <span style="font-size:10px; color:${tc}; margin-left:8px; border:1px solid ${tc}33; padding:2px 6px; border-radius:4px">${r.team}</span>
        </div>
        <div style="padding:12px 16px; font-family:'DM Mono'; color:var(--text2); font-size:12px;">${r.date.slice(5).replace('-','/')}</div>
        <div style="padding:12px 16px; color:var(--text2); font-size:12px; line-height:1.5">${r.detail||'—'}</div>
      </div>`;
    }).join('');

    return `<div class="card" style="padding:0; border-radius:12px; overflow:hidden; background:var(--bg2);">${headerHtml}${rowsHtml}</div>`;
  }
}

// --- 差し替え/追加する定数と関数 ---
const STRAIGHT_KEYS = ['FF'];
const PITCH_MIN = 5;

// 投手全体指標の共通色付け関数（全試合のパーセンタイル基準）
// roleKey: 'starter' or 'reliever'
// colKey: 'swstr','oSwing','strike','zone','kpct','bbpct','kbbpct','gbpct'
const _OV_LO_KEYS = new Set(['bbpct']); // 低いほど良い
const _OV_DIR = {swstr:true,oSwing:true,strike:true,zone:true,kpct:true,bbpct:false,kbbpct:true,gbpct:true};
function _ovBg(val, colKey, roleKey) {
  if(val==null||isNaN(+val)) return '';
  const stats = (window._pitcherOverallStats||{})[roleKey||'starter'];
  if(!stats) return '';
  const s = stats[colKey] || stats[colKey==='oSwing'?'oSwing':colKey];
  if(!s) return '';
  const v = +val, dir = _OV_DIR[colKey];
  if(dir===undefined) return '';
  const {p15,p30,p40,p60,p70,p85} = s;
  let rank;
  if(dir){ // 高いほど良い
    if(v>=p85) rank='top15'; else if(v>=p70) rank='top30'; else if(v>=p60) rank='top40';
    else if(v>=p40) rank='mid'; else if(v>=p30) rank='bot60'; else if(v>=p15) rank='bot70'; else rank='bot85';
  } else { // 低いほど良い
    if(v<=p15) rank='top15'; else if(v<=p30) rank='top30'; else if(v<=p40) rank='top40';
    else if(v<=p60) rank='mid'; else if(v<=p70) rank='bot60'; else if(v<=p85) rank='bot70'; else rank='bot85';
  }
  switch(rank){
    case 'top15': return 'rgba(18,165,178,0.40)';
    case 'top30': return 'rgba(18,165,178,0.25)';
    case 'top40': return 'rgba(18,165,178,0.12)';
    case 'mid':   return '';
    case 'bot60': return 'rgba(238,122,151,0.10)';
    case 'bot70': return 'rgba(238,122,151,0.18)';
    case 'bot85': return 'rgba(238,122,151,0.38)';
  }
  return '';
}

// rnkSort: 投球ランキング（日次）テーブルのヘッダークリックソート
function rnkSort(tableId, key, headerEl) {
  const wrap = document.getElementById(tableId);
  if (!wrap) return;
  let rawRows;
  try { rawRows = JSON.parse(wrap.dataset.rows || '[]'); } catch(e) { return; }

  // ↕ / ↓ / ↑ トグル
  const curAsc = headerEl.dataset.asc;
  wrap.querySelectorAll('[data-key]').forEach(el => {
    el.dataset.asc = '-1';
    const a = el.querySelector('.sort-arrow'); if(a) a.textContent = '↕';
  });
  const newAsc = curAsc === '0' ? '1' : '0';
  headerEl.dataset.asc = newAsc;
  const arrEl = headerEl.querySelector('.sort-arrow');
  if(arrEl) arrEl.textContent = newAsc === '1' ? '↑' : '↓';

  // ソート
  const isAsc = newAsc === '1';
  rawRows.sort((a,b) => {
    const va = a[key]==null ? (isAsc ? Infinity : -Infinity) : parseFloat(a[key]);
    const vb = b[key]==null ? (isAsc ? Infinity : -Infinity) : parseFloat(b[key]);
    return isAsc ? va-vb : vb-va;
  });

  // 全指標の順位マップを独立計算
  const colEls = [...wrap.querySelectorAll('[data-key]')];
  const allRkMaps = {};
  colEls.forEach(el => {
    const ck = el.dataset.key;
    const loKey = ['bbpct']; // 低い方が良い指標
    const _sv2 = v => v==null ? (loKey.includes(ck) ? Infinity : -Infinity) : parseFloat(v)||0;
    const s = [...rawRows].sort((a,b) => loKey.includes(ck)
      ? _sv2(a[ck])-_sv2(b[ck]) : _sv2(b[ck])-_sv2(a[ck]));
    const m = new Map(); let rk = 1;
    s.forEach((r,i) => {
      if(i>0 && _sv2(r[ck]) !== _sv2(s[i-1][ck])) rk = i+1;
      m.set(r, rk);
    });
    allRkMaps[ck] = m;
  });

  // 表示順位（ソートキー基準）
  const dispRkMap = allRkMaps[key] || new Map();

  const SHOW = 5;
  const COL_W=80, NAME_W=200;
  const isOverall = colEls.some(el => el.dataset.key === 'kbbpct');

  const makeRowHtml = r => {
    const tc = TC[r.team]||'var(--text3)';
    const displayRank = dispRkMap.get(r)||1;
    const pitchBadge = r.pitchName ? `${r.pitchName}${r.pitchCount?' ('+r.pitchCount+'球)':''}` : '';
    const pitchColW = (!isOverall && r.pitchName) ? 90 : 0;
    const pitchHtml = pitchColW
      ? `<div style="display:table-cell;width:${pitchColW}px;min-width:${pitchColW}px;padding:7px 8px;vertical-align:middle;font-family:'DM Mono';font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap;">${pitchBadge}</div>` : '';
    const minW = NAME_W + pitchColW + colEls.length * COL_W;
    const cellsHtml = colEls.map(el => {
      const ck = el.dataset.key;
      let v = r[ck] != null ? _tf(r[ck]) : '—';
      if(v !== '—') { if(['ave','maxVel'].includes(ck)) v += 'km/h'; else v += '%'; }
      const clr = el.style.color || 'var(--text)';
      const cellRk = allRkMaps[ck]?.get(r) ?? '—';
      // グローバルBG（全試合パーセンタイル基準）
      let bg = '';
      {
        const _rk2 = isOverall ? 'starter' : 'starter'; // rnkSortは日次なので先発固定
        const _ok = ck==='oswing'?'oSwing':ck;
        bg = _ovBg(r[ck], _ok, _rk2);
      }
      return `<div style="display:table-cell;width:${COL_W}px;min-width:${COL_W}px;text-align:left;padding:7px 4px;vertical-align:middle${bg?';background:'+bg:''}">
        <div style="font-family:'DM Mono';font-size:13px;font-weight:700;color:${clr}">${v}</div>
        <div style="font-family:'DM Mono';font-size:10px;color:rgba(160,190,220,0.85);font-weight:600">${cellRk}位</div>
      </div>`;
    }).join('');
    return `<div class="rnk-data-row" style="display:table;table-layout:fixed;width:100%;min-width:${minW}px;border-bottom:1px solid rgba(255,255,255,0.05)">
      <div style="display:table-row">
        <div style="display:table-cell;width:${NAME_W}px;min-width:${NAME_W}px;padding:7px 8px 7px 16px;vertical-align:middle;">
          <div style="display:flex;align-items:center;">
            <span class="rank-num-col">${displayRank}</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                <span style="cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.35)" onclick="openPlayerPageAuto('${r.name}','${r.team}')">${r.name}</span>
                <span style="font-size:10px;color:${tc};margin-left:4px">${r.team}</span>
              </div>
              <div style="font-family:'DM Mono';font-size:9px;color:var(--text2);margin-top:2px;">${r._stat||''}</div>
            </div>
          </div>
        </div>
        ${pitchHtml}
        ${cellsHtml}
      </div>
    </div>`;
  };

  const listEl  = document.getElementById(tableId+'-list');
  const extraEl = document.getElementById(tableId+'-extra');
  if(listEl)  listEl.innerHTML  = rawRows.slice(0,SHOW).map(makeRowHtml).join('');
  if(extraEl) extraEl.innerHTML = rawRows.slice(SHOW).map(makeRowHtml).join('');
  wrap.dataset.rows = JSON.stringify(rawRows);
}

// ランクテーブル用ピボット背景色（順位ベース）
function _rkBg(rk, total, loIsBest=false){
  if(rk==null||total==null||total===0) return '';
  const pct = (total-rk)/total; // rank1=best(teal), rankN=worst(pink) — works for both loIsBest and not
  if(pct>=0.85) return 'rgba(18,165,178,0.40)';
  if(pct>=0.70) return 'rgba(18,165,178,0.25)';
  if(pct>=0.60) return 'rgba(18,165,178,0.12)';
  if(pct>=0.40) return '';
  if(pct>=0.30) return 'rgba(238,122,151,0.10)';
  if(pct>=0.15) return 'rgba(238,122,151,0.18)';
  return 'rgba(238,122,151,0.38)';
}

// --- 打者ランキング表示ロジック（showDailySummaryの外に配置） ---
window._batBuildSection = function(sortKeyOverride, ascOverride) {
  if(sortKeyOverride !== undefined && sortKeyOverride !== null && typeof sortKeyOverride !== 'number'){
    window._batDailySortKey = sortKeyOverride;
  }
  if(ascOverride !== undefined && ascOverride !== null){
    window._batDailyAsc = ascOverride;
  }
  // MLB時はバレル数降順デフォルト、NPBは塁打降順
  const _defaultSk = currentSport === 'mlb' ? 'barrel' : 'tb';
  if(!window._batDailySortKey || window._batDailySortKey === '_prev_sport_default') window._batDailySortKey = _defaultSk;
  // barrelが全員nullの場合（データ未取得）はtbにフォールバック
  let sk = window._batDailySortKey;
  if(sk === 'barrel' && (window._batRankData||[]).every(r=>r.barrelN==null)) sk = 'tb';
  window._batDailySortKey = sk;
  if(window._batDailyAsc === undefined) window._batDailyAsc = false;
  const asc = window._batDailyAsc;

  // MLB: バレル数・最高打球速度・xwOBA追加 / EV avg削除
  // NPB: EV avg/EV max 非表示
  const COL_DEFS = currentSport === 'mlb' ? [
    {key:'barrel', label:'バレル',      color:'#10B981'},
    {key:'tb',     label:'塁打',        color:'var(--cyan)'},
    {key:'ob',     label:'出塁',        color:'var(--teal)'},
    {key:'maxEV',  label:'最高打球速度', color:'#059669', fmt: v=>v!=null?v.toFixed(1)+'km/h':'—'},
    {key:'hr',     label:'本塁打',      color:'var(--red)'},
    {key:'rbi',    label:'打点',        color:'var(--gold)'},
    {key:'ops',    label:'OPS',         color:'var(--green)'},
    {key:'xwoba',  label:'xwOBA',       color:'#93C5FD', fmt: v=>v!=null?(+v).toFixed(3):'—'},
  ] : [
    {key:'tb',  label:'塁打',  color:'var(--cyan)'},
    {key:'ob',  label:'出塁',  color:'var(--teal)'},
    {key:'hr',  label:'本塁打',color:'var(--red)'},
    {key:'rbi', label:'打点',  color:'var(--gold)'},
    {key:'ops', label:'OPS',   color:'var(--green)'},
  ];

  const _na = a => {
    if(a==='本'||a==='HR') return 'HR'; if(a==='二'||a==='2B') return '2B';
    if(a==='三'||a==='3B') return '3B'; if(a==='単'||a==='H')  return 'H';
    if(a==='四'||a==='申四'||a==='BB') return 'BB';
    if(a==='三振'||a==='K') return 'K'; if(a==='ゴロ') return 'GO';
    if(a==='飛'||a==='内飛') return 'FO'; if(a==='ライナー') return 'LD';
    return a;
  };
  const data=(window._batRankData||[]).map(r=>{
    const normAbs=(r.abs||[]).map(_na);
    const hr=normAbs.filter(a=>a==='HR').length;
    const tb=normAbs.reduce((s,a)=>s+(a==='HR'?4:a==='3B'?3:a==='2B'?2:(a==='H'?1:0)),0);
    const gok=normAbs.filter(a=>a==='GO'||a==='DP'||a==='K').length;
    const ob=normAbs.filter(a=>a==='HR'||a==='3B'||a==='2B'||a==='H'||a==='BB'||a==='HBP').length;
    return {...r, abs:normAbs, hr, tb, gok, ob,
      avgEV:  r.avgEV  ?? null,
      maxEV:  r.maxEV  ?? null,
      xwoba:  r.xwoba  ?? null,
      barrel: r.barrelN ?? null,
      xbh:normAbs.filter(a=>a==='HR'||a==='2B'||a==='3B').length};
  }).filter(r=>r.pa>=1);  // 1打席以上（全員表示）

  // null値がある列でも正確に順位付け（null → -Infinity扱いで末尾へ）
  function _sv(v) { return v == null ? -Infinity : +v; }
  const sorted=[...data].sort((a,b)=>asc?(_sv(a[sk])-_sv(b[sk])):(_sv(b[sk])-_sv(a[sk])));

  function calcR(arr,key){
    // null値は順位付けの対象外（Mapには入れるがnull専用の扱い）
    const s=[...arr].sort((a,b)=>_sv(b[key])-_sv(a[key]));
    const m=new Map();let rk=1;
    s.forEach((r,i)=>{
      // 前の要素が非null→nullに変わった場合はrk増加しない（nullはまとめて末尾）
      if(i>0){
        const prevHasVal = s[i-1][key]!=null, curHasVal = r[key]!=null;
        if(curHasVal || prevHasVal){
          if(_sv(r[key])!==_sv(s[i-1][key])) rk=i+1;
        }
      }
      m.set(r,rk);
    });return m;
  }
  const rkMaps={};COL_DEFS.forEach(c=>{rkMaps[c.key]=calcR(sorted,c.key);});
  const rankMap=new Map();let rk=1;
  sorted.forEach((r,i)=>{if(i>0&&_sv(r[sk])!==_sv(sorted[i-1][sk]))rk=i+1;rankMap.set(r,rk);});

  const getArr=(k)=>sk===k?(asc?'↑':'↓'):'↕';

  function buildAbBadges(abs){
    if(!abs||!abs.length) return '';
    const _normAB = a => {
      if(a==='本'||a==='HR') return 'HR'; if(a==='二'||a==='2B') return '2B';
      if(a==='三'||a==='3B') return '3B'; if(a==='単'||a==='H')  return 'H';
      if(a==='四'||a==='申四'||a==='BB') return 'BB'; if(a==='死') return 'HBP';
      if(a==='三振'||a==='K') return 'K'; if(a==='ゴロ') return 'GO';
      if(a==='飛'||a==='内飛') return 'FO'; if(a==='ライナー') return 'LD';
      if(a==='犠飛') return 'SF'; if(a==='犠打') return 'SB'; return a;
    };
    const BG={'HR':'#7B2828','2B':'#0D6B6B','3B':'#0D6B6B','H':'#1B5E40','BB':'#5C5000','HBP':'#5C3800','K':'rgba(255,255,255,0.03)','GO':'rgba(255,255,255,0.02)','FO':'rgba(255,255,255,0.02)','LD':'rgba(255,255,255,0.05)','SF':'rgba(255,255,255,0.02)','SB':'rgba(255,255,255,0.02)','DP':'rgba(255,255,255,0.02)'};
    const FG={'HR':'#FCA5A5','2B':'#67E8F9','3B':'#6EE7B7','H':'#86EFAC','BB':'#FDE047','HBP':'#FB923C','K':'#475569','GO':'#475569','FO':'#475569','LD':'#94A3B8','SF':'#475569','SB':'#475569','DP':'#475569'};
    return abs.filter(a=>a&&a!=='—').map(a=>`<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;font-size:7px;font-weight:700;font-family:'DM Mono';background:${BG[a]||'transparent'};color:${FG[a]||'#475569'};border:1px solid rgba(255,255,255,0.06);margin-right:2px;">${a}</span>`).join('');
  }

  const DAILY_SHOW=5;const dailyShowAll=window._batDailyShowAll||false;

  const thead=`<thead><tr>
    <th style="min-width:180px;padding-left:14px;">打者 / 打席結果</th>
    ${COL_DEFS.map(c=>`<th style="min-width:70px;color:${sk===c.key?c.color:'var(--text3)'};cursor:pointer;font-weight:${sk===c.key?'700':'500'}" onclick="batDailySortBy('${c.key}')">${c.label} ${getArr(c.key)}</th>`).join('')}
  </tr></thead>`;

  const rows=sorted.map(r=>{
    const tc=TC[r.team]||'var(--text3)';
    const rnk=rankMap.get(r)||1;
    const opsV=(+r.ops).toFixed(3).replace(/^0/,'');
    return`<tr>
      <td style="padding:8px 8px 8px 14px;min-width:180px;vertical-align:top;">
        <div style="display:flex;align-items:flex-start;gap:6px;">
          <span style="font-family:'DM Mono';font-size:14px;font-weight:700;color:var(--gold);width:20px;text-align:right;flex-shrink:0;margin-top:2px">${rnk}</span>
          <div>
            <div style="font-size:13px;font-weight:700;"><span style="cursor:pointer;border-bottom:1px solid rgba(59,130,246,0.35)" onclick="openPlayerPageAuto('${r.name}','${r.team}')" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color=''">${r.name}</span> <span style="font-size:10px;color:${tc};margin-left:4px">${r.team}</span></div>
            <div style="margin-top:3px;">${buildAbBadges(r.abs||[])}</div>
          </div>
        </div>
      </td>
      ${COL_DEFS.map(c=>{
        const val=c.key==='ops'?opsV:c.fmt?c.fmt(r[c.key]):r[c.key]!=null?String(r[c.key]):'—';
        const rk2=rkMaps[c.key]?.get(r);
        // nullデータの場合は順位表示なし
        const hasVal = r[c.key] != null;
        const isActive=sk===c.key;
        return`<td><div style="font-family:'DM Mono';font-size:${isActive?'13':'12'}px;font-weight:${isActive?'700':'500'};color:${isActive?c.color:'var(--text2)'}">${val}</div><div style="font-family:'DM Mono';font-size:10px;color:rgba(160,190,220,0.7);font-weight:600">${(rk2!=null&&hasVal)?rk2+'位':''}</div></td>`;
      }).join('')}
    </tr>`;
  });

  // 初期5件表示 → ボタンで最大20件に展開
  const extraTbody = rows.length>DAILY_SHOW
    ? '<tbody id="bat-daily-extra" style="display:'+(dailyShowAll?'table-row-group':'none')+'">'+ rows.slice(DAILY_SHOW, 20).join('') +'</tbody>'
    : '';
  const moreBtn = rows.length>DAILY_SHOW
    ? '<div id="bat-more" style="text-align:center;padding:10px 0"><button onclick="batDailyToggleAll()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:4px 16px;border-radius:6px;cursor:pointer">'+(dailyShowAll?'閉じる ▲':'すべて表示 ▼')+'</button></div>'
    : '';
  return '<div id="bat-body"><div class="rnk-tbl-wrap"><table class="rnk-tbl">'
    + thead + '<tbody>'+ rows.slice(0,DAILY_SHOW).join('') +'</tbody>'
    + extraTbody + '</table></div>' + moreBtn + '</div>';
};

function buildPitchSubHeader(g){

  return `<div class="team-switch" style="border-radius:0; border-left:none; border-right:none; border-bottom:none;">${tswBtn('home',g.home,g.homeColor)}${tswBtn('away',g.away,g.awayColor)}</div><div class="ptab-row" id="pitcherTabRow" style="background:var(--bg)"></div>`;
}
function initPitch(g){renderPitchTeamContent(g);}
function switchPitchTeam(team,color){
  curPitchTeam=team;curPitcherIdx=0;cmpMode='this';window._pmCmpMode='prev';window._pmSplitMode='all';
  document.getElementById('subFixedArea').innerHTML = buildPitchSubHeader(DATA[curDate][curGameIdx]);
  destroyCharts(); renderPitchTeamContent(DATA[curDate][curGameIdx]);

function renderPitchTeamContent(g){
  const ps=g.pitchers[curPitchTeam];
  const tabs=ps.map((p,i)=>{
    const rcBg={W:'#16a34a',L:'#dc2626',H:'#d97706',S:'#7c3aed'}[p.result]||'';

    const resBadge=rcBg?`<span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:4px;background:${rcBg};color:#fff;margin-right:6px;margin-left:0;box-shadow:0 1px 6px ${rcBg}99;font-family:'DM Mono';vertical-align:middle">${rcLabel}</span>`:'';
    return`<button class="ptab ${i===curPitcherIdx?'active':''}" onclick="selectPitcher(${i})">${resBadge}${p.name}</button>`;
  }).join('');
  const tabRow = document.getElementById('pitcherTabRow');
  if(tabRow) tabRow.innerHTML = tabs;
  renderPitcherDetail(g,curPitcherIdx);

function selectPitcher(idx){
  curPitcherIdx=idx;cmpMode='this';window._pmCmpMode='prev';window._pmSplitMode='all';

  });
  destroyCharts();renderPitcherDetail(DATA[curDate][curGameIdx],idx);
  const dp=document.getElementById('detailPanel');
  if(dp) dp.scrollTo({top:0,behavior:'smooth'});

      ${[['投球回',(()=>{const v=String(p.ip||'');return v.endsWith('.0')?v.replace('.0',''):v;})()],['球数',p.pitches+'球'],['H',p.h],['K',p.k],['BB',p.bb],['ER',p.er]].map(([l,v])=>`<span style="font-family:'DM Mono';font-size:10px;letter-spacing:0;color:var(--text2);white-space:nowrap">${l}\u202F<b style="color:var(--text);font-weight:600">${v}</b></span>`).join('<span style="color:var(--border);margin:0 3px;flex-shrink:0">·</span>')}

  ${prevBlock}
  ${s?`<div style="padding:9px 14px;border-top:1px solid var(--border2)">

function renderBatTable(g){

  { key: 'activeSpin', label: '回転効率(近似)',  fmt: v => v != null ? (+v).toFixed(1)+'%' : '—', color: '#DDD6FE',      loIsBest: false, mlbOnly: true },
  { key: 'vaa',        label: 'VAA',             fmt: v => v != null ? (+v).toFixed(1)+'°': '—', color: '#F9A8D4',      loIsBest: true,  mlbOnly: true },
  { key: 'ivb',        label: '縦変化量',        fmt: v => v != null ? (+v).toFixed(1)+'cm': '—', color: '#67E8F9',     loIsBest: false, mlbOnly: true },
  { key: 'hb',         label: '横変化量',        fmt: v => v != null ? (+v).toFixed(1)+'cm': '—', color: '#86EFAC',     loIsBest: null,  mlbOnly: true },
  { key: 'ext',        label: 'Extension',       fmt: v => v != null ? (+v).toFixed(2)+'m' : '—', color: '#FCD34D',     loIsBest: false, mlbOnly: true },
];

function pitchCmpReset() {
  _pitchCmpSelected = [];
  document.querySelectorAll('[data-pidx]').forEach(c => c.checked = false);
  const scb = document.getElementById('pitch-cmp-season-cb');
  if(scb) scb.checked = false;
  document.querySelectorAll('[id^=pgr-]').forEach(r => r.style.outline = '');
  window._cmpMapsPerEntry = null;
  window._cmpLocsPerEntry = null;
  window._isCmpMode = false;
  const resetBtn2 = document.getElementById('pitch-cmp-reset-btn');
  if(resetBtn2) resetBtn2.style.display = 'none';
  const title2 = document.getElementById('pitch-detail-title');
  if(title2) title2.textContent = '球種詳細';
  const hmArea = document.getElementById('pitch-heatmap-area');
  if(hmArea) { hmArea.style.display = 'none'; const w = hmArea.querySelector('.hm-canvas-wrap'); if(w) w.innerHTML=''; }
  const staticCv = document.getElementById('pitch-canvas-area');
  if(staticCv) staticCv.style.display = '';
  const savedIdx = window._activeRowIdx;
  window._activeRowIdx = null; // 必ずリセット
  if(savedIdx != null && savedIdx !== 'season') {
    pitchRowClick(savedIdx, true);
  } else if(savedIdx === 'season') {
    pitchSeasonRowClick();
  } else {
    _closePitchDetail();
  }
}

function _pitchGetAllData() {
  const dataEl = document.getElementById('pitch-cmp-data');
  if(!dataEl) return [];
  const rawAttr = dataEl.getAttribute('data-mix') || '[]';
  try { return JSON.parse(rawAttr.replace(/&#39;/g, "'")); } catch(e) { return []; }
}

function _pitchGetEntry(key, mode) {
  mode = mode || 'all';
  if(key === 'season') {
    const mix = mode === 'vs_r' ? (window._seasonMixVsR || _pitchCmpSeasonMix || [])
              : mode === 'vs_l' ? (window._seasonMixVsL || _pitchCmpSeasonMix || [])
              : (window._seasonMixAll || _pitchCmpSeasonMix || []);
    return { mix, mixVsR: window._seasonMixVsR||[], mixVsL: window._seasonMixVsL||[], label: 'シーズン' };
  }
  const allData = _pitchGetAllData();
  const d = allData.find(d => d.idx === key);
  if(!d) return { mix: [], mixVsR: [], mixVsL: [], label: '—' };
  // locsキャッシュから各球種のlocsを注入
  const locsCache = (window._playerLocsCache || {})[key] || {};
  const injectLocs = (mixArr, cacheKey) => (mixArr||[]).map(m => ({
    ...m,
    locs: (locsCache[cacheKey]||{})[m.key] || m.locs || [],
  }));
  const mix = mode === 'vs_r' ? (d.mixVsR && d.mixVsR.length ? d.mixVsR : d.mix)
            : mode === 'vs_l' ? (d.mixVsL && d.mixVsL.length ? d.mixVsL : d.mix)
            : d.mix;
  return {
    mix:    injectLocs(mix, mode === 'vs_r' ? 'mixVsR' : mode === 'vs_l' ? 'mixVsL' : 'mix'),
    mixVsR: injectLocs(d.mixVsR, 'mixVsR'),
    mixVsL: injectLocs(d.mixVsL, 'mixVsL'),
    label:  d.label,
  };
}

window._activeRowIdx = null;

function pitchRowClick(idx, force) {
  if (!force && window._activeRowIdx === idx) { _closePitchDetail(); return; }

  const dataEl = document.getElementById('pitch-cmp-data');
  if (!dataEl) return;
    let allMix;
    try { allMix = JSON.parse(dataEl.getAttribute('data-mix').replace(/&#39;/g,"'")); } catch(e) { return; }
    const entry = allMix.find(e => e.idx === idx);
    if (!entry) return;

    window._activeRowIdx = idx;
    // role を保存（球種詳細のカラースケール基準に使用）
    window._activeRole = (entry && entry.role) ? entry.role : (window._currentPlayerRole || '先発');
    window._currentPitcherHand = (entry && entry.hand) ? entry.hand : 'R';
    window._currentSplitMode = 'all'; // 行切り替え時は必ず全体にリセット

    document.querySelectorAll('[id^="pgr-"]').forEach(r => {
      r.classList.remove('pit-row-active');
      r.dataset.active = '';
    });
    const sr = document.getElementById('pgr-season');
    if (sr) { sr.classList.remove('pit-row-active'); sr.dataset.active = ''; }
    const row = document.getElementById('pgr-' + idx);
    if (row) {
      row.classList.add('pit-row-active');
      row.dataset.active = '1';
    }

    const curMode = window._currentSplitMode || 'all';

    window._pitchDetailMixes = {
      all:   entry.mix || [],
      vs_r:  (entry.mixVsR && entry.mixVsR.length) ? entry.mixVsR : entry.mix || [],
      vs_l:  (entry.mixVsL && entry.mixVsL.length) ? entry.mixVsL : entry.mix || [],
      label: entry.label,
    };

    ['all','vs_r','vs_l'].forEach(m => {
      const btn = document.getElementById('pitch-detail-tab-'+m);
      if (!btn) return;
      btn.style.background = m === curMode ? 'var(--bg)' : 'transparent';
      btn.style.color = m === curMode ? 'var(--text)' : 'var(--text3)';
      btn.style.boxShadow = m === curMode ? '0 1px 4px rgba(0,0,0,0.4)' : '';
    });

    _renderPitchDetailContent(curMode);
    const title = document.getElementById('pitch-detail-title');
    if (title) title.textContent = '球種詳細 ' + entry.label;

    const area = document.getElementById('pitch-detail-area');
    if (area) { area.style.display = 'block'; _scrollToPitchDetail(); }
  }

  function pitchSeasonRowClick() {
    if (window._activeRowIdx === 'season') {
      _closePitchDetail();
      return;
    }
    window._activeRowIdx = 'season';
    window._activeRole = window._currentPlayerRole || '先発';
    window._currentSplitMode = 'all'; // シーズン行クリック時は必ず全体にリセット
    try {
      const _dEl = document.getElementById('pitch-cmp-data');
      if (_dEl) {
        const _aM = JSON.parse(_dEl.getAttribute('data-mix').replace(/&#39;/g,"'"));
        window._currentPitcherHand = (_aM[0] && _aM[0].hand) ? _aM[0].hand : 'R';
      }
    } catch(e) { window._currentPitcherHand = 'R'; }

    const mix = _pitchCmpSeasonMix || window._seasonMixAll || [];
    if (!mix.length) return;

    window._pitchDetailMixes = {
      all:   window._seasonMixAll  || _pitchCmpSeasonMix || [],
      vs_r:  window._seasonMixVsR  || _pitchCmpSeasonMix || [],
      vs_l:  window._seasonMixVsL  || _pitchCmpSeasonMix || [],
      label: 'シーズン',
    };

    const activeMode = window._currentSplitMode || 'all';

    _renderPitchDetailContent(activeMode);
    const title = document.getElementById('pitch-detail-title');
    if (title) title.textContent = 'シーズン球種詳細';

    ['all','vs_r','vs_l'].forEach(m => {
      const btn = document.getElementById(`pitch-detail-tab-${m}`);
      if (!btn) return;
      const active = m === activeMode;
      btn.style.background = active ? 'var(--bg)' : 'transparent';
      btn.style.color = active ? 'var(--text)' : 'var(--text3)';
      btn.style.boxShadow = active ? '0 1px 4px rgba(0,0,0,0.4)' : '';
    });

    document.querySelectorAll('[id^="pgr-"]').forEach(r => {
      r.classList.remove('pit-row-active');
      r.dataset.active = '';
    });
    const seasonRow = document.getElementById('pgr-season');
    if (seasonRow) {
      seasonRow.classList.add('pit-row-active');
      seasonRow.dataset.active = '1';
    }

    const area = document.getElementById('pitch-detail-area');
    if (area) { area.style.display = 'block'; _scrollToPitchDetail(); }

    // シーズンヒートマップ・サマリーを描画
    const hmMix = window._seasonMixAll || [];
    _renderHeatmaps(hmMix);
    // カウント別：シーズンlocsがあればボタンを表示
    window._chBuilt = false;
    const _seasonHasLocs = window._seasonLocsMap && Object.values(window._seasonLocsMap).some(v=>v.locsR.length||v.locsL.length);
    if(_seasonHasLocs) {
      const chArea3 = document.getElementById('count-heatmap-area');
      if(chArea3) chArea3.style.display = 'block';
      const chToggleS = document.getElementById('ch-toggle-wrap');
      if(chToggleS) chToggleS.style.display = 'none';
      _buildCountHeatmap();
    }
  }

  function _scrollToPitchDetail() {
    if(window._suppressScroll) return;
    const area = document.getElementById('pitch-detail-area');
    if (!area || area.style.display === 'none') return;
    setTimeout(() => {
      const panel = document.getElementById('detailPanel');
      if (!panel) return;
      const panelRect = panel.getBoundingClientRect();
      const areaRect  = area.getBoundingClientRect();
      const offset = 100;
      panel.scrollBy({ top: areaRect.top - panelRect.top - offset, behavior: 'smooth' });
    }, 50);
  }

  function _closePitchDetail() {
    window._activeRowIdx = null;
    _pitchCmpSelected = [];
    const area = document.getElementById('pitch-detail-area');
    if (area) area.style.display = 'none';
    document.querySelectorAll('[data-pidx]').forEach(c => c.checked = false);
    const scb = document.getElementById('pitch-cmp-season-cb');
    if(scb) scb.checked = false;
    document.querySelectorAll('[id^="pgr-"]').forEach(r => {
      r.classList.remove('pit-row-active');
      r.dataset.active = '';
    });
    const sr = document.getElementById('pgr-season');
    if(sr) { sr.classList.remove('pit-row-active'); }
  }

  function switchPitchDetailTab(mode) {
    window._currentSplitMode = mode;
    ['all','vs_r','vs_l'].forEach(m => {
      const btn = document.getElementById(`pitch-detail-tab-${m}`);
      if (!btn) return;
      btn.style.background = m === mode ? 'var(--bg)' : 'transparent';
      btn.style.color = m === mode ? 'var(--text)' : 'var(--text3)';
      btn.style.boxShadow = m === mode ? '0 1px 4px rgba(0,0,0,0.4)' : 'none';
    });
    ['all','vs_r','vs_l'].forEach(m => {
      const btn = document.getElementById('year-split-'+m);
      if (!btn) return;
      btn.style.background  = m === mode ? 'var(--bg)'  : 'transparent';
      btn.style.color       = m === mode ? 'var(--text)' : 'var(--text3)';
      btn.style.boxShadow   = m === mode ? '0 1px 4px rgba(0,0,0,0.4)' : '';
    });
    
    _updateGameRowValues(mode);
    
    if(_pitchCmpSelected.length >= 1) {
      _renderCmpContent(mode);
    } else {
      _renderPitchDetailContent(mode);
    }
  }

  function _renderPitchDetailContent(mode) {
    const content = document.getElementById('pitch-detail-content');
    if (!content) return;
    const mixes = window._pitchDetailMixes || {};
    const mix = mixes[mode] || mixes['all'] || [];
    if (!mix.length) {
      content.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px">データなし</div>';
      return;
    }
    const tc = mix.reduce((s,m)=>s+m.count,0);
    let totSwstr  = tc>0?(mix.reduce((a,m)=>a+(+(m.swstr)||0)*m.count,0)/tc).toFixed(1)+'%':'—';
    let totOSwing = tc>0?(mix.reduce((a,m)=>a+((+(m.oSwing)||0))*m.count,0)/tc).toFixed(1)+'%':'—';
    const stMix = mix.filter(m=>m.strike!=null);
    const stTot = stMix.reduce((s,m)=>s+m.count,0);
    let totStrike = stTot>0?(stMix.reduce((a,m)=>a+(+(m.strike)||0)*m.count,0)/stTot).toFixed(1)+'%':'—';
    let totZone   = tc>0?(mix.reduce((a,m)=>a+(+(m.zone)||0)*m.count,0)/tc).toFixed(1)+'%':'—';
    const gbMix = mix.filter(m=>m.gbpct!=null);
    const gbTot = gbMix.reduce((s,m)=>s+m.count,0);
    let totGbpct  = gbTot>0?(gbMix.reduce((a,m)=>a+(+(m.gbpct)||0)*m.count,0)/gbTot).toFixed(1)+'%':'—';
    const xwMix = mix.filter(m=>m.xwoba!=null);
    const xwTot = xwMix.reduce((s,m)=>s+m.count,0);
    let totXwoba  = xwTot>0?(xwMix.reduce((a,m)=>a+(+(m.xwoba)||0)*m.count,0)/xwTot).toFixed(3):'—';
    const _seasonTr = document.getElementById('pgr-season');
    if(window._activeRowIdx === 'season' && _seasonTr) {
      try {
        const _ss = JSON.parse(_seasonTr.dataset.ss.replace(/&#39;/g,"'"));
        const _mode = window._currentSplitMode||'all';
        const _sv = _ss[_mode]||_ss['all']||{};
        if(_sv.swstr  != null) totSwstr  = (+_sv.swstr).toFixed(1)+'%';
        if(_sv.oSwing != null) totOSwing = (+_sv.oSwing).toFixed(1)+'%';
        if(_sv.strike != null) totStrike = (+_sv.strike).toFixed(1)+'%';
        if(_sv.zone   != null) totZone   = (+_sv.zone).toFixed(1)+'%';
        if(_sv.gbpct  != null) totGbpct  = (+_sv.gbpct).toFixed(1)+'%';
      } catch(e) {}
    }
    const thS  = `padding:6px 8px;font-size:9px;font-family:'DM Mono';color:var(--text3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;background:var(--bg3);`;
    const thLS = thS;
    const _pcsAll=window._pitchColorScaleStats||{};
    const _activeRoleKey=(window._activeRole==='先発')?'starter':'reliever';
    // シーズン行・試合別行ともに同ロール×同球種コードの全登板データを基準にする
    const _pcs = _pcsAll[_activeRoleKey]||_pcsAll.starter||{};
    const rows = mix.map(m => {
      const col = (window.PC&&window.PC[m.key])||'#888';
      const _ps=_pcs[m.key]||{};
      const _scTd=(val,metric,color,bold,suffix='%')=>{
        const sc=val!=null?getScaleColor(metric,val,_ps):'';
        const bgS=sc?`background-color:${sc};`:'';
        const colorS=color?`color:${color};`:'';
        const boldS=bold?'font-weight:700;':'';
        const disp=val!=null?(val+suffix):'—';
        return `<td style="padding:7px 8px;font-family:'DM Mono';font-size:12px;text-align:left;${colorS}${boldS}${bgS}">${disp}</td>`;
      };
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer" onmouseover="this.style.background='var(--bg4)'" onmouseout="this.style.background=''" onclick="_renderHeatmapForPitch('${m.key}','${m.name}','${col}')">
        <td style="padding:7px 8px;white-space:nowrap;position:sticky;left:0;background:var(--bg2)"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span><span style="font-size:12px;font-weight:600">${m.name}</span></span></td>
        <td style="padding:7px 8px;font-family:'DM Mono';font-size:12px;text-align:left;color:var(--text2)">${m.count!=null?m.count:'—'}</td>
        <td style="padding:7px 8px;font-family:'DM Mono';font-size:12px;text-align:left;color:var(--text2)">${m.pct}%</td>
        ${_scTd(m.swstr,  'swstr',  '', true,  '%')}
        ${_scTd(m.oSwing, 'oSwing', '', false, '%')}
        ${_scTd(m.strike, 'strike', '', false, '%')}
        ${_scTd(m.zone,   'zone',   '', true,  '%')}
        ${_scTd(m.gbpct,  'gbpct',  '', false, '%')}
        ${currentSport==='mlb'?_scTd(m.xwoba!=null?+(+m.xwoba).toFixed(3):null,'xwoba_mix','',false,''):''}
        ${_scTd((m.vel!=null&&m.vel>0)?m.vel:null,          'vel',    '', false, 'km/h')}
        ${_scTd((m.maxVel!=null&&m.maxVel>0)?m.maxVel:null, 'maxVel', '', false, 'km/h')}
        ${currentSport==='mlb'?
          [['avgSpin',m.avgSpin!=null?Math.round(m.avgSpin):null,'rpm'],
           ['spinAxis',m.spinAxis!=null?Math.round(m.spinAxis):null,'°'],
           ['activeSpin',m.activeSpin,'%'],
           ['vaa',m.vaa,'°'],
           ['ivb',m.ivb,'cm'],
           ['hb',m.hb,'cm'],
           ['ext',m.ext,'m']
          ].map(([k,v,s])=>_scTd(v,k,'',false,s)).join('')
        :''}
      </tr>`;
    }).join('');
    content.innerHTML = `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="width:100%;border-collapse:collapse;min-width:560px">
      <thead><tr>
        <th style="${thLS};position:sticky;left:0;z-index:3">球種</th>
        <th style="${thS}">投球数</th>
        <th style="${thS}">投球割合</th>
        <th style="${thS.replace('color:var(--text3)','color:var(--blue)')}">空振り率</th>
        <th style="${thS.replace('color:var(--text3)','color:var(--cyan)')}">ボール球SW%</th>
        <th style="${thS.replace('color:var(--text3)','color:var(--text2)')}">ストライク率</th>
        <th style="${thS.replace('color:var(--text3)','color:var(--green)')}">ゾーン率</th>
        <th style="${thS.replace('color:var(--text3)','color:var(--teal)')}">ゴロ率</th>
        ${currentSport==='mlb'?`<th style="${thS.replace('color:var(--text3)','color:#93C5FD')}">xwOBA</th>`:''}
        <th style="${thS.replace('color:var(--text3)','color:var(--gold)')}">平均球速</th>
        <th style="${thS.replace('color:var(--text3)','color:var(--orange)')}">最高球速</th>
        ${currentSport==='mlb'?
          ['#A78BFA','#C4B5FD','#DDD6FE','#F9A8D4','#67E8F9','#86EFAC','#FCD34D'].map((c,i)=>
            `<th style="${thS.replace('color:var(--text3)','color:'+c)}">${['回転数','回転軸','回転効率(近似)','VAA','縦変化量','横変化量','Extension'][i]}</th>`
          ).join('')
        :''}
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="border-top:2px solid var(--border);background:var(--bg3)">
        <td style="padding:6px 8px;font-size:11px;font-weight:700;font-family:'DM Mono';position:sticky;left:0;background:var(--bg3);color:var(--text2)">合計</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">${mix.reduce((a,m)=>a+(m.count||0),0)}</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">100%</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">${totSwstr}</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">${totOSwing}</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">${totStrike}</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">${totZone}</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700">${totGbpct}</td>
        ${currentSport==='mlb'?`<td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700;color:#93C5FD">${totXwoba}</td>`:''}
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left">—</td>
        <td style="padding:6px 8px;font-family:'DM Mono';font-size:11px;text-align:left">—</td>
        ${currentSport==='mlb'?'<td style="padding:6px 8px;font-family:\'DM Mono\';font-size:11px;text-align:left">—</td>'.repeat(7):''}
      </tr></tfoot>
    </table></div>`;
    // ヒートマップ描画
    _renderHeatmaps(mix);
  }


  // ── ヒートマップ描画 ──
  // locs: [[x, y, flag, in_zone], ...]
  //   x,y: 正規化座標（-1.5〜1.5）、x正=外角(右打者視点)、y正=高め
  //   flag: 1=空振り, 0=スイング, -1=見逃し/ボール
  //   in_zone: 1=ゾーン内, 0=ゾーン外
  // pitchLocsMap: { pitchKey: { name, color, locsR:[], locsL:[] } }
  // selectedKeys: Set of pitchKeys to show (null = all)
  function _drawZoneHeatmapMulti(canvasId, pitchLocsMap, selectedKeys, isBatterRight, flipX=false) {
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const RANGE = 1.75;
    const BAT_W = 42;
    const PAD_TOP = 6, PAD_BTM = 28;
    const PAD_L = isBatterRight ? 10 : BAT_W + 6;
    const PAD_R = isBatterRight ? BAT_W + 6 : 10;
    const drawW = W - PAD_L - PAD_R;
    const drawH = H - PAD_TOP - PAD_BTM;
    const toX = x => PAD_L + (x + RANGE) / (RANGE * 2) * drawW;
    const toY = y => PAD_TOP + (1 - (y + RANGE) / (RANGE * 2)) * drawH;

    // 背景
    ctx.fillStyle = '#070E1A';
    ctx.fillRect(0, 0, W, H);

    const keys = Object.keys(pitchLocsMap).filter(k => !selectedKeys || selectedKeys.has(k));
    const locsKey = isBatterRight ? 'locsR' : 'locsL';

    const sigma = (drawW / (RANGE * 2)) * 0.075 * 2;
    let hasAnyLocs = false;

    // ── 総球数をカウント（dotRスケール調整用）──
    const totalLocs = keys.reduce((s, k) => s + (pitchLocsMap[k][locsKey]?.length || 0), 0);
    // 基準球数150球(NPB1試合相当): それ以上は球数に比例してドットを縮小・薄くする
    const BASE_LOCS = 150;
    const _scale = totalLocs > BASE_LOCS ? Math.sqrt(BASE_LOCS / totalLocs) : 1.0;
    const dotScale  = Math.max(0.7, _scale);
    const alphaScale = Math.max(0.5, _scale);

    // ── 描画範囲をclipしてRANGE外の点を非表示 ──
    ctx.save();
    ctx.beginPath();
    ctx.rect(PAD_L, PAD_TOP, drawW, drawH);
    ctx.clip();

    // ── 均一ドット描画（球数に応じてサイズ・不透明度を動的調整）──
    keys.forEach(k => {
      const locs = pitchLocsMap[k][locsKey] || [];
      if(!locs.length) return;
      hasAnyLocs = true;
      const rawColor = pitchLocsMap[k].color || '#3B82F6';
      const pc = _hexToRgb(rawColor);
      const dotR = Math.max(2.5, sigma * 0.55 * dotScale);
      const a0 = +(0.85 * alphaScale).toFixed(2);
      const a1 = +(0.55 * alphaScale).toFixed(2);
      locs.forEach(([x, y]) => {
        const px = flipX ? -x : x;

        // ボール球（ゾーン外）の座標を凝縮: ゾーン境界からの距離を圧縮してゾーン周辺に寄せる
        // ストライクゾーン: |x| <= 1, |y| <= 1
        const BALL_COMPRESS = 0.42; // 0=完全圧縮(境界に張り付き) 1=無圧縮、小さいほど凝縮
        const compressAxis = v => {
          const SZ = 1.0; // ゾーン境界
          if(Math.abs(v) <= SZ) return v; // ゾーン内はそのまま
          const sign = v > 0 ? 1 : -1;
          const overflow = Math.abs(v) - SZ; // ゾーン外にはみ出た量
          return sign * (SZ + overflow * BALL_COMPRESS);
        };
        const cx2 = toX(compressAxis(px));
        const cy2 = toY(compressAxis(y));
        const grd = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, dotR * 2.2);
        grd.addColorStop(0,   `rgba(${pc.r},${pc.g},${pc.b},${a0})`);
        grd.addColorStop(0.4, `rgba(${pc.r},${pc.g},${pc.b},${a1})`);
        grd.addColorStop(1,   `rgba(${pc.r},${pc.g},${pc.b},0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx2, cy2, dotR * 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
    });
    ctx.restore(); // clip解除

    // ── ストライクゾーン・分割線・プレート ──
    const zx1=toX(-1),zx2=toX(1),zy1=toY(1),zy2=toY(-1);
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1.5;ctx.strokeRect(zx1,zy1,zx2-zx1,zy2-zy1);
    ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=0.8;
    [toX(-1/3),toX(1/3)].forEach(x=>{ctx.beginPath();ctx.moveTo(x,zy1);ctx.lineTo(x,zy2);ctx.stroke();});
    [toY(1/3),toY(-1/3)].forEach(y=>{ctx.beginPath();ctx.moveTo(zx1,y);ctx.lineTo(zx2,y);ctx.stroke();});
    const plateY=toY(-1.0)+2, plW=zx2-zx1;
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(zx1,plateY);ctx.lineTo(zx2,plateY);
    ctx.moveTo(zx1,plateY);ctx.lineTo(zx1+plW*0.15,plateY+8);
    ctx.lineTo(zx1+plW*0.5,plateY+11);ctx.lineTo(zx2-plW*0.15,plateY+8);ctx.lineTo(zx2,plateY);
    ctx.stroke();

    // ── バッターシルエット（putImageDataの後に描画）──
    // スクショ2枚目のような本格的なシルエット
    const batCX  = isBatterRight ? toX(1) + BAT_W*0.5 : toX(-1) - BAT_W*0.5;
    const batBotY = toY(-1.0) + 4;
    const s = 0.88; // スケール（canvasサイズに合わせて調整）
    ctx.save();
    ctx.translate(batCX, batBotY);
    if(!isBatterRight) ctx.scale(-1, 1);
    ctx.fillStyle = 'rgba(148,163,184,0.55)';
    ctx.strokeStyle = 'rgba(148,163,184,0.55)';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // 全体をPathで塗りつぶすシルエット
    ctx.beginPath();
    // 足〜腰
    ctx.moveTo(-12*s, 0);
    ctx.lineTo(-14*s,-25*s); ctx.lineTo(-7*s,-25*s);
    ctx.lineTo(-5*s,-14*s);
    ctx.lineTo(-1*s,-25*s); ctx.lineTo(5*s,-25*s);
    ctx.lineTo(2*s,0);
    ctx.closePath(); ctx.fill();
    // 腰〜胴
    ctx.beginPath();
    ctx.moveTo(-13*s,-23*s); ctx.lineTo(-14*s,-48*s);
    ctx.lineTo(-4*s,-48*s); ctx.lineTo(-2*s,-23*s);
    ctx.closePath(); ctx.fill();
    // 頭
    ctx.beginPath(); ctx.ellipse(-9*s,-56*s,7*s,8*s,0,0,Math.PI*2); ctx.fill();
    // ヘルメット耳あて
    ctx.beginPath(); ctx.ellipse(-4*s,-54*s,4*s,5*s,0.3,0,Math.PI); ctx.fill();
    // 後腕（肩〜肘）
    ctx.beginPath();
    ctx.moveTo(-13*s,-44*s); ctx.lineTo(-24*s,-35*s);
    ctx.lineWidth=7*s; ctx.stroke();
    // 前腕（肘〜手）
    ctx.beginPath();
    ctx.moveTo(-14*s,-44*s); ctx.lineTo(-7*s,-33*s);
    ctx.lineWidth=5*s; ctx.stroke();
    // バット
    ctx.beginPath();
    ctx.moveTo(-7*s,-33*s); ctx.lineTo(10*s,-14*s);
    ctx.lineWidth=3.5*s; ctx.strokeStyle='rgba(148,163,184,0.35)'; ctx.stroke();
    // バットグリップ端
    ctx.beginPath(); ctx.arc(10*s,-14*s,2.5*s,0,Math.PI*2);
    ctx.fillStyle='rgba(148,163,184,0.4)'; ctx.fill();
    ctx.restore();
  }

  // 旧インターフェース互換（単色）
  function _drawZoneHeatmap(canvasId, locs, pitchColor, isBatterRight) {
    _drawZoneHeatmapMulti(canvasId, {'_':{ color: pitchColor, locsR: locs, locsL: locs }}, null, isBatterRight);
  }


  function _hexToRgb(hex) {
    if(!hex || hex.startsWith('var(')) return {r:148,g:163,b:184}; // CSS変数はグレーで代替
    const h = hex.replace('#','');
    if(h.length === 3) {
      return {r:parseInt(h[0]+h[0],16), g:parseInt(h[1]+h[1],16), b:parseInt(h[2]+h[2],16)};
    }
    const m = h.match(/.{2}/g);
    if(!m || m.length < 3) return {r:136,g:136,b:136};
    const r = parseInt(m[0],16), g = parseInt(m[1],16), b = parseInt(m[2],16);
    if(isNaN(r)||isNaN(g)||isNaN(b)) return {r:136,g:136,b:136};
    return {r, g, b};
  }

  // mixデータからlocsを取得してヒートマップを描画
  // mixは現在表示中の球種mix（全体/対右/対左）
  // 左右並べて表示: 対右=mixVsR、対左=mixVsL
  // window._hmPitchLocsMap: 全球種のlocsを保持
  // window._hmSelectedKeys: 選択中の球種キーSet（nullなら全選択）

  function _buildPitchLocsMap(mixAll, mixVsR, mixVsL) {
    // mixVsR/mixVsL にあるキーを優先しつつ、全球種を収集
    const map = {};
    const addKey = (m) => {
      if(!m || !m.key) return;
      if(!map[m.key]) { const _pc={FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6'}; map[m.key] = { name: m.name, color: _pc[m.key]||'#94A3B8', locsR:[], locsL:[] }; }
    };
    (mixAll||[]).forEach(addKey);
    (mixVsR||[]).forEach(addKey);
    (mixVsL||[]).forEach(addKey);
    // locsを設定（keyが存在しない場合も必ず設定）
    (mixVsR||[]).forEach(m => { if(m&&m.key&&map[m.key]) map[m.key].locsR = m.locs||[]; });
    (mixVsL||[]).forEach(m => { if(m&&m.key&&map[m.key]) map[m.key].locsL = m.locs||[]; });
    // mixAllのlocsはlocsR/locsLともにない場合のみフォールバック（左右不明データ）
    // → 試合行の場合はmixVsR/VsLにlocsが正しく入っているので不要
    // → フォールバックなし（混入防止）
    return map;
  }

  function _hmUpdateButtons() {
    const map = window._hmPitchLocsMap || {};
    const sel = window._hmSelectedKeys;
    const allActive = !sel;
    document.querySelectorAll('[id^="hm-btn-"]').forEach(b => {
      const k = b.id.replace('hm-btn-','');
      const col = k==='all' ? 'rgba(148,163,184,1)' : (map[k]?.color||'#888');
      const active = k==='all' ? allActive : (!allActive && sel && sel.has(k));
      b.style.borderColor = active ? col : 'rgba(255,255,255,0.1)';
      b.style.background  = active ? col+'33' : 'transparent';
      b.style.color       = active ? '#fff' : 'var(--text3)';
    });
  }

  function _buildFilterButtons(pitchLocsMap) {
    const btns = document.getElementById('hm-filter-btns');
    if(!btns) return;
    window._hmSelectedKeys = null;
    const keys = Object.keys(pitchLocsMap).filter(k => {
      const d = pitchLocsMap[k];
      return d.locsR.length > 0 || d.locsL.length > 0;
    });
    if(!keys.length) { btns.innerHTML = ''; return; }
    // 全球種ボタン + 球種ごとのボタン（1つずつ選択）
    let html = `<button id="hm-btn-all" onclick="_hmToggleAll()" style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-size:10px;font-family:'DM Mono';font-weight:700;border-radius:5px;cursor:pointer;transition:all .15s;border:1px solid rgba(148,163,184,1);background:rgba(148,163,184,0.2);color:#fff">全球種</button>`;
    keys.forEach(k => {
      const d = pitchLocsMap[k];
      const cnt = d.locsR.length + d.locsL.length;
      html += `<button id="hm-btn-${k}" onclick="_hmToggleKey('${k}')" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:10px;font-family:'DM Mono';font-weight:700;border-radius:5px;cursor:pointer;transition:all .15s;border:1px solid rgba(255,255,255,0.1);background:transparent;color:var(--text3)"><span style="width:8px;height:8px;border-radius:50%;background:${d.color};flex-shrink:0"></span>${d.name}</button>`;
    });
    btns.innerHTML = html;
  }

  function _hmToggleAll() {
    window._hmSelectedKeys = null;
    _hmRedraw();
    _hmUpdateButtons();
  }

  function _hmToggleKey(key) {
    // 1つずつ選択（排他）
    if(window._hmSelectedKeys && window._hmSelectedKeys.has(key) && window._hmSelectedKeys.size === 1) {
      // 同じ球種を再クリック → 全選択に戻る
      window._hmSelectedKeys = null;
    } else {
      window._hmSelectedKeys = new Set([key]);
    }
    _hmRedraw();
    _hmUpdateButtons();
  }

  // result: 'all'|'swstr'|'swing'|'take'
  // zone:   'all'|'in'|'out'
  window._hmResultFilter = window._hmResultFilter || 'all';
  window._hmZoneFilter   = window._hmZoneFilter   || 'all';

  function _hmFilterLocs(locs) {
    const rf = window._hmResultFilter || 'all';
    const zf = window._hmZoneFilter   || 'all';
    return (locs||[]).filter(loc => {
      const [x,y,flag,inZone,rtype,isStrike] = loc;
      // flag: 1=空振り, 0=スイング, -1=見逃し/ボール
      // rtype: 0=その他, 1=ゴロアウト, 2=フライアウト, 3=安打, 4=長打, 5=HR
      const resOk = rf==='all'
        || (rf==='swstr'  && flag===1)
        || (rf==='swing'  && flag>=0)
        || (rf==='take'   && flag===-1)
        || (rf==='ground' && rtype===1)
        || (rf==='fly'    && rtype===2)
        || (rf==='hit'    && rtype===3)
        || (rf==='xbh'    && (rtype===4||rtype===5))
        || (rf==='hr'     && rtype===5);
      const zoneOk = zf==='all' || (zf==='in'&&inZone===1) || (zf==='out'&&inZone===0);
      return resOk && zoneOk;
    });
  }

  function _hmSetResult(val) {
    window._hmResultFilter = val;
    ['all','swstr','swing','take','ground','fly','hit','xbh','hr'].forEach(v => {
      const b = document.getElementById('hm-res-'+v);
      if(!b) return;
      const active = v===val;
      b.style.border      = active ? '1px solid rgba(148,163,184,0.8)' : '1px solid rgba(255,255,255,0.1)';
      b.style.background  = active ? 'rgba(148,163,184,0.2)' : 'transparent';
      b.style.color       = active ? '#fff' : 'var(--text3)';
    });
    _hmRedraw();
  }

  function _hmSetZone(val) {
    window._hmZoneFilter = val;
    ['all','in','out'].forEach(v => {
      const b = document.getElementById('hm-zone-'+v);
      if(!b) return;
      const active = v===val;
      b.style.border      = active ? '1px solid rgba(148,163,184,0.8)' : '1px solid rgba(255,255,255,0.1)';
      b.style.background  = active ? 'rgba(148,163,184,0.2)' : 'transparent';
      b.style.color       = active ? '#fff' : 'var(--text3)';
    });
    _hmRedraw();
  }


  // ── 統計表示（S/B%、9分割、25分割）──
  // 9分割/25分割のトグルモード管理
  window._hmStatMode = '9'; // デフォルト9分割

  function _hmSetStatMode(mode) {
    window._hmStatMode = mode;
    // ボタンUI更新
    ['9','25'].forEach(m => {
      const b = document.getElementById(`hm-stat-btn-${m}`);
      if(!b) return;
      const active = m === mode;
      b.style.border     = active ? '1px solid rgba(148,163,184,0.8)' : '1px solid rgba(255,255,255,0.1)';
      b.style.background = active ? 'rgba(148,163,184,0.2)' : 'transparent';
      b.style.color      = active ? '#fff' : 'var(--text3)';

    _hmShowStats(mode, true);

  // 統計テーブルを再描画（フィルター変更時も呼ばれる）
  function _hmRefreshStats() {
    const area = document.getElementById('hm-stats-area');
    const mode = window._hmStatMode || '9';
    if(!area) return;
    _hmShowStats(mode, true); // forceUpdate=true
  }

  function _hmShowStats(mode, forceUpdate) {
    const area = document.getElementById('hm-stats-area');
    if(!area) return;
    // 同じモードを再クリック → 閉じる（ただしforceUpdateは除く）
    if(!forceUpdate && area.dataset.mode === mode) {
      area.style.display='none'; area.dataset.mode=''; return;
    }
    area.dataset.mode = mode;
    const map = window._hmPitchLocsMap || {};
    const sel = window._hmSelectedKeys;
    const keys = sel ? [...sel] : Object.keys(map);
    const locsR = keys.flatMap(k => _hmFilterLocs(map[k]?.locsR||[]));
    const locsL = keys.flatMap(k => _hmFilterLocs(map[k]?.locsL||[]));

    // 球種ラベル（選択中の球種名）
    const selLabel = sel && sel.size===1
      ? (map[[...sel][0]]?.name || [...sel][0])
      : (sel && sel.size>1 ? `${sel.size}球種` : '全球種');

    const _buildTable = (locs, label, locsKey, flipX=false) => {
      const total = locs.length;
      if(!total) return `<div style="font-size:10px;color:var(--text3);font-family:'DM Mono';padding:4px 0">${label}：データなし</div>`;

      if(mode === 'sz') {
        const strikes = locs.filter(l=>l[5]===1).length;
        const balls = total - strikes;
        return `<div>
          <div style="font-size:9px;color:var(--text3);font-family:'DM Mono';font-weight:600;margin-bottom:5px">${label}（${total}球）</div>
          <div style="display:flex;gap:14px;font-family:'DM Mono'">
            <div style="background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.4);border-radius:6px;padding:8px 14px;text-align:center">
              <div style="font-size:9px;color:var(--blue);font-weight:600;margin-bottom:3px">ストライク</div>
              <div style="font-size:18px;font-weight:700;color:var(--text);line-height:1">${strikes}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px">${(strikes/total*100).toFixed(1)}%</div>
            </div>
            <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px 14px;text-align:center">
              <div style="font-size:9px;color:var(--text3);font-weight:600;margin-bottom:3px">ボール</div>
              <div style="font-size:18px;font-weight:700;color:var(--text);line-height:1">${balls}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px">${(balls/total*100).toFixed(1)}%</div>
            </div>
          </div>
        </div>`;
      }

      // 9分割: ストライクゾーン3×3
      // 25分割: ストライクゾーン3×3 ＋ 外周（上下左右各1列）= 5×5
      // x[-1,1]をストライクゾーン、x[-1.67,1.67]を全体とする
      const ZONE = 1.0;   // ストライクゾーン境界
      const OUTER = 1.67; // 外周境界
      // セルの境界を定義
      // 5×5の場合: [-OUTER,-ZONE], [-ZONE,-ZONE/3], [-ZONE/3,ZONE/3], [ZONE/3,ZONE], [ZONE,OUTER]
      // 3×3の場合: [-ZONE,-ZONE/3], [-ZONE/3,ZONE/3], [ZONE/3,ZONE]
      const edges9  = [-ZONE, -ZONE/3, ZONE/3, ZONE];
      const edges25 = [-OUTER, -ZONE, -ZONE/3, ZONE/3, ZONE, OUTER];
      const edges = mode==='9' ? edges9 : edges25;
      const N = edges.length - 1; // 3 or 5

      const getCell = (v, edgeArr) => {
        for(let i=0;i<edgeArr.length-1;i++){
          if(v >= edgeArr[i] && v < edgeArr[i+1]) return i;
        }
        return v < edgeArr[0] ? 0 : edgeArr.length-2;
      };

      const counts = Array.from({length:N}, ()=>new Array(N).fill(0));
      // 9分割はストライクゾーン内のみを対象とする（in_zone = loc[3] === 1）
      const zoneLocs = mode==='9' ? locs.filter(l => l[3]===1) : locs;
      const zoneTotal = mode==='9' ? zoneLocs.length : total;
      zoneLocs.forEach(([x,y]) => {
        const dispX = flipX ? -x : x;
        const col = getCell(dispX, edges);
        const row_ = getCell(-y, edges);
        counts[row_][col]++;
      });

      // フィルターなしの全投球数グリッド（フィルター時に分母として使用）
      const rf = window._hmResultFilter||'all', zf = window._hmZoneFilter||'all';
      const hasFilter = rf!=='all' || zf!=='all';
      let totalCounts = null;
      if(hasFilter) {
        // 一時的にフィルターを解除して全投球数グリッドを計算
        const _savedRf = window._hmResultFilter, _savedZf = window._hmZoneFilter;
        window._hmResultFilter = 'all'; window._hmZoneFilter = 'all';
        const allLocs2 = keys.flatMap(k => _hmFilterLocs(map[k]?.[locsKey]||[]));
        window._hmResultFilter = _savedRf; window._hmZoneFilter = _savedZf;
        // 9分割はゾーン内のみを分母にする
        const allLocs2Filtered = mode==='9' ? allLocs2.filter(l => l[3]===1) : allLocs2;
        totalCounts = Array.from({length:N}, ()=>new Array(N).fill(0));
        allLocs2Filtered.forEach(([x,y]) => {
          const dispX2 = flipX ? -x : x;
          totalCounts[getCell(-y,edges)][getCell(dispX2,edges)]++
        });
      }

      const maxCnt = Math.max(...counts.flat(), 1);
      const CW = mode==='9' ? 58 : 36;
      const CH = mode==='9' ? 46 : 30;
      const fs = mode==='9' ? '12px' : '10px';
      const fsSub = mode==='9' ? '9px' : '8px';

      let html = `<div>
        <div style="font-size:9px;color:var(--text3);font-family:'DM Mono';font-weight:600;margin-bottom:5px">${label}（${mode==='9' ? zoneTotal+'球 ゾーン内' : total+'球'}）— 投手視点</div>
        <table style="border-collapse:collapse;font-family:'DM Mono'">`;
      for(let r=0;r<N;r++){
        html += '<tr>';
        for(let c=0;c<N;c++){
          const cnt = counts[r][c];
          const denomForPct = mode==='9' ? zoneTotal : total;
          const pct = denomForPct>0 ? (cnt/denomForPct*100).toFixed(1) : '0.0';
          // ストライクゾーン判定（9分割=全体、25分割=中央3×3）
          const inZone = mode==='9' ? true : (c>=1&&c<=3&&r>=1&&r<=3);
          const intensity = cnt / maxCnt;
          // 背景色: ゾーン内=青系、ゾーン外=グレー系
          const bgAlpha = (0.05 + intensity * 0.7).toFixed(2);
          const bg = cnt>0
            ? (inZone ? `rgba(59,130,246,${bgAlpha})` : `rgba(100,116,139,${bgAlpha})`)
            : (inZone ? 'rgba(59,130,246,0.03)' : 'rgba(255,255,255,0.01)');
          // ボーダー: ゾーン境界を太線で強調
          const borderTop    = (mode==='25'&&r===1) ? '2px solid rgba(255,255,255,0.5)' : '1px solid rgba(255,255,255,0.08)';
          const borderLeft   = (mode==='25'&&c===1) ? '2px solid rgba(255,255,255,0.5)' : '1px solid rgba(255,255,255,0.08)';
          const borderBottom = (mode==='25'&&r===3) ? '2px solid rgba(255,255,255,0.5)' : '1px solid rgba(255,255,255,0.08)';
          const borderRight  = (mode==='25'&&c===3) ? '2px solid rgba(255,255,255,0.5)' : '1px solid rgba(255,255,255,0.08)';
          // 文字色: 常に白系（背景が濃い場合は純白、薄い場合はグレー）
          const textCol = intensity > 0.25 ? '#fff' : (cnt>0 ? 'var(--text)' : 'var(--text3)');
          const subCol  = intensity > 0.25 ? 'rgba(255,255,255,0.75)' : 'var(--text3)';
          const totCnt = totalCounts ? totalCounts[r][c] : null;
          // フィルターあり: x/n (率%) 表示。フィルターなし: n (率%) 表示
          const mainText = hasFilter && totCnt!==null
            ? (cnt>0||totCnt>0 ? `${cnt}/${totCnt}` : '·')
            : (cnt>0 ? `${cnt}` : '·');
          const subText = hasFilter && totCnt!==null && totCnt>0
            ? `${(cnt/totCnt*100).toFixed(0)}%`
            : (cnt>0 ? `${pct}%` : '');
          // フィルターあり時は分母ベースで色の濃さを決める
          const _intensity2 = hasFilter && totCnt>0 ? cnt/totCnt : intensity;
          const _bg2 = (_intensity2>0||cnt>0) ? (inZone?`rgba(59,130,246,${(0.05+_intensity2*0.7).toFixed(2)})`:`rgba(100,116,139,${(0.05+_intensity2*0.7).toFixed(2)})`) : (inZone?'rgba(59,130,246,0.03)':'rgba(255,255,255,0.01)');
          const _tc2 = cnt>0 ? '#fff' : 'rgba(255,255,255,0.35)';
          const _sc2 = cnt>0 ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.25)';
          // 表示: 常に「率%」上・「実数」下（フィルターあり時はx/n形式）
          const topText  = hasFilter && totCnt!==null ? subText  : `${pct}%`;
          const botText  = hasFilter && totCnt!==null ? mainText : (cnt>0?`${cnt}`:'');
          const topStyle = `font-size:${fs};font-weight:700;line-height:1.3;color:${_tc2}`;
          const botStyle = `font-size:${fsSub};line-height:1.1;color:${_sc2}`;
          html += `<td style="width:${CW}px;height:${CH}px;text-align:center;border-top:${borderTop};border-left:${borderLeft};border-bottom:${borderBottom};border-right:${borderRight};background:${_bg2};vertical-align:middle;padding:0">
            <div style="${topStyle}">${topText}</div>
            ${botText?`<div style="${botStyle}">${botText}</div>`:''}
          </td>`;
        }
        html += '</tr>';
      }
      html += '</table></div>';
      return html;
    };

    // 比較モード: エントリごとに横並び
    if(window._isCmpMode && window._cmpMapsPerEntry && window._cmpMapsPerEntry.length >= 2) {
      const _pH2 = window._currentPitcherHand || 'R';
      const _fR2 = currentSport === 'mlb' ? (_pH2 === 'R') : (_pH2 === 'L');
      const _fL2 = currentSport === 'mlb' ? (_pH2 === 'L') : (_pH2 === 'R');
      const labelColors = ['var(--blue)','var(--cyan)','var(--gold)'];
      const sortedCmpKeys = [..._pitchCmpSelected].filter(k=>k!=='season').sort((a,b)=>a-b);
      const cmpData = window._cmpMapsPerEntry.map(({label, map}, i) => {
        const cacheIdx = sortedCmpKeys[i] ?? i;
        const lc = (window._playerLocsCache||{})[cacheIdx] || {};
        const keys2 = sel ? [...sel] : Object.keys(map);
        const getR = k => map[k]?.locsR?.length ? map[k].locsR : (lc.mixVsR?.[k] || lc.mix?.[k] || []);
        const getL = k => map[k]?.locsL?.length ? map[k].locsL : (lc.mixVsL?.[k] || lc.mix?.[k] || []);
        return {
          label,
          locsR: keys2.flatMap(k => _hmFilterLocs(getR(k))),
          locsL: keys2.flatMap(k => _hmFilterLocs(getL(k))),
        };
      });
      area.innerHTML = `<div style="margin-bottom:8px;font-size:10px;font-family:'DM Mono';color:var(--text3)">表示中: <span style="color:var(--text);font-weight:700">${selLabel}</span></div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        ${cmpData.map(({label, locsR, locsL}, i) => `
          <div>
            <div style="font-size:10px;font-family:'DM Mono';font-weight:700;color:${labelColors[i]||'var(--text2)'};margin-bottom:6px">${label}</div>
            <div style="display:flex;gap:14px;flex-wrap:wrap">
              <div>${_buildTable(locsR,'対右打者','locsR',_fR2)}</div>
              <div>${_buildTable(locsL,'対左打者','locsL',_fL2)}</div>
            </div>
          </div>`).join('')}
      </div>`;
      area.style.display = 'block';
      return;
    }

    const _pH2 = window._currentPitcherHand || 'R';
    const _fR2 = currentSport === 'mlb' ? (_pH2 === 'R') : (_pH2 === 'L');
    const _fL2 = currentSport === 'mlb' ? (_pH2 === 'L') : (_pH2 === 'R');

    area.innerHTML = `<div style="margin-bottom:6px;font-size:10px;font-family:'DM Mono';color:var(--text3)">表示中: <span style="color:var(--text);font-weight:700">${selLabel}</span></div>
    <div style="display:flex;gap:24px;flex-wrap:wrap">
      <div>${_buildTable(locsR,'対右打者','locsR',_fR2)}</div>
      <div>${_buildTable(locsL,'対左打者','locsL',_fL2)}</div>
    </div>`;
    area.style.display = 'block';
  }

  function _hmRedraw() {
    const map = window._hmPitchLocsMap;
    if(!map) return;
    const sel = window._hmSelectedKeys;

    // 比較モードの場合は各エントリのcanvasを再描画
    if(window._cmpMapsPerEntry && window._cmpMapsPerEntry.length > 0) {
      const _ph = window._currentPitcherHand || 'R';
      const sortedCmpKeys2 = [..._pitchCmpSelected].filter(k=>k!=='season').sort((a,b)=>a-b);
      window._cmpMapsPerEntry.forEach(({label, map}, i) => {
        const cacheIdx = sortedCmpKeys2[i] ?? i;
        const lc = (window._playerLocsCache||{})[cacheIdx] || {};
        ['vsR','vsL'].forEach(side => {
          const cvId = 'hm-cmp-'+label.replace(/[^a-zA-Z0-9]/g,'_')+'-'+side;
          if(!document.getElementById(cvId)) return;
          const filteredMap = {};
          const _pc3 = {FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6',ST:'#2DD4BF'};
      const allKeys = sel ? [...sel] : Object.keys(map);
      allKeys.forEach(k => {
            const isR = side==='vsR';
            const rawLocs = isR
              ? (map[k]?.locsR?.length ? map[k].locsR : (lc.mixVsR?.[k] || lc.mix?.[k] || []))
              : (map[k]?.locsL?.length ? map[k].locsL : (lc.mixVsL?.[k] || lc.mix?.[k] || []));
            const hexColor = _pc3[k] || (map[k]?.color?.startsWith('#') ? map[k].color : '#94A3B8');
            filteredMap[k] = {
              name: map[k]?.name || k,
              color: hexColor,
              locsR: isR ? _hmFilterLocs(rawLocs) : [],
              locsL: isR ? [] : _hmFilterLocs(rawLocs),
            };
          });
          const _isR = side==='vsR';
          const _fX = currentSport==='mlb' ? (_ph==='R' ? _isR : !_isR) : (_ph==='R' ? !_isR : _isR);
          _drawZoneHeatmapMulti(cvId, filteredMap, null, _isR, _fX);
        });
      });
      _hmRefreshStats();
      return;
    }

    const count = document.getElementById('hm-pitch-count');
    const activeKeys = sel ? [...sel] : Object.keys(map);
    // 全投球数（フィルター前）
    let totR=0,totL=0;
    activeKeys.forEach(k=>{ totR+=(map[k]?.locsR||[]).length; totL+=(map[k]?.locsL||[]).length; });
    // フィルター適用したlocsMapを生成
    const filteredMap = {};
    Object.keys(map).forEach(k => {
      filteredMap[k] = {
        ...map[k],
        locsR: _hmFilterLocs(map[k].locsR),
        locsL: _hmFilterLocs(map[k].locsL),
      };
    });
    // フィルター後の球数
    let filtR=0,filtL=0;
    activeKeys.forEach(k=>{ filtR+=(filteredMap[k]?.locsR||[]).length; filtL+=(filteredMap[k]?.locsL||[]).length; });
    // 表示テキスト: フィルターなし→ 通常表示、フィルターあり→ フィルター数/全体数 (率%)
    const rf = window._hmResultFilter || 'all';
    const zf = window._hmZoneFilter   || 'all';
    const hasFilter = rf !== 'all' || zf !== 'all';
    if(count) {
      if(hasFilter) {
        const rPct = totR>0 ? (filtR/totR*100).toFixed(1) : '0.0';
        const lPct = totL>0 ? (filtL/totL*100).toFixed(1) : '0.0';
        count.textContent = `R:${filtR}/${totR}球 (${rPct}%)  L:${filtL}/${totL}球 (${lPct}%)`;
      } else {
        count.textContent = `R:${totR}球 / L:${totL}球`;
      }
    }
    const _ph = window._currentPitcherHand || 'R';
    const _fR = currentSport === 'mlb' ? (_ph === 'R') : (_ph === 'L');
    const _fL = currentSport === 'mlb' ? (_ph === 'L') : (_ph === 'R');
    _drawZoneHeatmapMulti('hm-vsR', filteredMap, sel, true,  _fR);
    _drawZoneHeatmapMulti('hm-vsL', filteredMap, sel, false, _fL);
    // 統計表示中なら自動更新
    _hmRefreshStats();
  }

  function _renderHeatmaps(mixAll) {
    const area = document.getElementById('pitch-heatmap-area');

      // シーズン行: 全登板の集約locsを使用

    }

      // locs（座標データ）がない場合はヒートマップ・トグルボタンのみ非表示にする

  function _renderHeatmapForPitch(pitchKey, pitchName, pitchColor) {
    const map = window._hmPitchLocsMap;

    if(!map[pitchKey]) return;
    window._hmSelectedKeys = new Set([pitchKey]);

name: MLB公式日程との突き合わせ（取りこぼし試合の洗い出し）

# MLB公式の日程（statsapi）で終了している試合のうち、当サイトのデータに無い試合を一覧にする。データは書き換えない（読み取り専用）。
on:
  workflow_dispatch:
    inputs:
      years:
        description: '対象年（スペース区切り）'
        required: false
        default: '2026 2025 2024 2023 2022 2021'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 突き合わせ
        run: python baseball/scripts/check_mlb_schedule_gaps.py --year ${{ inputs.years }}

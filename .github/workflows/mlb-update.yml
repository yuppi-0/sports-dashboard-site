name: MLBデータ自動更新

on:
  # GitHub自身のschedule機能は時刻通りに発火しない不具合が続いたため廃止。
  # 代わりにcron-job.org（外部サービス）から、この後のworkflow_dispatchをAPI経由で
  # 直接叩く方式に切り替えた。
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付（例: 2026-08-20 / 2026-08-17:2026-08-24 / 空欄なら自動計算）'
        required: false
        default: ''
      steps:
        description: '実行ステップ（games/highlights/datamart/llm_input/batter_llm_input/defense/all。スペース区切りで複数可。defenseは守備OAA・スプリントスピード・捕手フレーミング/PopTimeを取得するシーズン単位のステップで、allには含まれない）'
        required: false
        default: 'all'
      refetch:
        description: 'true にすると、保存済みのRAWキャッシュを使わずStatcastを取り直す（欠けた試合を補う。通常は空欄）'
        required: false
        default: ''
      years:
        description: 'defenseステップ専用：対象年をスペース区切りで複数指定（例: 2024 2025 2026。並列取得する）。空欄なら日付の年'
        required: false
        default: ''
      backfill_days:
        description: '取りこぼし確認の遡り日数（空欄なら既定の1日＝前日だけ確認。月1回など広く調べ直すときだけ 35 などを指定（NPBは公式記録の訂正も確認し、取り直す日の上限は20に広がる））'
        required: false
        default: ''
      source:
        description: 'cron-job.org専用。空欄のままでOK'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-mlb:
    runs-on: ubuntu-latest
    steps:
      - name: サイト側リポジトリを取得（このリポジトリ自身。docs/・scripts/など）
        uses: actions/checkout@v4

      - name: データ側リポジトリを取得（非公開のsports-dashboard-data。data/配下に展開）
        uses: actions/checkout@v4
        with:
          repository: yuppi-0/sports-dashboard-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 対象日付を計算
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TARGET="${{ inputs.date }}"
          else
            # run_mlb.py 側が内部で「date-1日」のStatcastを取得し「date」ラベルで
            # 保存する時差調整ロジックを既に持っているため、ここでは前日にずらさず
            # 日本時間の「今日」をそのまま渡す。
            TARGET=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "対象日: $TARGET"

      - name: 実行ステップを整理（datamart / llm_input / batter_llm_input を独立させる）
        id: steps
        run: |
          # 「all」のときだけ、シーズン全体のxlsx・数値JSON（llm_input / batter_llm_input）まで自動で実行する。
          # それ以外は指定したステップだけを実行する（datamart を指定しても llm_input は自動付与しない）。
          # llm_input / batter_llm_input はシーズン全体の共有ファイルを書き換えるため、並列実行すると
          # git push時に競合する。datamart だけなら日付ごとのファイルしか書かないので並列実行できる。
          STEPS="${{ inputs.steps || 'all' }}"
          if echo " $STEPS " | grep -qw "all"; then
            SKIP_FLAGS=""
          else
            SKIP_FLAGS="--skip-llm-input --skip-batter-llm-input"
          fi
          echo "steps=$STEPS" >> "$GITHUB_OUTPUT"
          echo "skip_flags=$SKIP_FLAGS" >> "$GITHUB_OUTPUT"
          echo "実行ステップ: $STEPS ${SKIP_FLAGS:+(llm_input系は指定時のみ実行)}"

      - name: 重複実行チェック（cron-job.orgからの自動実行のみ。手動実行は常に実行する）
        id: check
        run: |
          SKIP=false
          if [ "${{ inputs.source }}" = "cron" ]; then
            LAST_MSG=$(git log -1 --pretty=%s)
            if echo "$LAST_MSG" | grep -q "MLB自動更新: ${{ steps.date.outputs.date }}"; then
              echo "既に ${{ steps.date.outputs.date }} 分は処理済み（手動実行済みの可能性）のためスキップします"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: MLBデータを取得・更新
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          YEARS_ARG=""
          if [ -n "${{ inputs.years }}" ]; then YEARS_ARG="--year ${{ inputs.years }}"; fi
          REFETCH_ARG=""
          if [ "${{ inputs.refetch }}" = "true" ]; then REFETCH_ARG="--refetch"; fi
          python baseball/scripts/run_mlb.py --date ${{ steps.date.outputs.date }} --steps ${{ steps.steps.outputs.steps }} ${{ steps.steps.outputs.skip_flags }} $YEARS_ARG $REFETCH_ARG

      - name: 活躍選手0件の日付がないか確認
        if: steps.check.outputs.skip != 'true'
        run: |
          python - <<'PYEOF'
          import json, glob, datetime, os

          steps_arg = os.environ.get("STEPS_ARG", "all")
          if "highlights" not in steps_arg and steps_arg != "all":
              raise SystemExit(0)

          target = os.environ.get("TARGET_DATE", "")
          if ":" in target:
              d0s, d1s = target.split(":")
              d0 = datetime.date.fromisoformat(d0s)
              d1 = datetime.date.fromisoformat(d1s)
              dates = [(d0 + datetime.timedelta(days=i)).isoformat()
                       for i in range((d1 - d0).days + 1)]
          else:
              dates = [target]

          missing = []
          for d in dates:
              found_file = False
              has_hl = False
              for path in glob.glob(f"docs/baseball/data/MLB/*/*/games/json/{d}.json"):
                  found_file = True
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  games = data.get(d) or []
                  hl = (data.get("highlights") or {}).get(d) or []
                  if not games:
                      has_hl = True
                      break
                  if hl:
                      has_hl = True
                  break
              if found_file and not has_hl:
                  missing.append(d)

          if missing:
              print(f"::warning::活躍選手が0件の日付があります: {', '.join(missing)}。--steps highlights で該当日を再実行してください")
          else:
              print("活躍選手チェック: 問題なし")
          PYEOF
        env:
          STEPS_ARG: ${{ inputs.steps || 'all' }}
          TARGET_DATE: ${{ steps.date.outputs.date }}

      - name: 当日分：データ側をコミット&push（sports-dashboard-data）
        if: steps.check.outputs.skip != 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "更新なし（データ変化なし）"
          else
            git commit -m "MLB自動更新: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            # 並列ジョブの同時pushでも取りこぼさないよう、競合解消・再試行つきのヘルパーでpushする（失敗時はステップも失敗）
            bash "$GITHUB_WORKSPACE/baseball/scripts/push_with_retry.sh"
          fi

      - name: 当日分：サイト側（docs/）をコミット&push（このリポジトリ自身）
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし（docs変化なし）"
          else
            git commit -m "MLB自動更新: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            # index.jsonは並列ジョブ同士で競合しやすいので、競合解消後に実在ファイルから再生成する
            ADD_PATHS=docs bash baseball/scripts/push_with_retry.sh "python baseball/scripts/rebuild_index.py"
          fi

      - name: 前日分の取りこぼしの自動取り直し（当日分をpushしたあとに実行。公式日程で終了済みなのにデータが無い試合）
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 20    # 万一長引いても、ここで打ち切って次のコミット手順に進む
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_ARGS: ${{ inputs.backfill_days && format('--days {0} --max-dates 20', inputs.backfill_days) || '' }}
        run: |
          STEPS_NOW="${{ inputs.steps || 'all' }}"
          if echo " $STEPS_NOW " | grep -Eqw "all|games"; then
            python baseball/scripts/backfill_missing_mlb_games.py "${{ steps.date.outputs.date }}" $BACKFILL_ARGS 2>&1 | tail -n 40
          else
            echo "games を含まないためスキップ"
          fi

      - name: 前日分の取り直し：データ側をコミット&push（sports-dashboard-data）
        if: steps.check.outputs.skip != 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "更新なし（前日分に取り直しなし）"
          else
            git commit -m "MLB自動更新（前日分の取りこぼし取り直し）: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            # 並列ジョブの同時pushでも取りこぼさないよう、競合解消・再試行つきのヘルパーでpushする（失敗時はステップも失敗）
            bash "$GITHUB_WORKSPACE/baseball/scripts/push_with_retry.sh"
          fi

      - name: 前日分の取り直し：サイト側（docs/）をコミット&push（このリポジトリ自身）
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし（前日分に取り直しなし）"
          else
            git commit -m "MLB自動更新（前日分の取りこぼし取り直し）: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            # index.jsonは並列ジョブ同士で競合しやすいので、競合解消後に実在ファイルから再生成する
            ADD_PATHS=docs bash baseball/scripts/push_with_retry.sh "python baseball/scripts/rebuild_index.py"
          fi
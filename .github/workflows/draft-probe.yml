name: ドラフト候補ページの接続確認（draft-repo.com）

# draft-repo.com の選手ページを少数だけ取得し、生HTMLを非公開のデータ側リポジトリ
# （sports-dashboard-data / draft/_probe/）に保存する。
# このリポジトリは公開なのでActionsのログは誰でも読める。ログにはHTTPステータスとサイズしか出さず、
# ページの中身（成績データ）は一切出力しない。

on:
  workflow_dispatch:
    inputs:
      ids:
        description: '取得するblog-entryのID（カンマ区切り。例: 2855,3725,1001）'
        required: false
        default: '2855,3725,1001'
      data_ref:
        description: 'データ側リポジトリの取得元ブランチ'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: データ側リポジトリを取得（非公開のsports-dashboard-data）
        uses: actions/checkout@v4
        with:
          repository: yuppi-0/sports-dashboard-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: ${{ inputs.data_ref }}
          path: data

      - name: ページを取得（間隔1秒。中身はログに出さない）
        env:
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p data/draft/_probe
          for id in $(echo "$IDS" | tr ',' ' '); do
            case "$id" in (*[!0-9]*|'') echo "不正なID: skip"; continue;; esac
            code=$(curl -sS -m 30 -A "sports-dashboard-data-research/1.0 (personal use; github.com/yuppi-0)" \
              -o "data/draft/_probe/${id}.html" -w "%{http_code}" \
              "https://draft-repo.com/blog-entry-${id}.html" || echo "curl_error")
            echo "ID=${id} status=${code} bytes=$(wc -c < "data/draft/_probe/${id}.html" 2>/dev/null || echo 0)"
            sleep 1
          done

      - name: データ側にコミット&push（非公開リポジトリのみ）
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draft/_probe
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "draft-repo.com 接続確認: ページ取得"
            git push
          fi

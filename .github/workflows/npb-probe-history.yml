name: NPB過去シーズンの取得可否の調査

# 過去シーズンのNPB試合をYahoo!から取得できるか調べる読み取り専用ワークフロー。データは書き換えない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python baseball/scripts/probe_npb_history.py 2>&1 | grep -v "FutureWarning\|google\|genai\|README\|updates or bug" || true

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サッカー選手AI解釈カード</title>
<style>
  :root{
    --bg:#05080F; --panel:#0F1B2E; --panel-alt:#111F33; --border:rgba(59,130,246,0.16);
    --text:#E2E8F0; --text-dim:#94A3B8; --text-bright:#F1F5F9;
    --green:#10B981; --green-text:#6EE7B7; --red:#F87171; --red-text:#FCA5A5;
    --blue:#3B82F6; --blue-text:#93C5FD; --amber:#F59E0B; --amber-text:#FCD34D;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior-x:none; }
  body{ background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans","Helvetica Neue",Arial,sans-serif; }
  .app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header{ padding:14px 20px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center;
    justify-content:space-between; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  header h1{ font-size:17px; margin:0; font-weight:700; color:var(--text-bright); }
  .header-controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select,input[type=text],input[type=number]{ font-family:inherit; }
  .filter-select{ flex:1; min-width:0; background:var(--panel); border:1px solid rgba(148,163,184,0.2); border-radius:8px;
    color:var(--text); font-size:12px; padding:6px 8px; outline:none; }

  .body-layout{ display:flex; flex:1; min-height:0; }
  .sidebar{ width:290px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; height:100%; }
  .filter-panel{ padding:10px 14px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .filter-panel-label{ font-size:9.5px; font-weight:700; color:var(--text-dim); margin:2px 0 -2px; }
  .filter-panel-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .season-select{ flex:none; min-width:150px; }
  .search-input{ width:100%; background:var(--panel); border:1px solid rgba(148,163,184,0.2); border-radius:8px;
    padding:7px 12px; color:var(--text); font-size:13px; outline:none; }
  .search-input:focus{ border-color:var(--blue); }
  .sort-dir-btn{ background:var(--panel); border:1px solid rgba(148,163,184,0.2); border-radius:8px; color:var(--text);
    font-size:12px; padding:6px 10px; cursor:pointer; white-space:nowrap; }
  .filter-row{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-dim); }
  .filter-row input[type=number]{ width:60px; background:var(--panel); border:1px solid rgba(148,163,184,0.2);
    border-radius:6px; color:var(--text); font-size:12px; padding:4px 6px; }
  .player-list{ flex:1; overflow-y:auto; padding:6px 8px 20px; }
  .player-item{ padding:8px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .player-item:hover{ background:var(--panel); }
  .player-item.active{ background:var(--panel-alt); border-color:var(--border); }
  .player-item .name{ font-size:13.5px; font-weight:700; color:var(--text-bright); }
  .player-item .meta{ font-size:11px; color:var(--text-dim); display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px 8px; margin-top:2px; }
  .player-item .meta b{ color:var(--blue-text); }
  .ai-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-left:6px; vertical-align:middle; }
  .empty-list{ color:var(--text-dim); font-size:12.5px; padding:20px 10px; text-align:center; }

  main{ flex:1; min-width:0; overflow-y:auto; padding:0 24px 60px; }
  .placeholder,.error{ color:var(--text-dim); font-size:14px; padding:60px 10px; text-align:center; }
  .error{ color:var(--red-text); }
  .back-btn{ display:none; background:var(--panel); border:1px solid rgba(148,163,184,0.2); color:var(--text);
    border-radius:8px; font-size:12px; padding:6px 12px; margin-bottom:10px; cursor:pointer; }

  .p-head{ display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:0 -24px 14px; padding:16px 24px 12px;
    position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); box-shadow:0 8px 14px -10px rgba(0,0,0,.7); }
  .p-name{ font-size:22px; font-weight:800; color:var(--text-bright); }
  .p-sub{ font-size:12.5px; color:var(--text-dim); margin-top:3px; }
  .pos-badge{ display:inline-block; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:5px;
    background:rgba(59,130,246,0.18); color:var(--blue-text); margin-right:6px; }
  .pos-mix{ font-size:11.5px; }
  .sub-h{ font-size:11px; font-weight:700; color:var(--amber-text); margin:14px 0 4px; letter-spacing:0.02em; }
  .kpis{ display:flex; gap:8px; flex-wrap:wrap; }
  .kpi{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:7px 12px; min-width:70px; }
  .kpi .l{ font-size:10px; color:var(--text-dim); }
  .kpi .v{ font-size:17px; font-weight:800; color:var(--text-bright); white-space:nowrap; }
  .kpi .v .u{ font-size:10px; font-weight:500; color:var(--text-dim); margin-left:3px; letter-spacing:0.02em; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .card h2{ font-size:13.5px; margin:0 0 10px; color:var(--text-bright); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .note{ font-size:11px; color:var(--text-dim); margin:6px 0 0; line-height:1.5; }
  .ai-tag{ display:inline-block; background:rgba(16,185,129,0.14); color:var(--green-text); font-weight:800;
    font-size:15px; padding:5px 12px; border-radius:8px; margin-bottom:10px; }
  .ai-group{ margin-top:10px; }
  .ai-group h3{ font-size:11px; font-weight:700; color:var(--amber-text); margin:0 0 4px; letter-spacing:0.02em; }
  .ai-group ul{ margin:0; padding-left:18px; }
  .ai-group li{ font-size:13px; line-height:1.65; margin-bottom:3px; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; color:var(--text-dim); font-weight:700; font-size:11px; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td{ padding:7px 8px; border-bottom:1px solid rgba(148,163,184,0.08); vertical-align:top; }
  td.num,th.num{ text-align:right; }
  .val{ font-weight:800; color:var(--text-bright); font-size:14px; }
  .rk{ display:block; font-size:10.5px; color:var(--text-dim); margin-top:1px; }
  .rk.top{ color:var(--green-text); } .rk.low{ color:var(--red-text); } .rk.mid{ color:var(--text-dim); }
  .rk.none{ opacity:0.55; }
  .table-scroll{ overflow-x:auto; }
  .seg{ display:inline-flex; background:var(--bg); border-radius:8px; padding:2px; gap:2px; }
  .seg button{ border:none; background:transparent; color:var(--text-dim); font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:6px; cursor:pointer; }
  .seg button.active{ background:var(--panel-alt); color:var(--text-bright); }

  /* 指標セクション（カテゴリ別のタイル） */
  .seg-row{ display:inline-flex; gap:8px; flex-wrap:wrap; }
  .mt-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .mt{ background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:8px 10px; min-width:0; }
  .mt.core{ border-color:rgba(59,130,246,0.5); }
  .mt-l{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; font-size:11px; color:var(--text-dim); line-height:1.35; }
  .core-tag{ flex-shrink:0; font-size:9px; font-weight:800; color:var(--blue-text); background:rgba(59,130,246,0.18); padding:0 5px; border-radius:4px; }
  .mt-l .sub-mark{ display:block; margin:1px 0 0; }
  .mt-v{ margin-top:4px; white-space:nowrap; }
  .mt-v .val{ font-size:17px; }
  .mt-v .u{ font-size:10px; color:var(--text-dim); margin-left:3px; }

  .pt-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .pt{ background:var(--panel-alt); border:1px solid var(--border); border-radius:12px; padding:11px 13px; }
  .pt-title{ font-size:13px; font-weight:800; color:var(--text-bright); }
  .pt-title small{ font-weight:600; color:var(--text-dim); font-size:10.5px; margin-left:4px; }
  .pt-use{ font-size:11.5px; color:var(--text-dim); margin:5px 0 4px; }
  .bar{ height:5px; background:rgba(148,163,184,0.15); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .bar i{ display:block; height:100%; background:var(--blue); }
  .pt-tag{ display:inline-block; font-size:11px; font-weight:700; color:var(--amber-text); background:rgba(245,158,11,0.12); padding:2px 8px; border-radius:6px; margin-bottom:6px; }
  .pt-metric{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; padding:3px 0; border-top:1px solid rgba(148,163,184,0.08); }
  .pt-metric .rk{ display:inline; margin-left:6px; }

  .r-hi{ color:var(--green-text); font-weight:800; } .r-lo{ color:var(--red-text); font-weight:800; }
  .res-W{ color:var(--green-text); } .res-L{ color:var(--red-text); } .res-D{ color:var(--text-dim); }
  .sub-mark{ font-size:9.5px; color:var(--text-dim); margin-left:3px; }

  /* 年度ブロック（折りたたみ） */
  details.yr{ margin:0 0 8px; }
  details.yr > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:6px 0 8px; font-size:12.5px; color:var(--text-bright); }
  details.yr > summary::-webkit-details-marker{ display:none; }
  details.yr > summary::after{ content:"⌄"; margin-left:auto; color:var(--text-dim); font-size:14px; }
  details.yr[open] > summary::after{ content:"⌃"; }
  .yr-bar{ width:3px; height:14px; border-radius:2px; background:var(--blue); flex-shrink:0; }
  .yr-n{ color:var(--text-dim); font-weight:600; font-size:11.5px; }
  .yr-plain{ margin:0 0 4px; }
  .yr-warn{ font-size:11px; color:var(--text-dim); line-height:1.6; margin:6px 0 0; padding:8px 10px; border-radius:8px; background:rgba(245,158,11,0.08); word-break:break-all; }

  /* シーズン成績テーブル */
  table.log td:nth-child(2){ white-space:nowrap; }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--text-bright); }
  th.sorted{ color:var(--blue-text); }
  th .arr{ font-size:9px; margin-left:2px; }
  tr.season-row td{ background:rgba(59,130,246,0.09); font-weight:700; color:var(--text-bright); border-bottom:1px solid var(--border); }
  .vn{ display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:5px; font-size:10px; font-weight:800; margin-right:7px; vertical-align:middle; }
  .vn-h{ background:rgba(16,185,129,0.16); color:var(--green-text); }
  .vn-a{ background:rgba(148,163,184,0.16); color:var(--text-dim); }

  @media (max-width:720px){
    header{ padding:10px 12px 8px; }
    .body-layout{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; flex:1; min-height:0; }
    .body-layout.has-selection .sidebar{ display:none; }
    .body-layout:not(.has-selection) main{ display:none; }
    .back-btn{ display:inline-block; }
    main{ padding:0 12px 60px; }
    .mt-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .back-btn{ margin-top:10px; }
    .p-head{ margin:0 -12px 12px; padding:8px 12px 8px; gap:8px; align-items:stretch; }
    .p-name{ font-size:18px; }
    .p-sub{ margin-top:1px; }
    .kpis{ flex-wrap:nowrap; gap:5px; width:100%; }
    .kpi{ flex:1; min-width:0; padding:4px 4px; border-radius:8px; }
    .kpi .l{ font-size:8.5px; white-space:nowrap; }
    .kpi .v{ font-size:13.5px; }
    .kpi .v .u{ font-size:8px; margin-left:1px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>サッカー選手 AI解釈カード</h1>
    <div class="header-controls">
      <select id="seasonSelect" class="filter-select season-select" aria-label="年度"></select>
    </div>
  </header>

  <div class="body-layout" id="bodyLayout">
    <aside class="sidebar">
      <div class="filter-panel">
        <input id="searchInput" type="text" class="search-input" placeholder="選手名で検索">
        <div class="filter-panel-label">並び替え</div>
        <div class="filter-panel-row">
          <select id="sortField" class="filter-select"></select>
          <button type="button" id="sortDirBtn" class="sort-dir-btn">降順 ↓</button>
        </div>
        <div class="filter-panel-label">フィルタ</div>
        <div class="filter-panel-row">
          <select id="leagueSelect" class="filter-select" aria-label="リーグ"></select>
        </div>
        <div class="filter-panel-row">
          <select id="teamSelect" class="filter-select"><option value="">全クラブ</option></select>
          <select id="groupSelect" class="filter-select">
            <option value="">全ポジション</option>
            <option value="FW">FW</option><option value="WG">WG</option><option value="MF">MF</option>
            <option value="CB">CB</option><option value="SB">SB</option><option value="GK">GK</option>
          </select>
        </div>
        <div class="filter-panel-row">
          <label class="filter-row">出場時間 <input id="minMinFilter" type="number" min="0" step="90" placeholder="0"> 分以上</label>
          <label class="filter-row"><input id="aiOnlyFilter" type="checkbox"> AIコメントがある選手のみ</label>
        </div>
      </div>
      <div class="player-list" id="playerList"><div class="empty-list">読み込み中…</div></div>
    </aside>
    <main>
      <div id="mainContent" class="placeholder">左の一覧から選手を選んでください</div>
    </main>
  </div>
</div>

<script>
// ── データの置き場所（docs/soccer/ からの相対パス）。manifest.json にあるリーグ・シーズンだけが選べる ──
const DATA_ROOT = "data";
const seasonBase = (league, year) => `${DATA_ROOT}/games/${year}/${league}`;

const SORT_FIELDS = [
  ["rating_avg", "平均評価", 2], ["minutes", "出場時間", 0], ["goals_p90", "ゴール/90", 2],
  ["key_passes_p90", "キーパス/90", 2], ["progressive_passes_p90", "プログレッシブパス/90", 2],
  ["tackles_p90", "タックル/90", 2], ["interceptions_p90", "インターセプト/90", 2],
  ["assists_p90", "アシスト/90", 2], ["np_goals_p90", "ノンPKゴール/90", 2], ["big_chances_created_p90", "ビッグチャンス創出/90", 2],
  ["name", "名前", 0],
];
const PT_VENUE_LABEL = { all: "全体", home: "ホーム", away: "アウェイ" };
const AI_GROUPS = [["play_style", "プレースタイル"], ["season_metrics", "指標評価"], ["play_metrics", "プレー別指標評価"]];

const $ = (s) => document.querySelector(s);
const listEl = $("#playerList"), mainEl = $("#mainContent"), bodyEl = $("#bodyLayout");
const searchEl = $("#searchInput"), sortFieldEl = $("#sortField"), sortDirEl = $("#sortDirBtn");
const teamEl = $("#teamSelect"), groupEl = $("#groupSelect"), minMinEl = $("#minMinFilter"), aiOnlyEl = $("#aiOnlyFilter");
const leagueEl = $("#leagueSelect"), seasonEl = $("#seasonSelect");

let manifest = null, league = "all", seasonSel = "all";     // league: リーグ名または "all"（全リーグ） / seasonSel: 年（"2025"）または "all"（すべての年度）
let allPlayers = [], activeId = null, sortField = "rating_avg", sortDir = "desc";
let mtBasis = "p90", mtVenue = "all", mtEff = "p90";           // 指標セクションの切替（全体=累計 / 90分あたり、全試合 / ホーム / アウェイ）
let ptVenue = "all", activeCards = [], primaryIdx = 0;      // activeCards: [{year, title, card, llm}]（新しい年度が先頭）。primaryIdx = ヘッダーなどに使う年度
let logSort = { key: "date", dir: "desc" };                 // シーズン成績の並び順（既定は日付の降順）
let openState = {};                                         // 年度ブロックの開閉状態
let selToken = 0, loadToken = 0;
const idxCache = {}, llmCache = {};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// GitHub Pages（CDN）のキャッシュで更新直後に古いJSONが返るのを避けるため、毎回変わるクエリを付ける
const bust = (url) => `${url}${url.includes("?") ? "&" : "?"}_=${Date.now()}`;
async function getJson(url){
  const res = await fetch(bust(url), { cache: "no-store" });
  if(!res.ok) throw new Error(`${url} の取得に失敗しました (${res.status})`);
  return res.json();
}

const fmt = (v, unit) => v == null ? "—" : (unit === "%" ? v.toFixed(1) + "%" : unit === "m" ? v.toFixed(1) + "m" : (Number.isInteger(v) ? String(v) : v.toFixed(2)));
// 「ゴール/90」→「ゴール（/90分あたり）」
const lbl = (s) => String(s ?? "").replace(/\/90(?=$|[（(\s])/, "（/90分あたり）");
const nk = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const numOf = (v) => typeof v === "number" && isFinite(v) ? v : null;
const sumOf = (arr) => { const v = arr.map(numOf).filter(n => n != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };

// 順位チップ。母数が少ない指標（10人未満）は、上位・下位の色を付けない
function rankChip(c){
  if(!c || c.rank == null || c.pop == null) return `<span class="rk none">順位なし</span>`;
  const p = c.pop > 1 ? (c.rank - 1) / (c.pop - 1) : 0.5;
  const cls = c.pop < 10 ? "mid" : p <= 0.25 ? "top" : p >= 0.75 ? "low" : "mid";
  return `<span class="rk ${cls}">${c.rank}位 / ${c.pop}人</span>`;
}

// ── リーグ・年度 ──
const leaguesSel = () => league === "all" ? Object.keys(manifest.leagues || {}) : [league];
const seasonsOf = (lg) => ((manifest.leagues[lg] || {}).seasons || []).slice().sort((a, b) => Number(b.year) - Number(a.year));
// 選択中のリーグにある年度の一覧（新しい順・重複なし）
function seasonsUnion(){
  const m = new Map();
  leaguesSel().forEach(lg => seasonsOf(lg).forEach(s => { if(!m.has(String(s.year))) m.set(String(s.year), s); }));
  return [...m.values()].sort((a, b) => Number(b.year) - Number(a.year));
}
const yLabel = (y) => {
  for(const lg of Object.keys(manifest.leagues || {})){
    const s = seasonsOf(lg).find(x => String(x.year) === String(y)); if(s) return s.label;
  }
  return String(y);
};
// 順位の下限（900分＝約10試合分）に達した年度を「消化済み」とみなす。試合数の少ない年度は、ヘッダー・一覧の初期表示に使わない
const READY_GAMES = 10;
const isReady = (lg, year) => {
  const s = ((manifest.leagues[lg] || {}).seasons || []).find(x => String(x.year) === String(year));
  return !s || s.games == null || s.games >= READY_GAMES;
};
const yearsSelected = () => seasonSel === "all" ? seasonsUnion().map(s => String(s.year)) : [String(seasonSel)];
// 複数年を束ねるときの選手キー。idは「選手番号_クラブ」なので、移籍しても同じ選手になるよう番号だけを使う
const pkey = (id) => { const m = /^(\d+)_/.exec(String(id)); return m ? m[1] : String(id); };

// ── 初期化 ──
async function init(){
  SORT_FIELDS.forEach(([k, l]) => sortFieldEl.insertAdjacentHTML("beforeend", `<option value="${k}">${esc(lbl(l))}</option>`));
  sortFieldEl.value = sortField;
  try{
    manifest = await getJson(`${DATA_ROOT}/manifest.json`);
  }catch(e){
    listEl.innerHTML = `<div class="empty-list">データがまだありません。<br>(${esc(e.message)})</div>`;
    return;
  }
  const leagues = Object.keys(manifest.leagues || {});
  if(!leagues.length){ listEl.innerHTML = '<div class="empty-list">データがまだありません</div>'; return; }
  leagueEl.innerHTML = `<option value="all">全リーグ</option>` + leagues.map(k => `<option value="${esc(k)}">${esc(manifest.leagues[k].label)}</option>`).join("");
  leagueEl.value = league;
  fillSeasonSelect();
  loadPlayers();
}
function fillSeasonSelect(){
  const seasons = seasonsUnion();
  seasonEl.innerHTML = `<option value="all">すべての年度</option>` + seasons.map(s => `<option value="${esc(s.year)}">${esc(s.label)}</option>`).join("");
  if(seasonSel !== "all" && !seasons.some(s => String(s.year) === String(seasonSel))) seasonSel = "all";
  seasonEl.value = seasonSel;
}
leagueEl.addEventListener("change", () => { league = leagueEl.value; fillSeasonSelect(); loadPlayers(); });
seasonEl.addEventListener("change", () => { seasonSel = seasonEl.value; loadPlayers(); });

// ── LLM解釈JSON（llm/<年>/{クラブ}.json。ポジションはまとめて1ファイル）──
async function loadLlmFile(st, year, file){
  if(st.tried.has(file)) return st.tried.get(file);
  const team = file.replace(/\.json$/, "");
  const pr = (async () => {
    try{
      const batch = await getJson(`${DATA_ROOT}/llm/${year}/${encodeURIComponent(file)}`);
      const names = Object.keys(batch || {});
      st.names.set(team, names);
      names.forEach(name => {
        const data = batch[name];
        if(!data || typeof data !== "object") return;
        st.byTeamName.set(`${team}|${name}`, data);
        st.byName.set(name, data);
        st.norm.set(`${nk(team)}|${nk(name)}`, data);
      });
      st.status.set(file, "ok"); return "ok";
    }catch(e){ st.status.set(file, "missing"); return "missing"; }
  })();
  st.tried.set(file, pr);
  return pr;
}
async function loadLlmYear(year){
  if(llmCache[year]) return llmCache[year];
  const st = { files: [], byTeamName: new Map(), byName: new Map(), norm: new Map(), names: new Map(), tried: new Map(), status: new Map() };
  llmCache[year] = st;
  try{
    const idx = await getJson(`${DATA_ROOT}/llm/${year}/index.json`);
    st.files = idx.files || [];
  }catch(e){ /* LLM解釈がまだ無い */ }
  await Promise.all(st.files.map(f => loadLlmFile(st, year, f)));
  return st;
}
function getLlm(year, team, name){
  const st = llmCache[year]; if(!st) return null;
  return st.byTeamName.get(`${team}|${name}`) || st.norm.get(`${nk(team)}|${nk(name)}`) || st.byName.get(name) || null;
}
// index.json に載っていないクラブのファイルも、カードを開いたときに直接取りにいく
async function ensureLlm(year, team, name){
  let llm = getLlm(year, team, name);
  if(llm) return llm;
  const st = llmCache[year] || await loadLlmYear(year);
  await loadLlmFile(st, year, `${team}.json`);
  return getLlm(year, team, name);
}

// ── 一覧 ──
function mergePlayers(key, list){          // list: [{year, lg, p}]（新しい年度が先頭）。一覧の数値は、消化済みの最新年度のものを使う
  const main = list.find(({ year, lg }) => isReady(lg, year)) || list[0];
  return { ...main.p, key, entries: list.map(({ year, lg, p }) => ({ year, league: lg, id: p.id, team: p.team })) };
}
const hasLlm = (p) => p.entries.some(e => getLlm(e.year, e.team, p.name));

async function loadPlayers(){
  listEl.innerHTML = '<div class="empty-list">読み込み中…</div>';
  mainEl.className = "placeholder"; mainEl.innerHTML = "左の一覧から選手を選んでください";
  bodyEl.classList.remove("has-selection");
  activeId = null; activeCards = []; searchEl.value = ""; groupEl.value = ""; minMinEl.value = "";
  const years = yearsSelected(), my = ++loadToken;
  // 読みにいく（リーグ × 年度）の組。そのリーグに無い年度は読まない
  const pairs = [];
  years.forEach(y => leaguesSel().forEach(lg => { if(seasonsOf(lg).some(x => String(x.year) === y)) pairs.push({ lg, y }); }));
  const res = await Promise.all(pairs.map(({ lg, y }) =>
    getJson(`${seasonBase(lg, y)}/index.json`).then(idx => ({ lg, y, idx })).catch(err => ({ lg, y, err }))));
  if(my !== loadToken) return;
  const ok = res.filter(r => r.idx);
  if(!ok.length){ allPlayers = []; listEl.innerHTML = `<div class="empty-list">${esc(res.length ? res[0].err.message : "データがありません")}</div>`; return; }
  await Promise.all(years.map(loadLlmYear));
  if(my !== loadToken) return;
  const multi = years.length > 1, byKey = new Map(), teams = [];
  ok.forEach(({ lg, y, idx }) => {
    (idx.teams || []).forEach(t => { if(!teams.includes(t)) teams.push(t); });
    (idx.players || []).forEach(p => {
      const k = multi ? pkey(p.id) : p.id;
      if(!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push({ year: y, lg, p });
    });
  });
  allPlayers = [...byKey.entries()].map(([k, list]) => mergePlayers(k, list));
  teamEl.innerHTML = '<option value="">全クラブ</option>' + teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  const has = years.some(y => llmCache[y] && llmCache[y].byTeamName.size > 0);
  aiOnlyEl.disabled = !has;
  aiOnlyEl.checked = has;
  renderList();
  // index.json に載っていないクラブのファイルも探す（手動でアップロードしたファイルなど）。見つかったら一覧を更新する
  await Promise.all(ok.flatMap(({ y, idx }) => (idx.teams || []).map(t => loadLlmFile(llmCache[y], y, `${t}.json`))));
  if(my !== loadToken) return;
  aiOnlyEl.disabled = !years.some(y => llmCache[y] && llmCache[y].byTeamName.size > 0);
  renderList();
}

function applyFilters(){
  const q = searchEl.value.trim().toLowerCase(), team = teamEl.value, group = groupEl.value;
  const minMin = parseFloat(minMinEl.value), aiOnly = aiOnlyEl.checked && !aiOnlyEl.disabled;
  const dir = sortDir === "desc" ? -1 : 1;
  return allPlayers.filter(p =>
      (!q || p.name.toLowerCase().includes(q)) && (!team || p.entries.some(e => e.team === team)) && (!group || p.group === group) &&
      (isNaN(minMin) || (p.minutes ?? 0) >= minMin) && (!aiOnly || hasLlm(p)))
    .sort((a, b) => {
      if(sortField === "name") return dir * a.name.localeCompare(b.name);
      const av = a[sortField], bv = b[sortField];
      if(av == null && bv == null) return 0;
      if(av == null) return 1; if(bv == null) return -1;   // 値が無い選手は常に末尾
      return dir * (av - bv);
    });
}

function renderList(){
  const players = applyFilters();
  if(!players.length){ listEl.innerHTML = '<div class="empty-list">該当する選手がいません</div>'; return; }
  const def = SORT_FIELDS.find(f => f[0] === sortField);
  listEl.innerHTML = players.map(p => {
    const metric = sortField !== "name" ? `<span>${esc(lbl(def[1]))}: <b>${p[sortField] == null ? "—" : Number(p[sortField]).toFixed(def[2])}</b></span>` : "";
    return `<div class="player-item ${p.key === activeId ? "active" : ""}" data-key="${esc(p.key)}">
      <div class="name">${esc(p.name)}${hasLlm(p) ? '<span class="ai-dot" title="AIコメントあり"></span>' : ""}</div>
      <div class="meta"><span>${esc(p.team)} ・ ${esc(p.group)}</span>${metric}</div></div>`;
  }).join("");
  listEl.querySelectorAll(".player-item").forEach(it => it.addEventListener("click", () => selectPlayer(it.dataset.key)));
}

[searchEl, minMinEl].forEach(e => e.addEventListener("input", renderList));
[teamEl, groupEl, aiOnlyEl].forEach(e => e.addEventListener("change", renderList));
sortFieldEl.addEventListener("change", () => { sortField = sortFieldEl.value; renderList(); });
sortDirEl.addEventListener("click", () => {
  sortDir = sortDir === "desc" ? "asc" : "desc";
  sortDirEl.textContent = sortDir === "desc" ? "降順 ↓" : "昇順 ↑";
  renderList();
});

// ── カード ──
async function selectPlayer(key){
  activeId = key; openState = {};
  bodyEl.classList.add("has-selection");
  renderList();
  mainEl.className = "placeholder"; mainEl.innerHTML = "読み込み中…";
  const my = ++selToken, p = allPlayers.find(x => x.key === key);
  try{
    const got = await Promise.allSettled(p.entries.map(async e => {
      const card = await getJson(`${seasonBase(e.league, e.year)}/${encodeURIComponent(e.id)}.json`);
      const llm = await ensureLlm(e.year, card.team || e.team, card.name || p.name);
      return { year: e.year, card, llm };
    }));
    if(my !== selToken) return;
    const cards = got.filter(g => g.status === "fulfilled").map(g => g.value);
    if(!cards.length) throw got[0].reason;
    const multi = seasonSel === "all";
    cards.forEach(x => { x.title = yLabel(x.year) + (multi ? ` ・ ${x.card.team}` : ""); });
    activeCards = cards;
    primaryIdx = Math.max(0, cards.findIndex(x => isReady(x.card.league, x.year)));
    ptVenue = "all"; mtVenue = "all";
    renderCard();
    mainEl.scrollTop = 0;
  }catch(e){
    mainEl.className = "error"; mainEl.innerHTML = `カードを読み込めませんでした。<br>(${esc(e.message)})`;
  }
}

// 年度ごとの折りたたみブロック（先頭＝最新の年度だけ開く）。年度ラベルは「すべての年度」のときだけ出す
function yearBlocks(sect, cards, fn, extra){
  const labeled = seasonSel === "all" || cards.length > 1;
  return cards.map((x, i) => {
    const body = fn(x);
    if(!body) return "";
    if(!labeled) return `<div class="yr-plain">${body}</div>`;
    const k = `${sect}|${x.year}|${x.card.team}`;
    const open = k in openState ? openState[k] : i === primaryIdx;
    return `<details class="yr" data-k="${esc(k)}" ${open ? "open" : ""}><summary><i class="yr-bar"></i><b>${esc(x.title)}</b>${extra ? extra(x) : ""}</summary>${body}</details>`;
  }).join("");
}

function aiMissing(x){
  const st = llmCache[x.year], team = x.card.team, f = `${team}.json`, name = x.card.name;
  let why = "";
  if(x.llm && !x.llm.player_type) why = `${f} に「${name}」の項目はありますが player_type がありません（項目のキー: ${Object.keys(x.llm).join(", ") || "なし"}）`;
  else if(st && st.status.get(f) === "missing") why = `data/llm/${x.year}/${f} を読み込めませんでした（ファイルが無い、またはクラブ名とファイル名が違う）`;
  else if(st && st.status.get(f) === "ok") why = `${f} は読み込めましたが「${name}」の項目が見つかりません（収録されている名前の例: ${(st.names.get(team) || []).slice(0, 5).join(", ") || "なし"}）`;
  else why = `data/llm/${x.year}/ にこのクラブのファイルがありません`;
  return `<p class="note">この年度のAI解釈テキストはまだ生成されていません（数値データのみ表示中）</p><p class="yr-warn">確認用: ${esc(why)}</p>`;
}
function aiBody(x){
  const pt = x.llm && x.llm.player_type;
  if(!pt) return aiMissing(x);
  const groups = AI_GROUPS.map(([k, label]) => ({ label, bullets: pt[k] || [] })).filter(g => g.bullets.length);
  return `${pt.tag ? `<div class="ai-tag">${esc(pt.tag)}</div>` : ""}
    ${groups.map(g => `<div class="ai-group"><h3>${esc(g.label)}</h3><ul>${g.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`).join("")}`;
}
const aiSection = (cards) => `<div class="card"><h2>AI解釈</h2>${yearBlocks("ai", cards, aiBody)}</div>`;

// ── 指標（コア指標＋詳細指標を、カテゴリ別のタイルにまとめる）──
// card.metrics: [{key, label, unit, better, cat, core, all/home/away:{v,rank,pop}, total:{all,home,away}}]
// total（累計）は、90分あたりの指標にだけ付く。割合・平均の指標は、どちらのタブでも同じ値を出す。
const MT_BASIS = [["total", "全体"], ["p90", "90分あたり"]];
const MT_VENUE = [["all", "全試合"], ["home", "ホーム"], ["away", "アウェイ"]];
const P90_RE = /\/90(?=$|[（(\s])/;
const isPer90 = (m) => /_p90$/.test(m.key || "") || P90_RE.test(m.label || "");
const noP90 = (s) => String(s ?? "").replace(P90_RE, "");
function metricItems(c){
  if(Array.isArray(c.metrics) && c.metrics.length) return c.metrics;
  // 旧形式のJSON（core / detail のみ）：カテゴリも累計値も無いので、旧テーマ名をそのままカテゴリにする
  return [...(c.core || []).map(m => ({ ...m, cat: "コア指標", core: true })),
          ...(c.detail || []).flatMap(sec => (sec.metrics || []).map(m => ({ ...m, cat: sec.title })))];
}
function metricTile(m){
  const per = isPer90(m), asTotal = mtEff === "total" && per;
  let val, chip = "", unit = "";
  if(asTotal){
    val = fmt(m.total ? m.total[mtVenue] : null, m.unit);                 // 累計には順位が無い
  }else{
    val = fmt(m[mtVenue]?.v, m.unit);
    if(per) unit = '<span class="u">/90分</span>';
    if(m.better !== "neutral") chip = rankChip(m[mtVenue]);
  }
  return `<div class="mt${m.core ? " core" : ""}"><div class="mt-l"><span>${esc(noP90(m.label))}${m.better === "low" ? '<span class="sub-mark">（小さいほど良い）</span>' : ""}</span>${m.core ? '<span class="core-tag">コア</span>' : ""}</div>
    <div class="mt-v"><span class="val">${val}</span>${unit}</div>${chip}</div>`;
}
function metricsBody(c){
  const items = metricItems(c);
  if(!items.length) return "";
  const cats = [], by = new Map();                                         // カテゴリは、出てくる順（並びはビルド側で決める）
  items.forEach(m => { const k = m.cat || "その他"; if(!by.has(k)){ by.set(k, []); cats.push(k); } by.get(k).push(m); });
  return cats.map(k => `<h3 class="sub-h">${esc(k)}</h3><div class="mt-grid">${by.get(k).map(metricTile).join("")}</div>`).join("");
}
function metricsSection(cards){
  const hasTotal = cards.some(x => metricItems(x.card).some(m => m.total));
  mtEff = hasTotal ? mtBasis : "p90";                                      // 累計値が無いデータのときは「90分あたり」だけ
  const blocks = yearBlocks("metrics", cards, x => metricsBody(x.card));
  if(!blocks) return "";
  const seg = (list, cur, id, attr) => `<span class="seg" id="${id}">${list.map(([k, l]) => `<button data-${attr}="${k}" class="${k === cur ? "active" : ""}">${l}</button>`).join("")}</span>`;
  return `<div class="card"><h2><span>指標</span><span class="seg-row">${hasTotal ? seg(MT_BASIS, mtEff, "mtBasisSeg", "b") : ""}${seg(MT_VENUE, mtVenue, "mtVenueSeg", "v")}</span></h2>${blocks}
    <p class="note">青い枠の「コア」は、そのポジションで特に重視する指標です。順位は、同じリーグ・同じ集団（FW / WG / MF / CB / SB / GK）の中での順位です。対象は、出場時間が900分以上（シーズン途中は、消化した試合数に合わせて下げた条件）で、試行数が一定以上の選手です。「ノンPK」は、PKを除いた値です。</p>
    <p class="note">${hasTotal ? "「全体」は累計の回数で、順位は付きません（順位は「90分あたり」と、割合の指標に出ます）。" : ""}順位が出ていない指標は、値だけを表示しています（良し悪しではないスタイルの指標や、順位の計算対象外の指標）。</p></div>`;
}

function playtypeBody(x){
  const pts = x.card.playtypes;
  if(!pts) return "";
  const evals = {}; ((x.llm && x.llm.play_evaluations) || []).forEach(e => { evals[e.name] = e; });
  const cardsHtml = pts.types.map(t => {

  return `<p class="note" style="margin:0 0 8px">${esc(pts.count_label)}</p><div class="pt-grid">${cardsHtml}</div>
    ${String(pts.count_label).includes("近似") ? '<p class="note">※ シュートにつながったプレーは、シュート直前の同じチームのプレーを最大2つさかのぼって数えた近似値で、公式の集計とは一致しません。</p>' : ""}`;
}
function playtypeSection(cards){
  if(!cards.some(x => x.card.playtypes)) return "";
  const seg = Object.entries(PT_VENUE_LABEL).map(([k, l]) => `<button data-v="${k}" class="${k === ptVenue ? "active" : ""}">${l}</button>`).join("");
  return `<div class="card"><h2><span>プレータイプ別</span><span class="seg" id="ptSeg">${seg}</span></h2>${yearBlocks("pt", cards, playtypeBody)}</div>`;
}

// ── シーズン成績（年度ごとに「シーズン」行＋試合ログ）──
const POS_LABEL = {                     // WhoScoredのポジションコード → 日本語表記
  GK:"GK", DC:"CB", DL:"左SB", DR:"右SB", DMC:"守備的MF", DML:"左守備的MF", DMR:"右守備的MF",
  MC:"中央MF", ML:"左MF", MR:"右MF", AMC:"トップ下", AML:"左WG", AMR:"右WG",
  FW:"CF", FWL:"左FW", FWR:"右FW"
};
const posLabel = (code) => POS_LABEL[code] || code || "";
// 試合ログの位置から、出場の多いポジション順の内訳を作る（Subは除外、出場時間があれば出場時間で重み付け）
function posBreakdown(logs){
  const log = (logs || []).filter(g => g.pos && g.pos !== "Sub");
  const useMin = log.length && log.every(g => typeof g.minutes === "number");
  const m = {};
  log.forEach(g => { m[g.pos] = (m[g.pos] || 0) + (useMin ? g.minutes : 1); });
  const rows = Object.entries(m).sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((t, r) => t + r[1], 0) || 1;
  return rows.map(([pos, v]) => ({ pos, label: posLabel(pos), v, share: v / total }));
}

function sortVal(g, key){
  if(key === "date") return g.date;
  if(key === "opponent") return g.opponent || "";
  if(key === "result") return (g.gf - g.ga) * 100 + g.gf;
  if(key === "pos") return posLabel(g.pos);
  return g[key];
}
function sortLog(log){
  const { key, dir } = logSort, d = dir === "desc" ? -1 : 1;
  return log.slice().sort((a, b) => {
    const av = sortVal(a, key), bv = sortVal(b, key);
    const an = av == null || av === "", bn = bv == null || bv === "";
    if(an && bn) return 0; if(an) return 1; if(bn) return -1;   // 値が無い行は常に末尾
    const r = typeof av === "string" ? av.localeCompare(bv) : av - bv;
    return r !== 0 ? d * r : (b.date || "").localeCompare(a.date || "");
  });
}

// 表の列。出場は「出場時間（分）」表記にし、データにアシストがあれば「得点」の右に列を足す
function logCols(c, log){
  const cols = (c.game_log_cols || []).map(k => k.key === "minutes" ? { ...k, label: "出場時間（分）" } : k);
  if(log.some(g => numOf(g.assists) != null) && !cols.some(k => k.key === "assists")){
    const i = cols.findIndex(k => k.key === "goals");
    cols.splice(i >= 0 ? i + 1 : cols.length, 0, { key: "assists", label: "アシスト" });
  }
  return cols;
}

// 割合（%）の列は平均、回数の列は合計、評価はシーズン平均
const isPctCol = (k) => /%|％/.test(k.label || "") || /_pct$/.test(k.key || "");
const round1 = (n) => Math.round(n * 10) / 10;
function seasonRow(c, cols, log){
  const cells = cols.map(x => {
    if(x.key === "rating"){
      const r = numOf(c.rating_avg) ?? (() => { const v = log.map(g => numOf(g.rating)).filter(n => n != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; })();
      const cls = r == null ? "" : r >= 7.5 ? "r-hi" : r <= 6.0 ? "r-lo" : "";
      return `<td class="num ${cls}">${r == null ? "—" : r.toFixed(2)}</td>`;
    }
    const vals = log.map(g => numOf(g[x.key])).filter(n => n != null);
    if(!vals.length) return `<td class="num">—</td>`;
    const total = vals.reduce((a, b) => a + b, 0);
    const v = isPctCol(x) ? round1(total / vals.length) : round1(total);
    return `<td class="num">${v}</td>`;
  }).join("");
  return `<tr class="season-row"><td>シーズン</td><td></td><td></td>${cells}<td></td></tr>`;
}

function logBody(x){
  const c = x.card, log = c.game_log || [], cols = logCols(c, log);
  if(!log.length) return "";
  const heads = [["date", "日付", false], ["opponent", "相手", false], ["result", "結果", false],
    ...cols.map(k => [k.key, k.label, true]), ["pos", "位置", false]];
  const th = heads.map(([k, label, num]) => {
    const on = logSort.key === k;
    return `<th class="sortable ${num ? "num" : ""} ${on ? "sorted" : ""}" data-sk="${esc(k)}">${esc(label)}${on ? `<span class="arr">${logSort.dir === "desc" ? "▼" : "▲"}</span>` : ""}</th>`;
  }).join("");
  const rows = sortLog(log).map(g => {
    const res = g.gf > g.ga ? "W" : g.gf < g.ga ? "L" : "D";
    const cellsHtml = cols.map(k => {
      let v = g[k.key], cls = "";
      if(k.key === "rating" && v != null){ cls = v >= 7.5 ? "r-hi" : v <= 6.0 ? "r-lo" : ""; v = v.toFixed(2); }
      return `<td class="num ${cls}">${v == null ? "—" : v}</td>`;
    }).join("");
    const home = g.venue === "H";
    return `<tr><td>${esc(String(g.date || "").slice(5))}</td>
      <td><span class="vn ${home ? "vn-h" : "vn-a"}" title="${home ? "ホーム" : "アウェイ"}">${home ? "H" : "A"}</span>${esc(g.opponent)}</td>
      <td class="res-${res}">${g.gf}-${g.ga}</td>${cellsHtml}<td><span title="${esc(g.pos || "")}">${esc(posLabel(g.pos))}</span>${g.starter ? "" : '<span class="sub-mark">途中</span>'}</td></tr>`;
  }).join("");
  return `<div class="table-scroll"><table class="log"><thead><tr>${th}</tr></thead><tbody>${seasonRow(c, cols, log)}${rows}</tbody></table></div>`;
}
const logSection = (cards) => {
  const blocks = yearBlocks("log", cards, logBody, x => `<span class="yr-n">（${(x.card.game_log || []).length}試合）</span>`);
  return blocks ? `<div class="card"><h2>シーズン成績</h2>${blocks}</div>` : "";
};

// ── ヘッダー（選択中の年度の値。「すべての年度」のときは最新年度の値）──
function cardAssists(c){
  if(numOf(c.assists) != null) return c.assists;
  return sumOf((c.game_log || []).map(g => g.assists));
}
function summarize(cards){                 // cards[primaryIdx] = 消化済みの最新年度
  const c = cards[primaryIdx].card;
  return { name: c.name, team: c.team, group: c.group, matches: numOf(c.matches), starts: numOf(c.starts), minutes: numOf(c.minutes),
    rating: numOf(c.rating_avg), goals: numOf(c.goals), assists: cardAssists(c), clean_sheets: numOf(c.clean_sheets) };
}

function renderCard(){
  const cards = activeCards, S = summarize(cards);
  const pb = posBreakdown(cards[primaryIdx].card.game_log || []);
  const kpis = [["出場", S.matches, "試合"], ["先発", S.starts, "試合"], ["出場時間", S.minutes, "分"], ["平均評価", S.rating == null ? null : S.rating.toFixed(2), ""]];
  if(S.group === "GK") kpis.push(["無失点試合", S.clean_sheets, ""]);
  else kpis.push(["ゴール数", S.goals, ""], ["アシスト数", S.assists, ""]);
  const kpiHtml = kpis.map(([l, v, u]) => `<div class="kpi"${v == null && l === "アシスト数" ? ' title="アシストのデータがまだ取得されていません"' : ""}><div class="l">${l}</div><div class="v">${v == null ? "—" : esc(v)}${v != null && u ? `<span class="u">${u}</span>` : ""}</div></div>`).join("");
  mainEl.className = "";
  mainEl.innerHTML = `
    <button class="back-btn" id="backBtn">← 選手一覧</button>
    <div class="p-head">
      <div><div class="p-name">${esc(S.name)}</div>
        <div class="p-sub"><span class="pos-badge" title="${esc(pb.map(x => `${x.pos}(${x.label}) ${Math.round(x.share*100)}%`).join(" / "))}">${esc(pb.length ? pb[0].label : S.group)}</span>${esc(S.team)}${pb.length > 1 ? ` <span class="pos-mix">・ ${pb.slice(0, 3).map(x => `${esc(x.label)} ${Math.round(x.share*100)}%`).join(" / ")}</span>` : ""}${seasonSel === "all" ? (primaryIdx === 0 ? ` <span class="pos-mix">・ 最新年度（${esc(yLabel(cards[0].year))}）</span>` : ` <span class="pos-mix">・ ${esc(yLabel(cards[primaryIdx].year))}のデータ（${esc(yLabel(cards[0].year))}は消化した試合が少ないため）</span>`) : ""}</div></div>
      <div class="kpis">${kpiHtml}</div>
    </div>
    ${aiSection(cards)}${metricsSection(cards)}${playtypeSection(cards)}${logSection(cards)}`;
}

// 描き直しても、スクロール位置と年度ブロックの開閉を保つ
function rerender(){ const y = mainEl.scrollTop; renderCard(); mainEl.scrollTop = y; }
mainEl.addEventListener("click", (e) => {
  const back = e.target.closest("#backBtn");
  if(back){ bodyEl.classList.remove("has-selection"); return; }
  const mb = e.target.closest("#mtBasisSeg button");
  if(mb){ mtBasis = mb.dataset.b; rerender(); return; }
  const mv = e.target.closest("#mtVenueSeg button");
  if(mv){ mtVenue = mv.dataset.v; rerender(); return; }
  const seg = e.target.closest("#ptSeg button");
  if(seg){ ptVenue = seg.dataset.v; rerender(); return; }
  const th = e.target.closest("th.sortable");
  if(th){
    const k = th.dataset.sk;
    logSort = logSort.key === k ? { key: k, dir: logSort.dir === "desc" ? "asc" : "desc" } : { key: k, dir: k === "opponent" || k === "pos" ? "asc" : "desc" };
    rerender();
  }
});
mainEl.addEventListener("toggle", (e) => { const k = e.target.dataset && e.target.dataset.k; if(k) openState[k] = e.target.open; }, true);

init();
</script>
</body>
</html>

name: NPB球団別選手成績ページの調査

# Yahoo!の球団別「選手一覧（成績）」から公式の個人成績を全選手ぶん取れるか調べる読み取り専用ワークフロー。データは書き換えない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python baseball/scripts/probe_npb_memberlist.py 2>&1 | grep -v "FutureWarning\|google\|genai\|README\|updates or bug" || true

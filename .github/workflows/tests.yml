name: テスト（NPB取得まわり）

on:
  pull_request:
    paths: ['baseball/scripts/**', 'tests/**', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['baseball/scripts/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests

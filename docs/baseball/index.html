  // ── カウント別投球パターン ──
  window._chActivePitch = 'ALL';
  window._chBuilt = false;

  function _toggleCountHeatmap() {
    const area = document.getElementById('count-heatmap-area');
    if(!area) return;
    const isHidden = area.style.display === 'none';
    area.style.display = isHidden ? 'block' : 'none';
    if(isHidden && !window._chBuilt) _buildCountHeatmap();
  }

  function _buildCountHeatmap() {
    const mixes  = window._pitchDetailMixes || {};
    const mixAll = mixes.all  || [];
    const mixR   = mixes.vs_r && mixes.vs_r.length ? mixes.vs_r : mixAll;
    const mixL   = mixes.vs_l && mixes.vs_l.length ? mixes.vs_l : mixAll;
    const _pc    = {FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6'};

    // シーズン行の場合は _seasonLocsMap を利用
    const isSeason = window._activeRowIdx === 'season';
    const seasonMap = window._seasonLocsMap || {};

    // 球種リスト
    let pitchList;
    if(isSeason) {
      pitchList = Object.entries(seasonMap)
        .filter(([k,v]) => v.locsR.length || v.locsL.length)
        .map(([k,v]) => ({ key: k, name: v.name, color: v.color || _pc[k] || '#888' }));
    } else {
      pitchList = mixAll.filter(m => m.count > 0)
        .map(m => ({ key: m.key, name: m.name, color: _pc[m.key] || '#888' }));
    }
    if (!pitchList.length) { document.getElementById('count-heatmap-area').style.display='none'; return; }

    const COUNTS = ['0-0','0-1','0-2','1-0','1-1','1-2','2-0','2-1','2-2','3-0','3-1','3-2'];
    const chData = {};
    COUNTS.forEach(k => { chData[k] = { pitchCounts:{}, res:{swing:0,look:0,ball:0,out:0,hit:0}, byPitch:{}, total:0 }; });

    // locs源を決定: サイドフィルター(all/r/l)を考慮
    const side = window._chSideFilter || 'all';

    // cbsベース集計（locs[6]/[7]よりも正確・球種詳細テーブルと一致）
    const getMixArr = () => {
      if(isSeason) {
        const mixes2 = window._pitchDetailMixes || {};
        return side==='r' ? (mixes2.vs_r||[]) : side==='l' ? (mixes2.vs_l||[]) : (mixes2.all||[]);
      } else {
        return side==='r' ? mixR : side==='l' ? mixL : mixAll;
      }
    };
    getMixArr().forEach(m => {
      const mKey = m.key;
      if(m.cbs) {
        Object.entries(m.cbs).forEach(([ck, v]) => {
          if(!chData[ck]) return;
          const d = chData[ck];
          d.total += v.c||0;
          d.pitchCounts[mKey] = (d.pitchCounts[mKey]||0) + (v.c||0);
          if(!d.byPitch[mKey]) d.byPitch[mKey] = {swing:0,foul:0,look:0,ball:0,out:0,hit:0};
          const bp = d.byPitch[mKey];
          d.res.swing+=(v.sw||0); bp.swing+=(v.sw||0);
          d.res.foul=(d.res.foul||0)+(v.fo||0); bp.foul=(bp.foul||0)+(v.fo||0);
          d.res.look+=(v.lo||0); bp.look+=(v.lo||0);
          d.res.ball+=(v.ba||0); bp.ball+=(v.ba||0);
          d.res.out+=(v.ou||0);  bp.out+=(v.ou||0);
          d.res.hit+=(v.hi||0);  bp.hit+=(v.hi||0);
        });
      } else if(m.locs) {
        (m.locs||[]).forEach(loc => {
          const [x,y,flag,inZone,rtype,isStrike,balls,strikes] = loc;
          if(balls==null||strikes==null) return;
          const ck=`${Math.min(balls,3)}-${Math.min(strikes,2)}`;
          if(!chData[ck]) return;
          const d=chData[ck];
          d.total++; d.pitchCounts[mKey]=(d.pitchCounts[mKey]||0)+1;
          if(!d.byPitch[mKey]) d.byPitch[mKey]={swing:0,foul:0,look:0,ball:0,out:0,hit:0};
          const bp=d.byPitch[mKey];
          if(flag===1){d.res.swing++;bp.swing++;}
          else if(flag===0&&rtype===0){d.res.foul=(d.res.foul||0)+1;bp.foul=(bp.foul||0)+1;}
          else if(flag===-1&&inZone===1){d.res.look++;bp.look++;}
          else if(flag===-1&&inZone===0){d.res.ball++;bp.ball++;}
          if(rtype===1||rtype===2){d.res.out++;bp.out++;}
          else if(rtype>=3){d.res.hit++;bp.hit++;}
        });
      }
    });

    // pcts を計算
    COUNTS.forEach(key => {
      const d = chData[key];
      const t = d.total;
      d.pcts = {};
      pitchList.forEach(p => {
        d.pcts[p.key] = t > 0 ? Math.round((d.pitchCounts[p.key]||0)/t*100) : 0;
      });
    });

    // データが空（旧JSON）なら通知して終了
    const hasData = COUNTS.some(k => chData[k].total > 0);
    if(!hasData) {
      const table = document.getElementById('ch-table');
      if(table) table.innerHTML = `<tr><td style="padding:16px;font-size:11px;color:var(--text3);font-family:'DM Mono'">カウント別データは新しいJSONで利用可能です（run.pyを再実行してください）</td></tr>`;
      document.getElementById('count-heatmap-area').style.display = 'block';
      window._chBuilt = true;
      return;
    }

    window._chData = chData;
    window._chPitchList = pitchList;
    // mix.countベースの合計投球数を保存（_renderCountTableの全合計球数表示に使用）
    window._chMixTotal = getMixArr().reduce((s,m)=>s+(m.count||0),0);
    _renderCountTable(chData, pitchList, 'ALL');
    _buildChFilterBar(pitchList);
    // サイドフィルターボタンUIを現在の状態に合わせて更新
    const _curSide = window._chSideFilter || 'all';
    document.querySelectorAll('[id^="ch-side-"]').forEach(b => {
      const k = b.id.replace('ch-side-', '');
      const active = k === _curSide;
      b.style.border     = active ? '1px solid rgba(148,163,184,0.8)' : '1px solid rgba(255,255,255,0.1)';
      b.style.background = active ? 'rgba(148,163,184,0.2)' : 'transparent';
      b.style.color      = active ? '#fff' : 'var(--text3)';
    });
    window._chBuilt = true;
  }


  window._chCountFilter = 'all';
  window._chSideFilter  = 'all'; // all | r | l

  function _chSetSide(side) {
    window._chSideFilter = side;
    document.querySelectorAll('[id^="ch-side-"]').forEach(b => {
      const k = b.id.replace('ch-side-', '');
      const active = k === side;
      b.style.border     = active ? '1px solid rgba(148,163,184,0.8)' : '1px solid rgba(255,255,255,0.1)';
      b.style.background = active ? 'rgba(148,163,184,0.2)' : 'transparent';
      b.style.color      = active ? '#fff' : 'var(--text3)';
    });
    // サイドフィルター変更 → データ再集計
    window._chBuilt = false;
    _buildCountHeatmap();
  }


  function _buildChFilterBar(pitchList) {
    const bar = document.getElementById('ch-filter-bar');
    if(!bar) return;
    let html = `<button data-ch-pitch="ALL" onclick="_chSetFilter('ALL')" style="padding:3px 10px;font-size:9px;font-family:'DM Mono';font-weight:700;border-radius:12px;cursor:pointer;border:1.5px solid rgba(247,129,102,0.5);background:rgba(247,129,102,0.15);color:#f78166">全球種</button>`;
    // 投球数の多い順にソート
    const sortedPitchList = [...pitchList].sort((a,b)=>{
      const ca=(window._chData?Object.values(window._chData).reduce((s,d)=>s+(d.pitchCounts[a.key]||0),0):0);
      const cb=(window._chData?Object.values(window._chData).reduce((s,d)=>s+(d.pitchCounts[b.key]||0),0):0);
      return cb-ca;
    });
    sortedPitchList.forEach(p => {
      html += `<button data-ch-pitch="${p.key}" onclick="_chSetFilter('${p.key}')" style="padding:3px 10px;font-size:9px;font-family:'DM Mono';font-weight:700;border-radius:12px;cursor:pointer;border:1.5px solid ${p.color}44;background:transparent;color:${p.color}88">${p.name}</button>`;
    });
    bar.innerHTML = html;

    // カウントフィルターバー
    const cfBar = document.getElementById('ch-count-filter');
    if(!cfBar) return;
    const btnStyle = (active) =>
      `padding:2px 8px;font-size:9px;font-family:'DM Mono';font-weight:700;border-radius:4px;cursor:pointer;`
      + `border:1px solid ${active?'rgba(148,163,184,0.7)':`rgba(255,255,255,0.1)`};`
      + `background:${active?'rgba(148,163,184,0.18)':`transparent`};`
      + `color:${active?'#fff':`var(--text3)`}`;
    const FILTERS = [
      {key:'all',  label:'全カウント'},
      {key:'s0',   label:'S0'},
      {key:'s1',   label:'S1'},
      {key:'s2',   label:'S2'},
      {key:'b0',   label:'B0'},
      {key:'b1',   label:'B1'},
      {key:'b2',   label:'B2'},
      {key:'b3',   label:'B3'},
    ];
    cfBar.innerHTML = FILTERS.map(f =>
      `<button data-ch-count="${f.key}" onclick="_chSetCountFilter('${f.key}')" style="${btnStyle(f.key==='all')}">${f.label}</button>`
    ).join('');
  }

  function _chSetCountFilter(filterKey) {
    window._chCountFilter = filterKey;
    // ボタンUI更新
    document.querySelectorAll('[data-ch-count]').forEach(b => {
      const active = b.dataset.chCount === filterKey;
      b.style.border      = active ? '1px solid rgba(148,163,184,0.7)' : '1px solid rgba(255,255,255,0.1)';
      b.style.background  = active ? 'rgba(148,163,184,0.18)' : 'transparent';
      b.style.color       = active ? '#fff' : 'var(--text3)';
    });
    if(window._chData && window._chPitchList) {
      _renderCountTable(window._chData, window._chPitchList, window._chActivePitch||'ALL');
    }
  }

  function _chSetFilter(pitchKey) {
    window._chActivePitch = pitchKey;
    document.querySelectorAll('[data-ch-pitch]').forEach(b => {
      const k = b.dataset.chPitch;
      const p = (window._chPitchList||[]).find(x=>x.key===k);
      const col = k==='ALL' ? '#f78166' : (p?.color||'#888');
      const active = k === pitchKey;
      b.style.borderColor = active ? col+'99' : col+'44';
      b.style.background  = active ? col+'22' : 'transparent';
      b.style.color       = active ? col : col+'88';
    });
    if(window._chData && window._chPitchList) {
      _renderCountTable(window._chData, window._chPitchList, pitchKey);
    }
  }

  function _chBuildResult(res, pitchKey, byPitch) {
    const r = pitchKey !== 'ALL' && byPitch && byPitch[pitchKey] ? byPitch[pitchKey] : res;
    const strike = (r.swing||0) + (r.look||0);
    const total4 = strike + (r.ball||0) + (r.out||0) + (r.hit||0);
    if(!total4) return `<div style="font-size:9px;color:var(--text3);font-family:'DM Mono'">—</div>`;
    const pct = (n,t) => t>0?Math.round(n/t*100):0;
    const sPct=pct(strike,total4), bPct=pct(r.ball,total4), oPct=pct(r.out,total4), hPct=pct(r.hit,total4);
    const swPct=pct(r.swing,total4), loPct=pct(r.look,total4);
    const segs = [
      `<div style="height:100%;width:${sPct}%;background:#79c0ff;border-radius:2px"></div>`,
      `<div style="height:100%;width:${bPct}%;background:#7d8590;border-radius:2px"></div>`,
      `<div style="height:100%;width:${oPct}%;background:#fbbf24;border-radius:2px"></div>`,
      `<div style="height:100%;width:${hPct}%;background:#56d364;border-radius:2px"></div>`,
    ].join('');
    const row = (col,name,pct2,cnt,sub) => `
      <div style="display:flex;align-items:center;gap:3px;margin-bottom:1px">
        <div style="width:6px;height:6px;border-radius:50%;background:${col};flex-shrink:0"></div>
        <span style="font-size:9px;color:rgba(255,255,255,0.5);flex:1">${name}</span>
        <span style="font-size:9px;font-weight:700;color:${col};width:26px;text-align:right">${pct2}%</span>
        <span style="font-size:8px;color:rgba(255,255,255,0.25);width:20px;text-align:right">${cnt}</span>
      </div>${sub||''}`;
    const subRow = (name,pct2,cnt) => `
      <div style="display:flex;align-items:center;gap:3px;margin-bottom:1px;padding-left:9px">
        <span style="font-size:8px;color:rgba(255,255,255,0.2)">└</span>
        <span style="font-size:8px;color:rgba(255,255,255,0.3);flex:1">${name}</span>
        <span style="font-size:8px;color:rgba(255,255,255,0.3);width:26px;text-align:right">${pct2}%</span>
        <span style="font-size:8px;color:rgba(255,255,255,0.18);width:20px;text-align:right">${cnt}</span>
      </div>`;
    return `
      <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px;margin-bottom:5px">${segs}</div>
      ${row('#79c0ff','ストライク',sPct,strike, subRow('空振り',swPct,r.swing||0)+subRow('見逃',loPct,r.look||0))}
      ${row('#7d8590','ボール',bPct,r.ball||0)}
      ${row('#fbbf24','凡打',oPct,r.out||0)}
      ${row('#56d364','被安打',hPct,r.hit||0)}`;
  }

  function _renderCountTable(chData, pitchList, activePitch) {
    const table = document.getElementById('ch-table');
    if(!table) return;
    // 行(B別)ごとの最大球種数を計算
    const _rowMaxPitch = {};
    [0,1,2,3].forEach(b => {
      _rowMaxPitch[b] = [0,1,2].reduce((mx,s)=>{
        const d = chData[`${b}-${s}`];
        if(!d) return mx;
        const cnt = pitchList.filter(p=>(d.pitchCounts[p.key]||0)>0).length;
        return Math.max(mx, cnt);
      }, 0);
    });
    // 行合計カード: 同じ行の通常カードと同じ高さ
    const _cardH = (b) => 118 + _rowMaxPitch[b] * 19; // 基本118px + 球種行19pxずつ

    // ── データ集約ヘルパー ──
    const buildCardData = (keys) => {
      const m = { pitchCounts:{}, res:{swing:0,look:0,ball:0,out:0,hit:0}, byPitch:{}, total:0 };
      keys.forEach(k => {
        const d = chData[k];
        if(!d) return;
        m.total += d.total;
        Object.entries(d.pitchCounts||{}).forEach(([pk,n]) => { m.pitchCounts[pk]=(m.pitchCounts[pk]||0)+n; });
        ['swing','foul','look','ball','out','hit'].forEach(r => { m.res[r]+=(d.res[r]||0); });
        Object.entries(d.byPitch||{}).forEach(([pk,r]) => {
          if(!m.byPitch[pk]) m.byPitch[pk]={swing:0,foul:0,look:0,ball:0,out:0,hit:0};
          ['swing','foul','look','ball','out','hit'].forEach(r2=>{m.byPitch[pk][r2]+=(r[r2]||0);});
        });
      });
      // 球種%: 丸め誤差を最後の球種で吸収して合計100%に
      m.pcts={};
      const _pitchKeys = pitchList.map(p=>p.key).filter(k=>(m.pitchCounts[k]||0)>0);
      let _sumPct = 0;
      _pitchKeys.forEach((k,i)=>{
        if(i===_pitchKeys.length-1){
          m.pcts[k] = Math.max(0, 100 - _sumPct);
        } else {
          const pct = m.total>0?Math.round((m.pitchCounts[k]||0)/m.total*100):0;
          m.pcts[k] = pct;
          _sumPct += pct;
        }
      });
      pitchList.forEach(p=>{ if(m.pcts[p.key]===undefined) m.pcts[p.key]=0; });
      return m;
    };

    // ── カードHTML生成 ──
    const buildCard = (d, label, isSum, cardH) => {
      if(!d || !d.total) return `<div style="width:168px;min-height:${cardH}px;border-radius:7px;border:1px solid rgba(255,255,255,0.05);background:transparent;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:rgba(255,255,255,0.2);font-family:'DM Mono'">—</span></div>`;

      // 球種フィルター時は選択球種のみ表示（バー幅100%）
      const pitchListFiltered = activePitch==='ALL'
        ? pitchList.filter(p=>d.pcts[p.key]>0).sort((a,x)=>d.pcts[x.key]-d.pcts[a.key])
        : pitchList.filter(p=>p.key===activePitch&&d.pcts[p.key]>0);
      const pitchBars = pitchListFiltered
        .map(p=>{
          const _cnt=d.pitchCounts[p.key]||0;
          // バー幅: 全球種モードは全体%、単球種モードは100%固定
          const _barW = activePitch==='ALL' ? d.pcts[p.key] : 100;
          const dim=false;
          return `<div style="display:flex;align-items:center;gap:4px;opacity:${dim?0.18:1};margin-bottom:3px">
            <span style="font-size:8px;font-weight:700;width:20px;color:${p.color};font-family:'DM Mono';flex-shrink:0">${p.key}</span>
            <div style="flex:1;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;min-width:28px">
              <div style="height:100%;width:${_barW}%;background:${p.color};border-radius:2px"></div>
            </div>
            <span style="font-size:8px;color:rgba(255,255,255,0.65);width:22px;text-align:right;font-family:'DM Mono'">${activePitch==='ALL'?d.pcts[p.key]:100}%</span>
            <span style="font-size:7px;color:rgba(255,255,255,0.4);width:28px;text-align:right;font-family:'DM Mono'">${_cnt}球</span>
          </div>`;
        }).join('');

      const res=activePitch!=='ALL'&&d.byPitch&&d.byPitch[activePitch]?d.byPitch[activePitch]:d.res;
      // 分母: 結果が確定した投球のみ（swing+foul+look+ball+out+hit）
      const resTotal=(res.swing||0)+(res.foul||0)+(res.look||0)+(res.ball||0)+(res.out||0)+(res.hit||0);
      // 全合計カードはmix.countベース（_mixTotal）を球数表示に使用し、球種詳細テーブルと一致させる
      const T = (isSum && d._mixTotal != null) ? d._mixTotal : (resTotal||d.total);
      const p_=n=>T>0?Math.round(n/T*100):0;
      const strike=(res.swing||0)+(res.foul||0)+(res.look||0);
      const resBars=[{c:'#79c0ff',w:p_(strike)},{c:'#7d8590',w:p_(res.ball)},{c:'#fbbf24',w:p_(res.out)},{c:'#56d364',w:p_(res.hit)}]
        .map(s=>`<div style="height:100%;width:${s.w}%;background:${s.c}"></div>`).join('');

      const rr=(col,name,pct,cnt)=>`<div style="display:flex;align-items:center;gap:3px;margin-bottom:2px">
        <div style="width:5px;height:5px;border-radius:50%;background:${col};flex-shrink:0"></div>
        <span style="font-size:8px;color:rgba(255,255,255,0.5);flex:1;font-family:'DM Mono'">${name}</span>
        <span style="font-size:8px;font-weight:700;color:${col};width:22px;text-align:right;font-family:'DM Mono'">${pct}%</span>
        <span style="font-size:7px;color:rgba(255,255,255,0.45);width:28px;text-align:right;font-family:'DM Mono'">${cnt}球</span>
      </div>`;
      const sr=(name,pct,cnt)=>`<div style="display:flex;align-items:center;gap:3px;margin-bottom:2px;padding-left:8px">
        <span style="font-size:7px;color:rgba(255,255,255,0.35);flex:1;font-family:'DM Mono'">└ ${name}</span>
        <span style="font-size:7px;color:rgba(255,255,255,0.45);width:22px;text-align:right;font-family:'DM Mono'">${pct}%</span>
        <span style="font-size:7px;color:rgba(255,255,255,0.38);width:28px;text-align:right;font-family:'DM Mono'">${cnt}球</span>
      </div>`;

      // 通常カード: 投手有利=青、打者有利=赤、均衡=暗
      // 合計カード: ゴールド系（通常カードと明確に区別）
      let bg, bord, lc;
      if(isSum) {
        bg   = 'rgba(234,179,8,0.06)';
        bord = '1px dashed rgba(234,179,8,0.45)';
        lc   = 'rgba(234,179,8,0.9)';
      } else {
        // labelから B数とS数を取得して投打有利判定
        const _bMatch = label.match(/^(\d+)B-(\d+)S$/);
        const _lb = _bMatch ? parseInt(_bMatch[1]) : 0;
        const _ls = _bMatch ? parseInt(_bMatch[2]) : 0;
        const isHitter  = _lb > _ls;
        const isPitcher = _ls >= 2 || (_ls > _lb);
        bg   = isHitter  ? 'rgba(248,113,113,0.07)' : isPitcher ? 'rgba(59,130,246,0.07)' : 'rgba(255,255,255,0.02)';
        bord = isHitter  ? '1px solid rgba(248,113,113,0.22)' : isPitcher ? '1px solid rgba(59,130,246,0.22)' : '1px solid rgba(255,255,255,0.07)';
        lc   = 'rgba(255,255,255,0.3)';
      }

      return `<div style="width:168px;min-height:${cardH}px;border-radius:7px;padding:8px 9px;border:${bord};background:${bg};box-sizing:border-box;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
          <span style="font-family:'DM Mono';font-size:9px;font-weight:700;color:${lc}">${label}</span>
          <span style="font-family:'DM Mono';font-size:8px;color:rgba(255,255,255,0.2)">${T}球</span>
        </div>
        <div style="font-size:7px;color:rgba(255,255,255,0.22);font-family:'DM Mono';font-weight:600;letter-spacing:0.08em;margin-bottom:3px">PITCH</div>
        <div style="flex:1">${pitchBars}</div>
        <div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:5px;flex-shrink:0">
          <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;gap:0.5px;margin-bottom:5px">${resBars}</div>
          ${rr('#79c0ff','ストライク',p_(strike),strike)}
          ${sr('空振り',p_(res.swing||0),res.swing||0)}
          ${sr('ファウル',p_(res.foul||0),res.foul||0)}
          ${sr('見逃し',p_(res.look||0),res.look||0)}
          ${rr('#7d8590','ボール',p_(res.ball||0),res.ball||0)}
          ${rr('#fbbf24','凡打',p_(res.out||0),res.out||0)}
          ${rr('#56d364','被安打',p_(res.hit||0),res.hit||0)}
        </div>
      </div>`;
    };

    // ── テーブル組み立て（4×3 + 合計列 + 合計行）──
    // ヘッダー行: S0 S1 S2 | 合計
    let html = `<thead><tr>
      <th style="font-size:9px;color:var(--text3);font-family:'DM Mono';padding:4px 10px 4px 0;text-align:right"></th>`;
    [0,1,2].forEach(s=>{
      html+=`<th style="font-size:9px;color:var(--text3);font-family:'DM Mono';font-weight:600;text-align:center;padding:4px 8px">ストライク ${s}</th>`;
    });
    html+=`<th style="font-size:9px;color:rgba(255,255,255,0.45);font-family:'DM Mono';font-weight:600;text-align:center;padding:4px 8px;border-left:1px solid rgba(255,255,255,0.1)">合計</th>`;
    html+='</tr></thead><tbody>';

    // データ行: B0〜B3 + 行合計
    [0,1,2,3].forEach(b=>{
      html+=`<tr><th style="font-size:9px;color:var(--text3);font-family:'DM Mono';font-weight:600;text-align:right;padding:4px 10px 4px 0;white-space:nowrap;vertical-align:middle">ボール ${b}</th>`;
      const _ch = _cardH(b);
      [0,1,2].forEach(s=>{
        const d=buildCardData([`${b}-${s}`]);
        html+=`<td style="vertical-align:top;padding:3px">${buildCard(d,`${b}B-${s}S`,false,_ch)}</td>`;
      });
      // 行合計（B固定）
      const dRowSum=buildCardData([0,1,2].map(s=>`${b}-${s}`));
      html+=`<td style="vertical-align:top;padding:3px;border-left:1px solid rgba(255,255,255,0.08)">${buildCard(dRowSum,`B${b} 合計`,true,_ch)}</td>`;
      html+='</tr>';
    });

    // 合計行（S固定）
    html+=`<tr><th style="font-size:9px;color:rgba(255,255,255,0.45);font-family:'DM Mono';font-weight:700;text-align:right;padding:4px 10px 4px 0;white-space:nowrap;vertical-align:middle;border-top:1px solid rgba(255,255,255,0.1)">合計</th>`;
    const _sumRowH = Math.max(...[0,1,2,3].map(b=>_cardH(b)));
    [0,1,2].forEach(s=>{
      const dColSum=buildCardData([0,1,2,3].map(b=>`${b}-${s}`));
      html+=`<td style="vertical-align:top;padding:3px;border-top:1px solid rgba(255,255,255,0.08)">${buildCard(dColSum,`S${s} 合計`,true,_sumRowH)}</td>`;
    });
    // 全合計
    const dAll=buildCardData([0,1,2,3].flatMap(b=>[0,1,2].map(s=>`${b}-${s}`)));
    // 球数表示は mix.count ベース（datamart由来）に統一してcbs欠落・locs欠落による乖離を解消
    // _mixTotalをフィールドとして渡し、buildCard内でTの上書きに使用する
    if(window._chMixTotal != null) dAll._mixTotal = window._chMixTotal;
    html+=`<td style="vertical-align:top;padding:3px;border-left:1px solid rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.08)">${buildCard(dAll,'全合計',true,_sumRowH)}</td>`;
    html+='</tr></tbody>';

    table.innerHTML = html;
  }

  function _renderPitchSummary() {
    const area   = document.getElementById('pitch-summary-area');
    const titleEl = document.getElementById('ps-title');
    const content = document.getElementById('ps-content');
    if(!area || !content) return;

    // データソースを決定
    const isSeason = window._activeRowIdx === 'season';
    const mixes    = window._pitchDetailMixes || {};
    const mix      = isSeason
      ? (window._seasonMixAll || [])
      : (mixes.all || []);
    const mixR     = isSeason
      ? (window._seasonMixVsR || [])
      : (mixes.vs_r || []);
    const mixL     = isSeason
      ? (window._seasonMixVsL || [])
      : (mixes.vs_l || []);

    if(!mix.length) { area.style.display = 'none'; return; }

    const _pc = {FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6'};

    // タイトル
    if(titleEl) titleEl.textContent = isSeason ? 'シーズン 球種・結果' : '球種・結果';

    // 球種割合バー
    const totalPitches = mix.reduce((s,m)=>s+(m.count||0),0);
    const pitchBars = mix.filter(m=>m.count>0).map(m => {
      const col  = _pc[m.key] || '#888';
      const pct  = totalPitches>0 ? (m.count/totalPitches*100).toFixed(1) : 0;
      return `<div style="margin-bottom:5px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></span>
          <span style="font-size:11px;font-weight:700;color:var(--text);font-family:'DM Mono'">${m.name}</span>
          <span style="font-size:11px;font-weight:700;color:${col};font-family:'DM Mono';margin-left:auto">${pct}%</span>
          <span style="font-size:10px;color:var(--text3);font-family:'DM Mono'">${m.count}球</span>
        </div>
        <div style="height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${col};border-radius:3px"></div>
        </div>
      </div>`;
    }).join('');

    // 結果集計（locsから計算）
    const _calcResult = (locsArr) => {
      const locs = locsArr.flatMap(m=>m.locs||[]);
      const total = locs.length;
      if(!total) return null;
      const swing  = locs.filter(l=>l[2]===1).length;
      const look   = locs.filter(l=>l[2]===-1&&l[3]===1).length;
      const ball   = locs.filter(l=>l[2]===-1&&l[3]===0).length;
      const out    = locs.filter(l=>l[4]===1||l[4]===2).length;
      const hit    = locs.filter(l=>l[4]>=3).length;
      return { swing, look, ball, out, hit, total };
    };

    const _buildResultBlock = (res, label) => {
      if(!res || !res.total) return `<div style="font-size:10px;color:var(--text3);font-family:'DM Mono'">${label}: データなし</div>`;
      const T = res.total;
      const strike = res.swing + res.look;
      const p = n => (n/T*100).toFixed(1);
      const segs = [
        {c:'#79c0ff',w:p(strike)},{c:'#7d8590',w:p(res.ball)},
        {c:'#fbbf24',w:p(res.out)},{c:'#56d364',w:p(res.hit)},
      ].map(s=>`<div style="height:100%;width:${s.w}%;background:${s.c}"></div>`).join('');
      const row = (col,name,n,sub='') => `
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          <div style="width:6px;height:6px;border-radius:50%;background:${col};flex-shrink:0"></div>
          <span style="font-size:10px;color:rgba(255,255,255,0.5);flex:1;font-family:'DM Mono'">${name}</span>
          <span style="font-size:10px;font-weight:700;color:${col};font-family:'DM Mono';width:32px;text-align:right">${p(n)}%</span>
          <span style="font-size:9px;color:var(--text3);font-family:'DM Mono';width:28px;text-align:right">${n}球</span>
        </div>${sub}`;
      const sub = (name,n) => `
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:1px;padding-left:10px">
          <span style="font-size:8px;color:rgba(255,255,255,0.2)">└</span>
          <span style="font-size:9px;color:rgba(255,255,255,0.3);flex:1;font-family:'DM Mono'">${name}</span>
          <span style="font-size:9px;color:rgba(255,255,255,0.3);font-family:'DM Mono';width:32px;text-align:right">${p(n)}%</span>
          <span style="font-size:8px;color:rgba(255,255,255,0.2);font-family:'DM Mono';width:28px;text-align:right">${n}球</span>
        </div>`;
      return `
        <div style="font-size:9px;color:var(--text3);font-family:'DM Mono';font-weight:600;margin-bottom:6px">${label} (${T}球)</div>
        <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px;margin-bottom:8px">${segs}</div>
        ${row('#79c0ff','ストライク',strike, sub('└空振り',res.swing)+sub('└見逃し',res.look))}
        ${row('#7d8590','ボール',res.ball)}
        ${row('#fbbf24','凡打',res.out)}
        ${row('#56d364','被安打',res.hit)}`;
    };

    const resAll = _calcResult(mix);
    const resR   = _calcResult(mixR);
    const resL   = _calcResult(mixL);

    content.innerHTML = `
      <div style="min-width:200px">
        <div style="font-size:9px;color:var(--text3);font-family:'DM Mono';font-weight:600;margin-bottom:8px">球種割合</div>
        ${pitchBars}
      </div>
      <div style="min-width:180px;border-left:1px solid var(--border2);padding-left:16px">
        ${_buildResultBlock(resAll,'全体')}
      </div>
      ${resR ? `<div style="min-width:180px;border-left:1px solid var(--border2);padding-left:16px">${_buildResultBlock(resR,'対右打者')}</div>` : ''}
      ${resL ? `<div style="min-width:180px;border-left:1px solid var(--border2);padding-left:16px">${_buildResultBlock(resL,'対左打者')}</div>` : ''}
    `;
    area.style.display = 'block';
  }

  function pitchCmpToggle(cb, idx) {
    if(cb.checked) {
      if(_pitchCmpSelected.length >= 3) { cb.checked = false; return; }
      _pitchCmpSelected.push(idx);
      _highlightRow(idx, true);
    } else {
      _pitchCmpSelected = _pitchCmpSelected.filter(i => i !== idx);
      _highlightRow(idx, false);
    }

    const area = document.getElementById('pitch-detail-area');
    const title = document.getElementById('pitch-detail-title');

    const resetBtn = document.getElementById('pitch-cmp-reset-btn');
    if(_pitchCmpSelected.length >= 1) {
      if(area) { area.style.display = 'block'; }
      const isMulti = _pitchCmpSelected.length >= 2;
      if(resetBtn) resetBtn.style.display = isMulti ? 'block' : 'none';
      if(title) {
        const labels = _pitchCmpSelected.map(k => {
          if(k === 'season') return 'シーズン';
          const d = _pitchGetAllData().find(d => d.idx === k);
          return d ? d.label : '—';
        });
        title.textContent = isMulti ? `球種比較 ${labels.join(' vs ')}` : `球種詳細 ${labels[0]}`;
      }
      const curMode = window._currentSplitMode || 'all';
      ['all','vs_r','vs_l'].forEach(m => {
        const btn = document.getElementById(`pitch-detail-tab-${m}`);
        if(!btn) return;
        btn.style.background = m === curMode ? 'var(--bg)' : 'transparent';
        btn.style.color = m === curMode ? 'var(--text)' : 'var(--text3)';
        btn.style.boxShadow = m === curMode ? '0 1px 4px rgba(0,0,0,0.4)' : 'none';
      });
      if(isMulti) {
        _renderCmpContent(curMode);
      } else {
        // 1件: 比較状態クリアして単体表示（_activeRowIdxは触らない）
        window._cmpMapsPerEntry = null;
        window._cmpLocsPerEntry = null;
        window._isCmpMode = false;
        const staticCv3 = document.getElementById('pitch-canvas-area');
        if(staticCv3) staticCv3.style.display = '';
        const hmArea4 = document.getElementById('pitch-heatmap-area');
        if(hmArea4) { const w = hmArea4.querySelector('.hm-canvas-wrap'); if(w) w.innerHTML=''; }
        const singleKey = _pitchCmpSelected[0];
        window._activeRowIdx = null; // リセットしてからクリック
        window._suppressScroll = true;
        if(singleKey === 'season') { pitchSeasonRowClick(); } else { pitchRowClick(singleKey, true); }
        window._suppressScroll = false;
      }
    } else {
      if(resetBtn) resetBtn.style.display = 'none';
      if(title) title.textContent = '球種詳細';
      if(window._activeRowIdx != null && window._activeRowIdx !== 'season') {
        pitchRowClick(window._activeRowIdx);
      } else if(window._activeRowIdx === 'season') {
        pitchSeasonRowClick();
      } else {
        if(area) area.style.display = 'none';
      }
    }
  }

  function _renderCmpContent(mode) {
    const content = document.getElementById('pitch-detail-content');
    if(!content) return;
    const sorted = [..._pitchCmpSelected].sort((a, b) => {
      if(a === 'season') return -1;
      if(b === 'season') return 1;
      return a - b; 
    });
    const entries = sorted.map(k => _pitchGetEntry(k, mode));
    const isMulti = entries.length >= 2;
    renderPitchPanel(content, entries, isMulti);
    if(isMulti) {
      // 比較ヒートマップ
      _renderCmpHeatmaps(entries, mode);
    } else {
      // 1件: 比較状態を完全リセットしてから単体表示
      window._cmpMapsPerEntry = null;
      window._cmpLocsPerEntry = null;
      window._isCmpMode = false;
      const staticCv2 = document.getElementById('pitch-canvas-area');
      if(staticCv2) staticCv2.style.display = '';
      const hmArea3 = document.getElementById('pitch-heatmap-area');
      if(hmArea3) { const w = hmArea3.querySelector('.hm-canvas-wrap'); if(w) w.innerHTML=''; }
      // _activeRowIdx をリセットして pitchRowClick が正常動作するように
      const singleKey = sorted[0];
      window._activeRowIdx = null;
      if(singleKey === 'season') {
        pitchSeasonRowClick();
      } else {
        pitchRowClick(singleKey, true);
      }
    }
  }

  function _renderCmpHeatmaps(entries, mode) {
    const area = document.getElementById('pitch-heatmap-area');
    if(!area) return;
    const locsKey = mode==='vs_r' ? 'locsR' : mode==='vs_l' ? 'locsL' : null;
    const _pc = {FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6'};
    const mapsPerEntry = entries.map((e, ei) => {
      const map = {};
      const _pc2 = {FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF',FS:'#2DD4BF',SH:'#F472B6'};
      // _playerLocsCacheから直接locsを取得（最も確実）
      const locsCache = (window._playerLocsCache || {})[_pitchCmpSelected.slice().sort((a,b)=>a-b)[ei]] || {};
      const mixAll = e.mix||[];
      mixAll.forEach(m => {
        if(!m.key) return;
        // 対右: mixVsRのlocs > cacheのmixVsR > mixのlocs > cacheのmix
        const locsR = (e.mixVsR && e.mixVsR.find(x=>x.key===m.key)?.locs?.length)
          ? e.mixVsR.find(x=>x.key===m.key).locs
          : (locsCache.mixVsR?.[m.key]?.length ? locsCache.mixVsR[m.key]
          : (m.locs?.length ? m.locs
          : (locsCache.mix?.[m.key] || [])));
        const locsL = (e.mixVsL && e.mixVsL.find(x=>x.key===m.key)?.locs?.length)
          ? e.mixVsL.find(x=>x.key===m.key).locs
          : (locsCache.mixVsL?.[m.key]?.length ? locsCache.mixVsL[m.key]
          : (m.locs?.length ? m.locs
          : (locsCache.mix?.[m.key] || [])));
        map[m.key] = { name: m.name, color: _pc2[m.key]||'#888', locsR, locsL };
      });
      return { label: e.label, map };
    });
    const hasAny = mapsPerEntry.some(e => Object.values(e.map).some(d=>d.locsR.length||d.locsL.length));
    if(!hasAny) { area.style.display='none'; return; }

    const canvasArea = area.querySelector('.hm-canvas-wrap') || (()=>{
      const d=document.createElement('div'); d.className='hm-canvas-wrap';
      area.appendChild(d); return d;
    })();
    canvasArea.innerHTML = '';
    // 比較時: 対右・対左それぞれで横並び
    const SIDES = mode==='all' ? ['vsR','vsL'] : [mode==='vs_r'?'vsR':'vsL'];
    canvasArea.style.cssText = 'display:flex;gap:64px;flex-wrap:wrap;align-items:flex-start;margin-top:12px';

    mapsPerEntry.forEach(({label, map}) => {
      const entryWrap = document.createElement('div');
      entryWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px';

      const canvasRow = document.createElement('div');
      canvasRow.style.cssText = 'display:flex;gap:6px';

      SIDES.forEach(side => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px';
        const lbl = document.createElement('div');
        lbl.style.cssText = "font-size:9px;color:var(--text3);font-family:'DM Mono';text-align:center";
        lbl.textContent = `${label} ${side==='vsR' ? '対右' : '対左'}`;
        const cv = document.createElement('canvas');
        const cvId = 'hm-cmp-'+label.replace(/[^a-zA-Z0-9]/g,'_')+'-'+side;
        cv.id=cvId; cv.width=160; cv.height=170;
        wrap.appendChild(lbl); wrap.appendChild(cv);
        canvasRow.appendChild(wrap);
      });

      entryWrap.appendChild(canvasRow);
      canvasArea.appendChild(entryWrap);
    });

    // 固定canvasエリアを非表示（比較時は動的canvasのみ使用）
    const staticCv = document.getElementById('pitch-canvas-area');
    if(staticCv) staticCv.style.display = 'none';

    window._isCmpMode = true;
    // フィルターボタン: 全エントリのlocsをマージして渡す
    const mergedMap = {};
    mapsPerEntry.forEach(({map}) => {
      Object.keys(map).forEach(k => {
        if(!mergedMap[k]) mergedMap[k] = {...map[k], locsR:[], locsL:[]};
        mergedMap[k].locsR = mergedMap[k].locsR.concat(map[k].locsR);
        mergedMap[k].locsL = mergedMap[k].locsL.concat(map[k].locsL);
      });
    });
    window._hmPitchLocsMap = mergedMap;
    window._hmSelectedKeys = null;
    window._cmpMapsPerEntry = mapsPerEntry;
    area.style.display = 'block';
    _buildFilterButtons(mergedMap);
    // DOM追加後に一括描画（requestAnimationFrameを使わず直接描画）
    _hmRedraw();
    _hmSetStatMode(window._hmStatMode || '9');
  }

  function _highlightRow(idx, on) {
    const el = idx === 'season'
      ? document.getElementById('pgr-season')
      : document.getElementById('pgr-' + idx);
    if(!el) return;
    if(on) {
      el.classList.add('pit-row-active');
      el.dataset.active = '1';
    } else {
      el.classList.remove('pit-row-active');
      el.dataset.active = '';
    }
  }

  function renderPitchPanel(panel, entries, isCompare) {
    const PC_LOCAL = {FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF'};
    const N = entries.length;

    const allKeys = [...new Set(entries.flatMap(e => e.mix.map(m => m.key)))];

    function getVal(mix, pitchKey, metricKey) {
      const m = mix.find(x => x.key === pitchKey);
      return (m && m[metricKey] != null) ? m[metricKey] : null;
    }
    function getPitchName(pitchKey) {
      for(const e of entries) {
        const m = e.mix.find(x => x.key === pitchKey);
        if(m) return m.name;
      }
      return pitchKey;
    }

    const thBase = `font-size:9px;font-family:'DM Mono';font-weight:600;border-bottom:1px solid var(--border);background:var(--bg3);white-space:nowrap;`;
    const thLS = thBase + `padding:6px 10px;text-align:left;color:var(--text3);`;

    let theadHtml = '';
    // ③ 球種詳細と同じカラースケールを使う
    const _pcsAll2 = window._pitchColorScaleStats||{};
    const _activeRoleKey2 = (window._activeRole==='先発')?'starter':'reliever';
    const _pcs2 = _pcsAll2[_activeRoleKey2]||_pcsAll2.starter||{};
    function _cmpBg(val, pitchKey, metKey) {
      if(val == null) return '';
      const _ps2 = _pcs2[pitchKey] || {};
      return getScaleColor(metKey, val, _ps2) || '';
    }

    const activeMetrics = PITCH_METRICS.filter(m => !m.mlbOnly || currentSport === 'mlb');
    const COL_MAP = Object.fromEntries(activeMetrics.map(m => [m.key, m.color]));

    // ピボット色付け用: 指標ごとの全球種の値を収集
    function _pivotBg(val, allVals, loIsBest) {
      if(val == null || allVals == null || loIsBest == null) return '';
      const nums = allVals.filter(v => v != null);
      if(nums.length < 2) return '';
      const sorted = [...nums].sort((a,b)=>a-b);
      const rank = sorted.findIndex(v => v >= val); // 0=最小値
      // loIsBest=false（高いほど良い）: rank大＝高値＝best → pct高
      // loIsBest=true（低いほど良い）: rank小＝低値＝best → pct高
      const pct = loIsBest
        ? (nums.length - 1 - rank) / (nums.length - 1)
        : rank / (nums.length - 1);
      if(pct >= 0.85) return 'rgba(18,165,178,0.40)';
      if(pct >= 0.70) return 'rgba(18,165,178,0.25)';
      if(pct >= 0.60) return 'rgba(18,165,178,0.12)';
      if(pct >= 0.40) return '';
      if(pct >= 0.30) return 'rgba(238,122,151,0.10)';
      if(pct >= 0.15) return 'rgba(238,122,151,0.18)';
      return 'rgba(238,122,151,0.38)';
    }
    const metricValsMap = {};
    activeMetrics.forEach(met => {
      metricValsMap[met.key] = [];
      entries.forEach(e => {
        allKeys.forEach(pk => {
          const v = getVal(e.mix, pk, met.key);
          if(v != null) metricValsMap[met.key].push(+v);
        });
      });
    });

    if(!isCompare) {
      const cols = activeMetrics.map(met =>
        `<th style="${thBase}padding:6px 8px;text-align:left;color:${COL_MAP[met.key]};min-width:${CELL_W}px">${met.label}</th>`
      ).join('');
      theadHtml = `<thead><tr><th style="${thLS}">球種</th><th style="${thBase}padding:6px 8px;text-align:left;color:var(--text3);min-width:60px">投球数</th>${cols}</tr></thead>`;
    } else {
      const BORDER_COL = 'rgba(59,130,246,0.3)';
      const labelColors = ['var(--blue)', 'var(--cyan)', 'var(--gold)'];
      const lastMetIdx = activeMetrics.length - 1;

      let topRow = `<th style="${thLS}" rowspan="2">球種</th><th colspan="${N}" style="${thBase}padding:5px 10px;text-align:left;color:var(--text3);border-right:2px solid ${BORDER_COL}">投球数</th>`;
      activeMetrics.forEach((met, mi) => {
        const borderRight = mi < lastMetIdx ? `border-right:2px solid ${BORDER_COL};` : '';
        topRow += `<th colspan="${N}" style="${thBase}padding:5px 10px;text-align:left;color:${COL_MAP[met.key]};${borderRight}">${met.label}</th>`;
      });

      let botRow = entries.map((e, ei) => `<th style="${thBase}padding:3px 10px;text-align:left;color:${labelColors[ei]};font-size:8px;${ei===N-1?'border-right:2px solid '+BORDER_COL+';':''}">${e.label}</th>`).join('');
      activeMetrics.forEach((met, mi) => {
        const borderRight = mi < lastMetIdx ? `border-right:2px solid ${BORDER_COL};` : '';
        entries.forEach((e, ei) => {
          const br = ei === N - 1 ? borderRight : '';
          botRow += `<th style="${thBase}padding:3px 10px;text-align:left;color:${labelColors[ei]};font-size:8px;${br}">${e.label}</th>`;
        });
      });

      theadHtml = `<thead><tr>${topRow}</tr><tr>${botRow}</tr></thead>`;
    }

    const BORDER_COL2 = 'rgba(59,130,246,0.3)';
    const lastMetIdx2 = activeMetrics.length - 1;
    const CELL_W = isCompare ? 70 : 90; 
    const bodyRows = allKeys.map(pitchKey => {
      const name = getPitchName(pitchKey);
      const col = PC_LOCAL[pitchKey] || '#888';

      const countCells = isCompare
        ? entries.map((e, ei) => {
            const cnt = getVal(e.mix, pitchKey, 'count');
            const br = ei === N-1 ? 'border-right:2px solid rgba(59,130,246,0.3);' : '';
            return `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;color:var(--text2);min-width:${CELL_W}px;${br}">${cnt!=null?cnt:'—'}</td>`;
          }).join('')
        : `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;color:var(--text2);min-width:60px">${_pitchCount!=null?_pitchCount:'—'}</td>`;
      let cells = '';
      if(!isCompare) {
        cells = activeMetrics.map(met => {
          const v = getVal(entries[0].mix, pitchKey, met.key);
          const disp = v != null ? met.fmt(v) : '—';
          const c = COL_MAP[met.key] || 'var(--text)';
          const isBold = (met.key==='swstr'||met.key==='zone');
          const bg = v != null ? _cmpBg(+v, pitchKey, met.key) : '';
          return `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;color:${c};min-width:${CELL_W}px;width:${CELL_W}px;${isBold?'font-weight:700;':''}${bg?'background:'+bg+';':''}">${disp}</td>`;
        }).join('');
      } else {
        cells = activeMetrics.map((met, mi) => {
          const borderRight = mi < lastMetIdx2 ? `border-right:2px solid ${BORDER_COL2};` : '';
          return entries.map((e, ei) => {
            const v = getVal(e.mix, pitchKey, met.key);
            const disp = v != null ? met.fmt(v) : '—';
            const br = ei === N - 1 ? borderRight : '';
            const c = COL_MAP[met.key] || 'var(--text)';
            const isBold = (met.key==='swstr'||met.key==='zone');
            const bg = v != null ? _cmpBg(+v, pitchKey, met.key) : '';
            return `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;min-width:${CELL_W}px;width:${CELL_W}px;${br}color:#fff;${isBold?'font-weight:700;':''}${bg?'background:'+bg+';':''}">${disp}</td>`;
          }).join('');
        }).join('');
      }

      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05)" onmouseover="this.style.background='var(--bg4)'" onmouseout="this.style.background=''">
        <td style="padding:5px 10px;white-space:nowrap;position:sticky;left:0;background:var(--bg2);z-index:1"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span><span style="font-size:11px;font-weight:600">${name}</span></span></td>
        ${countCells}
        ${cells}
      </tr>`;
    }).join('');

    let totalCells = '';
    if(!isCompare) {
      totalCells = activeMetrics.map(met => {
        if(met.key === 'pct') {
          const totCount = entries[0].mix.reduce((s,m)=>s+(m.count||0),0);
          return `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700;color:var(--text2);min-width:60px">${totCount}</td><td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700;color:var(--text2);min-width:${CELL_W}px">100%</td>`;
        }
        const mix = entries[0].mix;
        const totC = mix.reduce((s,m)=>s+m.count,0);
        let totVal;
        if(met.key === 'vel' || met.key === 'maxVel') {
          // 球速は加重平均（ゼロ除外）で計算し km/h を付与
          const velItems = mix.filter(m=>m[met.key]!=null&&m[met.key]>0);
          const velTotC  = velItems.reduce((s,m)=>s+m.count,0);
          totVal = velTotC > 0 ? (velItems.reduce((s,m)=>s+(+(m[met.key]||0))*m.count,0)/velTotC).toFixed(1)+'km/h' : '—';
        } else {
          totVal = totC > 0 ? (mix.reduce((s,m)=>s+((+(m[met.key])||0))*m.count,0)/totC).toFixed(1)+'%' : '—';
        }
        const c = COL_MAP[met.key] || 'var(--text)';
        const isBold = (met.key==='swstr'||met.key==='zone');
        return `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;color:#fff;min-width:${CELL_W}px;${isBold?'font-weight:700;':''}">${totVal}</td>`;
      }).join('');
    } else {
      totalCells = activeMetrics.map((met, mi) => {
        const borderRight = mi < lastMetIdx2 ? `border-right:2px solid ${BORDER_COL2};` : '';
        return entries.map((e, ei) => {
          const br = ei === N - 1 ? borderRight : '';
          if(met.key === 'pct') {
            const totC = e.mix.reduce((s,m)=>s+(m.count||0),0);
            return `<td style="padding:5px 8px;font-family:'DM Mono';font-size:11px;text-align:left;font-weight:700;color:var(--text2);min-width:${CELL_W}px;${br}">100%</td>`;
          }
          const mix = e.mix; const totC = mix.reduce((s,m)=>s+m.count,0);
          let totVal;
          if(met.key === 'vel' || met.key === 'maxVel') {
            const velItems = mix.filter(m=>m[met.key]!=null&&m[met.key]>0);
            const velTotC  = velItems.reduce((s,m)=>s+m.count,0);
            totVal = velTotC > 0 ? (velItems.reduce((s,m)=>s+(+(m[met.key]||0))*m.count,0)/velTotC).toFixed(1)+'km/h' : '—';
          } else {
            totVal = totC > 0 ? (mix.reduce((s,m)=>s+((+(m[met.key])||0))*m.count,0)/totC).toFixed(1)+'%' : '—';

// ── データ初期化用関数（追加） ──
  function applySeasonData(){

    window.SEASON_DATA['シーズン投手マスタ'].forEach(p => { pitMap[p['選手名']] = p; });

      if(date === 'highlights' || date.startsWith('_') || !Array.isArray(games)) return;

          (g.pitchers[side] || []).forEach(p => {

            if(s['防御率'])  p.season.era   = String(s['防御率']);
            if(s['WHIP']||s['ＷＨＩＰ']) p.season.whip = String(s['WHIP']||s['ＷＨＩＰ']);
            if(s['K%'])      p.season.kpct  = parseFloat(s['K%']);
            if(s['BB%'])     p.season.bbpct = parseFloat(s['BB%']);
            if(s['K-BB%'])   p.season.kbbpct= parseFloat(s['K-BB%']);

    });
  }

  // ── カラースケール ──
  // ポジティブ: ティール系、ネガティブ: ピンク系（半透明rgba）
  // true=高いほど良い, false=低いほど良い, null=方向性なし
  const COL_SCALE_DIR = {
    swstr:true, oSwing:true, strike:true, zone:true,
    kbbpct:true, kpct:true, bbpct:false, gbpct:true,
    vel:true, maxVel:true,
    avgSpin:true, spinAxis:false, activeSpin:true, vaa:false,
    ivb:true, hb:true, ext:true,
    xwoba_mix:false,
  };
  // 先発・中継ぎ別にパーセンタイル計算
  function buildColorScaleStats() {
    const mk=()=>({swstr:[],oSwing:[],strike:[],zone:[],kbbpct:[],kpct:[],bbpct:[],gbpct:[]});
    const byRole={starter:mk(), reliever:mk()};
    Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
      (DATA[date]||[]).forEach(g=>{
        ['home','away'].forEach(side=>{
          (g.pitchers[side]||[]).forEach(p=>{
            const role=p.role==='先発'?'starter':'reliever';
            const vals=byRole[role];
            if(p.swstr  !=null) vals.swstr.push(+p.swstr);
            if(p.oSwing !=null) vals.oSwing.push(+p.oSwing);
            if(p.strike !=null) vals.strike.push(+p.strike);
            if(p.zone   !=null) vals.zone.push(+p.zone);
            // JSONにkpct/bbpct/kbbpctが直接入っている場合は優先使用
            // ない場合のみ k+bb+h を近似TBFとして計算
            if(p.kpct   != null) vals.kpct.push(+p.kpct);
            else { const tbf=(p.k||0)+(p.bb||0)+(p.h||0); if(tbf>0) vals.kpct.push((p.k||0)/tbf*100); }
            if(p.bbpct  != null) vals.bbpct.push(+p.bbpct);
            else { const tbf=(p.k||0)+(p.bb||0)+(p.h||0); if(tbf>0) vals.bbpct.push((p.bb||0)/tbf*100); }
            if(p.kbbpct != null) vals.kbbpct.push(+p.kbbpct);
            else { const tbf=(p.k||0)+(p.bb||0)+(p.h||0); if(tbf>0) vals.kbbpct.push(((p.k||0)-(p.bb||0))/tbf*100); }
            if(p.gbpct!=null) vals.gbpct.push(+p.gbpct);
          });
        });
      });
    });
    const calcStats=vals=>{
      const stats={};
      Object.entries(vals).forEach(([k,arr])=>{
        if(!arr.length){stats[k]={p15:0,p30:0,p40:0,p60:100,p70:100,p85:100};return;}
        arr.sort((a,b)=>a-b);
        const p=pct=>arr[Math.min(arr.length-1,Math.floor(arr.length*pct/100))];
        stats[k]={p15:p(15),p30:p(30),p40:p(40),p60:p(60),p70:p(70),p85:p(85)};
      });
      return stats;
    };
    window._colorScaleStats={
      starter:  calcStats(byRole.starter),
      reliever: calcStats(byRole.reliever),
    };
  }
  // 先発・中継ぎ別に球種データのパーセンタイル計算
  function buildPitcherOverallColorStats() {
    // 投手全体指標（空振り率・ゾーン率・K%・BB%・K-BB%・GB%・ボール球SW%・ストライク率）
    // 先発/中継ぎ別にパーセンタイル計算
    const keys = ['swstr','oSwing','strike','zone','kpct','bbpct','kbbpct','gbpct'];
    const mk = () => Object.fromEntries(keys.map(k=>[k,[]]));
    const byRole = {starter: mk(), reliever: mk()};
    Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
      (DATA[date]||[]).forEach(g=>{
        ['home','away'].forEach(side=>{
          (g.pitchers[side]||[]).forEach(p=>{
            const rk = p.role==='先発'?'starter':'reliever';
            const d = byRole[rk];
            if(p.swstr!=null)  d.swstr.push(+p.swstr);
            if(p.oSwing!=null||p.oswing!=null) d.oSwing.push(+(p.oSwing??p.oswing));
            if(p.strike!=null) d.strike.push(+p.strike);
            if(p.zone!=null)   d.zone.push(+p.zone);
            if(p.kpct!=null)   d.kpct.push(+p.kpct);
            if(p.bbpct!=null)  d.bbpct.push(+p.bbpct);
            if(p.kbbpct!=null) d.kbbpct.push(+p.kbbpct);
            if(p.gbpct!=null)  d.gbpct.push(+p.gbpct);
          });
        });
      });
    });
    const calc = byKey => {
      const result = {};
      Object.entries(byKey).forEach(([metric, arr]) => {
        if(!arr.length){result[metric]={p15:0,p30:0,p40:0,p60:100,p70:100,p85:100};return;}
        arr.sort((a,b)=>a-b);
        const p = pct => arr[Math.min(arr.length-1, Math.floor(arr.length*pct/100))];
        result[metric] = {p15:p(15),p30:p(30),p40:p(40),p60:p(60),p70:p(70),p85:p(85)};
      });
      return result;
    };
    window._pitcherOverallStats = {
      starter:  calc(byRole.starter),
      reliever: calc(byRole.reliever),
    };
  }

  function buildPitchColorScaleStats() {
    const mk=()=>({swstr:[],oSwing:[],strike:[],zone:[],gbpct:[],xwoba_mix:[],vel:[],maxVel:[],avgSpin:[],spinAxis:[],activeSpin:[],vaa:[],ivb:[],hb:[],ext:[]});
    const byRole={starter:{}, reliever:{}};
    Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
      (DATA[date]||[]).forEach(g=>{
        ['home','away'].forEach(side=>{
          (g.pitchers[side]||[]).forEach(p=>{
            const roleKey=p.role==='先発'?'starter':'reliever';
            (p.mix||[]).forEach(m=>{
              if(!byRole[roleKey][m.key]) byRole[roleKey][m.key]=mk();
              const d=byRole[roleKey][m.key];
              if(m.swstr  !=null) d.swstr.push(+m.swstr);
              if(m.oSwing !=null) d.oSwing.push(+m.oSwing);
              if(m.strike !=null) d.strike.push(+m.strike);
              if(m.zone   !=null) d.zone.push(+m.zone);
              if(m.gbpct  !=null) d.gbpct.push(+m.gbpct);
              if(m.xwoba  !=null) d.xwoba_mix.push(+m.xwoba);
              if(m.vel!=null&&m.vel>0)       d.vel.push(+m.vel);
              if(m.maxVel!=null&&m.maxVel>0) d.maxVel.push(+m.maxVel);
              if(m.avgSpin!=null&&m.avgSpin>0) d.avgSpin.push(+m.avgSpin);
              if(m.spinAxis!=null) d.spinAxis.push(+m.spinAxis);
              if(m.activeSpin!=null) d.activeSpin.push(+m.activeSpin);
              if(m.vaa!=null) d.vaa.push(+m.vaa);
              if(m.ivb!=null) d.ivb.push(+m.ivb);
              if(m.hb!=null)  d.hb.push(+m.hb);
              if(m.ext!=null&&m.ext>0) d.ext.push(+m.ext);
            });
          });
        });
      });
    });
    const calcPitchStats=byKey=>{
      const result={};
      Object.entries(byKey).forEach(([pitchKey,valMap])=>{
        result[pitchKey]={};
        Object.entries(valMap).forEach(([metric,arr])=>{
          if(!arr.length){result[pitchKey][metric]={p15:0,p30:0,p40:0,p60:100,p70:100,p85:100};return;}
          arr.sort((a,b)=>a-b);
          const p=pct=>arr[Math.min(arr.length-1,Math.floor(arr.length*pct/100))];
          result[pitchKey][metric]={p15:p(15),p30:p(30),p40:p(40),p60:p(60),p70:p(70),p85:p(85)};
        });
      });
      return result;
    };
    window._pitchColorScaleStats={
      starter:  calcPitchStats(byRole.starter),
      reliever: calcPitchStats(byRole.reliever),
    };
  }
  // 値 → 半透明背景色rgba文字列を返す
  // パーセンタイル閾値ベースで以下に分類:
  //   上位15%          → ティール濃        rgba(18,165,178, 0.40)
  //   上位15〜30%      → ティールやや薄    rgba(18,165,178, 0.25)
  //   上位30〜40%      → ティール薄        rgba(18,165,178, 0.12)
  //   中央40〜60%      → 色なし
  //   上位60〜70%      → ピンク薄          rgba(238,122,151, 0.10)
  //   上位70〜85%      → ピンクやや薄      rgba(238,122,151, 0.18)
  //   上位85%〜        → ピンク濃          rgba(238,122,151, 0.38)
  function getScaleColor(colKey,val,statsObj){
    const dir=COL_SCALE_DIR[colKey];
    if(dir===null||dir===undefined) return '';
    if(val==null||val===''||isNaN(+val)) return '';
    const s=statsObj&&statsObj[colKey];
    if(!s) return '';
    const v=+val;
    const rank = (() => {
      const {p15:_p15,p30:_p30,p40:_p40,p60:_p60,p70:_p70,p85:_p85} = s;
      if(dir){
        if(v>=_p85)  return 'top15';
        if(v>=_p70)  return 'top30';
        if(v>=_p60)  return 'top40';
        if(v>=_p40)  return 'mid';
        if(v>=_p30)  return 'bot60';
        if(v>=_p15)  return 'bot70';
        return 'bot85';
      } else {
        if(v<=_p15)  return 'top15';
        if(v<=_p30)  return 'top30';
        if(v<=_p40)  return 'top40';
        if(v<=_p60)  return 'mid';
        if(v<=_p70)  return 'bot60';
        if(v<=_p85)  return 'bot70';
        return 'bot85';
      }
    })();
    switch(rank){
      case 'top15': return 'rgba(18,165,178,0.40)';
      case 'top30': return 'rgba(18,165,178,0.25)';
      case 'top40': return 'rgba(18,165,178,0.12)';
      case 'mid':   return '';
      case 'bot60': return 'rgba(238,122,151,0.10)';
      case 'bot70': return 'rgba(238,122,151,0.18)';
      case 'bot85': return 'rgba(238,122,151,0.38)';
    }
    return '';
  }

  function _reloadData() {
    DATA = {};
    curDate = null;
    curGameIdx = 0;
    playerPageReturnState = null;
    window._mlbPlayerCache = {}; // スポーツ切り替え時にキャッシュクリア
    window._batDailySortKey = null; // スポーツ切り替え時にデフォルトソートをリセット

    // ── ランキングフィルター・ソート状態をリセット ──
    // リーグ/スポーツが変わると投球回・球数の規模が変わるため必ずリセット
    window._seaPitMinIP = null;
    window._seaPitMinPitches = null;
    window._gamePitMinIP = null;
    window._gamePitMinPitches = null;
    window._seaBatMinPA = null;
    window._rankDateFrom = '';
    window._rankDateTo = '';
    rankPitSortKey = 'swstr';
    rankPitSortAsc = false;

    // ランキング表示中にタブ切り替えした場合: viewModeをdailyに戻してからinit
    // → initWithData()内でselectDate()がランキングを再描画しようとするのを防ぐ
    // → データ読み込み完了後にshowRankingを遅延呼び出しする
    const wasRanking = (viewMode === 'ranking');
    if (wasRanking) {
      viewMode = 'daily';
      document.getElementById('rankingBtn').classList.remove('active');
    }

    document.getElementById('detailPanel').innerHTML = '<div class="empty-state"><span class="icon">⚾</span><span>読み込み中...</span></div>';
    document.getElementById('gameList').innerHTML = '';
    init(wasRanking);
  }

  function showLoadError(msg){
    document.getElementById('detailPanel').innerHTML=`
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;gap:16px;text-align:center">
    <div style="font-size:48px;opacity:0.3">⚠️</div>
    <div style="font-size:15px;font-weight:700;color:var(--red)">データの読み込みに失敗しました</div>
    <div style="font-size:12px;color:var(--text3)">${msg}</div>
    <div style="font-size:11px;color:var(--text3)">ファイルが存在するか、Live Serverで開いているか確認してください</div>
  </div>`;
  }

  // ── 1ファイル分のJSONを対象オブジェクトにマージ（元initの結合ロジックを共通化） ──
  function mergeGamesJson(json, target){
    if(json === null) return;
    Object.entries(json).forEach(([date, games]) => {
      if(date === 'highlights') {
        if(!target.highlights) target.highlights = {};
        Object.entries(games).forEach(([d, list]) => {
          if(!target.highlights[d]) target.highlights[d] = [];
          target.highlights[d] = target.highlights[d].concat(list);
        });
      } else if(date.startsWith('_')) {
        target[date] = games;
      } else if(Array.isArray(games)) {
        if(!target[date]) target[date] = [];
        target[date] = target[date].concat(games);
      }
    });
  }

  // ── バックグラウンド読み込み中インジケーター（画面右下の小さなピル） ──
  function showBgLoadIndicator(total){
    if(total <= 0) return;
    if(!document.getElementById('bgspin-style')){
      const st = document.createElement('style');
      st.id = 'bgspin-style';
      st.textContent = '@keyframes bgspin{to{transform:rotate(360deg)}}';
      document.head.appendChild(st);
    }
    let el = document.getElementById('bgLoadIndicator');
    if(!el){
      el = document.createElement('div');
      el.id = 'bgLoadIndicator';
      el.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:900;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:11px;font-family:\'DM Mono\',monospace;color:var(--text2);box-shadow:0 4px 16px rgba(0,0,0,0.4);display:flex;align-items:center;gap:8px;';
      document.body.appendChild(el);
    }
    el.style.display = 'flex';
    el.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:bgspin .7s linear infinite;flex-shrink:0"></span><span id="bgLoadText">残りのデータを読み込み中... 0/${total}</span>`;
  }
  function updateBgLoadIndicator(done, total){
    const t = document.getElementById('bgLoadText');
    if(t) t.textContent = `残りのデータを読み込み中... ${done}/${total}`;
  }
  function hideBgLoadIndicator(){
    const el = document.getElementById('bgLoadIndicator');
    if(el) el.style.display = 'none';
  }

  // ── 全データが出揃った後、統計系（シーズン成績・カラースケール）を再計算 ──
  // 表示中の画面は書き換えない（閲覧中のジャンプを避けるため）。
  // 次に日付やタブを切り替えたときから正しい値が反映される。
  function finalizeBackgroundLoad(){
    window._dataLoadComplete = true;
    applyTeamColors();
    applySeasonData();
    buildColorScaleStats();
    buildPitchColorScaleStats();
    buildPitcherOverallColorStats();
    hideBgLoadIndicator();
  }

  function init(wasRanking){
    const year = new Date().getFullYear();
    const indexPath = _getIndexPath(currentLeague, currentGameType);
    if(!indexPath){ showLoadError(`パスが設定されていません: ${currentLeague} / ${currentGameType}`); return; }
    const jsonBase  = indexPath.replace('/index.json', '/');
    const cacheBuster = '?t=' + Date.now();
    window._dataLoadComplete = false;
    fetch(indexPath + cacheBuster, { cache: 'no-store' })
      .then(r => { if(!r.ok) throw new Error('index.json が見つかりません: ' + indexPath); return r.json(); })
      .then(index => {
        const fileNames = index.files || [];
        if(fileNames.length === 0){ showLoadError('index.json にファイルが登録されていません'); return; }
        const files = fileNames.map(f => `${jsonBase}${f}`);

        // NPBのみ season マスタを取得。MLBは個人JSON（_mlbPlayerCache）から参照
        const seasonPath = currentSport === 'mlb'
          ? null
          : jsonBase.replace('/games/json/', '/season/') + `season_${year}.json`;

        // ── ① まず最新日付（index.jsonの最後の1件）だけ取得して即描画 ──
        // files は日付昇順なので、末尾＝最新日付のファイル
        const firstFile  = files[files.length - 1];
        const restFiles  = files.slice(0, files.length - 1);

        fetch(firstFile + cacheBuster, { cache: 'no-store' })
          .then(r => { if(!r.ok) throw new Error(firstFile); return r.json(); })
          .catch(() => { console.warn('読み込み失敗:', firstFile); return null; })
          .then(firstJson => {
            const merged = {};
            mergeGamesJson(firstJson, merged);
            const dateKeys = Object.keys(merged).filter(k=>k!=='highlights'&&!k.startsWith('_'));
            if(dateKeys.length === 0){
              showLoadError('データを読み込めませんでした');
              return;
            }
            DATA = merged;
            window.SEASON_DATA = window.SEASON_DATA || {};
            // ランキング画面からのリーグ切り替えの場合: デイリーを先に描画し、
            // UIスレッドが解放された後にランキングを再描画する（重さ解消）
            if (wasRanking) {
              initWithData();
              // デイリー描画完了後、非同期でランキングに切り替え
              setTimeout(() => showRanking(), 50);
            } else {
              initWithData();
            }

            // ── ② 残りの試合データ＋シーズンマスタをバックグラウンドで取得 ──
            // すでに表示中の画面には手を加えず、DATAへ静かにマージしていく。
            const bgTotal = restFiles.length + (seasonPath ? 1 : 0);
            if(bgTotal === 0){ finalizeBackgroundLoad(); return; }
            showBgLoadIndicator(bgTotal);
            let bgDone = 0;
            function bgTick(){
              bgDone++;
              updateBgLoadIndicator(bgDone, bgTotal);
              if(bgDone >= bgTotal) finalizeBackgroundLoad();
            }
            restFiles.forEach(path => {
              fetch(path + cacheBuster, { cache: 'no-store' })
                .then(r => { if(!r.ok) throw new Error(path); return r.json(); })
                .catch(() => { console.warn('読み込み失敗:', path); return null; })
                .then(json => { mergeGamesJson(json, DATA); bgTick(); });
            });
            if(seasonPath){
              fetch(seasonPath + cacheBuster, { cache: 'no-store' })
                .then(r => r.ok ? r.json() : null)
                .catch(() => null)
                .then(seasonData => { window.SEASON_DATA = seasonData || {}; bgTick(); });
            }
          });
      })
      .catch(e => showLoadError(e.message));
  }
  init();

  </script>
  
<script>
// rnk-tbl-wrap: データ行の横スクロールをヘッダー行に同期
function initRnkSync() {
  document.querySelectorAll('.rnk-tbl-wrap').forEach(function(wrap) {
    if(wrap._synced) return;
    wrap._synced = true;
    var dw = wrap.querySelector('.rnk-data-wrap');
    var hw = wrap.querySelector('.rnk-hdr-wrap .rnk-hdr-inner');
    if(!dw || !hw) return;
    dw.addEventListener('scroll', function() {
      hw.style.marginLeft = '-' + dw.scrollLeft + 'px';
    }, {passive:true});
  });
}
// _updateRankContent後に呼ぶ（_impl をラップして横スクロール同期を追加）
var _origUpdateImpl = window._updateRankContent_impl;
if(typeof _origUpdateImpl === 'function') {
  window._updateRankContent_impl = function() {
    _origUpdateImpl.apply(this, arguments);
    setTimeout(initRnkSync, 50);
  };
}
document.addEventListener('DOMContentLoaded', function(){ setTimeout(initRnkSync,100); });
</script>

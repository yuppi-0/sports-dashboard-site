<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NPB 試合分析ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Oswald:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{height:100%;overflow:hidden;margin:0;padding:0;}
:root{
  --bg:#070E1A;--bg2:#0C1829;--bg3:#111F33;--bg4:#172843;
  --blue:#3B82F6;--blue-dim:#1D3461;--blue-g:rgba(59,130,246,0.14);
  --cyan:#22D3EE;--gold:#F59E0B;--green:#10B981;--red:#F87171;
  --orange:#FB923C;--purple:#A78BFA;--teal:#2DD4BF;
  --border:rgba(59,130,246,0.16);--border2:rgba(255,255,255,0.06);
  --red-dim:#3D1515;--red-g:rgba(248,113,113,0.14);
  --text:#E2E8F0;--text2:#94A3B8;--text3:#475569;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 800px 500px at 10% 5%,rgba(59,130,246,0.07) 0%,transparent 60%),
             radial-gradient(ellipse 500px 400px at 90% 95%,rgba(167,139,250,0.04) 0%,transparent 60%);
  pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;background:var(--bg);height:calc(100% - 57px);display:flex;flex-direction:column;}

/* ── HEADER ── */
header{background:rgba(6,16,30,0.97);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:500;}
.league-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.06);border:1px solid var(--border2);border-radius:8px;padding:3px;}
.league-tab{font-size:12px;font-weight:700;font-family:'Noto Sans JP',sans-serif;padding:5px 18px;border:none;border-radius:6px;cursor:pointer;background:transparent;color:var(--text3);transition:all .15s;}
.league-tab.active{background:var(--blue);color:#fff;box-shadow:0 1px 6px rgba(59,130,246,0.4);}
.league-tab.active.mlb{background:var(--red);box-shadow:0 1px 6px rgba(248,113,113,0.4);}
.league-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.08);}
/* ── スポーツ/リーグ 2段タブ ── */
.league-tabs-wrap{display:flex;flex-direction:column;gap:0;}
.sport-tabs{display:flex;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:8px 8px 0 0;border-bottom:none;overflow:hidden;}
.sport-tab{font-size:11px;font-weight:700;font-family:'Noto Sans JP',sans-serif;padding:6px 18px;border:none;border-bottom:2px solid transparent;cursor:pointer;background:transparent;color:var(--text3);transition:all .18s;white-space:nowrap;}
.sport-tab+.sport-tab{border-left:1px solid var(--border2);}
.sport-tab.active{color:#fff;border-bottom-color:var(--blue);background:rgba(59,130,246,0.15);}
.sport-tab.mlb-active{border-bottom-color:var(--red)!important;background:rgba(248,113,113,0.12)!important;}
.sport-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.07);}
.league-tabs{display:flex;gap:3px;background:rgba(255,255,255,0.05);border:1px solid var(--border2);border-top:none;border-radius:0 0 8px 8px;padding:4px;}
.h-brand{display:flex;align-items:center;gap:10px;}
.h-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#1D3461,#3B82F6);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;color:#fff;box-shadow:0 0 12px rgba(59,130,246,0.35);text-align:center;line-height:1.3;}
.h-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;letter-spacing:0.04em;}
.h-title em{font-style:normal;color:var(--blue);}
/* Header right: date picker button */
.cnt-badge{display:none !important;}
.h-date-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;transition:all .15s;white-space:nowrap;}
.h-date-btn:hover{border-color:var(--blue);color:var(--text);}
.h-date-btn .date-val{color:var(--text);font-weight:600;}
.h-date-btn .cnt-badge{background:var(--blue-dim);border:1px solid rgba(59,130,246,0.3);color:var(--blue);border-radius:5px;padding:1px 6px;font-size:10px;}

/* ── DATE PICKER MODAL ── */
.date-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:800;display:none;align-items:flex-start;justify-content:center;padding-top:56px;}
.date-modal-overlay.open{display:flex;}
.date-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:min(440px,94vw);max-height:82vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,0.7);}
.date-modal-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.date-modal-title{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.06em;color:var(--text2);}
.date-modal-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.date-modal-month-label{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;color:var(--gold);min-width:76px;text-align:center;}
.date-modal-nav-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:all .12s;}
.date-modal-nav-btn:hover{border-color:var(--blue);color:var(--text);}
.date-modal-nav-btn:disabled{opacity:0.3;cursor:default;}
.date-modal-close{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}
/* Calendar grid */
.date-modal-body{overflow-y:auto;padding:10px 12px 14px;flex:1;}
.date-modal-body::-webkit-scrollbar{width:4px;}
.date-modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.dm-cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px;padding:0 1px;}
.dm-wd{font-size:10px;font-family:'DM Mono',monospace;text-align:center;padding:4px 0;font-weight:600;color:var(--text3);}
.dm-wd.sat{color:#60A5FA;}
.dm-wd.sun{color:#F87171;}
.dm-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.dm-cell{border-radius:8px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;border:1px solid transparent;transition:all .12s;}
.dm-cell.has-game{background:var(--bg3);border-color:var(--border2);cursor:pointer;}
.dm-cell.has-game:hover{border-color:var(--blue);background:var(--bg4);}
.dm-cell.active{background:var(--blue-dim);border-color:var(--blue);box-shadow:0 0 10px rgba(59,130,246,0.3);cursor:pointer;}
.dm-cell.empty{background:transparent;}
.dm-cell-day{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;line-height:1;color:var(--text3);}
.dm-cell.has-game .dm-cell-day{color:var(--text);}
.dm-cell.sat.has-game .dm-cell-day{color:#93C5FD;}
.dm-cell.sun.has-game .dm-cell-day{color:#FCA5A5;}
.dm-cell.active .dm-cell-day{color:#fff;}
.dm-cell-cnt{font-size:8px;font-family:'DM Mono',monospace;color:var(--blue);margin-top:2px;}
.dm-cell.active .dm-cell-cnt{color:rgba(255,255,255,0.7);}
.dm-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);margin-top:2px;}
.dm-cell.active .dm-dot{background:rgba(255,255,255,0.8);}

/* ── MAIN LAYOUT ── */
.main-body{display:flex;height:100%;overflow:hidden;}

/* ── LEFT SIDEBAR (game list) ── */
.game-sidebar{width:272px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto;position:sticky;top:57px;height:calc(100vh - 57px);}
.game-sidebar::-webkit-scrollbar{width:4px;}
.game-sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.sidebar-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-head-label{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;color:var(--text2);}
.sidebar-head-cnt{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;}

/* Sidebar buttons */
.sidebar-daily-btn{width:100%;padding:10px 14px;border:none;background:transparent;color:var(--text2);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;text-align:left;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:6px;transition:background .12s;}
.sidebar-daily-btn:hover{background:var(--bg3);}
.sidebar-daily-btn.active{background:var(--bg4);border-left:3px solid var(--gold);color:var(--gold);}
.sidebar-ranking-btn{width:100%;padding:10px 14px;border:none;background:transparent;color:var(--text2);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;text-align:left;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:6px;transition:background .12s;}
.sidebar-ranking-btn:hover{background:var(--bg3);}
.sidebar-ranking-btn.active{background:var(--bg4);border-left:3px solid var(--blue);color:var(--blue);}

.game-card{padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;position:relative;}
.game-card:hover{background:var(--bg3);}
.game-card.active{background:var(--bg4);border-left:3px solid var(--blue);}
.gc-stadium{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:4px;}
.gc-teams{display:flex;align-items:center;justify-content:space-between;font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.02em;}
.gc-score-wrap{display:flex;align-items:center;gap:5px;}
.gc-score-num{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;}
.gc-sep{font-size:11px;color:var(--text3);}
.gc-meta{font-size:9px;color:var(--text3);margin-top:3px;font-family:'DM Mono',monospace;}
.gc-badge{position:absolute;top:11px;right:10px;font-size:8px;padding:2px 5px;border-radius:3px;font-family:'DM Mono',monospace;font-weight:700;}
.badge-w{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:var(--green);}
.badge-l{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);color:var(--red);}
.badge-d{background:rgba(148,163,184,0.1);border:1px solid var(--border2);color:var(--text3);}
.badge-cancel{background:rgba(148,163,184,0.1);border:1px solid var(--border2);color:var(--text3);font-size:9px;}

/* ── DETAIL PANEL ── */
.detail-panel{flex:1;overflow-y:auto;padding:0;background:var(--bg);height:calc(100vh - 57px);}
#tabContent{padding:0 16px 60px;}
.detail-panel::-webkit-scrollbar{width:5px;}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* --- ランキング詳細テーブル用スタイル追加 --- */
.rnk-col-hdr { background: var(--bg3); }
/* スタッツまとめ テーブル */
.rnk-tbl-wrap { overflow-x:auto; border-radius:8px; scrollbar-width:none; -ms-overflow-style:none; }
.rnk-tbl-wrap::-webkit-scrollbar { display:none; }
.rnk-tbl { width:100%; border-collapse:collapse; }
.rnk-tbl thead th {
  background:var(--bg3);
  font-size:10px;
  font-weight:700;
  padding:9px 8px;
  text-align:left;
  border-bottom:1px solid var(--border2);
  white-space:nowrap;
}
.rnk-tbl tbody td {
  padding:10px 8px;
  border-bottom:1px solid rgba(255,255,255,0.05);
  vertical-align:top;
}
.rnk-tbl tbody tr:hover td { background:rgba(255,255,255,0.03); }
.rnk-data-row:hover { background: var(--bg4); }
.sort-arrow { margin-left: 2px; opacity: 0.7; }

/* 投球ランキングの先発/中継ぎタブ直上のsection-hdr */
#sec-pitch-rank > .section-hdr:first-child { border-radius:12px 12px 0 0; }

/* 内部タブのSticky管理用 */
#rnk-role-tabs, #bat-tab-bar {
  position: sticky;
  z-index: 72;
  background: var(--bg3);
}

/* 投手テーブル行のsticky背景 */
.rnk-data-row [style*="position:sticky"] {
  background: inherit;
}

/* ランキング等 順位デザイン共通化 */
.rank-num-col {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #f59e0c;
  width: 24px;
  min-width: 24px;
  text-align: right;
  flex-shrink: 0;
  line-height: 1.2;
  margin-right: 12px;
}

/* 試合詳細の固定エリア用 */
#gameFixedArea {
  position: sticky;
  top: 0;
  z-index: 110;
  background: var(--bg);
  border-bottom: 1px solid var(--border2);
  transition: height 0.1s;
}

/* ── DAILY SUMMARY ── */
.fadein{padding:0;}
.daily-hdr{margin-bottom:16px;}
.daily-date-label{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:0.04em;color:var(--text);margin-bottom:4px;}
.daily-date-label span{color:var(--blue);}
.daily-sub{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}

.daily-top{display:flex;flex-direction:column;gap:16px;margin-bottom:0;padding:4px 18px 60px;}

.daily-section{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:visible; 
}
.daily-section > .section-hdr:first-child { border-radius:12px 12px 0 0; }

.section-hdr{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 9px;
  background:var(--bg3);
  border-bottom:2px solid var(--border);
  position:sticky;
  top:45px;
  z-index:80;
  cursor:pointer;
  margin:0;
  transition:box-shadow .15s;
}
.section-hdr:hover .section-hdr-title{color:var(--blue);}
.section-hdr-icon{font-size:16px;line-height:1;}
.section-hdr-title{
  font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;
  letter-spacing:0.1em;color:var(--text2);text-transform:uppercase;
  flex:1;
}
.section-hdr-accent{width:3px;height:16px;border-radius:2px;flex-shrink:0;}
.section-body{padding:16px 18px;}

/* Spotlight */
.spotlight-card{background:transparent;border:none;border-radius:0;padding:0;position:relative;overflow:visible;}
.spotlight-card::before{display:none;}
.spotlight-label{display:none;}
.spotlight-matchup{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.02em;margin-bottom:4px;line-height:1.2;}
.spotlight-score{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--blue);margin-bottom:6px;}
.spotlight-highlight{font-size:11px;color:var(--text2);line-height:1.6; max-width: 640px;}
.spotlight-pitcher{margin-top:8px;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}

/* Star players */
.stars-card{background:transparent;border:none;border-radius:0;padding:0;display:flex;flex-direction:column;gap:0;}
.stars-label{display:none;}
.star-row{border-bottom:1px solid var(--border2);padding:10px 0;display:flex;align-items:flex-start;gap:0;}
.star-row:last-child{border-bottom:none;padding-bottom:0;}
.star-num{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:#f59e0c;width:28px;flex-shrink:0;line-height:1.2;text-align:right;padding-right:4px;margin-left:-4px;}
.star-info{flex:1;min-width:0;}
.star-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.star-team{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
.star-stat{font-size:13px;color:var(--green);font-family:'DM Mono',monospace;text-align:right;flex-shrink:0;white-space:nowrap;font-weight:600;}

/* Score cards grid */
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px;}
.score-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:0;
  cursor:pointer;
  transition:background .15s, border-color .15s;
  overflow:hidden;
  position:relative;
}
.score-card:hover{background:var(--bg4);border-color:var(--border2);}
.score-card.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;}
.sc-color-bar{height:3px;width:100%;display:flex;}
.sc-color-home{flex:1;transition:opacity .15s;}
.sc-color-away{flex:1;transition:opacity .15s;}
.sc-inner{padding:12px 13px 10px;}
.sc-stadium{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-team-row{display:grid;grid-template-columns:10px 1fr 32px;align-items:center;gap:5px;margin-bottom:3px;}
.sc-team-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sc-team{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.sc-score{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;line-height:1;flex-shrink:0;width:32px;text-align:right;}
.sc-score.win{color:var(--text);}
.sc-score.lose{color:var(--text3);}
.sc-divider{border:none;border-top:1px solid var(--border2);margin:8px 0;}
.sc-meta{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-inning-mini{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap;}
.sc-inn{width:14px;height:14px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:7px;font-family:'DM Mono',monospace;font-weight:700;}
.sc-inn-0{background:rgba(255,255,255,0.05);color:transparent;}
.sc-inn-scored{background:rgba(255,255,255,0.12);}

/* ── GAME DETAIL CARDS ── */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:12px;}
.card-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;color:var(--text2);text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:6px;}
.tag{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--blue-g);border:1px solid rgba(59,130,246,0.28);color:var(--blue);font-family:'DM Mono',monospace;letter-spacing:0.1em;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}

/* ── SCORE HDR ── */
.score-hdr{background:transparent;border:none;border-radius:0;padding:6px 18px;margin-bottom:0;display:flex;align-items:center;}
.sh-team{flex:1;text-align:center;position:relative;}
.sh-tname{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.04em;}
.sh-score{font-family:'Oswald',sans-serif;font-size:38px;font-weight:700;line-height:1;margin:1px 0;}
.sh-score.win{color:var(--blue);text-shadow:0 0 22px rgba(59,130,246,0.45);}
.sh-score.lose{color:var(--text3);}
.sh-record{font-size:10px;color:var(--text2);font-family:'DM Mono',monospace;}
.sh-mid{padding:0 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;}
.sh-result{font-size:10px;padding:3px 9px;border-radius:4px;font-family:'DM Mono',monospace;font-weight:700;}
.sec-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:0;gap:0;background:transparent;padding:0 16px;}
.stab{padding:12px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;}
.stab:hover{color:var(--text);}
.stab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* ── INN TABLE ── */
.inn-tbl{width:100%;border-collapse:collapse;font-size:11px;min-width:420px;}
.inn-tbl th{padding:5px 7px;text-align:center;font-size:9px;color:var(--text3);border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;}
.inn-tbl th:first-child{text-align:left;}
.inn-tbl td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--border2);font-family:'DM Mono',monospace;}
.inn-tbl td:first-child{text-align:left;font-weight:700;font-size:12px;}
.inn-tbl tr.tot-row td{border-top:1px solid var(--border);font-weight:700;color:var(--text);}
.inn-run{color:var(--blue);font-weight:700;}

/* ── PITCHER ── */
.ptab-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:0;padding:8px 16px 4px;}
.ptab{font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:all .12s;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;gap:4px;}
.ptab:hover{border-color:var(--blue);color:var(--text);}
.ptab.active{background:var(--blue-dim);border-color:var(--blue);color:#fff;}
.pres{font-size:8px;padding:1px 4px;border-radius:2px;font-family:'DM Mono',monospace;font-weight:700;}
.pres-W{background:rgba(16,185,129,0.2);color:var(--green);border:1px solid rgba(16,185,129,0.3);}
.pres-L{background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.2);}
.pres-H{background:rgba(245,158,11,0.15);color:var(--gold);border:1px solid rgba(245,158,11,0.25);}
.pres-S{background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.25);}
.pres-ND{background:rgba(148,163,184,0.1);color:var(--text3);border:1px solid var(--border2);}

/* Pitch table */
.pitch-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.pitch-tbl th{padding:6px 8px;text-align:right;font-size:10px;letter-spacing:0.05em;color:var(--text2);border-bottom:2px solid var(--border);font-family:'DM Mono',monospace;white-space:nowrap;background:var(--bg2);font-weight:600;}
.pitch-tbl th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:var(--bg2);min-width:80px;}
.pitch-tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border2);vertical-align:top;font-family:'DM Mono',monospace;font-weight:400;color:var(--text);}
.pitch-tbl td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--bg2);white-space:nowrap;vertical-align:middle;}
.pitch-tbl tr:hover td{background:var(--bg4);}
.pitch-tbl tr:hover td:first-child{background:var(--bg4);}
.pitch-tbl tr.tot-row td,.bat-tbl tr.tot-row td{border-top:2px solid var(--border);border-bottom:none;color:var(--text);font-size:12px;font-weight:600;background:var(--bg3);}
.pitch-tbl tr.tot-row td:first-child,.bat-tbl tr.tot-row td:first-child{background:var(--bg3);}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pname-cell{display:flex;align-items:center;gap:6px;}
.pname{font-size:12px;font-weight:700;white-space:nowrap;}
.sv{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;}
.hr-badge{display:inline-flex;align-items:center;justify-content:center;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;font-family:'DM Mono',monospace;background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.25);}

/* pitch mix */
.donut-wrap{position:relative;width:150px;height:150px;}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.donut-num{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:#FFFFFF;line-height:1;}
.donut-lbl{font-size:9px;color:rgba(255,255,255,0.55);margin-top:2px;font-family:'DM Mono',monospace;letter-spacing:0.08em;}
.pitch-legend{display:flex;flex-direction:column;gap:4px;}
.pl-row{display:flex;align-items:center;gap:6px;}
.pl-name{font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-bar-bg{width:56px;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;}
.pl-bar-fill{height:100%;border-radius:2px;}
.pl-pct{font-size:10px;color:var(--text);font-family:'DM Mono',monospace;min-width:38px;text-align:right;white-space:nowrap;line-height:1.4;}
.pl-pct-cmp{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;display:block;text-align:right;}

/* ── BATTING ── */
.bat-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
.bat-tbl th{padding:6px 8px;text-align:right;font-size:9px;letter-spacing:0.08em;color:var(--text3);border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;white-space:nowrap;background:var(--bg2);}
.bat-tbl th:first-child,.bat-tbl th:nth-child(2),.bat-tbl th:nth-child(3){text-align:left;}
.bat-tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border2);vertical-align:middle;}
.bat-tbl td:first-child,.bat-tbl td:nth-child(2),.bat-tbl td:nth-child(3){text-align:left;}
.bat-tbl td:first-child{position:sticky;left:0;z-index:2;background:var(--bg2);}
.bat-tbl td:nth-child(2){position:sticky;left:28px;z-index:2;background:var(--bg2);}
.bat-tbl td:nth-child(3){position:sticky;left:108px;z-index:2;background:var(--bg2);}
.bat-tbl tr:hover td{background:var(--bg3);}
.bat-tbl tr:hover td:first-child,.bat-tbl tr:hover td:nth-child(2),.bat-tbl tr:hover td:nth-child(3){background:var(--bg3);}
.bat-tbl tr:last-child td{border-bottom:none;}
.order-n{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--text3);width:18px;text-align:center;}
.b-name{font-size:12px;font-weight:700;white-space:nowrap;}
.pos-badge{font-size:9px;padding:2px 5px;border-radius:3px;font-family:'DM Mono',monospace;font-weight:500;white-space:nowrap;}
.pos-C  {background:rgba(167,139,250,0.15);color:#C4B5FD;}
.pos-1B {background:rgba(245,158,11,0.15);color:#FDE68A;}
.pos-2B {background:rgba(16,185,129,0.15);color:#6EE7B7;}
.pos-3B {background:rgba(248,113,113,0.15);color:#FCA5A5;}
.pos-SS {background:rgba(251,146,60,0.15);color:#FDBA74;}
.pos-LF,.pos-CF,.pos-RF{background:rgba(34,211,238,0.15);color:#A5F3FC;}
.pos-DH{background:rgba(148,163,184,0.15);color:#CBD5E1;}
.pos-P {background:rgba(59,130,246,0.15);color:#93C5FD;}
.ab-badges{display:flex;gap:2px;flex-wrap:nowrap;align-items:center;}
.abb{width:19px;height:19px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:'DM Mono',monospace;flex-shrink:0;}
.abb-H {background:#1B5E40;color:#4ADE80;border:1px solid #22744A;}
.abb-2B{background:#0D6B6B;color:#2DD4BF;border:1px solid #0E9A9A;}
.abb-3B{background:#0D6B6B;color:#2DD4BF;border:1px solid #0E9A9A;}
.abb-HR{background:#7B2828;color:#F87171;border:1px solid #A83030;}
.abb-K {background:rgba(255,255,255,0.03);color:#475569;border:1px solid rgba(255,255,255,0.06);}
.abb-BB{background:#5C5000;color:#FDE68A;border:1px solid #7A6A00;}
.abb-GO,.abb-FO,.abb-DP{background:rgba(255,255,255,0.02);color:#475569;border:1px solid rgba(255,255,255,0.04);}
.team-switch{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;padding:4px 16px;background: transparent;}
.tsw-btn{flex:1;padding:7px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg3);border:none;color:var(--text2);transition:all .12s;font-family:'Noto Sans JP',sans-serif;}
.tsw-btn:hover{color:var(--text);}
.tsw-btn.active{background:rgba(59,130,246,0.2);color:var(--blue);}

/* scroll wrappers */
.tbl-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.tbl-scroll::-webkit-scrollbar{display:none;}

/* misc */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:var(--text3);gap:10px;text-align:center;}
.empty-state .icon{font-size:40px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fadein{animation:fadeUp .22s ease both;}
@keyframes slideInFromRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInFromLeft {from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideOutToLeft  {from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-30px);}}
@keyframes slideOutToRight {from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(30px);}}
.slide-from-right{animation:slideInFromRight .2s cubic-bezier(.25,.46,.45,.94) both;}
.slide-from-left {animation:slideInFromLeft  .2s cubic-bezier(.25,.46,.45,.94) both;}
.detail-panel.is-sliding{overflow:hidden;}

/* ── SCROLLBAR HIDE ── */
.hide-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none; 
}
.hide-scrollbar::-webkit-scrollbar {
  display: none;
}

/* ── DATE NAV BAR ── */
.date-nav-bar{
  display:flex;align-items:stretch;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
  overflow:hidden;
  position:sticky;
  top:0;
  z-index:100;
}
.date-nav-arrow{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;
  min-width:120px;padding:10px 16px;
  background:transparent;border:none;
  cursor:pointer;transition:background .14s;
  color:var(--text2);
  flex-shrink:0;
}
.date-nav-arrow:hover:not(.disabled){background:rgba(255,255,255,0.04);}
.date-nav-arrow.disabled{opacity:0.25;cursor:default;}
.date-nav-arrow-icon{font-size:16px;color:var(--text2);line-height:1;}
.date-nav-arrow-label{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;font-weight:600;line-height:1;}
.date-nav-center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 8px;
  cursor:pointer;
  text-align:center;
}
.date-nav-center:hover{background:rgba(255,255,255,0.03);}
.date-nav-main{display:flex;align-items:baseline;gap:6px;justify-content:center;}
.date-nav-date{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--text);letter-spacing:0.02em;}
.date-nav-wd{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;}

}

<body>
<div class="wrap">

<header>
  <div class="h-brand">
    <div class="h-logo" id="headerLogo">GAME<br>RPT</div>
    <div class="h-title" id="headerTitle">NPB <em>試合分析</em> ダッシュボード</div>

</button>

<script>
// null/undefined/NaN安全な toFixed ヘルパー
function _tf(v, d=1, unit='') {
  if (v == null || (typeof v === 'number' && isNaN(v))) return '—';
  return (+v).toFixed(d) + unit;
}
function _tfp(v, d=1) { return _tf(v, d, '%'); }  // % 付き版

const PC={FF:'#3B82F6',SL:'#F59E0B',CU:'#10B981',FK:'#F87171',CH:'#A78BFA',SI:'#22D3EE',CT:'#FB923C',SP:'#2DD4BF'};
const TC={'巨人':'#F79727','阪神':'#FFE100','中日':'#1fb3e9','広島':'#E50012','DeNA':'#0052CD','ヤクルト':'#96C800','SB':'#FBC700','ソフトバンク':'#FBC700','オリックス':'#A19C80','楽天':'#dc143c','西武':'#00A0E0','ロッテ':'#CCCCCC','日本ハム':'#01609A',
// MLB
'NYY':'#003087','BOS':'#BD3039','LAD':'#005A9C','SF':'#FD5A1E','CHC':'#0E3386',
'HOU':'#002D62','ATL':'#CE1141','NYM':'#002D72','PHI':'#E81828','STL':'#C41E3A',
'MIL':'#12284B','CIN':'#C6011F','PIT':'#FDB827','COL':'#333366','ARI':'#A71930',
'SD':'#2F241D','MIA':'#00A3E0','WSH':'#AB0003',
'CLE':'#00385D','MIN':'#002B5C','CWS':'#27251F','DET':'#0C2340','KC':'#004687',
'LAA':'#BA0021','OAK':'#003831','SEA':'#0C2C56','TEX':'#003278','TB':'#092C5C',
'TOR':'#134A8E','BAL':'#DF4601',
};
let curDate='',curGameIdx=null,curTab='summary',curPitchTeam='home',curPitcherIdx=0,curBatTeam='home',cmpMode='this';
let pitchCharts={};
let viewMode='daily'; // 'daily' | 'game' | 'ranking'

let playerPageReturnState = null;

function destroyCharts(){
  Object.values(pitchCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  pitchCharts={};
}

function applySeasonData(){
  if(currentSport === 'mlb') return; // MLB は別構造のため個人ページで直接参照
  if(!window.SEASON_DATA || !window.SEASON_DATA['シーズン投手マスタ']) return;
  const pitMap = {};
  window.SEASON_DATA['シーズン投手マスタ'].forEach(p => { pitMap[p['選手名']] = p; });
  Object.entries(DATA).forEach(([date, games]) => {

function getAllDates(){
  return Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).sort();
}
function getAdjacentDates(date){
  const allData=getAllDates();
  if(allData.length === 0) return {prev: null, next: null};
  const first=allData[0],last=allData[allData.length-1];
  const firstD=new Date(first),lastD=new Date(last);
  const range=[];
  for(let d=new Date(firstD);d<=lastD;d.setDate(d.getDate()+1)){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    range.push(`${y}-${m}-${day}`);
  }
  const idx=range.indexOf(date);
  return {prev:idx>0?range[idx-1]:null, next:idx<range.length-1?range[idx+1]:null};
}
function formatDateLabel(date){
  if(!date)return '';
  const [,m,d]=date.split('-');
  const wdays=['日','月','火','水','木','金','土'];
  const wd=wdays[new Date(date).getDay()];
  return `${parseInt(m)}/${parseInt(d)}(${wd})`;
}
function navigateDate(dir){ 
  const {prev,next}=getAdjacentDates(curDate);
  const target=dir===-1?prev:next;
  if(!target)return;
  const outAnim = dir===1 ? 'slideOutToLeft .13s cubic-bezier(.55,0,1,.45) both'
                           : 'slideOutToRight .13s cubic-bezier(.55,0,1,.45) both';
  const inCls   = dir===1 ? 'slide-from-right' : 'slide-from-left';
  const panel = document.getElementById('detailPanel');
  const current = panel.firstElementChild;
  panel.classList.add('is-sliding');
  if(current){ current.style.animation = outAnim; }
  setTimeout(()=>{
    selectDate(target);
    const newEl = panel.firstElementChild;
    if(newEl){ newEl.classList.remove('fadein'); newEl.classList.add(inCls); }
    panel.scrollTop = 0;
    window.scrollTo(0, 0);
    setTimeout(()=>{ panel.classList.remove('is-sliding'); }, 250);
  }, 120);
}

let touchStartX=0,touchStartY=0,touchStartTime=0;
function initSwipe(){
  const panel=document.getElementById('detailPanel');
  panel.addEventListener('touchstart',e=>{
    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;
    touchStartTime=Date.now();
  },{passive:true});
  panel.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    const dt=Date.now()-touchStartTime;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&dt<400){
      if(viewMode==='daily' || (viewMode==='ranking' && rankState.scope==='today')){
        if(dx>0) navigateDate(-1);
        else navigateDate(1);
      }
    }
  },{passive:true});
}

let rankState = {
  tab: 'pitcher', 
  mode: 'gamelog', // デフォルトを試合別に
  pitchRole: 'starter', // デフォルトを先
  batSplit: 'all', // 打者: all/vs_r/vs_l発に
  pitchSplit: 'all',

  searchQuery: ''

let rankPitSortKey = 'swstr';
let rankPitSortAsc = false;

// pitRankLogSort は下で定義

// --- 投手ランキング生成 ---
function buildGenRankCombo(pitchers, isBreak, limit, isStarter){
  const rows=[];
  pitchers.forEach(p=>{
    if(isBreak){
      p.mix.filter(m=>!STRAIGHT_KEYS.includes(m.key)&&m.count>=PITCH_MIN).forEach(m=>{
        rows.push({p,swstr:m.swstr??0,oswing:m.oSwing??0,strike:m.strike??0,zone:m.zone??0,ave:m.vel??0,maxVel:m.maxVel??0,count:m.count,pitchName:m.name,pitchCount:m.count,kpct:null,gbpct:null,ipStr:p.ipStr,pitches:p.pitches,k:p.k,bb:p.bb,h:p.h,er:p.er});
      });
    } else {
      const t=p.mix.reduce((a,m)=>a+m.count,0);
      if(t<PITCH_MIN) return;
      rows.push({p,swstr:p.swstr??0,oswing:p.oswing??0,strike:p.strike??0,zone:p.zone??0,count:t,pitchName:'',kpct:p.kpct,bbpct:p.bbpct,kbbpct:p.kbbpct,gbpct:p.gbpct,ipStr:p.ipStr,pitches:p.pitches,k:p.k,bb:p.bb,h:p.h,er:p.er});
    }
  });

  const tblId='tbl-ov-'+(isBreak?'bk':'all')+(isStarter?'-s':'-r')+'-'+Date.now();
  const useKGB=!isBreak;
  const cols=useKGB
    ?[{label:'空振り率',color:'var(--blue)',key:'swstr'},{label:'ボール球SW%',color:'var(--cyan)',key:'oswing'},{label:'ストライク率',color:'var(--text2)',key:'strike'},{label:'ゾーン率',color:'var(--green)',key:'zone'},{label:'K-BB%',color:'#A78BFA',key:'kbbpct'},{label:'K%',color:'#F59E0B',key:'kpct'},{label:'BB%',color:'#F87171',key:'bbpct'},{label:'GB%',color:'var(--teal)',key:'gbpct'}]
    :[{label:'空振り率',color:'var(--blue)',key:'swstr'},{label:'ボール球SW%',color:'var(--cyan)',key:'oswing'},{label:'ストライク率',color:'var(--text2)',key:'strike'},{label:'ゾーン率',color:'var(--green)',key:'zone'},{label:'平均球速',color:'var(--gold)',key:'ave'},{label:'最高球速',color:'var(--orange)',key:'maxVel'}];
  
  // 全DATA基準のグローバルパーセンタイル計算
  const _gbLoKeys = new Set(['bbpct']);
  const _gbColKeys = useKGB
    ? ['swstr','oswing','strike','zone','kbbpct','kpct','bbpct','gbpct']
    : ['swstr','oswing','strike','zone','ave','maxVel'];
  const _gbVals = {};
  _gbColKeys.forEach(k => { _gbVals[k] = []; });
  Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
    (DATA[date]||[]).forEach(g=>{
      ['home','away'].forEach(side=>{
        (g.pitchers[side]||[]).forEach(p=>{
          if(isBreak){
            p.mix.filter(m=>!STRAIGHT_KEYS.includes(m.key)&&m.count>=PITCH_MIN).forEach(m=>{
              if(m.swstr!=null) _gbVals['swstr'].push(+m.swstr);
              if(m.oSwing!=null) _gbVals['oswing'].push(+m.oSwing);
              if(m.strike!=null) _gbVals['strike'].push(+m.strike);
              if(m.zone!=null) _gbVals['zone'].push(+m.zone);
              if(m.vel!=null&&m.vel>0) { if(_gbVals['ave']) _gbVals['ave'].push(+m.vel); }
              if(m.maxVel!=null&&m.maxVel>0) { if(_gbVals['maxVel']) _gbVals['maxVel'].push(+m.maxVel); }
            });
          } else {
            const t=p.mix.reduce((a,m)=>a+m.count,0);
            if(t<PITCH_MIN) return;
            if(p.swstr!=null) _gbVals['swstr'].push(+p.swstr);
            if(p.oswing!=null) _gbVals['oswing'].push(+(p.oswing||p.oSwing||0));
            if(p.strike!=null) _gbVals['strike'].push(+p.strike);
            if(p.zone!=null) _gbVals['zone'].push(+p.zone);
            if(p.kbbpct!=null) _gbVals['kbbpct']?.push(+p.kbbpct);
            if(p.kpct!=null) _gbVals['kpct']?.push(+p.kpct);
            if(p.bbpct!=null) _gbVals['bbpct']?.push(+p.bbpct);
            if(p.gbpct!=null) _gbVals['gbpct']?.push(+p.gbpct);
          }
        });
      });
    });
  });
  _gbColKeys.forEach(k=>{ _gbVals[k].sort((a,b)=>_gbLoKeys.has(k)?a-b:b-a); });
  // グローバルキャッシュに保存（isBreak/isStarterに関わらず全指標を蓄積）
  if(!window._gbValsMaster) window._gbValsMaster = {};
  _gbColKeys.forEach(k=>{ window._gbValsMaster[k] = _gbVals[k]; });
  window._gbLoKeysMaster = _gbLoKeys;
  window._gbValsCache = _gbVals;
  window._gbLoKeysCache = _gbLoKeys;
  function _gbBg(val, key) {
    if(val==null||isNaN(+val)) return '';
    const arr = _gbVals[key]; if(!arr||arr.length<2) return '';
    const lo = _gbLoKeys.has(key);
    // arr: loIsBest=true→昇順(小さいほど良い), false→降順(大きいほど良い)
    // 「全体の中で何番目に良いか」= best端からの距離をpct化
    // loIsBest: arr[0]=最良, arr[n-1]=最悪
    // !loIsBest: arr[0]=最良(最大), arr[n-1]=最悪(最小)
    const v = +val, n = arr.length;
    let cnt = 0; // valより悪い値の数
    if(lo){
      // 昇順: valより大きい(悪い)値の数
      for(let i=n-1;i>=0;i--){ if(arr[i]>v) cnt++; else break; }
    } else {
      // 降順: valより小さい(悪い)値の数
      for(let i=n-1;i>=0;i--){ if(arr[i]<v) cnt++; else break; }
    }
    const pct = cnt/n; // 0=最悪(ピンク), 1=最良(ティール)
    if(pct>=0.85) return 'rgba(18,165,178,0.40)';
    if(pct>=0.70) return 'rgba(18,165,178,0.25)';
    if(pct>=0.60) return 'rgba(18,165,178,0.12)';
    if(pct>=0.40) return '';
    if(pct>=0.30) return 'rgba(238,122,151,0.10)';
    if(pct>=0.15) return 'rgba(238,122,151,0.18)';
    return 'rgba(238,122,151,0.38)';
  }

  const sortedAll=rows.sort((a,b)=>((b.swstr||0)-(a.swstr||0)));
  const dataRows=sortedAll.map(r=>({...r, name:r.p.name, team:r.p.team, _stat:`${r.ipStr}回 ${r.pitches}球 ${r.k}K`}));

  // 各指標の独立順位計算
  function _calcRkMap(arr, key, loIsBest=false) {
    const s=[...arr].sort((a,b)=>loIsBest?((a[key]??999)-(b[key]??999)):((b[key]??-999)-(a[key]??-999)));
    const m=new Map(); let rk=1;
    s.forEach((r,i)=>{if(i>0&&r[key]!==s[i-1][key])rk=i+1;m.set(r,rk);});
    return m;
  }
  // 順位マップは sortedAll ベースの _rkXxxF を使用（下で宣言）
  
  // sortedAll基準で全指標の順位マップを計算（buildRowsに渡すオブジェクトと同一参照）
  function _calcRk2(arr,key,loIsBest=false){
    const s=[...arr].sort((a,b)=>loIsBest?((a[key]??999)-(b[key]??999)):((b[key]??-999)-(a[key]??-999)));
    const m=new Map();let rk=1;
    s.forEach((r,i)=>{if(i>0&&r[key]!==s[i-1][key])rk=i+1;m.set(r,rk);});return m;
  }
  const _rkSwstrF =_calcRk2(sortedAll,'swstr');
  const _rkOswingF=_calcRk2(sortedAll,'oswing');
  const _rkStrikeF=_calcRk2(sortedAll,'strike');
  const _rkZoneF  =_calcRk2(sortedAll,'zone');
  const _rkKbbpctF=_calcRk2(sortedAll,'kbbpct');
  const _rkKpctF  =_calcRk2(sortedAll,'kpct');
  const _rkBbpctF =_calcRk2(sortedAll,'bbpct',true);
  const _rkGbpctF =_calcRk2(sortedAll,'gbpct');
  const _rkAveF   =_calcRk2(sortedAll,'ave');
  const _rkMaxF   =_calcRk2(sortedAll,'maxVel');
  // 表示順位（デフォルトソートキー swstr ベース）
  const _rkDisp=_calcRk2(sortedAll,'swstr');
  // dataRows用マップも sortedAll のオブジェクトを使って設定（sortedAllはdataRowsのサブセット）
  // alias 廃止 → _rkXxxF を直接参照

  const show=5;
  const buildRows = (list) => list.map((r,i) => {
    // r は sortedAll の要素なので _rkXxxF.get(r) は正しい順位を返す
    const dispRk = _rkDisp.get(r) ?? (i+1);
    const roleKey = isStarter ? 'starter' : 'reliever';
    const vals = useKGB
      ? [{value:r.swstr+'%',rank:_rkSwstrF.get(r)??(i+1),color:'var(--blue)',bg:_ovBg(r.swstr,'swstr',roleKey)},{value:r.oswing+'%',rank:_rkOswingF.get(r)??(i+1),color:'var(--cyan)',bg:_ovBg(r.oswing,'oSwing',roleKey)},{value:r.strike+'%',rank:_rkStrikeF.get(r)??(i+1),color:'var(--text2)',bg:_ovBg(r.strike,'strike',roleKey)},{value:r.zone+'%',rank:_rkZoneF.get(r)??(i+1),color:'var(--green)',bg:_ovBg(r.zone,'zone',roleKey)},{value:(r.kbbpct!=null?r.kbbpct+'%':'—'),rank:_rkKbbpctF.get(r)??(i+1),color:'#A78BFA',bg:_ovBg(r.kbbpct,'kbbpct',roleKey)},{value:(r.kpct!=null?r.kpct+'%':'—'),rank:_rkKpctF.get(r)??(i+1),color:'#F59E0B',bg:_ovBg(r.kpct,'kpct',roleKey)},{value:(r.bbpct!=null?(r.bbpct===0?'0%':r.bbpct+'%'):'—'),rank:_rkBbpctF.get(r)??(i+1),color:'#F87171',loIsBest:true,bg:_ovBg(r.bbpct,'bbpct',roleKey)},{value:(r.gbpct!=null?r.gbpct+'%':'—'),rank:_rkGbpctF.get(r)??(i+1),color:'var(--teal)',bg:_ovBg(r.gbpct,'gbpct',roleKey)}]
      : [{value:r.swstr+'%',rank:_rkSwstrF.get(r)??(i+1),color:'var(--blue)',bg:_ovBg(r.swstr,'swstr',roleKey)},{value:r.oswing+'%',rank:_rkOswingF.get(r)??(i+1),color:'var(--cyan)',bg:_ovBg(r.oswing,'oSwing',roleKey)},{value:r.strike+'%',rank:_rkStrikeF.get(r)??(i+1),color:'var(--text2)',bg:_ovBg(r.strike,'strike',roleKey)},{value:r.zone+'%',rank:_rkZoneF.get(r)??(i+1),color:'var(--green)',bg:_ovBg(r.zone,'zone',roleKey)},{value:r.ave>0?_tf(r.ave)+'km/h':'—',rank:_rkAveF.get(r)??(i+1),color:'var(--gold)',bg:_ovBg(r.ave,'ave',roleKey)},{value:r.maxVel>0?_tf(r.maxVel)+'km/h':'—',rank:_rkMaxF.get(r)??(i+1),color:'var(--orange)',bg:_ovBg(r.maxVel,'maxVel',roleKey)}];
    vals._stat = `${r.ipStr}回 ${r.pitches}球 ${r.k}K`;
    vals._pitchCount = r.count;
    vals._total = sortedAll.length;
    return rankRowDouble(dispRk, r.p.name, r.p.team, r.pitchName, vals, !isBreak);
  }).join('');

  return {
    html:`<div id="${tblId}" data-rows='${JSON.stringify(dataRows)}' style="overflow-x:auto;background:var(--bg3)"><div style="background:var(--bg3);border-bottom:1px solid var(--border2)">${rankTableHeader(cols,tblId,'swstr',!isBreak)}</div><div id="${tblId}-list">${buildRows(sortedAll.slice(0,show))}</div><div id="${tblId}-extra" style="display:none">${buildRows(sortedAll.slice(show))}</div></div>`,
    moreHtml: sortedAll.length>show?`<div id="${tblId}-more" style="text-align:center;padding:10px 0 2px"><button onclick="toggleRnkMore('${tblId}')" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:5px 18px;border-radius:6px;cursor:pointer">すべて表示 ▼</button></div>`:''
  };
}

// --- ストレート（FF）ランキング生成用関数 ---
function buildStrRankCombo(pitchers, limit){
  const rows = pitchers.map(p => {
    const ff = p.mix.find(m => STRAIGHT_KEYS.includes(m.key));
    if(!ff || ff.count < PITCH_MIN) return null;
    return {p, swstr: ff.swstr??0, oswing: ff.oSwing??0, strike: ff.strike??0, zone: ff.zone??0, ave: ff.vel??0, maxVel: ff.maxVel??0, count: ff.count};
  }).filter(Boolean);

  const tblId = 'tbl-st-' + Date.now();
  const sortedAll = rows.sort((a,b) => b.swstr - a.swstr);

  const cols = [
    {label:'空振り率', color:'var(--blue)', key:'swstr'},
    {label:'ボール球SW%', color:'var(--cyan)', key:'oswing'},
    {label:'ストライク率', color:'var(--text2)', key:'strike'},
    {label:'ゾーン率', color:'var(--green)', key:'zone'},
    {label:'平均球速', color:'var(--gold)', key:'ave'},
    {label:'最高球速', color:'var(--orange)', key:'maxVel'}
  ];

  // sortedAll ベースで各指標の独立順位マップを計算
  function _strRk(arr,key,loIsBest=false){
    const s=[...arr].sort((a,b)=>loIsBest?((a[key]??999)-(b[key]??999)):((b[key]??-999)-(a[key]??-999)));
    const m=new Map();let rk=1;
    s.forEach((r,i)=>{if(i>0&&r[key]!==s[i-1][key])rk=i+1;m.set(r,rk);});return m;
  }
  const _srSwstr=_strRk(sortedAll,'swstr'), _srOswing=_strRk(sortedAll,'oswing');
  const _srStrike=_strRk(sortedAll,'strike'), _srZone=_strRk(sortedAll,'zone');
  const _srAve=_strRk(sortedAll,'ave'), _srMax=_strRk(sortedAll,'maxVel');
  const _srDisp=_strRk(sortedAll,'swstr');

  // dataRows は JSON化用（data-rows属性）。ランク計算は sortedAll のオブジェクトで実施
  const dataRows = sortedAll.map(r => ({
    name: r.p.name, team: r.p.team, pitchName: 'ストレート', pitchCount: r.count,
    swstr: r.swstr, oswing: r.oswing, strike: r.strike, zone: r.zone, ave: r.ave, maxVel: r.maxVel,
    _stat: `${r.p.ipStr}回 ${r.p.pitches}球 ${r.p.k}K`
  }));

  const show = 5;
  const buildRows = (list) => list.map((r,i) => {
    // r は sortedAll の要素 → _sr* マップのキーと同一参照
    const vals = [
      {value: _tfp(r.swstr), rank: _srSwstr.get(r)||(i+1), color: 'var(--blue)'},
      {value: _tfp(r.oswing), rank: _srOswing.get(r)||(i+1), color: 'var(--cyan)'},
      {value: _tfp(r.strike), rank: _srStrike.get(r)||(i+1), color: 'var(--text2)'},
      {value: _tfp(r.zone),   rank: _srZone.get(r)||(i+1),   color: 'var(--green)'},
      {value: r.ave>0?_tf(r.ave)+'km/h':'—',       rank: _srAve.get(r)||(i+1),  color: 'var(--gold)'},
      {value: r.maxVel>0?_tf(r.maxVel)+'km/h':'—', rank: _srMax.get(r)||(i+1),  color: 'var(--orange)'}
    ];
    vals._stat = `${r.p.ipStr}回 ${r.p.pitches}球 ${r.p.k}K`;
    vals._pitchCount = r.count;
    vals._total = sortedAll.length;
    return rankRowDouble(_srDisp.get(r)||(i+1), r.p.name, r.p.team, 'ストレート', vals, false);
  }).join('');

  return {
    html: `<div id="${tblId}" data-rows='${JSON.stringify(dataRows)}' style="overflow-x:auto;background:var(--bg3)"><div style="background:var(--bg3);border-bottom:1px solid var(--border2)">${rankTableHeader(cols,tblId,'swstr',false)}</div><div id="${tblId}-list">${buildRows(sortedAll.slice(0,show))}</div><div id="${tblId}-extra" style="display:none">${buildRows(sortedAll.slice(show))}</div></div>`,
    moreHtml: sortedAll.length > show ? `<div id="${tblId}-more" style="text-align:center;padding:10px 0 2px"><button onclick="toggleRnkMore('${tblId}')" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:11px;padding:5px 18px;border-radius:6px;cursor:pointer">すべて表示 ▼</button></div>` : ''
  };
}

// --- 打者ランキング生成 ---
function buildBatRanking(games){
  const batters=[];
  games.forEach(g=>{
    ['home','away'].forEach(side=>{
      (g.batters[side]||[]).forEach(b=>{
        const abs=b.abs||[];
        const hr=abs.filter(a=>a==='HR').length;
        const xbh=abs.filter(a=>a==='HR'||a==='2B'||a==='3B').length;
        const gok=abs.filter(a=>a==='GO'||a==='DP'||a==='K').length;
        const pa=abs.filter(a=>a&&a!=='—').length;
        batters.push({name:b.name,team:side==='home'?g.home:g.away,ops:b.ops||0,hr,xbh,gok,rbi:b.rbi||0,pa,abs,avgEV:b.avgEV??null,maxEV:b.maxEV??null,xwoba:b.xwoba??null,barrelN:b.barrelN??null});
      });
    });
  });
  window._batRankData=batters;
  return `<div class="daily-section" id="sec-bat-rank">
    <div class="section-hdr" onclick="scrollToSection('sec-bat-rank')">
      <div class="section-hdr-accent" style="background:var(--gold)"></div>
      <span class="section-hdr-icon">🏏</span>
      <span class="section-hdr-title">打者ランキング</span>
    </div>
    <div style="background:var(--bg3);" id="bat-content-today">${window._batBuildSection()}</div>
  </div>`;
}

// --- Sticky Stack (セクションヘッダーの積み重ね固定) 制御 ---
let _stickyRAF = null;

function updateStickyStack() {
  const panel = document.getElementById('detailPanel');
  if(!panel) return;

  const panelRect  = panel.getBoundingClientRect();
  // 日付ナビバーの高さを取得（固定値45pxでも可）
  const dateNavBar = panel.querySelector('.date-nav-bar');
  const dateNavH   = dateNavBar ? dateNavBar.offsetHeight : 45;

  const sectionIds = ['sec-scores','sec-stars','sec-pitch-rank','sec-bat-rank'];
  const sections   = sectionIds.map(id => document.getElementById(id)).filter(Boolean);

  let stackedH = dateNavH; // 積み重ねる基準の高さ

  sections.forEach((sec, secIdx) => {
    const hdr = sec.querySelector(':scope > .section-hdr');
    if(!hdr) return;

    const secRect  = sec.getBoundingClientRect();
    const hdrH     = hdr.offsetHeight;
    const secTopRelToPanel    = secRect.top  - panelRect.top;
    const secBottomRelToPanel = secRect.bottom - panelRect.top;

    if(secTopRelToPanel <= stackedH) {
      // スタックに載せる
      hdr.style.top       = stackedH + 'px';
      hdr.style.zIndex    = 80 + secIdx;
      hdr.style.boxShadow = '0 2px 8px rgba(0,0,0,0.45)';

      const stillInSection = secBottomRelToPanel > stackedH + hdrH;
      if(stillInSection) {
        stackedH += hdrH;
        // 内部タブのtop同期
        if(sec.id === 'sec-pitch-rank') {
          const roleTabs = document.getElementById('rnk-role-tabs');
          if(roleTabs) roleTabs.style.top = stackedH + 'px';
        }
        if(sec.id === 'sec-bat-rank') {
          const batTabs = document.getElementById('bat-tab-bar');
          if(batTabs) batTabs.style.top = stackedH + 'px';
        }
      }
    } else {
      // 通常位置
      hdr.style.top       = dateNavH + 'px';
      hdr.style.zIndex    = 80;
      hdr.style.boxShadow = '';
    }
  });
}

function onDailySummaryScroll() {
  if(_stickyRAF) cancelAnimationFrame(_stickyRAF);
  _stickyRAF = requestAnimationFrame(updateStickyStack);
}

function setupStickyStack() {
  const panel = document.getElementById('detailPanel');
  if(!panel) return;
  panel.removeEventListener('scroll', onDailySummaryScroll);
  panel.addEventListener('scroll', onDailySummaryScroll, {passive: true});
  // 初回実行
  requestAnimationFrame(updateStickyStack);
}

function teardownStickyStack() {
  const panel = document.getElementById('detailPanel');
  if(panel) panel.removeEventListener('scroll', onDailySummaryScroll);
  if(_stickyRAF) { cancelAnimationFrame(_stickyRAF); _stickyRAF = null; }
}

// ── ランキング再描画デバウンス ──
let _rankUpdateTimer = null;
const _updateRankContent_immediate = _updateRankContent_impl;
function _updateRankContent(delay) {
  if (_rankUpdateTimer) clearTimeout(_rankUpdateTimer);
  _rankUpdateTimer = setTimeout(_updateRankContent_impl, delay != null ? delay : 0);
}
function _updateRankContent_impl() {
  const contentBody = document.getElementById('rank-content-body');
  if (!contentBody) return;
  // --rnk-hdr-top: stickyヘッダーのtop位置を計算してrank-shellにセット
  requestAnimationFrame(() => {
    const panel = document.getElementById('detailPanel');
    const shell = document.getElementById('rank-shell');
    const tabs  = document.getElementById('rankMainTabs');
    if(!panel || !shell || !tabs) return;
    const pRect = panel.getBoundingClientRect();
    const tRect = tabs.getBoundingClientRect();
    let top = tRect.bottom - pRect.top;
    // コントロール行(先発/中継ぎ)の高さを追加
    const rcb = document.getElementById('rank-content-body');
    if(rcb) {
      const ctrl = rcb.querySelector('.card > div:first-child');
      if(ctrl && ctrl.offsetHeight) top += ctrl.offsetHeight;
    }
    shell.style.setProperty('--rnk-hdr-top', Math.round(top) + 'px');
  });

  // メインタブの active クラスを更新
  document.querySelectorAll('#rankMainTabs .stab').forEach(btn => {
    btn.classList.remove('active');
    btn.style.color = 'var(--text2)';
    btn.style.borderBottomColor = 'transparent';

    activeTabBtn.classList.add('active');
    activeTabBtn.style.color = 'var(--blue)';
    activeTabBtn.style.borderBottomColor = 'var(--blue)';
  }

  // モード切替ボタンの active クラスを更新

    const isMode = btn.getAttribute('onclick').includes(rankState.mode);

  else if (rankState.tab === 'batter') html = _buildRankBatter();
  else if (rankState.tab === 'hero') html = _buildRankHero();

// 試合別投手: 投球回フィルター（デフォルト5回）
function onGamePitIPFilter(val) {
  const n = (val===''||val===null||val===undefined) ? 5 : parseFloat(val);
  if(isNaN(n) || n < 0) return;
  if(window._gamePitMinIP === n) return;
  window._gamePitMinIP = n;
  _updateRankContent();
}

// シーズン投手: 投球回フィルター
function onSeaPitIPFilter(val) {
  const n = (val===''||val===null||val===undefined) ? 0 : parseFloat(val);
  if(isNaN(n) || n < 0) return;
  if(window._seaPitMinIP === n) return;
  window._seaPitMinIP = n;
  // コントロール行は維持してテーブルのみ更新
  const rcb = document.getElementById('rank-content-body');
  if(!rcb) return;
  const tblWrap = rcb.querySelector('.rnk-tbl-wrap');
  if(tblWrap) {
    const newHtml = _getSeasonPitcherTableHtml();
    tblWrap.closest('.card > div:last-child, .card')?.lastElementChild?.replaceWith 
      ? null : null;
  }
  _updateRankContent();
}

function onSeaBatPAFilter(val) {
  const n = (val === '' || val === null || val === undefined) ? 0 : parseInt(val);
  if(isNaN(n) || n < 0) return;
  window._seaBatMinPA = n;
  const c = document.getElementById('rank-bat-content');
  if(c) c.innerHTML = _getRankBatListHtml();
}

function switchBatSplit(split) {

  _updateRankContent();
}

function _getAllPlayerNames() {
  const names = new Set();
  Object.keys(DATA).filter(d=>d!=='highlights'&&!d.startsWith('_')).forEach(date=>{
    (DATA[date]||[]).forEach(g=>{
      ['home','away'].forEach(side=>{
        (g.pitchers[side]||[]).forEach(p=>names.add(p.name+'|pitcher'));
        (g.batters[side]||[]).forEach(b=>names.add(b.name+'|batter'));
      });
    });
  });
  return [...names].map(s=>{const[n,t]=s.split('|');return{name:n,type:t};});
}

function showSearchSuggestions(val) {
  const box = document.getElementById('rankSearchSuggest');
  if(!box) return;
  const q = val.trim();
  if(!q){box.style.display='none';return;}
  const allRaw = _getAllPlayerNames();
  const seen=new Set();
  const all=allRaw.filter(p=>{if(seen.has(p.name))return false;seen.add(p.name);return true;});
  const matched = all.filter(p=>p.name.includes(q)).slice(0,10);
  if(!matched.length){box.style.display='none';return;}
  box.innerHTML = matched.map(p=>`<div style="padding:6px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05)" onmousedown="selectSearchSuggestion('${p.name}')" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">${p.name}</div>`).join('');
  box.style.display='block';
}

function hideSearchSuggestions() {
  const box = document.getElementById('rankSearchSuggest');
  if(box) box.style.display='none';
}

function selectSearchSuggestion(name) {
  hideSearchSuggestions();
  // DATA から選手のチームを特定
  let team = '';
  outer: for(const date of Object.keys(DATA)){
    for(const g of (DATA[date]||[])){
      for(const side of ['home','away']){
        const t = side==='home'?g.home:g.away;
        if((g.batters[side]||[]).some(b=>b.name===name)||
           (g.pitchers[side]||[]).some(p=>p.name===name)){
          team=t; break outer;
        }
      }
    }
  }
  openPlayerPageAuto(name, team);
}

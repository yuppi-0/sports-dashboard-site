<script>
(function(){
  var ITER=600000;
  var b64=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
  var raw=b64(document.getElementById('payload').textContent.trim());
  var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!(window.crypto&&crypto.subtle)){msg.textContent='このブラウザ/環境では開けません(https でアクセスしてください)。';return;}
    go.disabled=true;msg.textContent='';go.textContent='確認中…';
    var enc=new TextEncoder();
    crypto.subtle.importKey('raw',enc.encode(pw.value),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);})
      .then(function(buf){var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close();})
      .catch(function(){msg.textContent='パスワードが違います。';go.disabled=false;go.textContent='開く';pw.select();});
  });
})();

name: NPBデータ自動更新

on:
  # GitHub自身のschedule機能は時刻通りに発火しない不具合が続いたため廃止。
  # 代わりにcron-job.org（外部サービス）から、この後のworkflow_dispatchをAPI経由で
  # 直接叩く方式に切り替えた。
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付（例: 2026-08-20 / 2026-08-17:2026-08-24 / 空欄なら自動計算）'
        required: false
        default: ''
      steps:
        description: '実行ステップ（games / pitch / highlights / datamart / llm_input / all。スペース区切りで複数可。datamartを含む場合はllm_inputが自動付与されます）'
        required: false
        default: 'all'
      game_ids:
        description: '特定の試合だけ再取得したい場合、試合IDをカンマ区切りで指定（例: 2021039325,2021039330）。空欄なら通常通り日単位で実行'
        required: false
        default: ''
      source:
        description: 'cron-job.org専用。空欄のままでOK'
        required: false
        default: ''
      skip_llm_input:
        description: '複数の日付範囲を並列実行する時だけチェックを付ける。OFFのままだと、並列実行中にエラーになることがある。並列ジョブが全部終わったら、実行ステップに「llm_input」とだけ入れて単独でもう1回実行してシーズン全体を最新化すること。'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-npb:
    runs-on: ubuntu-latest
    steps:
      - name: サイト側リポジトリを取得（このリポジトリ自身。docs/・scripts/など）
        uses: actions/checkout@v4

      - name: データ側リポジトリを取得（非公開のbaseball-dashboard-data。data/配下に展開）
        uses: actions/checkout@v4
        with:
          repository: yuppi-0/baseball-dashboard-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 対象日付を計算
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TARGET="${{ inputs.date }}"
          else
            HOUR=$(TZ='Asia/Tokyo' date +%H)
            if [ "$HOUR" -lt 12 ]; then
              TARGET=$(TZ='Asia/Tokyo' date -d 'yesterday' +%Y-%m-%d)
            else
              TARGET=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
            fi
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "対象日: $TARGET"

      - name: 重複実行チェック（cron-job.orgからの自動実行のみ。手動実行は常に実行する）
        id: check
        run: |
          SKIP=false
          if [ "${{ inputs.source }}" = "cron" ]; then
            LAST_MSG=$(git log -1 --pretty=%s)
            if echo "$LAST_MSG" | grep -q "NPB自動更新: ${{ steps.date.outputs.date }}"; then
              echo "既に ${{ steps.date.outputs.date }} 分は処理済み（手動実行済みの可能性）のためスキップします"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: NPBデータを取得・更新（1軍）
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.game_ids }}" ]; then
            echo "特定試合の再取得モード: ${{ inputs.game_ids }}"
            python scripts/run.py --steps games pitch datamart ${{ inputs.game_ids }} --date ${{ steps.date.outputs.date }} --1軍 ${{ inputs.skip_llm_input && '--skip-llm-input' || '' }}
          else
            python scripts/run.py --date ${{ steps.date.outputs.date }} --steps ${{ inputs.steps || 'all' }} --1軍 ${{ inputs.skip_llm_input && '--skip-llm-input' || '' }}
          fi

      - name: 活躍選手0件の日付がないか確認（1軍）
        if: steps.check.outputs.skip != 'true'
        run: |
          python - <<'PYEOF'
          import json, glob, datetime, os

          steps_arg = os.environ.get("STEPS_ARG", "all")
          if "highlights" not in steps_arg and steps_arg != "all":
              raise SystemExit(0)

          target = os.environ.get("TARGET_DATE", "")
          if ":" in target:
              d0s, d1s = target.split(":")
              d0 = datetime.date.fromisoformat(d0s)
              d1 = datetime.date.fromisoformat(d1s)
              dates = [(d0 + datetime.timedelta(days=i)).isoformat()
                       for i in range((d1 - d0).days + 1)]
          else:
              dates = [target]

          missing = []
          for d in dates:
              found_file = False
              has_hl = False
              for path in glob.glob(f"docs/data/プロ野球/*/1軍/*/games/json/{d}.json"):
                  found_file = True
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  games = data.get(d) or []
                  hl = (data.get("highlights") or {}).get(d) or []
                  if not games:
                      has_hl = True
                      break
                  if hl:
                      has_hl = True
                  break
              if found_file and not has_hl:
                  missing.append(d)

          if missing:
              print(f"::warning::【1軍】活躍選手が0件の日付があります: {', '.join(missing)}。--steps highlights で該当日を再実行してください")
          else:
              print("活躍選手チェック(1軍): 問題なし")
          PYEOF
        env:
          STEPS_ARG: ${{ inputs.steps || 'all' }}
          TARGET_DATE: ${{ steps.date.outputs.date }}

      - name: NPBデータを取得・更新（2軍）
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.game_ids }}" ]; then
            echo "特定試合の再取得モード: ${{ inputs.game_ids }}"
            python scripts/run.py --steps games pitch datamart ${{ inputs.game_ids }} --date ${{ steps.date.outputs.date }} --2軍 ${{ inputs.skip_llm_input && '--skip-llm-input' || '' }}
          else
            python scripts/run.py --date ${{ steps.date.outputs.date }} --steps ${{ inputs.steps || 'all' }} --2軍 ${{ inputs.skip_llm_input && '--skip-llm-input' || '' }}
          fi

      - name: 活躍選手0件の日付がないか確認（2軍）
        if: steps.check.outputs.skip != 'true'
        run: |
          python - <<'PYEOF'
          import json, glob, datetime, os

          steps_arg = os.environ.get("STEPS_ARG", "all")
          if "highlights" not in steps_arg and steps_arg != "all":
              raise SystemExit(0)

          target = os.environ.get("TARGET_DATE", "")
          if ":" in target:
              d0s, d1s = target.split(":")
              d0 = datetime.date.fromisoformat(d0s)
              d1 = datetime.date.fromisoformat(d1s)
              dates = [(d0 + datetime.timedelta(days=i)).isoformat()
                       for i in range((d1 - d0).days + 1)]
          else:
              dates = [target]

          missing = []
          for d in dates:
              found_file = False
              has_hl = False
              for path in glob.glob(f"docs/data/プロ野球/*/2軍/*/games/json/{d}.json"):
                  found_file = True
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  games = data.get(d) or []
                  hl = (data.get("highlights") or {}).get(d) or []
                  if not games:
                      has_hl = True
                      break
                  if hl:
                      has_hl = True
                  break
              if found_file and not has_hl:
                  missing.append(d)

          if missing:
              print(f"::warning::【2軍】活躍選手が0件の日付があります: {', '.join(missing)}。--steps highlights で該当日を再実行してください")
          else:
              print("活躍選手チェック(2軍): 問題なし")
          PYEOF
        env:
          STEPS_ARG: ${{ inputs.steps || 'all' }}
          TARGET_DATE: ${{ steps.date.outputs.date }}

      - name: データ側をコミット&push（baseball-dashboard-data）
        if: steps.check.outputs.skip != 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "更新なし（データ変化なし）"
          else
            git commit -m "NPB自動更新: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push失敗。リモートの変更を取り込んでリトライします (試行 $i/5)"
              git pull --rebase origin main
              sleep 5
            done
          fi

      - name: サイト側（docs/）をコミット&push（このリポジトリ自身）
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "更新なし（docs変化なし）"
          else
            git commit -m "NPB自動更新: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push失敗。リモートの変更を取り込んでリトライします (試行 $i/5)"
              git pull --rebase origin main
              sleep 5
            done
          fi